# =========================================================================================== #
# AWS Reaper — windows-wsus
# ------------------------------------------------------------------------------------------- #
# The safety net for the ephemeral lifecycle. terraform destroy can only remove what its state
# recorded, and a run killed hard enough never reaches its own destroy — so every 15 minutes
# this workflow tears down ANYTHING still carrying this repository's identity tag.
#
#   * It runs in its OWN concurrency group and instead GUARDS on the lifecycle: a pending
#     deploy in a shared group would be replaced (cancelled) by every reaper tick —
#     cancel-in-progress:false only protects RUNNING jobs, a pathology proven live when a
#     tick cancelled a queued required-check run. The guard step skips the sweep whenever any
#     lifecycle run is active or queued.
#   * The OIDC trust lists this file's path in job_workflow_ref alongside aws-deploy.yml —
#     renaming either file breaks its credential exchange loudly.
#   * Schedules run from the default branch only, and a clean account is a fast no-op.
# =========================================================================================== #
name: AWS Reaper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}

concurrency:
  group: aws-reaper-${{ github.repository }}
  cancel-in-progress: false

jobs:
  aws-reaper:
    name: AWS (teardown anything still standing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      issues: write
      actions: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_ROLE: github_nwarila-platform_windows-wsus

    steps:
      # Never sweep while a deploy is live: an active run's freshly created resources carry
      # the same tag and would be torn down mid-configure. Queued counts too — it will be
      # creating resources moments from now.
      - name: Check for an active lifecycle run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/aws-deploy.yml/runs?status=in_progress&per_page=1" --jq '.total_count')"
          queued="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/aws-deploy.yml/runs?status=queued&per_page=1" --jq '.total_count')"
          echo "busy=$(( active + queued ))" >> "${GITHUB_OUTPUT}"
          echo "lifecycle runs active or queued: $(( active + queued ))"

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.busy == '0'
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-reaper-${{ github.run_id }}
          role-duration-seconds: 3600

      # Teardown order follows the dependency chain: instances first (everything else is
      # attached to them), then network interfaces, Elastic IPs, volumes, security groups.
      # Every command is scoped by the repository's tag.
      - name: Tear down anything still standing
        if: steps.gate.outputs.busy == '0'
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail

          owned_by_this_repo="Name=tag:nwarila:management:repository-id,Values=${GITHUB_REPOSITORY_ID}"

          instance_ids="$(aws ec2 describe-instances \
            --filters "${owned_by_this_repo}" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          if [ -n "${instance_ids}" ]; then
            echo "terminating instance(s): ${instance_ids}"
            aws ec2 terminate-instances --instance-ids ${instance_ids} > /dev/null
            aws ec2 wait instance-terminated --instance-ids ${instance_ids}
          fi

          interface_ids="$(aws ec2 describe-network-interfaces \
            --filters "${owned_by_this_repo}" "Name=status,Values=available" \
            --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)"
          for interface_id in ${interface_ids}; do
            echo "deleting network interface: ${interface_id}"
            aws ec2 delete-network-interface --network-interface-id "${interface_id}"
          done

          allocation_ids="$(aws ec2 describe-addresses \
            --filters "${owned_by_this_repo}" \
            --query 'Addresses[].AllocationId' --output text)"
          for allocation_id in ${allocation_ids}; do
            echo "releasing Elastic IP: ${allocation_id}"
            aws ec2 release-address --allocation-id "${allocation_id}"
          done

          volume_ids="$(aws ec2 describe-volumes \
            --filters "${owned_by_this_repo}" "Name=status,Values=available" \
            --query 'Volumes[].VolumeId' --output text)"
          for volume_id in ${volume_ids}; do
            echo "deleting volume: ${volume_id}"
            aws ec2 delete-volume --volume-id "${volume_id}"
          done

          group_ids="$(aws ec2 describe-security-groups \
            --filters "${owned_by_this_repo}" \
            --query 'SecurityGroups[].GroupId' --output text)"
          for group_id in ${group_ids}; do
            echo "deleting security group: ${group_id}"
            aws ec2 delete-security-group --group-id "${group_id}"
          done

          if [ -z "${instance_ids}${interface_ids}${allocation_ids}${volume_ids}${group_ids}" ]; then
            echo "Nothing to reap: no resources tagged to this repository exist."
          else
            echo "Reaped. The account is clean again."
          fi

      # A failing reaper means potentially stranded paid resources with nobody watching —
      # that must surface as an issue, not a silently red schedule.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Reaper failed: run ${GITHUB_RUN_ID}" \
            --body "The scheduled teardown failed — check for stranded resources: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
