# =========================================================================================== #
# IAM Drift Attestation — read-only comparison of live IAM to reviewed source
# ------------------------------------------------------------------------------------------- #
# This workflow never applies IAM. A dedicated OIDC role can only read the exact tracked IAM
# objects and the two environment values needed to materialize their source documents. Drift is
# reported through one durable issue and closes only after a later exact comparison succeeds.
# =========================================================================================== #
name: IAM Drift Attestation

'on':
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: iam-drift-${{ github.repository }}
  cancel-in-progress: false

jobs:
  main-ref:
    name: Protected main ref
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse execution outside protected main
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "${EXPECTED_REF}" ]; then
            echo "::error::IAM drift attestation runs only from ${EXPECTED_REF}; got ${GITHUB_REF}."
            exit 1
          fi

  attest:
    name: Live IAM equals reviewed source
    needs: main-ref
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AUDIT_ROLE: github_nwarila-platform_windows-wsus-iam-audit
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Configure read-only AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.AUDIT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: iam-drift-${{ github.run_id }}
          role-duration-seconds: 1800

      - name: Compare live IAM with tracked source
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/bootstrap-iam.sh --check-drift --ambient

  report:
    name: IAM drift incident
    needs: [main-ref, attest]
    if: always() && needs.main-ref.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      ATTESTATION_RESULT: ${{ needs.attest.result }}
      GH_TOKEN: ${{ github.token }}
      INCIDENT_LABEL: automation-incident
      INCIDENT_MARKER: '<!-- windows-wsus-automation:iam-drift -->'
      INCIDENT_TITLE: '[automation] live AWS IAM drift detected'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Update, deduplicate, or resolve the IAM drift incident
        run: |
          set -euo pipefail

          gh label create "${INCIDENT_LABEL}" --repo "${GITHUB_REPOSITORY}" --force \
            --color B60205 --description 'Owned exclusively by recurring automation incidents' > /dev/null
          issue_json="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all --limit 100 \
            --label "${INCIDENT_LABEL}" --json number,state,title,body,author)"
          mapfile -t issue_numbers < <(jq -r --arg title "${INCIDENT_TITLE}" \
            --arg marker "${INCIDENT_MARKER}" '
              [.[] | select(
                .title == $title
                and .author.login == "app/github-actions"
                and ((.body // "") | contains($marker))
              )] | sort_by(.number) | .[].number
            ' <<< "${issue_json}")
          canonical="${issue_numbers[0]:-}"

          for duplicate in "${issue_numbers[@]:1}"; do
            if [ "$(gh issue view "${duplicate}" --repo "${GITHUB_REPOSITORY}" \
              --json state --jq .state)" = OPEN ]; then
              gh issue close "${duplicate}" --repo "${GITHUB_REPOSITORY}" --reason duplicate \
                --comment "Deduplicated into #${canonical}."
            fi
          done

          if [ "${ATTESTATION_RESULT}" = success ]; then
            if [ -n "${canonical}" ] && \
              [ "$(gh issue view "${canonical}" --repo "${GITHUB_REPOSITORY}" \
                --json state --jq .state)" = OPEN ]; then
              gh issue close "${canonical}" --repo "${GITHUB_REPOSITORY}" \
                --reason completed --comment "Live IAM again matches reviewed source: ${RUN_URL}."
            else
              echo "Live IAM matches reviewed source; no open incident to resolve."
            fi
            exit 0
          fi

          message="Read-only IAM attestation result: ${ATTESTATION_RESULT}. Inspect ${RUN_URL}. No IAM changes were attempted."
          if [ -z "${canonical}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --label "${INCIDENT_LABEL}" --title "${INCIDENT_TITLE}" \
              --body "$(printf '%s\n\n%s' "${INCIDENT_MARKER}" "${message}")"
          else
            if [ "$(gh issue view "${canonical}" --repo "${GITHUB_REPOSITORY}" \
              --json state --jq .state)" = CLOSED ]; then
              gh issue reopen "${canonical}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh issue comment "${canonical}" --repo "${GITHUB_REPOSITORY}" --body "${message}"
          fi
