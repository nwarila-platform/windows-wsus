# =========================================================================================== #
# Framework Pin Discovery
# ------------------------------------------------------------------------------------------- #
# This default-branch schedule discovers upstream movement — framework commits and the coupled
# quality-tool version/checksum tuples — and maintains one reviewable PR per concern. It
# deliberately does not dispatch an AWS workflow, enable auto-merge, or treat raw upstream main as
# trusted. Promotion remains behind the repository's required quality and review controls.
# =========================================================================================== #
name: Framework Pin Discovery

'on':
  schedule:
    - cron: '43 7 * * 2'

permissions: {}

concurrency:
  group: framework-pin-discovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  discover:
    name: Maintain framework update PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_BRANCH: automation/framework-pins

    steps:
      - name: Checkout protected main without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Discover updates and maintain one PR
        run: |
          set -euo pipefail

          [ "${GITHUB_REF}" = refs/heads/main ] \
            || { echo "::error::Pin discovery runs only from protected main."; exit 1; }

          ansible_candidate="$(git ls-remote https://github.com/nwarila-platform/ansible-framework refs/heads/main | cut -f1)"
          terraform_candidate="$(git ls-remote https://github.com/nwarila-platform/aws-terraform-framework refs/heads/main | cut -f1)"
          [[ "${ansible_candidate}" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Could not resolve a full ansible-framework commit."; exit 1; }
          [[ "${terraform_candidate}" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Could not resolve a full aws-terraform-framework commit."; exit 1; }

          read_remote_pin() {
            local path="$1" ref="$2"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" --jq '.content' \
              | base64 --decode | tr -d '\r\n'
          }

          ensure_quality_run() {
            local head_sha="$1" quality_runs_json acceptable_runs
            quality_runs_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?head_sha=${head_sha}&per_page=100")"
            acceptable_runs="$(jq -r '
              [.workflow_runs[]
               | select(.status != "completed" or .conclusion == "success")]
              | length
            ' <<< "${quality_runs_json}")"
            if [ "${acceptable_runs}" -eq 0 ]; then
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/dispatches" \
                -f ref="${UPDATE_BRANCH}"
              echo "Dispatched credential-free required quality for ${head_sha}; no successful or active run existed."
            else
              echo "Required quality already has a successful or active run for ${head_sha}; no redispatch."
            fi
          }

          # Anchor every automation branch rebuild to the current protected-main tree, not the
          # potentially older scheduled-run checkout, and read the pins from that exact commit.
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          ansible_pin="$(read_remote_pin .github/ansible-framework-pin "${base_sha}")"
          terraform_pin="$(read_remote_pin .github/terraform-framework-pin "${base_sha}")"
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          managed_prs_json="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main \
            --state open --limit 100 --json number,headRefName,headRepositoryOwner,isCrossRepository)"
          mapfile -t managed_pr_numbers < <(jq -r \
            --arg branch "${UPDATE_BRANCH}" --arg owner "${repository_owner}" '
              [.[] | select(
                .headRefName == $branch
                and .headRepositoryOwner.login == $owner
                and .isCrossRepository == false
              )]
              | sort_by(.number)
              | .[].number
            ' <<< "${managed_prs_json}")
          if [ "${#managed_pr_numbers[@]}" -gt 1 ]; then
            echo "::error::Multiple local managed PRs target ${UPDATE_BRANCH}; refusing ambiguity."
            exit 1
          fi
          existing_pr="${managed_pr_numbers[0]:-}"

          # ---- quality-tools.env tuple discovery (TD-007) -----------------------------------
          # Each tuple is discovered from its primary source, the artifact is downloaded and
          # validated here, and the whole file changes in one commit so a version and its
          # checksum can never land separately. Terraform is not fetched: its value is coupled
          # to the pinned framework's exact required_version.
          TOOLS_BRANCH=automation/quality-tools
          tools_work="$(mktemp -d)"

          actionlint_tag="$(gh api repos/rhysd/actionlint/releases/latest --jq '.tag_name')"
          actionlint_candidate="${actionlint_tag#v}"
          [[ "${actionlint_candidate}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Unrecognized actionlint release tag ${actionlint_tag}."; exit 1; }
          actionlint_base="https://github.com/rhysd/actionlint/releases/download/v${actionlint_candidate}"
          curl -fsSLo "${tools_work}/actionlint.tar.gz" \
            "${actionlint_base}/actionlint_${actionlint_candidate}_linux_amd64.tar.gz"
          curl -fsSLo "${tools_work}/actionlint_checksums.txt" \
            "${actionlint_base}/actionlint_${actionlint_candidate}_checksums.txt"
          actionlint_sha="$(awk -v file="actionlint_${actionlint_candidate}_linux_amd64.tar.gz" \
            '$2 == file { print $1 }' "${tools_work}/actionlint_checksums.txt")"
          [[ "${actionlint_sha}" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::actionlint release publishes no linux_amd64 checksum."; exit 1; }
          printf '%s  %s\n' "${actionlint_sha}" "${tools_work}/actionlint.tar.gz" \
            | sha256sum --check --strict --quiet
          tar -xzf "${tools_work}/actionlint.tar.gz" -C "${tools_work}" actionlint
          [ "$("${tools_work}/actionlint" -version | head -n 1)" = "${actionlint_candidate}" ] \
            || { echo "::error::Downloaded actionlint does not report its own version."; exit 1; }

          sudo apt-get update -qq
          shellcheck_candidate="$(apt-cache policy shellcheck | awk '/Candidate:/ { print $2 }')"
          [[ "${shellcheck_candidate}" =~ ^[0-9][A-Za-z0-9.+~:-]*$ ]] \
            || { echo "::error::No apt candidate for shellcheck."; exit 1; }

          terraform_required="$(gh api \
            "repos/nwarila-platform/aws-terraform-framework/contents/terraform/versions.tf?ref=${terraform_pin}" \
            --jq '.content' | base64 --decode \
            | sed -n 's/^[[:space:]]*required_version[[:space:]]*=[[:space:]]*"= \([0-9][0-9.]*\)".*$/\1/p')"
          [[ "${terraform_required}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Pinned framework declares no exact Terraform required_version."; exit 1; }

          current_tools_env="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/quality-tools.env?ref=${base_sha}" \
            --jq '.content' | base64 --decode)"
          for tuple_var in ACTIONLINT_VERSION ACTIONLINT_LINUX_AMD64_SHA256 SHELLCHECK_APT_VERSION \
            TERRAFORM_VERSION; do
            [ "$(grep -c "^${tuple_var}=" <<< "${current_tools_env}")" -eq 1 ] \
              || { echo "::error::quality-tools.env must declare ${tuple_var} exactly once."; exit 1; }
          done
          candidate_tools_env="$(sed \
            -e "s/^ACTIONLINT_VERSION=.*/ACTIONLINT_VERSION='${actionlint_candidate}'/" \
            -e "s/^ACTIONLINT_LINUX_AMD64_SHA256=.*/ACTIONLINT_LINUX_AMD64_SHA256='${actionlint_sha}'/" \
            -e "s/^SHELLCHECK_APT_VERSION=.*/SHELLCHECK_APT_VERSION='${shellcheck_candidate}'/" \
            -e "s/^TERRAFORM_VERSION=.*/TERRAFORM_VERSION='${terraform_required}'/" \
            <<< "${current_tools_env}")"

          mapfile -t managed_tools_pr_numbers < <(jq -r \
            --arg branch "${TOOLS_BRANCH}" --arg owner "${repository_owner}" '
              [.[] | select(
                .headRefName == $branch
                and .headRepositoryOwner.login == $owner
                and .isCrossRepository == false
              )]
              | sort_by(.number)
              | .[].number
            ' <<< "${managed_prs_json}")
          if [ "${#managed_tools_pr_numbers[@]}" -gt 1 ]; then
            echo "::error::Multiple local managed PRs target ${TOOLS_BRANCH}; refusing ambiguity."
            exit 1
          fi
          existing_tools_pr="${managed_tools_pr_numbers[0]:-}"

          if [ "${candidate_tools_env}" = "${current_tools_env}" ]; then
            echo "quality-tools.env already matches every discovered primary source."
            if [ -n "${existing_tools_pr}" ]; then
              gh pr close "${existing_tools_pr}" --repo "${GITHUB_REPOSITORY}" \
                --comment "Closing: protected main already carries the discovered tool tuples."
            fi
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TOOLS_BRANCH}" > /dev/null 2>&1; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TOOLS_BRANCH}" \
                -f sha="${base_sha}" -F force=true > /dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/heads/${TOOLS_BRANCH}" -f sha="${base_sha}" > /dev/null
            fi
            tools_blob_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/quality-tools.env?ref=${TOOLS_BRANCH}" --jq '.sha')"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/quality-tools.env" \
              -f branch="${TOOLS_BRANCH}" \
              -f message='chore: discover quality-tool version and checksum tuples' \
              -f content="$(printf '%s\n' "${candidate_tools_env}" | base64 -w 0)" \
              -f sha="${tools_blob_sha}" > /dev/null

          tools_body="$(cat <<EOF
          Automated discovery only; every artifact was downloaded and validated in this run, and
          auto-merge is not enabled. Terraform is coupled to the pinned framework's exact
          required_version, not fetched independently.

          | Tuple | Source | Candidate |
          |---|---|---|
          | actionlint | GitHub release + published checksum, binary self-reports | ${actionlint_candidate} |
          | shellcheck (apt) | Ubuntu 24.04 archive candidate | ${shellcheck_candidate} |
          | terraform | framework versions.tf at the current pin | ${terraform_required} |

          An unchanged version with a changed checksum means the published artifact mutated —
          treat that as an incident, not an update.
          EOF
          )"
            if [ -n "${existing_tools_pr}" ]; then
              gh pr edit "${existing_tools_pr}" --repo "${GITHUB_REPOSITORY}" \
                --title "chore: review discovered quality-tool tuple updates" --body "${tools_body}"
              gh pr comment "${existing_tools_pr}" --repo "${GITHUB_REPOSITORY}" \
                --body "Discovery refreshed by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            else
              gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${TOOLS_BRANCH}" \
                --title "chore: review discovered quality-tool tuple updates" --body "${tools_body}"
            fi
            tools_branch_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TOOLS_BRANCH}" --jq '.object.sha')"
            ensure_quality_run "${tools_branch_sha}"
          fi
          # ---- end quality-tools.env tuple discovery ----------------------------------------

          if [ "${ansible_candidate}" = "${ansible_pin}" ] && \
            [ "${terraform_candidate}" = "${terraform_pin}" ]; then
            echo "Framework pins already match the discovered upstream commits."
            if [ -n "${existing_pr}" ]; then
              gh pr close "${existing_pr}" --repo "${GITHUB_REPOSITORY}" \
                --comment "Closing: protected main already contains the discovered framework commits."
            fi
            exit 0
          fi

          expected_files=()
          [ "${ansible_candidate}" = "${ansible_pin}" ] \
            || expected_files+=(.github/ansible-framework-pin)
          [ "${terraform_candidate}" = "${terraform_pin}" ] \
            || expected_files+=(.github/terraform-framework-pin)

          if [ -n "${existing_pr}" ]; then
            branch_matches=false
            if branch_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/${UPDATE_BRANCH}" --jq '.object.sha')" && \
              branch_ansible_pin="$(read_remote_pin .github/ansible-framework-pin "${branch_sha}")" && \
              branch_terraform_pin="$(read_remote_pin .github/terraform-framework-pin "${branch_sha}")" && \
              [ "${ansible_candidate}" = "${branch_ansible_pin}" ] && \
              [ "${terraform_candidate}" = "${branch_terraform_pin}" ]; then
              branch_matches=true
            fi

            if [ "${branch_matches}" = true ]; then
              history_clean=false
              if compare_json="$(gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${branch_sha}")"; then
                expected_file_text="$(printf '%s\n' "${expected_files[@]}" | sort)"
                actual_file_text="$(jq -r '.files[].filename' <<< "${compare_json}" | sort)"
                expected_count="${#expected_files[@]}"

                if [ "${actual_file_text}" = "${expected_file_text}" ] && jq -e \
                  --arg base_sha "${base_sha}" --argjson expected_count "${expected_count}" '
                    .base_commit.sha == $base_sha
                    and .merge_base_commit.sha == $base_sha
                    and .behind_by == 0
                    and .ahead_by == $expected_count
                    and (.commits | length) == $expected_count
                  ' <<< "${compare_json}" > /dev/null; then
                  history_clean=true
                  declare -A seen_history_files=()
                  commit_shas="$(jq -r '.commits[].sha' <<< "${compare_json}")"
                  while IFS= read -r commit_sha; do
                    [ -n "${commit_sha}" ] || continue
                    commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}")"
                    parent_count="$(jq -r '.parents | length' <<< "${commit_json}")"
                    commit_file_count="$(jq -r '.files | length' <<< "${commit_json}")"
                    if [ "${parent_count}" -ne 1 ] || [ "${commit_file_count}" -ne 1 ]; then
                      history_clean=false
                      break
                    fi

                    commit_file="$(jq -er '.files[0].filename' <<< "${commit_json}")"
                    file_expected=false
                    for expected_file in "${expected_files[@]}"; do
                      [ "${commit_file}" = "${expected_file}" ] && file_expected=true
                    done
                    if [ "${file_expected}" != true ] || \
                      [[ -n "${seen_history_files[${commit_file}]+present}" ]]; then
                      history_clean=false
                      break
                    fi
                    seen_history_files["${commit_file}"]=1
                  done <<< "${commit_shas}"
                  [ "${#seen_history_files[@]}" -eq "${expected_count}" ] \
                    || history_clean=false
                fi
              fi

              if [ "${history_clean}" = true ]; then
                ensure_quality_run "${branch_sha}"
                echo "Open PR #${existing_pr} already contains only the current candidates; no update."
                exit 0
              fi
              echo "Open PR #${existing_pr} has unexpected tree/history; rebuilding from protected main."
            fi
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${UPDATE_BRANCH}" > /dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${UPDATE_BRANCH}" \
              -f sha="${base_sha}" -F force=true > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${UPDATE_BRANCH}" -f sha="${base_sha}" > /dev/null
          fi

          update_pin() {
            local path="$1" value="$2" message="$3" blob_sha encoded
            blob_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${UPDATE_BRANCH}" --jq '.sha')"
            encoded="$(printf '%s\n' "${value}" | base64 -w 0)"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f branch="${UPDATE_BRANCH}" -f message="${message}" \
              -f content="${encoded}" -f sha="${blob_sha}" > /dev/null
          }

          if [ "${ansible_candidate}" != "${ansible_pin}" ]; then
            update_pin .github/ansible-framework-pin "${ansible_candidate}" \
              "chore: discover ansible-framework ${ansible_candidate}"
          fi
          if [ "${terraform_candidate}" != "${terraform_pin}" ]; then
            update_pin .github/terraform-framework-pin "${terraform_candidate}" \
              "chore: discover aws-terraform-framework ${terraform_candidate}"
          fi

          body="$(cat <<EOF
          Automated discovery only; no privileged workflow was dispatched and auto-merge is not enabled.

          - ansible-framework: \`${ansible_pin}\` -> \`${ansible_candidate}\`
          - aws-terraform-framework: \`${terraform_pin}\` -> \`${terraform_candidate}\`

          Review upstream provenance and required statuses before promotion. The credential-free
          required quality workflow must pass; the protected-main AWS lifecycle proves after merge.
          EOF
          )"

          if [ -n "${existing_pr}" ]; then
            gh pr edit "${existing_pr}" --repo "${GITHUB_REPOSITORY}" \
              --title "chore: review discovered framework pin updates" --body "${body}"
            gh pr comment "${existing_pr}" --repo "${GITHUB_REPOSITORY}" \
              --body "Discovery refreshed by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${UPDATE_BRANCH}" \
              --title "chore: review discovered framework pin updates" --body "${body}"
          fi

          updated_branch_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${UPDATE_BRANCH}" --jq '.object.sha')"
          ensure_quality_run "${updated_branch_sha}"

  report:
    name: Framework discovery incident
    needs: discover
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      INCIDENT_LABEL: automation-incident
      INCIDENT_MARKER: '<!-- windows-wsus-automation:framework-discovery -->'
      INCIDENT_TITLE: '[automation] Framework pin discovery failed'
      DISCOVERY_RESULT: ${{ needs.discover.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Update or resolve the discovery incident
        run: |
          set -euo pipefail

          gh label create "${INCIDENT_LABEL}" --repo "${GITHUB_REPOSITORY}" --force \
            --color B60205 --description 'Owned exclusively by recurring automation incidents' > /dev/null
          issue_json="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all --limit 100 \
            --label "${INCIDENT_LABEL}" --json number,title,body,author,state)"
          mapfile -t issue_numbers < <(jq -r --arg title "${INCIDENT_TITLE}" \
            --arg marker "${INCIDENT_MARKER}" '
              [.[] | select(
                .title == $title
                and .author.login == "app/github-actions"
                and ((.body // "") | contains($marker))
              )] | sort_by(.number) | .[].number
            ' <<< "${issue_json}")
          issue_number="${issue_numbers[0]:-}"
          for duplicate in "${issue_numbers[@]:1}"; do
            if [ "$(gh issue view "${duplicate}" --repo "${GITHUB_REPOSITORY}" \
              --json state --jq .state)" = OPEN ]; then
              gh issue close "${duplicate}" --repo "${GITHUB_REPOSITORY}" --reason duplicate \
                --comment "Deduplicated into automation-owned incident #${issue_number}."
            fi
          done

          if [ "${DISCOVERY_RESULT}" = success ]; then
            if [ -n "${issue_number}" ] && \
              [ "$(gh issue view "${issue_number}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)" = OPEN ]; then
              gh issue close "${issue_number}" --repo "${GITHUB_REPOSITORY}" \
                --reason completed --comment "Recovered in ${RUN_URL}."
            else
              echo "Discovery is healthy; no open incident to resolve."
            fi
            exit 0
          fi

          message="Framework pin discovery result: ${DISCOVERY_RESULT}. Inspect ${RUN_URL}. No candidate was auto-merged."
          if [ -z "${issue_number}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --label "${INCIDENT_LABEL}" --title "${INCIDENT_TITLE}" \
              --body "$(printf '%s\n\n%s' "${INCIDENT_MARKER}" "${message}")"
          else
            if [ "$(gh issue view "${issue_number}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)" = CLOSED ]; then
              gh issue reopen "${issue_number}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body "${message}"
          fi
