# =========================================================================================== #
# AWS Deploy — windows-wsus
# ------------------------------------------------------------------------------------------- #
# Ephemeral lifecycle: terraform init/apply -> ansible -> terraform destroy (always).
# Terraform is DATA-ONLY here (tfvars template, no .tf files); resources live in the pinned
# aws-terraform-framework, configuration in the pinned ansible-framework + this repo's role.
#
#   * The OIDC trust pins THIS FILE's path in job_workflow_ref — every stage lives here, and
#     a rename fails the credential exchange loudly.
#   * Reachability: EIP + key-authenticated SSH (the SG's only ingress; egress is empty).
#     readiness_gate=false because the framework's gate dials the private ip; the Ansible
#     stage waits for sshd/EC2Launch itself, then flips DefaultShell to PowerShell.
#   * Credentials re-exchange per stage (MaxSessionDuration < job runtime); a destroy with
#     dead credentials strands paid resources.
#   * One fixed state key; the concurrency group serializes runs, and apply converges from
#     whatever state a killed predecessor left.
# =========================================================================================== #
name: AWS Deploy

on:
  workflow_dispatch:
  pull_request:
    # synchronize included so edits to an open PR re-prove; labeled excluded so a
    # triage-permission user cannot spend money.
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      # ansible/** stays WHOLE: the compose overlay can shadow framework content.
      - ansible/**
      - docs/reference/aws-iam/**
      - scripts/check-iam-literals.sh
      - scripts/test-iam-policies.sh
      - terraform/**
      - .terraform-framework-pin
      - .framework-pin
      - .github/workflows/aws-deploy.yml
permissions: {}

# One boundary, one state key — never two runs at once, never cancel a live apply.
concurrency:
  group: aws-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  aws-deploy:
    name: AWS (ephemeral deploy-test-destroy)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Fork PRs never reach the role; the org's no-ID-token-to-forks setting is layer one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_ROLE: github_nwarila-platform_windows-wsus
      TF_DIR: .frameworks/aws-terraform-framework/terraform
      STATE_KEY: nwarila-platform/windows-wsus/aws-poc.tfstate
      # Matches the pinned ansible-framework's requirements-dev.txt spec.
      ANSIBLE_CORE_SPEC: '>=2.21.2,<2.22'

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d13d05 # v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-deploy-${{ github.run_id }}
          role-duration-seconds: 3600

      # actions/checkout cannot read a file into ref:, so the pinned SHAs pass through step
      # outputs. A bad SHA fails the checkout itself.
      - name: Read framework pins
        id: pins
        run: |
          echo "terraform=$(cat .terraform-framework-pin)" >> "$GITHUB_OUTPUT"
          echo "ansible=$(cat .framework-pin)" >> "$GITHUB_OUTPUT"

      - name: Checkout aws-terraform-framework (pinned)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: nwarila-platform/aws-terraform-framework
          ref: ${{ steps.pins.outputs.terraform }}
          path: .frameworks/aws-terraform-framework
          persist-credentials: false

      - name: Checkout ansible-framework (pinned)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: nwarila-platform/ansible-framework
          ref: ${{ steps.pins.outputs.ansible }}
          path: .frameworks/ansible-framework
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # The framework's required_version is exact.
          terraform_version: '1.15.1'
          terraform_wrapper: false

      # Also renders the tfvars: the framework refuses a /0 ingress CIDR (its world-open
      # ingress ban), so the SSH rule must name this runner's own address, discovered per run.
      # Rendering here means destroy (gated on this step) can always rely on the file.
      - name: Terraform init
        id: tf-init
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          sed "s|__RUNNER_CIDR__|${runner_ip}/32|" \
            terraform/environments/aws-test.tfvars.tmpl > "${RUNNER_TEMP}/aws-test.tfvars"
          terraform -chdir="${TF_DIR}" init -input=false \
            -backend-config="bucket=${AWS_ACCOUNT_ID}-terraform" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      # Converges from clean OR from a killed predecessor's leftover state. The environment
      # and the deployment identity are passed as individual -var flags — the highest-
      # precedence source, so the tfvars cannot override who this deployment says it is.
      - name: Terraform apply
        timeout-minutes: 30
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" apply -input=false -auto-approve -lock-timeout=120s \
            -var-file="${RUNNER_TEMP}/aws-test.tfvars" \
            -var "environment=test" \
            -var "repository=${GITHUB_REPOSITORY}" \
            -var "repository_id=${GITHUB_REPOSITORY_ID}" \
            -var "stack=aws-poc" \
            -var "owner=${GITHUB_REPOSITORY_OWNER}" \
            -var "commit_sha=$(git rev-parse HEAD)" \
            -var "run_id=${GITHUB_RUN_ID}"

      # Fresh hour for the longest stage: the play's disk resolver describes EBS mid-run.
      - name: Refresh AWS credentials before configure (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d13d05 # v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-deploy-configure-${{ github.run_id }}
          role-duration-seconds: 3600

      # Readiness, configuration and the WSUS proof all live in the playbook; the dynamic
      # inventory (ansible/inventory/aws_ec2.yml) finds the instance by its Function tag.
      # This step just prepares the controller: toolchain, SSH key, compose overlay.
      - name: Run Ansible
        timeout-minutes: 110
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          AWS_EC2_SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
          # Imported by the play's pre-tasks — same value the OIDC role ARN is built from.
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --no-cache-dir "ansible-core${ANSIBLE_CORE_SPEC}" boto3 botocore
          ansible-galaxy collection install ansible.windows community.windows amazon.aws

          install -d -m 0700 "${HOME}/.ssh"
          install -m 0600 /dev/stdin "${HOME}/.ssh/nwarila-ec2-key.pem" <<< "${AWS_EC2_SSH_PRIVATE_KEY}"

          # Compose overlay: this repo's roles onto the pinned framework tree. Refuse a
          # framework-TRACKED role path so an overlay can never replace framework-owned code.
          framework_dir="${GITHUB_WORKSPACE}/.frameworks/ansible-framework"
          for role_source in "${GITHUB_WORKSPACE}"/ansible/applications/*; do
            role_name="$(basename "${role_source}")"
            [ -f "${role_source}/tasks/main.yml" ] || { echo "!! missing tasks/main.yml in ${role_source}" >&2; exit 1; }
            [ -z "$(git -C "${framework_dir}" ls-files -- "applications/${role_name}/")" ] \
              || { echo "!! refusing framework-tracked role path applications/${role_name}" >&2; exit 1; }
            rsync -a --delete "${role_source}/" "${framework_dir}/applications/${role_name}/"
          done

          cd "${framework_dir}"
          ansible-playbook -i "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml" \
            "${GITHUB_WORKSPACE}/ansible/playbooks/wsus-aws.yml" -e env=test

      # The originals are dead by now; a destroy with dead credentials strands paid resources.
      - name: Refresh AWS credentials before destroy (OIDC)
        if: always() && steps.tf-init.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d13d05 # v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-deploy-destroy-${{ github.run_id }}
          role-duration-seconds: 3600

      # Gated on INIT, not apply: a failed apply still leaves state to tear down. Ends with
      # the cost alarm — resources a hard-killed apply never recorded in state are invisible
      # to destroy, but the identity tag finds them; remediation is an operator call.
      - name: Terraform destroy (ephemeral, always)
        if: always() && steps.tf-init.outcome == 'success'
        timeout-minutes: 30
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" destroy -input=false -auto-approve -lock-timeout=300s \
            -var-file="${RUNNER_TEMP}/aws-test.tfvars" \
            -var "environment=test" \
            -var "repository=${GITHUB_REPOSITORY}" \
            -var "repository_id=${GITHUB_REPOSITORY_ID}" \
            -var "stack=aws-poc" \
            -var "owner=${GITHUB_REPOSITORY_OWNER}" \
            -var "commit_sha=$(git rev-parse HEAD)" \
            -var "run_id=${GITHUB_RUN_ID}"
          tag="Name=tag:nwarila:management:repository-id,Values=${GITHUB_REPOSITORY_ID}"
          fails=0
          check() { # label query...
            local label="$1"; shift
            local n; n="$("$@" --output text)"
            [ "${n}" = "0" ] || { echo "!! ${n} ${label} survived" >&2; fails=1; }
          }
          check 'instance(s)' aws ec2 describe-instances --filters "${tag}" \
            "Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down" \
            --query 'length(Reservations[].Instances[])'
          check 'volume(s)' aws ec2 describe-volumes --filters "${tag}" --query 'length(Volumes)'
          check 'ENI(s)' aws ec2 describe-network-interfaces --filters "${tag}" \
            --query 'length(NetworkInterfaces)'
          check 'Elastic IP(s)' aws ec2 describe-addresses --filters "${tag}" --query 'length(Addresses)'
          check 'security group(s)' aws ec2 describe-security-groups --filters "${tag}" \
            --query 'length(SecurityGroups)'
          [ "${fails}" = "0" ] && echo 'destroyed clean — no tagged resources survived'
          exit "${fails}"
