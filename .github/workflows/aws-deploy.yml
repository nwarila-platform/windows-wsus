# =========================================================================================== #
# AWS Deploy — windows-wsus
# ------------------------------------------------------------------------------------------- #
# Ephemeral lifecycle: terraform init/apply -> ansible -> terraform destroy (always).
# Terraform is DATA-ONLY here (tfvars template, no .tf files); resources live in the pinned
# aws-terraform-framework, configuration in the pinned ansible-framework + this repo's role.
#
#   * The OIDC trust pins THIS FILE's path in job_workflow_ref — every stage lives here, and
#     a rename fails the credential exchange loudly.
#   * Reachability: EIP + key-authenticated SSH (the SG's only ingress; egress is empty).
#     readiness_gate=false because the framework's gate dials the private ip; the Ansible
#     stage waits for sshd/EC2Launch itself, then flips DefaultShell to PowerShell.
#   * Credentials re-exchange per stage (MaxSessionDuration < job runtime); a destroy with
#     dead credentials strands paid resources.
#   * One fixed state key; the concurrency group serializes runs, and apply converges from
#     whatever state a killed predecessor left.
# =========================================================================================== #
name: AWS Deploy

on:
  workflow_dispatch:
  pull_request:
    # synchronize included so edits to an open PR re-prove; labeled excluded so a
    # triage-permission user cannot spend money.
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      # ansible/** stays WHOLE: the compose overlay can shadow framework content.
      - ansible/**
      - docs/reference/aws-iam/**
      - scripts/check-iam-literals.sh
      - scripts/test-iam-policies.sh
      - terraform/**
      - .terraform-framework-pin
      - .framework-pin
      - .github/workflows/aws-deploy.yml
permissions: {}

# One boundary, one state key — never two runs at once, never cancel a live apply.
concurrency:
  group: aws-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  aws-deploy:
    name: AWS (ephemeral deploy-test-destroy)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Fork PRs never reach the role; the org's no-ID-token-to-forks setting is layer one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_ROLE: github_nwarila-platform_windows-wsus
      TF_DIR: .frameworks/aws-terraform-framework/terraform
      STATE_KEY: nwarila-platform/windows-wsus/aws-poc.tfstate
      WSUS_HOSTNAME: wsus-poc-01
      # Matches the pinned ansible-framework's requirements-dev.txt spec.
      ANSIBLE_CORE_SPEC: '>=2.21.2,<2.22'
      # Drives the framework's provider default_tags — satisfies every create-time
      # nwarila:management:repository-id condition in the deploy policies.
      TF_VAR_resource_metadata: >-
        {"repository":"${{ github.repository }}","repository_id":"${{ github.repository_id }}",
        "stack":"aws-poc","owner":"${{ github.repository_owner }}",
        "commit_sha":"${{ github.sha }}","run_id":"${{ github.run_id }}"}

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d13d05 # v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-deploy-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Resolve framework pins
        id: pins
        run: |
          set -euo pipefail
          for pin in .terraform-framework-pin .framework-pin; do
            sha="$(tr -d '[:space:]' < "${pin}")"
            printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$' \
              || { printf '%s is not a full lowercase SHA: %s\n' "${pin}" "${sha}" >&2; exit 1; }
            printf '%s=%s\n' "$(basename "${pin}" | tr -d '.' | tr - _)" "${sha}" >> "${GITHUB_OUTPUT}"
          done

      - name: Checkout aws-terraform-framework (pinned)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: nwarila-platform/aws-terraform-framework
          ref: ${{ steps.pins.outputs.terraformframeworkpin }}
          path: .frameworks/aws-terraform-framework
          persist-credentials: false

      - name: Checkout ansible-framework (pinned)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: nwarila-platform/ansible-framework
          ref: ${{ steps.pins.outputs.frameworkpin }}
          path: .frameworks/ansible-framework
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # The framework's required_version is exact.
          terraform_version: '1.15.1'
          terraform_wrapper: false

      - name: Terraform init
        id: tf-init
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" init -input=false \
            -backend-config="bucket=${AWS_ACCOUNT_ID}-terraform" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      # Converges from clean OR from a killed predecessor's leftover state.
      - name: Terraform apply
        timeout-minutes: 30
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" apply -input=false -auto-approve -lock-timeout=120s \
            -var-file="${GITHUB_WORKSPACE}/terraform/environments/aws-test.tfvars"

      # Fresh hour for the longest stage: the play's disk resolver describes EBS mid-run.
      - name: Refresh AWS credentials before configure (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d13d05 # v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-deploy-configure-${{ github.run_id }}
          role-duration-seconds: 3600

      # Readiness (sshd + EC2Launch + DefaultShell->PowerShell), compose the pinned framework
      # with this repo's role, run the play, prove WSUS serves. One stage, one transport.
      - name: Run Ansible (readiness + configure + prove)
        timeout-minutes: 110
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          AWS_EC2_SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
          # Imported by the play's pre-tasks — same value the OIDC role ARN is built from.
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail

          # -- controller toolchain (boto3 powers the role's Function-tag resolver) ----------
          python3 -m pip install --quiet --no-cache-dir "ansible-core${ANSIBLE_CORE_SPEC}" boto3 botocore
          ansible-galaxy collection install ansible.windows community.windows amazon.aws

          # -- compose overlay: validate every role, refuse framework-TRACKED paths ----------
          framework_dir="${GITHUB_WORKSPACE}/.frameworks/ansible-framework"
          for role_source in "${GITHUB_WORKSPACE}"/ansible/applications/*; do
            role_name="$(basename "${role_source}")"
            [[ "${role_name}" =~ ^[a-z][a-z0-9_]*$ ]] || { echo "!! bad role name ${role_name}" >&2; exit 1; }
            [ ! -L "${role_source}" ] || { echo "!! symlinked role ${role_source}" >&2; exit 1; }
            [ -f "${role_source}/tasks/main.yml" ] || { echo "!! missing tasks/main.yml in ${role_source}" >&2; exit 1; }
            [ -z "$(git -C "${framework_dir}" ls-files -- "applications/${role_name}/")" ] \
              || { echo "!! refusing framework-tracked role path applications/${role_name}" >&2; exit 1; }
          done
          for role_source in "${GITHUB_WORKSPACE}"/ansible/applications/*; do
            rsync -a --delete "${role_source}/" "${framework_dir}/applications/$(basename "${role_source}")/"
          done

          # -- target address: the EIP the framework bound to eni-0 --------------------------
          eip="$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=${WSUS_HOSTNAME}" \
                      "Name=tag:nwarila:management:repository-id,Values=${GITHUB_REPOSITORY_ID}" \
            --query 'Addresses[0].PublicIp' --output text)"
          { [ -n "${eip}" ] && [ "${eip}" != "None" ]; } \
            || { echo 'no Elastic IP found for the PoC instance' >&2; exit 1; }
          echo "target: ${eip}"

          # -- readiness: sshd up, EC2Launch done, DefaultShell = PowerShell -----------------
          install -m 0600 /dev/stdin "${RUNNER_TEMP}/key.pem" <<< "${AWS_EC2_SSH_PRIVATE_KEY}"
          ssh_cmd() {
            ssh -i "${RUNNER_TEMP}/key.pem" -o BatchMode=yes -o ConnectTimeout=10 \
                -o ServerAliveInterval=15 -o StrictHostKeyChecking=accept-new \
                -o UserKnownHostsFile="${RUNNER_TEMP}/known_hosts" \
                "Administrator@${eip}" "$@"
          }
          for _ in $(seq 1 90); do ssh_cmd 'exit 0' 2>/dev/null && break; sleep 10; done
          ssh_cmd 'exit 0' || { echo 'sshd never became reachable' >&2; exit 1; }
          ssh_cmd '"C:\Program Files\Amazon\EC2Launch\EC2Launch.exe" status -b'
          flip="Set-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell"
          flip="${flip} -Value 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe';"
          flip="${flip} Restart-Service sshd"
          # The restart drops our own session; verify with a PowerShell-only construct.
          ssh_cmd "powershell -NoProfile -NonInteractive -Command \"${flip}\"" || true
          ready=false
          for _ in $(seq 1 12); do
            if ssh_cmd '(Get-ItemProperty "HKLM:\SOFTWARE\OpenSSH").DefaultShell' 2>/dev/null \
              | grep -qi 'powershell.exe'; then ready=true; break; fi
            sleep 5
          done
          [ "${ready}" = true ] || { echo 'DefaultShell flip did not take' >&2; exit 1; }

          # -- inventory + play --------------------------------------------------------------
          cat > "${RUNNER_TEMP}/inventory.yml" <<EOF
          wsus_servers:
            hosts:
              ${WSUS_HOSTNAME}:
                ansible_host: '${eip}'
            vars:
              ansible_user: 'Administrator'
              ansible_connection: 'ssh'
              ansible_shell_type: 'powershell'
              ansible_ssh_private_key_file: '${RUNNER_TEMP}/key.pem'
              ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/known_hosts'
          EOF
          ( cd "${framework_dir}" && ansible-playbook -i "${RUNNER_TEMP}/inventory.yml" \
              "${GITHUB_WORKSPACE}/ansible/playbooks/wsus-aws.yml" -e env=test )

          # -- prove WSUS actually serves, on the disks the deploy layer handed it -----------
          ssh_cmd 'powershell -NoProfile -NonInteractive -Command -' <<'PS'
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('WsusService', 'W3SVC', 'MSSQL$MICROSOFT##WID')) {
            $svc = Get-Service -Name $name
            if ($svc.Status -ne 'Running') { throw "service $name is $($svc.Status), not Running" }
          }
          foreach ($pair in @(@('E', 'WSUSDB'), @('F', 'WSUSDATA'), @('G', 'WSUSIIS'))) {
            $vol = Get-Volume -DriveLetter $pair[0]
            if ($vol.FileSystemLabel -cne $pair[1]) {
              throw "volume $($pair[0]): label '$($vol.FileSystemLabel)' != '$($pair[1])'"
            }
          }
          if (-not (Test-Path 'E:\WID\Data\SUSDB.mdf')) { throw 'SUSDB.mdf not relocated to E:\WID\Data' }
          if (-not (Test-Path 'F:\WSUS\WSUSContent')) { throw 'content root F:\WSUS\WSUSContent missing' }
          $wsus = Get-WsusServer -Name localhost -PortNumber 8530
          $null = $wsus.GetStatus()
          $resp = Invoke-WebRequest -UseBasicParsing -Uri 'http://localhost:8530/ClientWebService/client.asmx'
          if ($resp.StatusCode -ne 200) { throw "ClientWebService answered $($resp.StatusCode)" }
          Write-Output 'PROOF: WSUS serving on 8530, WID on E:, content on F:, IIS artifacts on G:'
          PS

      # The originals are dead by now; a destroy with dead credentials strands paid resources.
      - name: Refresh AWS credentials before destroy (OIDC)
        if: always() && steps.tf-init.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d13d05 # v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-deploy-destroy-${{ github.run_id }}
          role-duration-seconds: 3600

      # Gated on INIT, not apply: a failed apply still leaves state to tear down. Ends with
      # the cost alarm — resources a hard-killed apply never recorded in state are invisible
      # to destroy, but the identity tag finds them; remediation is an operator call.
      - name: Terraform destroy (ephemeral, always)
        if: always() && steps.tf-init.outcome == 'success'
        timeout-minutes: 30
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" destroy -input=false -auto-approve -lock-timeout=300s \
            -var-file="${GITHUB_WORKSPACE}/terraform/environments/aws-test.tfvars"
          tag="Name=tag:nwarila:management:repository-id,Values=${GITHUB_REPOSITORY_ID}"
          fails=0
          check() { # label query...
            local label="$1"; shift
            local n; n="$("$@" --output text)"
            [ "${n}" = "0" ] || { echo "!! ${n} ${label} survived" >&2; fails=1; }
          }
          check 'instance(s)' aws ec2 describe-instances --filters "${tag}" \
            "Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down" \
            --query 'length(Reservations[].Instances[])'
          check 'volume(s)' aws ec2 describe-volumes --filters "${tag}" --query 'length(Volumes)'
          check 'ENI(s)' aws ec2 describe-network-interfaces --filters "${tag}" \
            --query 'length(NetworkInterfaces)'
          check 'Elastic IP(s)' aws ec2 describe-addresses --filters "${tag}" --query 'length(Addresses)'
          check 'security group(s)' aws ec2 describe-security-groups --filters "${tag}" \
            --query 'length(SecurityGroups)'
          [ "${fails}" = "0" ] && echo 'destroyed clean — no tagged resources survived'
          exit "${fails}"
