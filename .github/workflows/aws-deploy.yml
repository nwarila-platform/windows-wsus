# =========================================================================================== #
# AWS Deploy — windows-wsus
# ------------------------------------------------------------------------------------------- #
# Ephemeral lifecycle: terraform init/apply -> ansible -> terraform destroy on the normal path.
# Terraform is DATA-ONLY here (a plain tfvars, no .tf files); resources live in the pinned
# aws-terraform-framework, configuration in the pinned ansible-framework and this repo's plays.
#
#   * AWS credentials are issued only to this workflow at refs/heads/main, by both the workflow
#     guard below and the OIDC trust; feature-branch workflow code never reaches AWS.
#   * Reachability: direct SSH to a subnet-assigned public IPv4, admitted by ONE run-scoped group
#     the framework attaches at apply. It carries the runner's validated public IPv4, and an
#     operator's own address as well, resolved at run time from an organisation secret naming a
#     host rather than from anything committed or recorded with the run. Nothing in
#     terraform/aws.tfvars opens tcp/22 any more: the committed rule that opened it to the whole
#     IPv4 space was a development-cycle allowance and has been removed, so this repository no
#     longer records who may reach the estate or from where. This configuration creates no EIP and
#     has no NAT. The playbook performs the bounded direct-SSH readiness check because
#     readiness_gate remains disabled.
#   * AWS credentials are exchanged before provisioning and refreshed before EACH long AWS-using
#     phase -- the idempotence proof, the optional operating-system swap, and teardown. The
#     7,800-second session is the deploy role's MaxSessionDuration and cannot be lengthened, and it
#     does NOT cover the whole pre-hold path now that this lifecycle builds two Windows guests: a
#     slow but permitted run would otherwise reach a later phase with it expired. The teardown
#     refresh uses a modest 3,600-second session so long holds do not reach destroy expired.
#     The 330-minute job budget stays below the runner's 360-minute execution limit. It no longer
#     accommodates the longest hold: this lifecycle now builds TWO Windows guests sequentially, so
#     the converge path costs roughly 150 minutes of it and a 240-minute hold would not fit. Choose
#     120 or less until the two-guest path has been measured. It is not a teardown guarantee
#     either: abnormal delay can exhaust the budget before destroy and strand paid resources. That
#     risk is accepted for this temporary proof bed.
#   * One fixed state key; this workflow's concurrency group prevents overlapping applies and
#     never cancels a live lifecycle. A later lifecycle can clean predecessor state before apply;
#     no age-gated reaper exists for a run killed before destroy.
#   * Protected-main pushes prove immediately; an off-minute weekly schedule proves recurrence.
#     One durable incident is updated on failure and closed after the next successful lifecycle.
# =========================================================================================== #
name: AWS Deploy

'on':
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: Hold the provisioned guest before teardown
        type: choice
        options:
          - '0'
          - '15'
          - '60'
          - '120'
          - '240'
        default: '0'
      os_swap:
        description: After converge, replace the OS drive and prove the data volumes reattach
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    # Avoid the top-of-hour load spike documented for scheduled Actions workflows.
    - cron: '17 9 * * 1'
permissions: {}

# One boundary, one state key — never two runs at once, never cancel a live apply.
concurrency:
  group: aws-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  main-ref:
    name: Protected main ref
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse privileged execution outside protected main
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "${EXPECTED_REF}" ]; then
            echo "::error::AWS lifecycle runs only from ${EXPECTED_REF}; got ${GITHUB_REF}."
            exit 1
          fi

  aws-deploy:
    name: AWS (ephemeral deploy-test-destroy)
    needs: main-ref
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The 330-minute budget remains below the runner's 360-minute execution limit. With two Windows
    # guests built sequentially the converge path takes roughly 150 minutes of it, so a 240-minute
    # hold no longer fits; a timeout can still strand resources before teardown.
    timeout-minutes: 330
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE: nwarila-platform_windows-wsus_runner
      # Must match key_name in terraform/aws.tfvars.
      CI_KEY_NAME: nwarila-ec2-key

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate hold duration
        if: github.event_name == 'workflow_dispatch'
        env:
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail
          case "${HOLD_MINUTES}" in
            0|15|60|120|240) ;;
            *)
              echo "::error::hold_minutes must be one of 0, 15, 60, 120, or 240; re-dispatch with a listed choice."
              exit 1
              ;;
          esac

      - name: Set up pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: requirements-quality.txt

      - name: Install Ansible
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          runtime_venv="${RUNNER_TEMP}/aws-proof-venv"
          python3 -m venv "${runtime_venv}"
          "${runtime_venv}/bin/python" -m pip install --quiet --no-cache-dir \
            --requirement requirements-quality.txt
          "${runtime_venv}/bin/ansible-galaxy" collection install --force \
            --requirements-file requirements-quality.yml
          echo "${runtime_venv}/bin" >> "${GITHUB_PATH}"

      # The framework consumes a pre-existing key pair and never creates one, so the standing
      # account key pair named in terraform/aws.tfvars is the launch key. Windows user_data
      # installs its public half by reading IMDS; only the private half is secret, and it
      # exists solely in this runner's temporary directory, mode 0600, for this one job.
      - name: Stage the launch private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          private_key="${RUNNER_TEMP}/${CI_KEY_NAME}.pem"
          umask 077
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${private_key}"
          staged_public="$(ssh-keygen -y -f "${private_key}")" \
            || { echo "::error::AWS_EC2_SSH_PRIVATE_KEY is not a usable private key."; exit 1; }
          echo "CI_PRIVATE_KEY=${private_key}" >> "${GITHUB_ENV}"
          echo "CI_STAGED_PUBLIC_KEY=${staged_public}" >> "${GITHUB_ENV}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}
          role-duration-seconds: 7800

      # actions/checkout cannot read a file into ref:, so validated immutable SHAs pass through
      # step outputs. Reject malformed/multiline pins before any external framework checkout.
      # A rotated secret that no longer matches the launch key pair is invisible until Ansible
      # cannot log in — which surfaces fifteen minutes and one instance later as a readiness
      # timeout. Compare the two public halves here instead, before anything is created.
      - name: Assert the staged key matches the launch key pair
        run: |
          set -euo pipefail
          launch_public="$(aws ec2 describe-key-pairs --key-names "${CI_KEY_NAME}" \
            --include-public-key --query 'KeyPairs[0].PublicKey' --output text)"
          staged_material="$(awk '{print $1" "$2}' <<< "${CI_STAGED_PUBLIC_KEY}")"
          launch_material="$(awk '{print $1" "$2}' <<< "${launch_public}")"
          if [ "${staged_material}" != "${launch_material}" ]; then
            echo "::error::AWS_EC2_SSH_PRIVATE_KEY does not match EC2 key pair ${CI_KEY_NAME}." \
                 "The guest installs the key pair's public half, so SSH would fail after launch." \
                 "Rotate the secret to the matching private key, or repoint key_name."
            exit 1
          fi
          echo "staged key matches ${CI_KEY_NAME}"

      - name: Read framework pins
        id: pins
        run: |
          set -euo pipefail
          emit_pin() {
            local name="$1" path="$2" pin
            local -a lines
            mapfile -t lines < "${path}"
            [ "${#lines[@]}" -eq 1 ] || {
              echo "${path} must contain exactly one line" >&2
              return 1
            }
            pin="${lines[0]}"
            [[ "${pin}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "${path} must contain exactly one lowercase 40-character Git SHA" >&2
              return 1
            }
            printf '%s=%s\n' "${name}" "${pin}" >> "${GITHUB_OUTPUT}"
          }
          emit_pin terraform .github/terraform-framework-pin
          emit_pin ansible .github/ansible-framework-pin

      - name: Checkout aws-terraform-framework (pinned)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository_owner }}/aws-terraform-framework
          ref: ${{ steps.pins.outputs.terraform }}
          path: .frameworks/aws-terraform-framework
          persist-credentials: false

      - name: Checkout ansible-framework (pinned)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository_owner }}/ansible-framework
          ref: ${{ steps.pins.outputs.ansible }}
          path: .frameworks/ansible-framework
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # The framework's required_version is exact.
          terraform_version: '1.15.1'
          terraform_wrapper: false

      - name: Discover and validate runner public IPv4
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsS --max-time 15 https://checkip.amazonaws.com)"
          ipv4_octet='(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
          if [[ ! "${runner_ip}" =~ ^${ipv4_octet}\.${ipv4_octet}\.${ipv4_octet}\.${ipv4_octet}$ ]]; then
            echo "::error::Runner public address discovery did not return a bare IPv4 address."
            exit 1
          fi
          echo "::add-mask::${runner_ip}"
          echo "RUNNER_IP=${runner_ip}" >> "${GITHUB_ENV}"
          echo 'runner public IPv4 validated'

      # A HOSTNAME rather than an address, resolved at run time. An address supplied as a dispatch
      # input is recorded unmasked in the run's parameters and kept with it; a dynamic name held as
      # an organisation secret is not, which is the whole reason the framework's own variable
      # documentation gives for never committing one. An unset secret grants nobody anything and is
      # the normal case. A secret that is set and will not resolve DOES fail, because the
      # alternative is a host that silently cannot be reached by the person who asked for it.
      - name: Resolve the operator address for direct access
        env:
          DEBUG_HOSTNAME: ${{ secrets.AWS_DEBUG_HOSTNAME }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_HOSTNAME}" ]; then
            echo 'no operator hostname configured; this run grants no direct access'
            exit 0
          fi
          # `|| true` so the check below is the ONE gate: a name that does not resolve and a name
          # that resolves to something that is not an address fail the same way to a reader, and
          # without it the first kills the step on pipefail before this message can explain itself.
          # The check proves the SHAPE of an address, not that it is routable.
          debug_ip="$(getent ahostsv4 "${DEBUG_HOSTNAME}" | awk '{ print $1; exit }' || true)"
          ipv4_octet='(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
          if [[ ! "${debug_ip}" =~ ^${ipv4_octet}\.${ipv4_octet}\.${ipv4_octet}\.${ipv4_octet}$ ]]; then
            echo "::error::The operator hostname did not resolve to a bare IPv4 address."
            exit 1
          fi
          echo "::add-mask::${debug_ip}"
          echo "DEBUG_IP=${debug_ip}" >> "${GITHUB_ENV}"
          echo 'operator IPv4 resolved and validated'

      - name: Terraform init
        id: tf-init
        working-directory: .frameworks/aws-terraform-framework/terraform
        run: |
          set -euo pipefail
          terraform init -input=false                                        \
            -backend-config="bucket=${{ secrets.AWS_ACCOUNT_ID }}-terraform" \
            -backend-config="key=${{ github.repository }}/aws-poc.tfstate"   \
            -backend-config="region=${AWS_REGION}"

      # A killed predecessor can leave state and an instance whose one-time SSH private key no
      # longer exists. Never adopt it: destroy under the same lock, then apply with a fresh key.
      # A live/out-of-band lock makes this fail closed.
      - name: Remove interrupted predecessor state before apply
        timeout-minutes: 15
        working-directory: .frameworks/aws-terraform-framework/terraform
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          terraform destroy -input=false -auto-approve -lock-timeout=300s    \
            -var "commit_sha=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" \
            -var "environment=test"                                          \
            -var "repository_id=${GITHUB_REPOSITORY_ID}"                     \
            -var "repository=${GITHUB_REPOSITORY}"                           \
            -var "run_id=${GITHUB_RUN_ID}"                                   \
            -var "runner_ip=${RUNNER_IP}"                                    \
            -var-file="${GITHUB_WORKSPACE}/terraform/aws.tfvars"

      # The environment and deployment identity are individual -var flags — the highest-
      # precedence source, so the tfvars cannot override who this fresh deployment says it is.
      #
      # debug_ip reaches the flag ONLY when the resolve step above set it. The framework's variable
      # takes an address or null and refuses an empty string, so the :+ expansion is what keeps a
      # blank from arriving as one. Committed rules used to open tcp/22 to the whole internet for
      # this; this grants one person one address, for one run, from a name nothing here records.
      - name: Terraform apply
        id: tf-apply
        timeout-minutes: 15
        working-directory: .frameworks/aws-terraform-framework/terraform
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve -lock-timeout=120s      \
            -var-file="${GITHUB_WORKSPACE}/terraform/aws.tfvars"             \
            -var "runner_ip=${RUNNER_IP}"                                    \
            -var "environment=test"                                          \
            -var "repository=${GITHUB_REPOSITORY}"                           \
            -var "repository_id=${GITHUB_REPOSITORY_ID}"                     \
            -var "commit_sha=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" \
            -var "run_id=${GITHUB_RUN_ID}"                                   \
            ${DEBUG_IP:+-var "debug_ip=${DEBUG_IP}"}

      # This repo's roles overlay onto the pinned framework tree. A framework-TRACKED role
      # path is refused so an overlay can never replace framework-owned code.
      #
      # nullglob, because the overlay set may legitimately be empty — the framework owns the roles
      # this play uses. An unmatched glob would otherwise reach the loop as its own literal path
      # and fail there, on a name no operator ever wrote.
      - name: Compose the Ansible tree
        run: |
          set -euo pipefail
          framework_dir="${GITHUB_WORKSPACE}/.frameworks/ansible-framework"
          # The framework tracks only <Name>.ps1.stub markers for the scripts its roles execute,
          # and materializes the reviewed sources from its own scripts/ at build time. Without
          # this the roles' lookup('file', ...) fails on a name that exists only as a stub.
          if [ -x "${framework_dir}/scripts/materialize-role-scripts.sh" ]; then
            (cd "${framework_dir}" && ./scripts/materialize-role-scripts.sh)
          fi
          shopt -s nullglob
          role_sources=("${GITHUB_WORKSPACE}"/ansible/applications/*)
          shopt -u nullglob
          for role_source in "${role_sources[@]}"; do
            role_name="$(basename "${role_source}")"
            [ -f "${role_source}/tasks/main.yml" ] || { echo "!! missing tasks/main.yml in ${role_source}" >&2; exit 1; }
            [ -z "$(git -C "${framework_dir}" ls-files -- "applications/${role_name}/")" ] \
              || { echo "!! refusing framework-tracked role path applications/${role_name}" >&2; exit 1; }
            rsync -a --delete "${role_source}/" "${framework_dir}/applications/${role_name}/"
          done
          echo "overlaid ${#role_sources[@]} repository role(s)"

      # Readiness, host preparation, guest storage and the WSUS role all live in the playbook.
      # The EC2 inventory plugin filters live instances to this repository and run before exposing
      # one target.
      # The FIRST long phase needs the refresh too, and most of all. The initial session is 130
      # minutes and this step alone may take 110 of them -- leaving twenty for predecessor destroy
      # and apply, each of which allows fifteen on its own. The playbook keeps making controller-
      # side AWS calls throughout: the tunnel profile and join secret come from S3, the disk role
      # resolves volumes through EC2, and the client's plays run LAST, after the server's
      # synchronisation waits. A run that is slow but entirely permitted would fail there with
      # ExpiredToken, with both Windows guests already built and paid for.
      - name: Refresh AWS credentials before the first converge
        if: always() && steps.tf-apply.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}-converge
          role-duration-seconds: 7800

      # 110 rather than 60, because this step now builds TWO Windows guests SEQUENTIALLY. Ansible
      # runs plays in order, and the client's readiness, bootstrap, tunnel and domain join are
      # their own plays that begin only after the server's product is finished -- so the guest
      # preparation cost is paid twice, and on top of it sit the WSUS install, the TLS work, a
      # catalogue synchronisation with its content, and the client's own update install.
      - name: Run the WSUS playbook
        timeout-minutes: 110
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          # NOT extra-vars: the dynamic inventory reads these from the environment to pick this
          # run's instance, and a lookup('env') has no command-line equivalent.
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/wsus-aws.yml" \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"     \
            --extra-vars env=test                                               \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                     \
            --extra-vars state=present

      # Idempotency gate: a settled host reports NO changes on a second converge. The same play is
      # run again and the step fails if any managed host reports changed>0 -- the standard proof
      # that every task's change detection is honest. A role that re-reports a change would bounce
      # its service on every run, so this is a hard gate, not a warning.
      # 40 rather than 30 for the same reason, though this run does no work on either host: it is
      # two full inventories, two connection setups and two playbook passes.
      # The OIDC session is 7,800 seconds and the role's MaxSessionDuration is exactly that, so it
      # cannot simply be lengthened. It is issued before framework setup, predecessor destroy and
      # apply, and the first converge may now take 110 minutes of what remains -- which leaves a
      # slow but entirely permitted run arriving here with expired credentials, to fail on a
      # dynamic inventory lookup with ExpiredToken rather than on anything real. Refreshed
      # immediately before each long AWS-using phase instead.
      - name: Refresh AWS credentials before the idempotence proof
        if: always() && steps.tf-apply.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}-proof
          role-duration-seconds: 7800

      - name: Prove the converge is idempotent (second run is a no-op)
        timeout-minutes: 40
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          recap="$(ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/wsus-aws.yml" \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"              \
            --extra-vars env=test                                                         \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                               \
            --extra-vars state=present 2>&1 | tee /dev/stderr)"

          if printf '%s\n' "${recap}" | grep -Eq ': +ok=[0-9]+ +changed=[1-9]'; then
            echo "::error::second converge reported changes -- the role is not idempotent" >&2
            exit 1
          fi
          echo "idempotent: the second converge reported no changes"

      # OS-DRIVE REPLACEMENT proof (opt-in). Bumping refresh_serial replaces the OS instance while
      # the STANDALONE data volumes detach and reattach to the replacement, so the guest has to
      # come back on the databases it already had. This is the mandate's replaceable-operating-
      # system property, and it is also the only state in which the WSUS role ever meets an
      # existing SUSDB: every lifecycle destroys its volumes at the end, so nothing else this
      # repository can build leaves a database behind to be adopted.
      # The operator grant is repeated here for the same reason every other -var is: this is a
      # full apply, and a variable absent from it is a variable terraform computes as null. Left
      # out, this second apply would quietly withdraw the access the first one granted, in the
      # middle of the run the person asked for it.
      # Again, because the swap path adds a full apply and a second 60-minute converge on top of
      # everything above it. A credential that was fresh at the idempotence proof need not be by
      # the time terraform is asked to replace a volume.
      - name: Refresh AWS credentials before the operating-system swap
        if: always() && inputs.os_swap && steps.tf-apply.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}-os-swap
          role-duration-seconds: 7800

      - name: Replace the OS drive, keeping the data volumes (refresh_serial bump)
        if: inputs.os_swap
        timeout-minutes: 15
        working-directory: .frameworks/aws-terraform-framework/terraform
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve -lock-timeout=120s      \
            -var-file="${GITHUB_WORKSPACE}/terraform/aws.tfvars"             \
            -var "runner_ip=${RUNNER_IP}"                                    \
            -var "environment=test"                                          \
            -var "repository=${GITHUB_REPOSITORY}"                           \
            -var "repository_id=${GITHUB_REPOSITORY_ID}"                     \
            -var "commit_sha=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" \
            -var "run_id=${GITHUB_RUN_ID}"                                   \
            -var "refresh_serial=1"                                          \
            ${DEBUG_IP:+-var "debug_ip=${DEBUG_IP}"}

      # The operating system is new, so this pays a first converge's costs again and gets a first
      # converge's budget. The disk role adopts each reattached volume untouched -- it classifies a
      # disk carrying an NTFS volume with the declared label as one of its own, formats only what
      # is blank or unformatted, and re-letters the rest -- so SUSDB is still on E: when the WSUS
      # role runs.
      - name: Re-converge onto the reattached data
        if: inputs.os_swap
        timeout-minutes: 60
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/wsus-aws.yml" \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"    \
            --extra-vars env=test                                              \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                    \
            --extra-vars state=present

      # The same idempotency bar as the first converge, on a host whose operating system was
      # rebuilt underneath it: a rebuilt guest that has adopted its data is no less settled than
      # one that created it.
      - name: Prove the rebuilt host is steady (second run is a no-op)
        if: inputs.os_swap
        timeout-minutes: 30
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          recap="$(ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/wsus-aws.yml" \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"    \
            --extra-vars env=test                                              \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                    \
            --extra-vars state=present 2>&1 | tee /dev/stderr)"
          if printf '%s\n' "${recap}" | grep -Eq ': +ok=[0-9]+ +changed=[1-9]'; then
            echo "::error::the rebuilt host reported changes on a second converge" >&2
            exit 1
          fi
          echo "steady: the rebuilt host reported no changes"

      - name: Hold the provisioned guest for interactive work
        if: >-
          !cancelled() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.hold_minutes != '0' &&
          steps.tf-apply.outcome == 'success'
        timeout-minutes: 245
        env:
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail
          remaining_minutes="${HOLD_MINUTES}"
          echo "Holding the provisioned guest for ${remaining_minutes} minutes."
          while (( remaining_minutes > 0 )); do
            sleep 300
            remaining_minutes=$((remaining_minutes - 5))
            echo "Hold heartbeat: ${remaining_minutes} minutes remaining."
          done
          exit 0

      - name: Refresh AWS credentials for teardown (OIDC)
        if: always() && steps.tf-init.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}-teardown
          role-duration-seconds: 3600

      # Gated on INIT, not apply: a failed apply still leaves state to tear down.
      - name: Terraform destroy (always)
        id: tf-destroy
        if: >-
          always() &&
          steps.tf-init.outcome == 'success'
        timeout-minutes: 15
        working-directory: .frameworks/aws-terraform-framework/terraform
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          terraform destroy -input=false -auto-approve -lock-timeout=300s    \
            -var-file="${GITHUB_WORKSPACE}/terraform/aws.tfvars"             \
            -var "runner_ip=${RUNNER_IP}"                                    \
            -var "environment=test"                                          \
            -var "repository=${GITHUB_REPOSITORY}"                           \
            -var "repository_id=${GITHUB_REPOSITORY_ID}"                     \
            -var "commit_sha=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" \
            -var "run_id=${GITHUB_RUN_ID}"

      - name: Remove the ephemeral private key
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${CI_PRIVATE_KEY:-}" ]; then
            rm -f -- "${CI_PRIVATE_KEY}"
          fi

  report:
    name: AWS lifecycle incident
    needs: [main-ref, aws-deploy]
    if: always() && needs.main-ref.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      INCIDENT_LABEL: automation-incident
      INCIDENT_MARKER: '<!-- windows-wsus-automation:aws-lifecycle -->'
      INCIDENT_TITLE: '[automation] AWS lifecycle proof failed'
      LIFECYCLE_RESULT: ${{ needs.aws-deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Update or resolve the lifecycle incident
        run: |
          set -euo pipefail

          gh label create "${INCIDENT_LABEL}" --repo "${GITHUB_REPOSITORY}" --force \
            --color B60205 --description 'Owned exclusively by recurring automation incidents' > /dev/null
          issue_json="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all --limit 100 \
            --label "${INCIDENT_LABEL}" --json number,title,body,author,state)"
          mapfile -t issue_numbers < <(jq -r --arg title "${INCIDENT_TITLE}" \
            --arg marker "${INCIDENT_MARKER}" '
              [.[] | select(
                .title == $title
                and .author.login == "app/github-actions"
                and ((.body // "") | contains($marker))
              )] | sort_by(.number) | .[].number
            ' <<< "${issue_json}")
          issue_number="${issue_numbers[0]:-}"
          for duplicate in "${issue_numbers[@]:1}"; do
            if [ "$(gh issue view "${duplicate}" --repo "${GITHUB_REPOSITORY}" \
              --json state --jq .state)" = OPEN ]; then
              gh issue close "${duplicate}" --repo "${GITHUB_REPOSITORY}" --reason duplicate \
                --comment "Deduplicated into automation-owned incident #${issue_number}."
            fi
          done

          if [ "${LIFECYCLE_RESULT}" = success ]; then
            if [ -n "${issue_number}" ] && \
              [ "$(gh issue view "${issue_number}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)" = OPEN ]; then
              gh issue close "${issue_number}" --repo "${GITHUB_REPOSITORY}" \
                --reason completed --comment "Recovered in ${RUN_URL}."
            else
              echo "Lifecycle is healthy; no open incident to resolve."
            fi
            exit 0
          fi

          message="Lifecycle result: ${LIFECYCLE_RESULT}. See ${RUN_URL}."
          message="${message} If initialization succeeded, check whether the destroy step ran and succeeded;"
          message="${message} cancellation or timeout can prevent cleanup."
          if [ -z "${issue_number}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --label "${INCIDENT_LABEL}" --title "${INCIDENT_TITLE}" \
              --body "$(printf '%s\n\n%s' "${INCIDENT_MARKER}" "${message}")"
          else
            if [ "$(gh issue view "${issue_number}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)" = CLOSED ]; then
              gh issue reopen "${issue_number}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body "${message}"
          fi
