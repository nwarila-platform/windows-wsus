# =========================================================================================== #
# File: 'ansible/playbooks/wsus.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Provisions the declared Windows data disks, then deploys the WSUS (WID-backed) role to the
# 'wsus_servers' inventory group. Runs from the COMPOSED tree only —
# scripts/compose-and-run.sh overlays the role into a pinned ansible-framework checkout and
# executes this playbook with the framework chassis.
#
# Windows-over-SSH notes: the upstream disk-manager loader is Windows-aware, but the local wsus
# v3.1.0 loader still needs the TD-001 workarounds below. Remove them after the wsus loader is
# synchronized with the upstream Windows-aware loader.
#
# =========================================================================================== #
---
- name: 'PLAY | WSUS Server (WID-backed)'
  hosts: 'wsus_servers'
  # TD-001: playbook-level gathering routes to the Windows setup module; with facts
  # already present, the loader skips its own ansible.builtin.setup call.
  gather_facts: true
  # TD-001: framework chassis ansible.cfg sets become=sudo (POSIX-only). The admin
  # account over SSH already holds an elevated token on Windows.
  become: false

  vars:
    # Platform convention: 'env' is the operator-facing extra-var; 'ENV' is the
    # play-var the loader validates (mirrors the wazuh central playbooks).
    ENV: "{{ env }}"
    # Guest disk provisioning is delegated to the framework role. These drive letters must
    # match wsus_defaults.data_disks because wsus consumes the volumes by letter.
    windows_disk_manager:
      platform: 'vmware'
      disks:
        - unique_id: 'eui.6C7076230CC23C55000C2968C7AE5760'
          drive_letter: 'E'
          label: 'WSUSDB'
          allocation_unit: 65536
        - unique_id: 'eui.CF4AE05CEB88F43B000C29656D55634B'
          drive_letter: 'F'
          label: 'WSUSDATA'
          allocation_unit: 4096
        - unique_id: 'eui.BC9F0ECE9FBC4B9A000C296303722FC1'
          drive_letter: 'G'
          label: 'WSUSIIS'
          allocation_unit: 4096
    wsus:
      # TD-001: disable the local loader's POSIX temp-dir; the role owns its staging via
      # ansible.windows.win_tempfile.
      temp_dir: false
      # Upstream WSUS server (C11d): this server is a DOWNSTREAM of the named upstream WSUS
      # (SyncFromMicrosoftUpdate=false). REQUIRED input (validate.yml asserts it) — no default.
      # DEV PLACEHOLDER below (the dev VM has no real upstream; Save() persists it without a
      # reachability check). Supply the real upstream hostname in production / on backport.
      upstream_server: 'wsus-upstream.corp.local'

  pre_tasks:
    # TD-001: the loader's 'INIT | Loading Installed Package Facts' task runs
    # ansible.builtin.package_facts (Python-only, no disable flag) and would hard-fail
    # on Windows. Seeding an empty dict satisfies its 'when' guard. Set the 'packages'
    # fact directly; NEVER set the name 'ansible_facts', because that set_fact variable
    # shadows the live facts store and hides all later facts-module results.
    - name: 'PRE | Seed empty package facts (loader Windows gap)'
      when: ansible_facts.packages is not defined
      ansible.builtin.set_fact:
        packages: {}
        cacheable: true

  roles:
    - role: 'windows_disk_manager'
    - role: 'wsus'
