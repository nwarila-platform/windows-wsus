# =========================================================================================== #
# File: 'ansible/playbooks/wsus-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Builds a WSUS server on SQL Server from ephemeral EC2, then a client that proves it. Runs only
# from the composed tree: the workflow overlays this repository onto the pinned ansible-framework
# and runs it against a dynamic EC2 inventory filtered to one run.
# =========================================================================================== #
---
#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# The inventory filters to this run by tag. This guards the one state a filter cannot: an empty
# result, where nothing launched or nothing was tagged.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  tasks:
    - name: 'INVENTORY | Require At Least One Filtered Host'
      ansible.builtin.assert:
        that: groups['wsus_servers'] | default([]) | length >= 1
        fail_msg: >-
          Refusing to configure: the 'wsus_servers' inventory group is empty. The dynamic EC2
          inventory found no running instance tagged for this run -- a zero-host inventory is not a
          successful deployment proof.
        quiet: true

    # Same for the client. Without this a run whose client never appeared would skip both client
    # plays and report success.

    - name: 'INVENTORY | Require At Least One Filtered Client'
      ansible.builtin.assert:
        that: groups['wsus_clients'] | default([]) | length >= 1
        fail_msg: >-
          Refusing to configure: the 'wsus_clients' inventory group is empty. The dynamic EC2
          inventory found no running instance tagged Function=wsus_client for this run, so nothing
          would ask the WSUS server for an update and the run would prove only half of itself.
        quiet: true

    # Bucket names are templated from the account id, so a wrong one fails minutes later on the
    # guest. Refuse it here.

    - name: 'INVENTORY | Require The Deploying Account'
      ansible.builtin.assert:
        that: aws_account_id is defined and aws_account_id is match('^[0-9]{12}$')
        fail_msg: >-
          Refusing to configure: aws_account_id must be passed as an extra-var and must be the
          twelve-digit account this run deploys into.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Configure The Guest ] -------------------------------------------------- #

- name: 'PLAY | Configure The Guest (ephemeral AWS)'
  hosts: 'wsus_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Host Readiness ] -------------------------------------------------- #
    # Declared, not detected: a failed probe reads as "no platform" and skips the EC2Launch wait.
    - role: 'host_readiness'
      vars: { host_readiness_platform: 'aws' }

    #endregion --- [ Roles: Host Readiness ] -------------------------------------------------- #

    #region ------ [ Roles: OS Bootstrap ] ---------------------------------------------------- #
    # Pass it NO vars: role params outrank the connection scoping it relies on.
    - role: 'os_bootstrap'

    #endregion --- [ Roles: OS Bootstrap ] ---------------------------------------------------- #

    #region ------ [ Roles: Remote Client ] --------------------------------------------------- #
    # The role defaults everything this site needs; 'aws_account_id' arrives as an extra-var.
    - role: 'remote_client'

    #endregion --- [ Roles: Remote Client ] --------------------------------------------------- #

    #region ------ [ Roles: Domain Member ] --------------------------------------------------- #
    # Three things are this environment's: the realm and join account, the OU a WSUS server is filed
    # under, and which address the host publishes in DNS. The VPC address, because the host is
    # multi-homed and would otherwise register its tunnel address -- VPC clients would then reach it
    # the long way round. That on-prem clients cannot resolve it is a dev-estate gap, not a
    # production one -- decision 57: production has no on-prem clients.
    - role: 'domain_member'
      vars:
        domain_member:
          realm: 'tcn.trinitytechnicalservices.com'
          user: 'svc-domainjoin@tcn.trinitytechnicalservices.com'
          password: >-
            {{ lookup('secret',
                's3://' ~ aws_account_id ~ '-ansible/host_roles/domain_member/'
                ~ 'svc-domainjoin-password.txt',
                '07493ed779c2962bff0b5e19cfa00b8cdb95defcf477f6b5bac36ddef55087ae') }}
          computer_ou: 'OU=WSUS,OU=Domain Servers,DC=tcn,DC=trinitytechnicalservices,DC=com'
          registration_address: "{{ aws_private_ip_address }}"

    #endregion --- [ Roles: Domain Member ] --------------------------------------------------- #

    #region ------ [ Roles: Windows Disk Manager ] -------------------------------------------- #
    # 'function' is each volume's Function tag in terraform/aws.tfvars; the role finds the disk by
    # it.
    - role: 'windows_disk_manager'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks:
            - function: 'WSUSDB'
              drive_letter: 'E'
              label: 'WSUSDB'
              allocation_unit: 65536
            - function: 'WSUSDATA'
              drive_letter: 'F'
              label: 'WSUSDATA'
              allocation_unit: 4096
            - function: 'WSUSIIS'
              drive_letter: 'G'
              label: 'WSUSIIS'
              allocation_unit: 4096

    #endregion --- [ Roles: Windows Disk Manager ] -------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Configure The Guest ] -------------------------------------------------- #

#region ------ [ Play: WSUS ] ----------------------------------------------------------------- #
# Its own play, so the product's failure reads as the product's rather than as one more role in
# a chain that also formats disks.

- name: 'PLAY | WSUS On SQL Server (ephemeral AWS)'
  hosts: 'wsus_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: WSUS ] ------------------------------------------------------------ #
    # The drive letters are the ones the disk role laid down in the previous play.
    - role: 'wsus'
      vars:
        wsus:
          db:
            drive_letter: 'E'
          content:
            drive_letter: 'F'
          updates:
            languages: ['en']
          sync:
            # Catalogue wait then content wait, sequential in one CI step. Worst case is three waits
            # -- an in-flight sync is stopped first -- so 75 minutes is the ceiling and 45 the
            # ordinary path. Generous for this upstream, measured at 66 MB across one approved
            # update; sized for the step that also builds a second Windows guest.
            content_timeout_seconds: 900
            timeout_seconds: 1800

            # Approvals are made once, upstream, and inherited here.
            replica: true

            # 'wait' because this deployment exists to prove a client takes an update, and only wait
            # can say the catalogue arrived. Affordable only because the upstream is a curated lab
            # server holding one approved update; a full Microsoft mirror would say 'start'.
            mode: 'wait'

            # The lab WSUS this POC mirrors, over the OpenVPN tunnel. An address, not a name: this
            # upstream is not a domain member and the guest resolves through the domain's DNS.
            upstream_server: '10.69.112.6'

            # Plain HTTP on 8530 because encrypting this link needs the UPSTREAM to serve SSL, which
            # is its property, not this deployment's.
            upstream_port: 8530
            upstream_use_ssl: false
          tls:
            certificate:
              bucket: "{{ aws_account_id | default('') }}-ansible"
              dns_name: "{{ inventory_hostname }}.tcn.trinitytechnicalservices.com"
              object: "applications/windows-wsus/tls/{{ inventory_hostname }}.pfx"
              password: >-
                {{ lookup('secret',
                    's3://' ~ aws_account_id ~ '-ansible/applications/windows-wsus/tls'
                    ~ '/' ~ inventory_hostname ~ '.pfx.password',
                    '0ba43689e6f79a59fcf2ce0bfad2a868042d4e4eae92506b84ccb38f1bea6d59') }}
              sha256: '473880d30d30fd3f6fc32b9aedd6e9fd410d9a63b31c0152d993d9ed0a585e16'
              thumbprint: '8760E9DA2B79D7FCFB5C8DADD72628649029B348'

    #endregion --- [ Roles: WSUS ] ------------------------------------------------------------ #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: WSUS ] ----------------------------------------------------------------- #

#region ------ [ Play: Configure The Client Guest ] ------------------------------------------- #
# The client that proves the server: a healthy WSUS proves it is configured, only a machine that
# takes an update from it proves it works. Same roles as the server, minus the disk manager.

- name: 'PLAY | Configure The Client Guest (ephemeral AWS)'
  hosts: 'wsus_clients'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Host Readiness ] -------------------------------------------------- #
    # Declared, not detected, as on the server.
    - role: 'host_readiness'
      vars:
        host_readiness_platform: 'aws'

    #endregion --- [ Roles: Host Readiness ] -------------------------------------------------- #

    #region ------ [ Roles: OS Bootstrap ] ---------------------------------------------------- #
    # Pass it NO vars: role params outrank the connection scoping it relies on.
    - role: 'os_bootstrap'

    #endregion --- [ Roles: OS Bootstrap ] ---------------------------------------------------- #

    #region ------ [ Roles: Remote Client ] --------------------------------------------------- #
    # The directory this machine joins is on the other side of the tunnel.
    - role: 'remote_client'

    #endregion --- [ Roles: Remote Client ] --------------------------------------------------- #

    #region ------ [ Roles: Domain Member ] --------------------------------------------------- #
    # Must be in scope of the domain's Windows Update policy, which is what points it at the server
    # under test. Domain Servers because that is the one OU this repository can show exists.
    - role: 'domain_member'
      vars:
        domain_member:
          realm: 'tcn.trinitytechnicalservices.com'
          user: 'svc-domainjoin@tcn.trinitytechnicalservices.com'
          password: >-
            {{ lookup('secret',
                's3://' ~ aws_account_id ~ '-ansible/host_roles/domain_member/'
                ~ 'svc-domainjoin-password.txt',
                '07493ed779c2962bff0b5e19cfa00b8cdb95defcf477f6b5bac36ddef55087ae') }}
          computer_ou: 'OU=Domain Servers,DC=tcn,DC=trinitytechnicalservices,DC=com'
          # Its VPC address, as the server. Declared because the framework refuses an empty value.
          registration_address: "{{ aws_private_ip_address }}"

    #endregion --- [ Roles: Domain Member ] --------------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Configure The Client Guest ] ------------------------------------------- #

#region ------ [ Play: Prove The Client ] ----------------------------------------------------- #
# Its own play, for the same reason the server's product gets one.

- name: 'PLAY | Prove The Client Takes Updates From WSUS (ephemeral AWS)'
  hosts: 'wsus_clients'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: WSUS Client ] ----------------------------------------------------- #
    # The URL is the certificate's subject, not an address: the server presents a certificate for
    # that name, so an IP would fail the handshake. If a first run resolves this to the tunnel
    # address, fix the tunnel adapter's registration, not the firewall.
    - role: 'wsus_client'
      vars:
        wsus_client:
          # The certificate the client must already trust, stated twice because the plays do not
          # share vars. The role reads the machine root stores for this thumbprint and refuses if it
          # is absent.
          certificate:
            thumbprint: '8760E9DA2B79D7FCFB5C8DADD72628649029B348'

          server:
            url: 'https://tcnaw-wsus01.tcn.trinitytechnicalservices.com:8531'

    #endregion --- [ Roles: WSUS Client ] ----------------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Prove The Client ] ----------------------------------------------------- #
