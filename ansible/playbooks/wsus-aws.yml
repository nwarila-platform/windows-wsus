# =========================================================================================== #
# File: 'ansible/playbooks/wsus-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Provisions the declared Windows data disks on the EPHEMERAL EC2 instance. The WSUS on SQL
# Server roles follow, one action at a time. Runs from the COMPOSED tree only — in CI,
# .github/workflows/aws-deploy.yml
# overlays this repository's roles into the pinned ansible-framework checkout and executes this
# playbook against a dynamic EC2 inventory filtered to this run by its framework-set EC2 tags,
# reached by direct SSH to the instance's public IPv4.
#
# Three plays, in a required order: confirm the filtered inventory is non-empty, wait for that
# instance to become reachable, then configure it.
#
# =========================================================================================== #
---

#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# The dynamic EC2 inventory (aws_ec2.yml) already filters to this run's instance by its
# framework-set tags, so the identity contract is not re-asserted here -- that would only re-check
# what the aws-terraform-framework guarantees. This guards the one state the filter cannot cover:
# an empty inventory, where the instance never launched or never tagged.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  gather_facts: false
  become: false
  tasks:
    - name: 'INVENTORY | Require At Least One Filtered Host'
      ansible.builtin.assert:
        that: groups['wsus_servers'] | default([]) | length >= 1
        fail_msg: >-
          Refusing to configure: the 'wsus_servers' inventory group is empty. The dynamic EC2
          inventory found no running instance tagged for this run -- a zero-host inventory is not a
          successful deployment proof.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Windows Readiness ] ---------------------------------------------------- #
# The instance answers the EC2 API seconds after creation and accepts SSH minutes later: it must
# finish sysprep and EC2Launch before sshd starts and the launch key is installed.
#
# Poll the TCP port without opening SSH sessions while sysprep and EC2Launch start sshd, then use
# a bounded authenticated probe before running anything on the guest.

- name: 'PLAY | Wait For Windows Readiness (direct SSH, EC2Launch)'
  hosts: 'wsus_servers'
  gather_facts: false
  become: false
  any_errors_fatal: true

  tasks:
    - name: 'READY | Wait For The Direct SSH Port'
      delegate_to: 'localhost'

      ansible.builtin.wait_for:
        active_connection_states: [ 'ESTABLISHED', 'FIN_WAIT1', 'FIN_WAIT2', 'SYN_RECV', 'SYN_SENT', 'TIME_WAIT' ]
        connect_timeout: 5
        delay: 0
        host: "{{ ansible_host }}"
        port: 22
        sleep: 15
        state: 'started'
        timeout: 900

    - name: 'READY | Confirm The Direct SSH Path End To End'
      changed_when: false
      delay: 15
      delegate_to: 'localhost'
      failed_when: __ssh_ready__.rc != 0
      register: '__ssh_ready__'
      retries: 20
      until: __ssh_ready__.rc == 0

      ansible.builtin.command:
        cmd: >-
          ssh {{ ansible_ssh_common_args }} -i {{ ansible_ssh_private_key_file }}
          -o BatchMode=yes -o ConnectTimeout=15
          {{ ansible_user }}@{{ ansible_host }} exit
        expand_argument_vars: true
        stdin_add_newline: true
        strip_empty_ends: true

    - name: 'READY | Wait For EC2Launch Provisioning To Complete'
      changed_when: false

      ansible.builtin.raw: '"C:\Program Files\Amazon\EC2Launch\EC2Launch.exe" status -b'

#endregion --- [ Play: Windows Readiness ] ---------------------------------------------------- #

#region ------ [ Play: Guest Storage ] ------------------------------------------------------- #

- name: 'PLAY | Guest Storage (ephemeral AWS)'
  hosts: 'wsus_servers'
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    ENV: "{{ env }}"
    # One volume per concern, matching terraform/aws.tfvars by Function tag. The letters are the
    # contract this play publishes to the roles that follow: SUSDB on E, the WSUS content store
    # on F, and the IIS root on G.
    wsus_disk_layout:
      - function: 'WSUSDB'
        drive_letter: 'E'
        label: 'WSUSDB'
        allocation_unit: 65536
      - function: 'WSUSDATA'
        drive_letter: 'F'
        label: 'WSUSDATA'
        allocation_unit: 4096
      - function: 'WSUSIIS'
        drive_letter: 'G'
        label: 'WSUSIIS'
        allocation_unit: 4096

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Windows Disk Manager ] -------------------------------------------- #
    # Guest disk provisioning is delegated to the composed framework role. `function` names
    # each EBS volume's Function tag (declared in
    # terraform/aws.tfvars) and the role resolves it to the attached disk itself, because a
    # volume id only exists after apply. The layout is passed through whole: adding a volume is
    # a change in two files, not three.
    - role: 'windows_disk_manager'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks: "{{ wsus_disk_layout }}"
    #endregion --- [ Roles: Windows Disk Manager ] -------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Guest Storage ] ------------------------------------------------------- #
