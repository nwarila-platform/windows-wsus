# =========================================================================================== #
# File: 'ansible/playbooks/wsus-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# AWS variant of wsus.yml: provisions the declared Windows data disks on the EPHEMERAL EC2
# instance, then deploys the WSUS (WID-backed) role. Runs from the COMPOSED tree only — in CI,
# .github/workflows/aws-deploy.yml overlays the role into the pinned ansible-framework
# checkout and executes this playbook against the aws_ec2 dynamic inventory (found by its
# Function tag, reached as its instance id over SSH-in-SSM — zero inbound).
#
# Differences from wsus.yml, and nothing else:
#   * windows_disk_manager.platform is 'aws' (vendor assert: 'Amazon EC2').
#   * Disk identities are declared by EBS `function` tag, not by literal unique_id: EBS
#     volume ids only exist after terraform apply, so the role resolves each Function tag
#     itself (windows_disk_manager/tasks/resolve_aws.yml — one controller-side describe per
#     host, Nitro serial == volume-id match), exactly like linux_disk_manager. The Function
#     tag values here must match the ebs_block_devices tags in
#     terraform/environments/aws-test.tfvars.tmpl.
#
# TD-001 workarounds are carried identically to wsus.yml; remove both together when the
# local wsus loader is synchronized with the upstream Windows-aware loader.
#
# =========================================================================================== #
---
#region ------ [ Play: Windows Readiness ] ---------------------------------------------------- #
# Runs BEFORE any Windows module can work: wait for sshd (EC2Launch installs the launch key
# minutes after boot) and for EC2Launch itself to finish provisioning. The OpenSSH
# DefaultShell stays cmd — the boot default, which passes ansible's module bootstrap argv
# through verbatim (a PowerShell login shell re-parses it and breaks -EncodedCommand; proven
# live, run 31185575215). Nothing in the roles needs a PowerShell login shell: win_* modules
# execute inside their own PowerShell wrapper regardless.
- name: 'PLAY | Wait for Windows readiness (sshd, EC2Launch)'
  hosts: 'wsus_servers'
  gather_facts: false
  become: false

  vars:
    # The same connection the inventory composes, spelled out for the controller-side probe
    # below (an unreachable `raw` task is never retried by retries/until, so the WAIT must run
    # on the controller, where a failing ssh is an ordinary command failure).
    __ssh_probe__: >-
      ssh {{ ansible_ssh_common_args }} -i {{ ansible_ssh_private_key_file }}
      -o BatchMode=yes -o ConnectTimeout=10
      {{ ansible_user }}@{{ ansible_host }} exit

  tasks:
    - name: 'READY | Wait for the SSM-SSH path (agent registered, sshd up, launch key installed)'
      delegate_to: 'localhost'
      ansible.builtin.command:
        cmd: "{{ __ssh_probe__ }}"
      register: '__ssh_ready__'
      retries: 90
      delay: 10
      until: __ssh_ready__.rc == 0
      failed_when: __ssh_ready__.rc != 0
      changed_when: false

    - name: 'READY | Wait for EC2Launch provisioning to complete'
      ansible.builtin.raw: '"C:\Program Files\Amazon\EC2Launch\EC2Launch.exe" status -b'
#endregion --- [ Play: Windows Readiness ] ---------------------------------------------------- #


- name: 'PLAY | WSUS Server (WID-backed, ephemeral AWS)'
  hosts: 'wsus_servers'
  # Roles gather the facts they need themselves at present-time; the play gathers nothing.
  gather_facts: false
  # TD-001: framework chassis ansible.cfg sets become=sudo (POSIX-only). The admin
  # account over SSH already holds an elevated token on Windows.
  become: false

  vars:
    # Platform convention: 'env' is the operator-facing extra-var; 'ENV' is the
    # play-var the loader validates (mirrors the wazuh central playbooks).
    ENV: "{{ env }}"


  #region ------ [ Pre-Tasks ] ---------------------------------------------------------------- #
  pre_tasks:

    #region ------ [ Pre-Tasks: Initalize Packages:{} ] --------------------------------------- #
    # TD-001: the loader's package_facts task is Python-only and would hard-fail on Windows.
    # Seeding an empty dict satisfies its 'when' guard. NEVER set the name 'ansible_facts'.
    - name: 'PRE | Seed empty package facts (loader Windows gap)'
      when: ansible_facts.packages is not defined
      ansible.builtin.set_fact:
        packages: {}
        cacheable: true
    #endregion --- [ Pre-Tasks: Initalize Packages:{} ] --------------------------------------- #

    #region ------ [ Pre-Tasks: Load AWS Account Information ] -------------------------------- #
    # The ROLE never reaches into an environment variable: every configuration value flows
    # through the 'wsus:' override dict. Account-derived values are imported HERE, once, from
    # the CONTROLLER environment the workflow already holds authoritatively — AWS_ACCOUNT_ID
    # is the same value the OIDC role ARN was built from, so the play and the deploy identity
    # can never disagree. lookup('env') evaluates on the controller, not the target.
    - name: 'PRE | Import AWS account information from the controller environment'
      ansible.builtin.set_fact:
        aws_account_id: "{{ lookup('ansible.builtin.env', 'AWS_ACCOUNT_ID') | trim }}"
        aws_region: "{{ lookup('ansible.builtin.env', 'AWS_REGION') | default('us-east-1', true) | trim }}"

    - name: 'PRE | Assert the account id was provided'
      ansible.builtin.assert:
        that:
          - (aws_account_id | length) == 12
          - aws_account_id is match('^[0-9]{12}$')
        fail_msg: >-
          AWS_ACCOUNT_ID is missing or malformed in the controller environment. The aws-deploy
          workflow exports it on the play step (from the same secret the OIDC role ARN uses);
          a local run must export it before invoking this playbook.
        quiet: true
    #endregion --- [ Pre-Tasks: Load AWS Account Information ] -------------------------------- #

  #endregion --- [ Pre-Tasks ] ---------------------------------------------------------------- #


  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:
    #region ------ [ Roles: Windows Disk Manager ] -------------------------------------------- #
    # Guest disk provisioning is delegated to the framework role. Drive letters must match
    # wsus_defaults.data_disks because wsus consumes the volumes by letter; each `function`
    # names the EBS volume's Function tag (declared in the terraform template) and the role
    # resolves it to the attached disk itself — no injected identities.
    - role: 'windows_disk_manager'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks:
            - function: 'WSUSDB'
              drive_letter: 'E'
              label: 'WSUSDB'
              allocation_unit: 65536
            - function: 'WSUSDATA'
              drive_letter: 'F'
              label: 'WSUSDATA'
              allocation_unit: 4096
            - function: 'WSUSIIS'
              drive_letter: 'G'
              label: 'WSUSIIS'
              allocation_unit: 4096
    #endregion --- [ Roles: Windows Disk Manager ] -------------------------------------------- #
    #region ------ [ Roles: Windows Server Update Service ] ----------------------------------- #
    - role: 'wsus'
      vars:
        wsus:
          # TD-001: disable the local loader's POSIX temp-dir; the WSUS role does not consume
          # the loader-provided staging directory.
          temp_dir: false
          # Upstream WSUS server (C11d): REQUIRED input (validate.yml asserts it). PLACEHOLDER —
          # the ephemeral PoC has no reachable upstream; the role only SAVES the downstream
          # topology config (no connectivity check), same as the dev VM.
          upstream_server: 'wsus-upstream.corp.local'
          # Artifact bucket. The '-ansible' suffix is the platform's Layer-0 bucket naming
          # convention (the state bucket is '<account-id>-terraform' the same way); it must
          # match the <artifact-bucket> value materialized into the IAM sources.
          bucket: "{{ aws_account_id }}-ansible"
          # TLS (MVP): the role finds-or-creates a self-signed certificate (dns_name '' =>
          # computer name), binds it to 8531, and runs wsusutil configuressl. Pin a
          # CA-issued certificate later by setting thumbprint (delivered from bucket +
          # tls.pfx_key); trust distribution is deliberately out of scope here.
          tls:
            enabled: true
            dns_name: ''
            thumbprint: ''
    #endregion --- [ Roles: Windows Server Update Service ] ----------------------------------- #
  #endregion --- [ Roles ] -------------------------------------------------------------------- #
