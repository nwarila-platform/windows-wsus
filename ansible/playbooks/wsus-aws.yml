# =========================================================================================== #
# File: 'ansible/playbooks/wsus-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Brings the EPHEMERAL EC2 instance from "the API says it exists" to a domain-joined host with
# its data disks provisioned. The WSUS on SQL Server roles follow, one action at a time.
#
# Runs from the COMPOSED tree only: the workflow overlays this repository onto the pinned
# ansible-framework and runs this against a dynamic EC2 inventory filtered to one run.
#
# The role order in the second play is the design. Each one is a precondition for the next: the
# host must answer before it can be repaired, be repaired before a module runs, be on the network
# before it can resolve a realm, and be in the realm before it is a host worth provisioning.
#
# gather_facts and become are absent throughout because the framework's ansible.cfg makes
# gathering explicit and escalation off. Both matter here: implicit gathering would run a module
# over the shell os_bootstrap has not yet fixed.
#
# =========================================================================================== #
---

#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# The inventory already filters to this run's instance by its framework-set tags. This guards the
# one state that filter cannot cover: an empty result, where nothing launched or nothing tagged.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  tasks:
    - name: 'INVENTORY | Require At Least One Filtered Host'
      ansible.builtin.assert:
        that: groups['wsus_servers'] | default([]) | length >= 1
        fail_msg: >-
          Refusing to configure: the 'wsus_servers' inventory group is empty. The dynamic EC2
          inventory found no running instance tagged for this run -- a zero-host inventory is not a
          successful deployment proof.
        quiet: true

    # The site roles template their bucket names from the account id, so a wrong one surfaces as a
    # download failure on the guest minutes later. Refuse it here, before anything is dialled.
    - name: 'INVENTORY | Require The Deploying Account'
      ansible.builtin.assert:
        that: aws_account_id is defined and aws_account_id is match('^[0-9]{12}$')
        fail_msg: >-
          Refusing to configure: aws_account_id must be passed as an extra-var and must be the
          twelve-digit account this run deploys into.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Configure The Guest ] -------------------------------------------------- #

- name: 'PLAY | Configure The Guest (ephemeral AWS)'
  hosts: 'wsus_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Host Readiness ] -------------------------------------------------- #
    # Waits for the connection itself, never a port: a TCP connect cannot speak for a connection
    # reaching its target through a proxy or a tunnel, and this inventory can select those. It
    # then waits out EC2Launch.
    - role: 'host_readiness'
      vars:
        # Declared, not detected. The role's probe carries ignore_errors, so a failed probe reads
        # as "no platform" and SKIPS the EC2Launch wait -- and the next role renames the computer
        # and reboots, which is exactly what that wait exists to sequence against.
        host_readiness_platform: 'aws'
    #endregion --- [ Roles: Host Readiness ] -------------------------------------------------- #

    #region ------ [ Roles: OS Bootstrap ] ---------------------------------------------------- #
    # Flips OpenSSH's DefaultShell to PowerShell and proves the session is elevated. Every module
    # after it depends on that. Pass it NO vars: role params outrank the connection scoping it
    # relies on, and a stray one silently re-breaks the pre-flip stage.
    - role: 'os_bootstrap'
    #endregion --- [ Roles: OS Bootstrap ] ---------------------------------------------------- #

    #region ------ [ Roles: Remote Client ] --------------------------------------------------- #
    # Site policy: the role defaults every value openvpn_client needs, so this play states none.
    # 'aws_account_id' is an extra-var -- only the pipeline knows which account it deploys into.
    - role: 'remote_client'
    #endregion --- [ Roles: Remote Client ] --------------------------------------------------- #

    #region ------ [ Roles: Domain Member ] --------------------------------------------------- #
    # Wraps the platform's join mechanism and defaults the site's realm, account and secret. Only
    # two things are this repository's to say: the account it deploys into, and where a WSUS
    # server is filed -- its own OU, not the deployment servers'.
    - role: 'domain_member'
      vars:
        domain_member:
          password: { bucket: "{{ aws_account_id | default('') }}-ansible" }
          computer_ou: 'OU=WSUS,OU=Domain Servers,DC=tcn,DC=trinitytechnicalservices,DC=com'
    #endregion --- [ Roles: Domain Member ] --------------------------------------------------- #

    #region ------ [ Roles: Windows Disk Manager ] -------------------------------------------- #
    # `function` names each EBS volume's Function tag from terraform/aws.tfvars, and the role
    # resolves it to the attached disk itself -- a volume id only exists after apply.
    - role: 'windows_disk_manager'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks:
            - function: 'WSUSDB'
              drive_letter: 'E'
              label: 'WSUSDB'
              allocation_unit: 65536
            - function: 'WSUSDATA'
              drive_letter: 'F'
              label: 'WSUSDATA'
              allocation_unit: 4096
            - function: 'WSUSIIS'
              drive_letter: 'G'
              label: 'WSUSIIS'
              allocation_unit: 4096
    #endregion --- [ Roles: Windows Disk Manager ] -------------------------------------------- #
  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Configure The Guest ] -------------------------------------------------- #

#region ------ [ Play: WSUS ] ----------------------------------------------------------------- #
# Its own play, as the reference gives its products one: the roles above bring a host into
# existence and into the directory, and this is the product that host exists to run. The split is
# what lets the product's failure be read as the product's, rather than as one more role in a
# chain that also formats disks.

- name: 'PLAY | WSUS On SQL Server (ephemeral AWS)'
  hosts: 'wsus_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: WSUS ] ------------------------------------------------------------ #
    # Rebuilt one region at a time against docs/explanation/wsus-role-migration-contract.md.
    #
    # The letters the disk role laid down in the previous play. That role owns the layout and
    # holds it identical across a replacement, so these are named here, not re-proven downstream.
    - role: 'wsus'
      vars:
        wsus:
          db:
            drive_letter: 'E'
          content:
            drive_letter: 'F'
    #endregion --- [ Roles: WSUS ] ------------------------------------------------------------ #
  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: WSUS ] ----------------------------------------------------------------- #
