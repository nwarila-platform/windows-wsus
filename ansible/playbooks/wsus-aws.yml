# =========================================================================================== #
# File: 'ansible/playbooks/wsus-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Builds three WSUS servers on SQL Server from ephemeral EC2, one each on Windows Server 2019,
# 2022 and 2025, so the role is shown converging across every generation the estate runs rather
# than only the one the image happened to ship. Runs only from the composed tree: the workflow
# overlays this repository onto the pinned ansible-framework and runs it against a dynamic EC2
# inventory filtered to one run. gather_facts and become are absent throughout: the framework's
# ansible.cfg makes gathering explicit and escalation off, and implicit gathering would run a
# module over the shell os_bootstrap has not yet fixed.
# =========================================================================================== #
---
#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# The inventory filters to this run by tag. This guards the one state a filter cannot: an empty
# result, where nothing launched or nothing was tagged.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  tasks:
    # EVERY server, not at least one. The deployment exists to show the role converging on three
    # operating-system generations, so a run that launched two and lost one would otherwise pass
    # while proving a third less than it claims. The count is the proof's subject.

    - name: 'INVENTORY | Require Every Filtered Host'
      ansible.builtin.assert:
        that: (groups['wsus_servers'] | default([]) | length) == 3
        fail_msg: >-
          Refusing to configure: the 'wsus_servers' inventory group holds
          {{ groups['wsus_servers'] | default([]) | length }} hosts, not 3. The dynamic EC2
          inventory found {{ groups['wsus_servers'] | default([]) | join(', ') | default('none',
          true) }} for this run -- an incomplete fleet is not a successful deployment proof.
        quiet: true

    # Each generation exactly once. Three hosts that are all one release would satisfy the count
    # above and prove a third of what this deployment is for, so the releases are asserted too.
    # OsRelease is the same tag the inventory composes os_bootstrap_role from, so this also
    # catches a host that would silently route to the wrong bootstrap role.

    # map(attribute=..., default=...) rather than map('extract', hostvars, 'os_bootstrap_role'):
    # extract RAISES on a host that has no such key, and the raise happens while the message is
    # being built, so the run dies with "HostVarsVars has no attribute" instead of the
    # diagnostic below. A host with no OsRelease tag is exactly the case worth reporting well.

    - name: 'INVENTORY | Require One Host Per Supported Release'
      ansible.builtin.assert:
        that: >-
          (groups['wsus_servers'] | default([]) | map('extract', hostvars)
            | map(attribute='os_bootstrap_role', default='<unset>') | sort)
          == ['windows_server_2019', 'windows_server_2022', 'windows_server_2025']
        fail_msg: >-
          Refusing to configure: the fleet must be exactly one Server 2019, one 2022 and one
          2025. Found {{ groups['wsus_servers'] | default([]) | map('extract', hostvars)
          | map(attribute='os_bootstrap_role', default='<unset>') | sort | join(', ') }}. Check
          the OsRelease tag in terraform/aws.tfvars.
        quiet: true

    # Bucket names are templated from the account id, so a wrong one fails minutes later on the
    # guest. Refuse it here.

    - name: 'INVENTORY | Require The Deploying Account'
      ansible.builtin.assert:
        that: aws_account_id is defined and aws_account_id is match('^[0-9]{12}$')
        fail_msg: >-
          Refusing to configure: aws_account_id must be passed as an extra-var and must be the
          twelve-digit account this run deploys into.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Configure The Guest ] -------------------------------------------------- #

- name: 'PLAY | Configure The Guest (ephemeral AWS)'
  hosts: 'wsus_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Host Readiness ] -------------------------------------------------- #
    # Declared, not detected: the role skips its vendor probe when the platform is named, and a
    # probe that errors fails the run rather than reading as "no platform". Naming AWS states the
    # precondition the rename-and-reboot below depends on -- the EC2Launch wait -- in the play.
    #
    # The attempt count is DOUBLED from the role's 60 because two of these hosts install OpenSSH
    # at boot and the one that does not is what the default was sized against. Measured on a live
    # Server 2022 SQL image: boot took 6m26s, then user_data spent 10m03s in Add-WindowsCapability
    # before port 22 opened at 16m41s. The default budget expired at roughly 25 minutes, which
    # leaves almost nothing for a slower boot -- and these hosts boot slower than that
    # measurement, launching three at a time with three data volumes each to enumerate.
    # Retries cost nothing on a host that is already up: the 2025 server answers on the first
    # attempt and pays none of this.
    - role: 'host_readiness'
      vars:
        host_readiness_platform: 'aws'
        host_readiness_attempts: 120

    #endregion --- [ Roles: Host Readiness ] -------------------------------------------------- #

    #region ------ [ Roles: OS Bootstrap ] ---------------------------------------------------- #
    # Pass it NO vars: role params outrank the connection scoping it relies on.
    - role: 'os_bootstrap'

    #endregion --- [ Roles: OS Bootstrap ] ---------------------------------------------------- #

    #region ------ [ Roles: Remote Client ] --------------------------------------------------- #
    # The role defaults everything this site needs; 'aws_account_id' arrives as an extra-var.
    - role: 'remote_client'

    #endregion --- [ Roles: Remote Client ] --------------------------------------------------- #

    #region ------ [ Roles: Domain Member ] --------------------------------------------------- #
    # Three things are this environment's: the realm and join account, the OU a WSUS server is filed
    # under, and which address the host publishes in DNS. The VPC address, because the host is
    # multi-homed and would otherwise register its tunnel address -- VPC clients would then reach it
    # the long way round. That on-prem clients cannot resolve it is a dev-estate gap, not a
    # production one -- decision 57: production has no on-prem clients.
    - role: 'domain_member'
      vars:
        domain_member:
          realm: 'tcn.trinitytechnicalservices.com'
          user: 'svc-domainjoin@tcn.trinitytechnicalservices.com'
          password: >-
            {{ lookup('secret',
                's3://' ~ aws_account_id ~ '-ansible/host_roles/domain_member/'
                ~ 'svc-domainjoin-password.txt',
                '07493ed779c2962bff0b5e19cfa00b8cdb95defcf477f6b5bac36ddef55087ae') }}
          computer_ou: 'OU=WSUS,OU=Domain Servers,DC=tcn,DC=trinitytechnicalservices,DC=com'
          registration_address: "{{ aws_private_ip_address }}"

    #endregion --- [ Roles: Domain Member ] --------------------------------------------------- #

    #region ------ [ Roles: Windows Disk Manager ] -------------------------------------------- #
    # 'function' is each volume's Function tag in terraform/aws.tfvars; the role finds the disk by
    # it.
    - role: 'windows_disk_manager'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks:
            - function: 'WSUSDB'
              drive_letter: 'E'
              label: 'WSUSDB'
              allocation_unit: 65536
            - function: 'WSUSDATA'
              drive_letter: 'F'
              label: 'WSUSDATA'
              allocation_unit: 4096
            - function: 'WSUSIIS'
              drive_letter: 'G'
              label: 'WSUSIIS'
              allocation_unit: 4096

    #endregion --- [ Roles: Windows Disk Manager ] -------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Configure The Guest ] -------------------------------------------------- #

#region ------ [ Play: WSUS ] ----------------------------------------------------------------- #
# Its own play, so the product's failure reads as the product's rather than as one more role in
# a chain that also formats disks.

- name: 'PLAY | WSUS On SQL Server (ephemeral AWS)'
  hosts: 'wsus_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: WSUS ] ------------------------------------------------------------ #
    # The drive letters are the ones the disk role laid down in the previous play.
    - role: 'wsus'
      vars:
        wsus:
          db:
            drive_letter: 'E'
          content:
            drive_letter: 'F'
          updates:
            languages: ['en']
          sync:
            # Catalogue wait then content wait, sequential in one CI step. Worst case is three waits
            # -- an in-flight sync is stopped first -- so 75 minutes is the ceiling and 45 the
            # ordinary path. Generous for this upstream, measured at 66 MB across one approved
            # update; sized for the step that also builds a second Windows guest.
            content_timeout_seconds: 900
            timeout_seconds: 1800

            # Approvals are made once, upstream, and inherited here.
            replica: true

            # 'wait' because this deployment exists to prove a client takes an update, and only wait
            # can say the catalogue arrived. Affordable only because the upstream is a curated lab
            # server holding one approved update; a full Microsoft mirror would say 'start'.
            mode: 'wait'

            # The lab WSUS this POC mirrors, over the OpenVPN tunnel. An address, not a name: this
            # upstream is not a domain member and the guest resolves through the domain's DNS.
            upstream_server: '10.69.112.6'

            # Plain HTTP on 8530 because encrypting this link needs the UPSTREAM to serve SSL, which
            # is its property, not this deployment's.
            upstream_port: 8530
            upstream_use_ssl: false
          tls:
            certificate:
              bucket: "{{ aws_account_id | default('') }}-ansible"
              dns_name: "{{ inventory_hostname }}.tcn.trinitytechnicalservices.com"
              # ONE object for every WSUS host: the certificate is a SAN covering wsus01, 02 and
              # 03, so it cannot be named per host. dns_name above stays per host -- the object
              # is shared, the identity each server presents is not.
              object: 'applications/windows-wsus/tls/tcnaw-wsus.pfx'
              password: >-
                {{ lookup('secret',
                    's3://' ~ aws_account_id ~ '-ansible/applications/windows-wsus/tls'
                    ~ '/tcnaw-wsus.pfx.password',
                    'fc77c7baa66d3ca12f359de51f821c5f454184a98187811d918e682514745b41') }}
              sha256: 'b0d8973b9eddc964c98092b2724d5a3c4daf407d946cda6f36a2dd88ff22b3fc'
              thumbprint: '38108AEDBD378EFA498607D2829FC75B58E32A40'

    #endregion --- [ Roles: WSUS ] ------------------------------------------------------------ #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: WSUS ] ----------------------------------------------------------------- #
