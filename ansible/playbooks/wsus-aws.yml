# =========================================================================================== #
# File: 'ansible/playbooks/wsus-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Prepares one WSUS server and three clients through their inventory-selected transports, then
# installs WSUS on SQL Server. Each client asks the server named by Group Policy for updates and
# installs what it is offered. Runs only from the composed tree built from the pinned framework.
#
# gather_facts and become are absent throughout: the framework makes gathering explicit and
# escalation off, and implicit gathering would run before os_bootstrap repairs the module shell.
# =========================================================================================== #
---
#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  tasks:
    - name: 'INVENTORY | Require The One WSUS Server'
      ansible.builtin.assert:
        that: (groups['wsus_servers'] | default([]) | length) == 1
        fail_msg: >-
          Refusing to configure: the 'wsus_servers' inventory group holds
          {{ groups['wsus_servers'] | default([]) | length }} host(s), not 1:
          {{ groups['wsus_servers'] | default([]) | join(', ') | default('none', true) }}.
          This deployment builds exactly one WSUS server.
        quiet: true

    - name: 'INVENTORY | Require The Three WSUS Clients'
      ansible.builtin.assert:
        that: (groups['wsus_clients'] | default([]) | length) == 3
        fail_msg: >-
          Refusing to configure: the 'wsus_clients' inventory group holds
          {{ groups['wsus_clients'] | default([]) | length }} host(s), not 3:
          {{ groups['wsus_clients'] | default([]) | join(', ') | default('none', true) }}.
          This deployment proves the server against exactly three clients.
        quiet: true

    # Account-derived values are explicit so the play and deploy identity cannot disagree.
    - name: 'INVENTORY | Require The AWS Deployment Identity'
      ansible.builtin.assert:
        that:
          - aws_account_id is defined
          - aws_account_id is match('^[0-9]{12}$')
          - aws_region is defined
          - aws_region is match('^[a-z]{2}(-[a-z]+)+-[0-9]$')
        fail_msg: >-
          aws_account_id and aws_region must be provided as extra-vars. The aws-deploy workflow
          passes them from its own environment (the same values the OIDC role ARN and region
          use); a local run must pass both explicitly.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Configure The Hosts ] -------------------------------------------------- #

- name: 'PLAY | Configure The Hosts (ephemeral AWS)'
  hosts: 'wsus_servers:wsus_clients'
  any_errors_fatal: true
  vars:
    domain_base_dn: 'DC=tcn,DC=trinitytechnicalservices,DC=com'
    domain_realm: 'tcn.trinitytechnicalservices.com'
    domain_join_user: "svc-domainjoin@{{ domain_realm }}"
    domain_join_password: >-
      {{ lookup('secret',
          's3://' ~ aws_account_id ~ '-ansible/host_roles/domain_member/svc-domainjoin-password.txt',
          '07493ed779c2962bff0b5e19cfa00b8cdb95defcf477f6b5bac36ddef55087ae') }}
    domain_automation_user: 'tcn\jenkins_runner'
    domain_automation_password: >-
      {{ lookup('secret',
          's3://' ~ aws_account_id ~ '-ansible/host_roles/domain_member/jenkins_runner-password.txt',
          '088a652ed843f0fa702a23d1f3ebe2e62c187c4c07f563e12c174e1d17945b03') }}
    domain_automation_private_key: >-
      {{ lookup('secret',
          's3://' ~ aws_account_id ~ '-ansible/host_roles/domain_member/jenkins_runner-ssh-private-key',
          'be4cb9ba3d7835827b2c3677c8cf1df3aafee8a3698537c040cd6f986049d5b7') }}
    domain_automation_public_key: >-
      {{ lookup('secret',
          's3://' ~ aws_account_id ~ '-ansible/host_roles/domain_member/jenkins_runner-ssh-public-key',
          'ad00b8b65b2d19f31595d4b62eaa79bccd05842d67cbe9b5c3d1ce4095f59281') }}
    launch_key_file: >-
      {{ lookup('ansible.builtin.env', 'CI_PRIVATE_KEY') | default('~/.ssh/nwarila-ec2-key', true)
         | expanduser }}
    password_login: "{{ (aws_ec2_tags.Authentication | default('key', true)) == 'password' }}"
    ssh_trusted_principals: >-
      {{ [] if (password_login | bool) else
         [{'user': domain_automation_user, 'public_key': domain_automation_public_key}] }}
    ssh_key_sets:
      - name: 'domain-automation'
        connection: 'ssh'
        user: "{{ domain_automation_user }}"
        private_key: "{{ domain_automation_private_key }}"
      - name: 'image-administrator'
        connection: 'ssh'
        user: 'Administrator'
        private_key_file: "{{ launch_key_file }}"
    ssh_password_sets:
      - name: 'domain-automation'
        connection: 'ssh'
        user: "{{ domain_automation_user }}"
        password: "{{ domain_automation_password }}"
      - name: 'image-administrator'
        connection: 'ssh'
        user: 'Administrator'
        launch_password:
          instance_id: "{{ aws_instance_id }}"
          region: "{{ aws_region }}"
          private_key_file: "{{ launch_key_file }}"
    winrm_sets:
      - name: 'domain-automation'
        connection: 'winrm'
        user: "{{ domain_automation_user }}"
        password: "{{ domain_automation_password }}"
        transport: 'ntlm'
      - name: 'image-administrator'
        connection: 'winrm'
        user: 'Administrator'
        launch_password:
          instance_id: "{{ aws_instance_id }}"
          region: "{{ aws_region }}"
          private_key_file: "{{ launch_key_file }}"
        transport: 'ntlm'
    credential_sets: >-
      {{ (ssh_password_sets if (password_login | bool) else ssh_key_sets) + winrm_sets }}
    domain_membership:
      realm: "{{ domain_realm }}"
      user: "{{ domain_join_user }}"
      password: "{{ domain_join_password }}"
      computer_ou: >-
        {{ 'OU=WSUS,OU=Domain Servers,' if inventory_hostname in groups['wsus_servers']
           else 'OU=Domain Servers,' }}{{ domain_base_dn }}
      # Use the VPC address; a multi-homed host would otherwise register its tunnel address (decision 57).
      registration_address: "{{ aws_private_ip_address }}"
      post_restart_credentials: >-
        {{ credential_sets | selectattr('name', 'equalto', 'domain-automation') | list }}

  roles:
    - role: 'credential_resolver'
      tags: ['always']
      vars:
        credential_resolver_candidates: "{{ credential_sets }}"
        credential_resolver_require_elevated: true
        credential_resolver_wait_pause_seconds: 10
        credential_resolver_wait_rounds: 60
    - role: 'host_readiness'
      vars:
        host_readiness_platform: 'aws'
    # Pass it NO vars: role params outrank the connection scoping it relies on.
    - role: 'os_bootstrap'
    - role: 'remote_client'
    - role: 'domain_member'
      vars:
        domain_member: "{{ domain_membership }}"
    - role: 'windows_disk_manager'
      when: inventory_hostname in groups['wsus_servers']
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks:
            - function: 'WSUSDB'
              drive_letter: 'E'
              label: 'WSUSDB'
              allocation_unit: 65536
            - function: 'WSUSDATA'
              drive_letter: 'F'
              label: 'WSUSDATA'
              allocation_unit: 4096
            - function: 'WSUSIIS'
              drive_letter: 'G'
              label: 'WSUSIIS'
              allocation_unit: 4096

#endregion --- [ Play: Configure The Hosts ] -------------------------------------------------- #

#region ------ [ Play: WSUS ] ----------------------------------------------------------------- #
# Its own play, so the product's failure reads as the product's rather than as one more role in
# a chain that also formats disks.

- name: 'PLAY | WSUS On SQL Server (ephemeral AWS)'
  hosts: 'wsus_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: WSUS ] ------------------------------------------------------------ #
    # The drive letters are the ones the disk role laid down in the previous play.
    - role: 'wsus'
      vars:
        wsus:
          db:
            drive_letter: 'E'
          content:
            drive_letter: 'F'
          updates:
            languages: ['en']
          sync:
            # Catalogue wait then content wait, sequential in one CI step. Worst case is three waits
            # -- an in-flight sync is stopped first -- so 75 minutes is the ceiling and 45 the
            # ordinary path. Generous for this upstream, measured at 66 MB across one approved
            # update; sized for the step that also prepares the clients.
            content_timeout_seconds: 900
            timeout_seconds: 1800

            # Approvals are made once, upstream, and inherited here.
            replica: true

            # 'wait' because this deployment exists to prove a client takes an update, and only wait
            # can say the catalogue arrived. Affordable only because the upstream is a curated lab
            # server holding one approved update; a full Microsoft mirror would say 'start'.
            mode: 'wait'

            # The lab WSUS this POC mirrors, over the OpenVPN tunnel. An address, not a name: this
            # upstream is not a domain member and the guest resolves through the domain's DNS.
            upstream_server: '10.69.112.6'

            # Plain HTTP on 8530 because encrypting this link needs the UPSTREAM to serve SSL, which
            # is its property, not this deployment's.
            upstream_port: 8530
            upstream_use_ssl: false
          tls:
            certificate:
              bucket: "{{ aws_account_id | default('') }}-ansible"
              dns_name: "{{ inventory_hostname }}.tcn.trinitytechnicalservices.com"
              # The shared certificate is a SAN for the estate's WSUS names; dns_name stays per host.
              object: 'applications/windows-wsus/tls/tcnaw-wsus.pfx'
              password: >-
                {{ lookup('secret',
                    's3://' ~ aws_account_id ~ '-ansible/applications/windows-wsus/tls'
                    ~ '/tcnaw-wsus.pfx.password',
                    'fc77c7baa66d3ca12f359de51f821c5f454184a98187811d918e682514745b41') }}
              sha256: 'b0d8973b9eddc964c98092b2724d5a3c4daf407d946cda6f36a2dd88ff22b3fc'
              thumbprint: '38108AEDBD378EFA498607D2829FC75B58E32A40'

    #endregion --- [ Roles: WSUS ] ------------------------------------------------------------ #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: WSUS ] ----------------------------------------------------------------- #

#region ------ [ Play: WSUS Clients ] --------------------------------------------------------- #

- name: 'PLAY | Prove The Clients Take Updates From WSUS (ephemeral AWS)'
  hosts: 'wsus_clients'
  any_errors_fatal: true
  roles:
    - role: 'wsus_client'
      vars:
        wsus_client:
          certificate:
            thumbprint: '8760E9DA2B79D7FCFB5C8DADD72628649029B348'
          server:
            url: 'https://tcnaw-wsus01.tcn.trinitytechnicalservices.com:8531'

#endregion --- [ Play: WSUS Clients ] --------------------------------------------------------- #
