# =========================================================================================== #
# File: 'ansible/playbooks/wsus-adopt.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# OS-DISK-REPLACEMENT playbook for adopting existing WSUS data volumes (the AWS AMI-swap case).
# It attaches the SUSDB already present on the DB volume BEFORE wsusutil postinstall, instead of
# letting postinstall create a new empty database.
#
# Operational preconditions, both measured:
# 1. Supply the CURRENT disk unique_ids — an OS swap CHANGES them, and stale ids fail closed at
#    'Assert Declared Data Disks Are Attached' with "found 0".
# 2. The replacement OS must be at least as patched as the server it replaces — backward adoption
#    is structurally impossible (a database created by newer WSUS/SQL binaries cannot attach to older ones).
#
# Keep the whole wsus: dict (temp_dir, all three disk ids, upstream_server) because Ansible does
# NOT merge role override dicts across precedence levels.
#
# Windows-over-SSH notes: the framework v3 loader is not yet Windows-aware; every
# workaround below is tagged TD-001 and tracked in docs/TECH-DEBT.md. Remove them when
# the framework ships loader v3.1 Windows support and .framework-pin is bumped.
#
# =========================================================================================== #
---
- name: 'PLAY | WSUS Server (WID-backed) — ADOPT existing data volumes'
  hosts: 'wsus_servers'
  # TD-001: playbook-level gathering routes to the Windows setup module; with facts
  # already present, the loader skips its own ansible.builtin.setup call.
  gather_facts: true
  # TD-001: framework chassis ansible.cfg sets become=sudo (POSIX-only). The admin
  # account over SSH already holds an elevated token on Windows.
  become: false

  vars:
    # Platform convention: 'env' is the operator-facing extra-var; 'ENV' is the
    # play-var the loader validates (mirrors the wazuh central playbooks).
    ENV: "{{ env }}"
    wsus:
      # TD-001: disable the loader's POSIX temp-dir; the role owns its staging via
      # ansible.windows.win_tempfile (queue piece C02).
      temp_dir: false
      mode: 'adopt'
      # Data-disk identity (Windows Get-Disk UniqueId). Declared in this wsus override dict so the
      # loader folds them into config (config.wid_disk_id / config.wsus_disk_id / config.iis_disk_id).
      # Dev-VM-specific —
      # parameterize (templated vars) on backport to *-template. NOTE: a `-e '{"wsus":{...}}'` override
      # REPLACES this whole mapping, so a proof override must re-state temp_dir: false.
      wid_disk_id: 'eui.6C7076230CC23C55000C2968C7AE5760'  # 20 GiB -> E: WSUSDB (WID database)
      wsus_disk_id: 'eui.CF4AE05CEB88F43B000C29656D55634B'  # 30 GiB -> F: WSUSDATA (update content)
      iis_disk_id: 'eui.BC9F0ECE9FBC4B9A000C296303722FC1'  # 20 GiB -> G: WSUSIIS (IIS working-dir disk); dev-VM eui, parameterize on backport
      # Upstream WSUS server (C11d): this server is a DOWNSTREAM of the named upstream WSUS
      # (SyncFromMicrosoftUpdate=false). REQUIRED input (validate.yml asserts it) — no default.
      # DEV PLACEHOLDER below (the dev VM has no real upstream; Save() persists it without a
      # reachability check). Supply the real upstream hostname in production / on backport.
      upstream_server: 'wsus-upstream.corp.local'

  pre_tasks:
    # TD-001: the loader's 'INIT | Loading Installed Package Facts' task runs
    # ansible.builtin.package_facts (Python-only, no disable flag) and would hard-fail
    # on Windows. Seeding an empty dict satisfies its 'when' guard. Set the 'packages'
    # fact directly; NEVER set the name 'ansible_facts', because that set_fact variable
    # shadows the live facts store and hides all later facts-module results.
    - name: 'PRE | Seed empty package facts (loader Windows gap)'
      when: ansible_facts.packages is not defined
      ansible.builtin.set_fact:
        packages: {}
        cacheable: true

  roles:
    - role: 'wsus'
