# =========================================================================================== #
# File: '{{ role_path }}/meta/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Role metadata for wsus. Description-only (style guide 8): NOT an enforcing argument spec. The
# role's tasks/validate.yml enforces its merged-config guards.
#
# REQUIRED INPUTS — supplied by the playbook, never defaulted here. The certificate leaves are
# declared empty in defaults; the rest have no leaf there at all. validate.yml refuses a run
# that omits any of the four below; the six certificate leaves are refused the same way on a
# present run with wsus.tls.enabled true, which is the shipped default.
#
#   wsus.db.drive_letter                 Volume SUSDB is created on. Refused if it equals the
#                                        content letter: the database and the update store grow
#                                        independently, and sharing a disk lets either one stop
#                                        the other.
#   wsus.content.drive_letter            Volume the update store is created on.
#   wsus.sync.upstream_server            The upstream WSUS this server mirrors, as a DNS name or
#                                        an IPv4 literal. Never defaulted: a defaulted upstream
#                                        points a server at whatever the last deployment's was.
#   wsus.firewall.admitted_networks      Networks the host firewall admits to 8530 and 8531, in
#                                        CIDR form, comma-separated. The only control that can
#                                        scope traffic arriving over a tunnel.
#   wsus.tls.certificate.bucket          S3 bucket holding the PKCS#12.
#   wsus.tls.certificate.dns_name        Name clients reach this server by, and the name the
#                                        certificate must be valid for.
#   wsus.tls.certificate.object          Object key of the PKCS#12 the listener presents, and the
#                                        only object this role fetches. Trusting it belongs to the
#                                        directory, so no second object is delivered -- and a host
#                                        whose policy has not delivered that root cannot read its
#                                        own WSUS API once TLS is on.
#   wsus.tls.certificate.password        The password that unlocks that PKCS#12, already resolved.
#                                        A value and not a location, because reading a credential
#                                        out of S3 is the framework secret lookup's job and the
#                                        playbook calls it.
#   wsus.tls.certificate.sha256          Digest the PKCS#12 must match.
#   wsus.tls.certificate.thumbprint      The certificate the listener may present, pinned so a
#                                        subject search cannot select another.
#
# The playbook resolves the object and the password on the CONTROLLER. The guest is never given
# cloud credentials, and in this deployment has no route to S3 at all.
#
# The SQL instance is NOT an input: the AWS images install the default instance and this role
# writes MSSQLSERVER where it needs a service and the machine name where it needs a connection
# target. There is no instance-name value to supply and none to validate -- naming one would be
# offering a choice the rest of the role does not honour.
#
# =========================================================================================== #
---
galaxy_info:
  role_name: 'wsus'
  namespace: 'nwarila_platform'
  author: 'nwarila-platform'
  description: >-
    Windows Server Update Services on SQL Server. Places SUSDB on a dedicated data volume before
    anything can create it, because the supported path puts a database where the instance's
    directories point rather than moving it afterwards.
  license: 'MIT'
  min_ansible_version: '2.17'
  platforms:
    - name: 'Windows'
      versions:
        - '2025'
  galaxy_tags: ['windows', 'wsus', 'sqlserver']

dependencies: []
