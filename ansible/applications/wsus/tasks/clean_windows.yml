# ============================================================================================= #
# File: '{{ role_path }}/tasks/clean_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# state=clean removes what this role STAGED on the guest, never what it configured. The loader
# resolves an OS task file per state, so this file has to exist for 'clean' to dispatch at all --
# the local style contract names it alongside present_windows.yml.
#
# It is deliberately empty, and not because nothing is ever staged. The TLS delivery stages a PFX
# on the guest and removes it in its own 'always' block -- private key bytes are not something to
# leave lying around until someone remembers to run 'clean'. So nothing
# PERSISTENT survives a converge for this file to remove. The first artefact that is meant to
# outlive its run brings its removal here with it.
#
# ============================================================================================= #
---
