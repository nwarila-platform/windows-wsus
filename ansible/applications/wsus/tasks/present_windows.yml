# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Complete install path for the wsus role on the Windows family (resolved by the v3
# loader via first_found; a future 'present_windows_<dist>_<ver>.yml' would shadow this
# automatically). Receives the merged running configuration as 'config'.
#
# BUILD IN PROGRESS — BEGIN Input Guards gather disk facts and resolve each declared
# data disk (config.wid_disk_id -> E:, config.wsus_disk_id -> F:) to exactly one
# attached disk. The Main region's state-aware safety guard authorizes provisioning.
# Config-contract invariants (id distinctness) live in tasks/validate.yml (run by the
# loader). Later pieces (C02c+) append the volume mutations after the Main region, one
# command per strict-cycle piece.
#
# =========================================================================================== #
---
#region ------ [ Script ] -------------------------------------------------------------------- #

- name: 'INFO | Entering OS Tasks (present_windows - wsus)'
  vars:
    __data_disks__:
      - purpose: 'db'
        id: "{{ config.wid_disk_id | default('') }}"
        drive_letter: "{{ config.data_disks.db.drive_letter }}"
        label: "{{ config.data_disks.db.label }}"
        allocation_unit: "{{ config.data_disks.db.allocation_unit }}"
        matches: "{{ ansible_facts.disks | selectattr('unique_id', 'equalto', config.wid_disk_id | default('')) | list }}"
      - purpose: 'content'
        id: "{{ config.wsus_disk_id | default('') }}"
        drive_letter: "{{ config.data_disks.content.drive_letter }}"
        label: "{{ config.data_disks.content.label }}"
        allocation_unit: "{{ config.data_disks.content.allocation_unit }}"
        matches: "{{ ansible_facts.disks | selectattr('unique_id', 'equalto', config.wsus_disk_id | default('')) | list }}"
    # Content root derived from the SINGLE source of truth (the content drive letter) + the folder name,
    # so it can never drift onto a different volume than the one provisioned. Renders e.g. F:\WSUS.
    __content_dir__: "{{ config.data_disks.content.drive_letter }}:\\{{ config.content_subdir }}"
    # SUSDB relocation target, same no-drift derivation as __content_dir__. Renders e.g. E:\WID\Data.
    __wid_data_dir__: "{{ config.data_disks.db.drive_letter }}:\\{{ config.db_subdir }}"
  block:

    #region ------ [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Initialization: Input Guards ] ------------------------------------------ #

    # This is the single canonical read-only gather at the superset the safety path needs
    # (partition_style + partitions[].drive_letter). No role task mutates disks before these
    # facts are consumed, so the snapshot stays valid; C02c owns its post-mutation refresh.
    - name: 'BEGIN | Loading Disk, Partition and Volume Facts'
      community.windows.win_disk_facts:
        filter:
          - 'physical_disk'
          - 'partitions'
          - 'volumes'

    - name: 'BEGIN | Assert Declared Data Disks Are Attached'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      ansible.builtin.assert:
        that:
          - item.matches | length == 1
        fail_msg: >-
          Expected exactly one attached disk whose unique_id matches the
          '{{ item.purpose }}' identifier ('{{ item.id }}'), but found
          {{ item.matches | length }}.
          Attached disks:
          {% for disk in ansible_facts.disks %}
          number={{ disk.number | default('unknown') }}, unique_id={{ disk.unique_id | default('unknown') }},
          size={{ disk.size | default('unknown') }}{%- if not loop.last %}; {% endif %}
          {% endfor %}
        quiet: true

    #endregion --- [ Initialization: Input Guards ] ------------------------------------------ #

    #endregion --- [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Main: Data Volume Provisioning ] --------------------------------------- #

    - name: 'MAIN | Assert Target Disk Is Safe To Provision'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      vars:
        __target_disk__: "{{ item.matches | first }}"
        __foreign_lettered__: >-
          {{
            __target_disk__.partitions | default([])
            | selectattr('drive_letter', 'defined')
            | selectattr('drive_letter')
            | rejectattr('drive_letter', 'equalto', item.drive_letter)
            | list
          }}
      ansible.builtin.assert:
        that:
          - __target_disk__.partition_style == 'RAW' or (__foreign_lettered__ | length == 0)
        fail_msg: >-
          Refusing to provision the '{{ item.purpose }}' disk (unique_id '{{ item.id }}'): it is
          already initialized (partition_style {{ __target_disk__.partition_style }}) and carries
          partition(s) with a foreign drive letter
          ({{ __foreign_lettered__ | map(attribute='drive_letter') | join(', ') }}). The role will
          not clobber existing data — clear the disk or correct the identifier.
        quiet: true

    # This first mutation is gated by the safety assert above. force:false is idempotent
    # (a no-op on an already-GPT disk); online:true defensively onlines an offline RAW disk
    # (the handed RAW-Online-writable disks need no change here), but is not a general
    # read-only fix for non-RAW disks. uniqueid targets the disk directly without disk_number.
    - name: 'MAIN | Initialize Data Disk (GPT, online, writable)'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      community.windows.win_initialize_disk:
        uniqueid: "{{ item.id }}"
        style: gpt
        online: true
        force: false

    # Creates a 100% partition (partition_size:-1 is the maximum free extent, the whole
    # initialized disk) and assigns its drive letter. drive_letter is mandatory for
    # win_partition idempotency; disk_number comes from the resolved disk
    # ((item.matches | first).number). The partition remains unformatted until C02e.
    - name: 'MAIN | Create 100% Data Partition With Drive Letter'
      community.windows.win_partition:
        disk_number: "{{ (item.matches | first).number }}"
        partition_size: -1
        drive_letter: "{{ item.drive_letter }}"
        gpt_type: basic_data
        state: present
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"

    # NTFS-formats the RAW partition (C02d) with its label + MS-recommended allocation unit.
    # force:false is idempotent on the pristine RAW volume (first run size 0 -> format; re-run
    # size!=0 + label preserved + ALU match -> no-op). full:false = quick format (thin VMware
    # disks). allocation_unit_size is in BYTES (65536=64 KiB E: / 4096=4 KiB F:). Closes the C02
    # disk-provisioning arc; volumes are ready for WSUS install (C04+).
    - name: 'MAIN | Format Data Volume (NTFS, labelled, MS allocation unit)'
      community.windows.win_format:
        drive_letter: "{{ item.drive_letter }}"
        file_system: ntfs
        new_label: "{{ item.label }}"
        allocation_unit_size: "{{ item.allocation_unit }}"
        full: false
        force: false
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"

    #endregion --- [ Main: Data Volume Provisioning ] --------------------------------------- #

    #region ------ [ Main: WSUS Installation ] ---------------------------------------------- #

    # Creates the WSUS content root on the formatted content volume (derived F:\WSUS).
    # win_file state:directory is idempotent (creates if absent, no-op if present).
    # wsusutil postinstall (C05) creates WSUSContent inside it.
    - name: 'MAIN | Ensure WSUS Content Directory Exists'
      ansible.windows.win_file:
        path: "{{ __content_dir__ }}"
        state: directory

    # Org convention (Director 2026-07-16): every interactive user on a server is an admin. An
    # unreadable folder makes Explorer offer 'Continue', which stamps the admin's PERSONAL ACE
    # onto the ACL — stale SIDs after they depart. The explicit Users grant kills the prompt.
    # R&X only (writes stay behind deliberate elevation); explicit rather than relying on the
    # format-default root-ACL inheritance, which a later hardening pass would silently remove.
    - name: 'MAIN | Grant Users Browse Access On The Content Root'
      ansible.windows.win_acl:
        path: "{{ __content_dir__ }}"
        user: 'BUILTIN\Users'
        rights: 'ReadAndExecute'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Installs the WSUS role on the WID backend (MS Step 1: Install-WindowsFeature -Name
    # UpdateServices -IncludeManagementTools). The WID role services are named EXPLICITLY —
    # MS never states the bare-parent auto-pull verbatim, and a missing WidDB would only
    # surface later as a postinstall failure. include_management_tools brings the WSUS console
    # + the UpdateServices PowerShell module (C07's Get-WsusServer). DO NOT set
    # include_sub_features: it maps to -IncludeAllSubFeature and would also pull
    # UpdateServices-DB (SQL Server Connectivity), which a WID build must NOT have.
    # Idempotent: changed only when the cmdlet returns a non-empty FeatureResult (a converged
    # re-run reports exitcode NoChangeNeeded). The module never reboots — it only reports
    # reboot_required; C04 deliberately does not act on it (measured at P4 first).
    - name: 'MAIN | Install WSUS Server Role (WID)'
      ansible.windows.win_feature:
        name:
          - 'UpdateServices'
          - 'UpdateServices-WidDB'
          - 'UpdateServices-Services'
        include_management_tools: true
        state: present

    # Read-only completion-truth probe: the four Installed Role Services flags are written at
    # the END of each postinstall component (measured =2 live, RTRACK-C05). Get-WsusServer is
    # runtime-truth and failed when the C06 arc legitimately stopped the stack; a midway
    # postinstall death leaves flags !=2, so the documented repair operation re-runs.
    # Runtime verification belongs to C07.
    - name: 'MAIN | Probe WSUS Post-Installation State'
      ansible.windows.win_reg_stat:
        path: 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup\Installed Role Services'
      register: __wsus_postinstall_probe__

    # Runs the WSUS post-installation: creates SUSDB in WID (on C: — relocated at C06), creates
    # WSUSContent inside the content root, configures the IIS 'WSUS Administration' site (8530),
    # and enables+starts WsusService. WID is selected by the ABSENCE of SQL_INSTANCE_NAME. Gated
    # by the completion flags above (all four =2 means configured -> skip). argv auto-quotes per
    # Win32 rules (the exe path contains spaces). NO trailing backslash on CONTENT_DIR. wsusutil
    # logs to a random .tmp in %TEMP% (stdout names it); the first run takes minutes.
    - name: 'MAIN | Run WSUS Post-Installation (WID, content on F:)'
      vars:
        __postinstall_flags__: >-
          {{
            ['UpdateServices-API', 'UpdateServices-Services', 'UpdateServices-UI', 'UpdateServices-WidDatabase']
            | map('extract', __wsus_postinstall_probe__.properties | default({}), 'value')
            | map('default', 0)
            | list
          }}
      when: __postinstall_flags__ != [2, 2, 2, 2]
      ansible.windows.win_command:
        argv:
          - 'C:\Program Files\Update Services\Tools\wsusutil.exe'
          - 'postinstall'
          - 'CONTENT_DIR={{ __content_dir__ }}'

    #endregion --- [ Main: WSUS Installation ] ---------------------------------------------- #

    #region ------ [ Main: SUSDB Relocation ] ----------------------------------------------- #

    # Target directory for the SUSDB relocation (C06 — community procedure, MS-unsupported,
    # Director-approved 2026-07-16) on the dedicated DB volume. Must exist before the WID
    # service-account ACL grant (C06b) and the attach (C06g). win_file creates parents
    # (E:\WID then E:\WID\Data) and no-ops when present.
    - name: 'MAIN | Ensure WID Data Directory Exists'
      ansible.windows.win_file:
        path: "{{ __wid_data_dir__ }}"
        state: directory

    # Load-bearing ACL for the relocation: without it the C06g attach SUCCEEDS but SUSDB comes
    # up READ-ONLY and WSUS silently stops syncing. Detach flips file ownership, so this dir
    # grant (inherited by the copied .mdf/.ldf) is what guarantees the engine can open them.
    # FullControl mirrors the engine's ACL on its own C:\Windows\WID\Data; the virtual account
    # name is fixed by the WID instance (MICROSOFT##WID) — architectural, not config.
    - name: 'MAIN | Grant WID Service Account Rights On The Relocation Target'
      ansible.windows.win_acl:
        path: "{{ __wid_data_dir__ }}"
        user: 'NT SERVICE\MSSQL$MICROSOFT##WID'
        rights: 'FullControl'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Same org convention as the content-root Users grant (see the WSUS Installation region).
    # DB files readable by Users is accepted in this trust model — everyone is an admin anyway;
    # this is ACL hygiene (stale-SID prevention), not access control.
    - name: 'MAIN | Grant Users Browse Access On The WID Data Directory'
      ansible.windows.win_acl:
        path: "{{ __wid_data_dir__ }}"
        user: 'BUILTIN\Users'
        rights: 'ReadAndExecute'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Server-truth relocation gate (sys.master_files — the filesystem lies: files can exist
    # detached or stale). Three states; BINDING contract for the C06 actors (ALWAYS compare
    # __susdb_probe__.stdout | trim — win_shell stdout carries a trailing newline):
    #   'pending'   attached on C:   -> full sequence (stop, detach, copy, attach, start)
    #   'orphaned'  detached, 0 rows -> RESUME: stop/copy/attach run, detach SKIPS — the expected
    #               state when a prior run died between detach and attach; while detached nothing
    #               writes to either copy, so C: stays the intact source (copy-don't-move payoff)
    #   'relocated' attached on E:   -> the whole destructive middle skips
    # SPLIT across volumes throws: attach is atomic, so this role can never produce it — it
    # uniquely signals foreign/manual drift (fail closed; manual recovery).
    - name: 'MAIN | Probe SUSDB Location (relocation gate)'
      ansible.windows.win_shell: |
        $conn = New-Object System.Data.SqlClient.SqlConnection(
          'server=\\.\pipe\Microsoft##WID\tsql\query;database=master;trusted_connection=true;')
        $conn.Open()
        $cmd = $conn.CreateCommand()
        $cmd.CommandText = "SELECT physical_name FROM sys.master_files WHERE database_id = DB_ID('SUSDB');"
        $reader = $cmd.ExecuteReader()
        $paths = @()
        while ($reader.Read()) {
            $paths += [string]$reader['physical_name']
        }
        $reader.Close()
        $conn.Close()

        if ($paths.Count -eq 0) {
            Write-Output 'orphaned'
            exit 0
        }

        $onTarget = @($paths | Where-Object { $_ -like '{{ __wid_data_dir__ }}\*' })
        if ($onTarget.Count -eq $paths.Count) {
            Write-Output 'relocated'
        } elseif ($onTarget.Count -eq 0) {
            Write-Output 'pending'
        } else {
            throw ('SUSDB files SPLIT across volumes: ' + ($paths -join '; ') + ' — this role cannot produce this (attach is atomic); foreign/manual drift, manual recovery required.')
        }
      register: __susdb_probe__
      changed_when: false

    # MS's wid-to-sql sequence stops WSUS + IIS before detach: WsusService and W3SVC hold
    # SUSDB connections (the WSUS app pools live in W3SVC). The WID engine service
    # MSSQL$MICROSOFT##WID deliberately stays running to execute the C06e detach. Gated on
    # the C06c pending|orphaned contract; an orphaned resume may find them already stopped,
    # a native no-op. C06h restarts both after verified attach. TRANSITIONAL: until C06h, a
    # converged pending run ends with both stopped — acceptable in the revert-every-run lab.
    - name: 'MAIN | Stop WSUS Services For Relocation'
      ansible.windows.win_service:
        name: '{{ item }}'
        state: stopped
      loop: ['WsusService', 'W3SVC']
      loop_control:
        label: '{{ item }}'
      when: __susdb_probe__.stdout | trim in ['pending', 'orphaned']

    #endregion --- [ Main: SUSDB Relocation ] ----------------------------------------------- #

#endregion --- [ Script ] -------------------------------------------------------------------- #
