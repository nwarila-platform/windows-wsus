# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Complete install path for the wsus role on the Windows family (resolved by the v3
# loader via first_found; a future 'present_windows_<dist>_<ver>.yml' would shadow this
# automatically). Receives the merged running configuration as 'config'.
#
# BUILD IN PROGRESS — BEGIN Input Guards gather disk facts and resolve each declared
# data disk (config.wid_disk_id -> E:, config.wsus_disk_id -> F:, config.iis_disk_id -> G:)
# to exactly one attached disk. The Main region's state-aware safety guard authorizes provisioning.
# Config-contract invariants (id distinctness) live in tasks/validate.yml (run by the
# loader). Later pieces (C02c+) append the volume mutations after the Main region, one
# command per cycle piece.
#
# =========================================================================================== #
---
#region ------ [ Script ] -------------------------------------------------------------------- #

- name: 'INFO | Entering OS Tasks (present_windows - wsus)'
  vars:
    __data_disks__:
      - purpose: 'db'
        id: "{{ config.wid_disk_id | default('') }}"
        drive_letter: "{{ config.data_disks.db.drive_letter }}"
        label: "{{ config.data_disks.db.label }}"
        allocation_unit: "{{ config.data_disks.db.allocation_unit }}"
        matches: "{{ ansible_facts.disks | selectattr('unique_id', 'equalto', config.wid_disk_id | default('')) | list }}"
      - purpose: 'content'
        id: "{{ config.wsus_disk_id | default('') }}"
        drive_letter: "{{ config.data_disks.content.drive_letter }}"
        label: "{{ config.data_disks.content.label }}"
        allocation_unit: "{{ config.data_disks.content.allocation_unit }}"
        matches: "{{ ansible_facts.disks | selectattr('unique_id', 'equalto', config.wsus_disk_id | default('')) | list }}"
      - purpose: 'iis'
        id: "{{ config.iis_disk_id | default('') }}"
        drive_letter: "{{ config.data_disks.iis.drive_letter }}"
        label: "{{ config.data_disks.iis.label }}"
        allocation_unit: "{{ config.data_disks.iis.allocation_unit }}"
        matches: "{{ ansible_facts.disks | selectattr('unique_id', 'equalto', config.iis_disk_id | default('')) | list }}"
    # Content root derived from the SINGLE source of truth (the content drive letter) + the folder name,
    # so it can never drift onto a different volume than the one provisioned. Renders e.g. F:\WSUS.
    __content_dir__: "{{ config.data_disks.content.drive_letter }}:\\{{ config.content_subdir }}"
    # SUSDB relocation target, same no-drift derivation as __content_dir__. Renders e.g. E:\WID\Data.
    __wid_data_dir__: "{{ config.data_disks.db.drive_letter }}:\\{{ config.db_subdir }}"
    # WID instance's fixed default data directory under %SystemDrive% (MS-specified; SUSDB installs
    # here — ground truth the C05 change record). Derived from the gathered SystemDrive fact, NOT literal C:
    # and NOT from db_subdir (which names the configurable E: TARGET; the source is fixed by WID).
    __wid_source_dir__: "{{ ansible_facts.env.SystemDrive }}\\Windows\\WID\\Data"
    # Fixed WID master named-pipe connection string (architectural constant: the WID instance pipe is
    # MICROSOFT##WID; named pipes are case-insensitive). Env-passed (WID_CONN) to the SqlClient blocks so the
    # literal is defined once and no raw \\.\pipe\ backslashes sit in PowerShell source (split_args-safety).
    __wid_conn_master__: 'server=\\.\pipe\MICROSOFT##WID\tsql\query;database=master;trusted_connection=true;'
    # The four 'Installed Role Services' completion flags written at the END of each postinstall component
    # (measured =2, the C05 change record). Hoisted to block scope (C14a) so the C05 postinstall gate AND the C14a
    # data-loss interlock consume ONE derivation — a second, divergent copy would be a latent inconsistency.
    # Block vars are lazily evaluated, so referencing the mid-block register is fine.
    __postinstall_flags__: >-
      {{
        ['UpdateServices-API', 'UpdateServices-Services', 'UpdateServices-UI', 'UpdateServices-WidDatabase']
        | map('extract', __wsus_postinstall_probe__.properties | default({}), 'value')
        | map('default', 0)
        | list
      }}
    # Observed per-disk state (C14e) — the SINGLE input to the data-safety rule below. MODE-INDEPENDENT.
    #   pristine    = partition_style RAW (nothing there yet)
    #   unformatted = partitions may exist but NO volume carries a filesystem (a mid-flight greenfield RESUME:
    #                 the run died after init and/or after partitioning). Verified live: an unformatted volume
    #                 reports type "" (empty string), so the truthiness filter below excludes it.
    #   ours        = a volume with filesystem NTFS AND our expected label (case-insensitive)
    #   foreign     = ANY other filesystem-bearing state (foreign label, absent label, non-NTFS) -> fail closed
    # Rendered to JSON then parsed so the result is a NATIVE dict (a bare {{ dict }} in a block scalar would
    # stringify). Jinja has no comprehensions and set_fact is banned for role-internal data (ratified R3), so a
    # set/update loop is used — mutating the outer dict escapes the loop scope.
    __disk_observed_json__: >-
      {%- set obs = {} -%}
      {%- for d in __data_disks__ -%}
      {%- set disk = d.matches | first -%}
      {%- set parts = disk.partitions | default([]) | rejectattr('type', 'equalto', 'Reserved') | list -%}
      {%- set vols = parts | selectattr('volumes', 'defined') | map(attribute='volumes') | flatten | list -%}
      {%- set fsvols = vols | selectattr('type', 'defined') | selectattr('type') | list -%}
      {%- set ourlabels = fsvols | selectattr('type', 'equalto', 'NTFS') | selectattr('label', 'defined') | map(attribute='label') | map('lower') | list -%}
      {%- set is_ours = (d.label | lower) in ourlabels -%}
      {%- set has_filesystem = fsvols | length > 0 -%}
      {%- set state = 'pristine' if disk.partition_style == 'RAW' else ('ours' if is_ours else ('foreign' if has_filesystem else 'unformatted')) -%}
      {%- set _ = obs.update({d.purpose: state}) -%}
      {%- endfor -%}
      {{ obs | to_json }}
    __disk_observed__: "{{ __disk_observed_json__ | from_json }}"
  block:

    #region ------ [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Initialization: Input Guards ] ------------------------------------------ #

    # This is the single canonical read-only gather at the superset the safety path needs
    # (partition_style + partitions[].drive_letter). No role task mutates disks before these
    # facts are consumed, so the snapshot stays valid; C02c owns its post-mutation refresh.
    - name: 'BEGIN | Loading Disk, Partition and Volume Facts'
      community.windows.win_disk_facts:
        filter:
          - 'physical_disk'
          - 'partitions'
          - 'volumes'

    - name: 'BEGIN | Assert Declared Data Disks Are Attached'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      ansible.builtin.assert:
        that:
          - item.matches | length == 1
        fail_msg: >-
          Expected exactly one attached disk whose unique_id matches the
          '{{ item.purpose }}' identifier ('{{ item.id }}'), but found
          {{ item.matches | length }}.
          Attached disks:
          {% for disk in ansible_facts.disks %}
          number={{ disk.number | default('unknown') }}, unique_id={{ disk.unique_id | default('unknown') }},
          size={{ disk.size | default('unknown') }}{%- if not loop.last %}; {% endif %}
          {% endfor %}
        quiet: true

    # A re-attached data volume (the OS-disk-replacement case) can arrive OFFLINE and/or read-only, and an OFFLINE
    # disk enumerates NO partitions — it would therefore observe as 'unformatted' and be provisioned, destroying it.
    # Clear read-only FIRST, then online (that order: you cannot online a read-only disk cleanly). No native module
    # covers this for non-RAW disks. Idempotent: changed only when something actually had to change.
    - name: 'BEGIN | Bring Declared Data Disks Online And Writable'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $changed = $false
        foreach ($id in ($env:DISK_IDS -split ';' | Where-Object { $_ })) {
            $d = Get-Disk | Where-Object { $_.UniqueId -eq $id }
            if (-not $d) {
                continue
            }
            if ($d.IsReadOnly) {
                Set-Disk -Number $d.Number -IsReadOnly $false
                $changed = $true
            }
            if ($d.IsOffline) {
                Set-Disk -Number $d.Number -IsOffline $false
                $changed = $true
            }
        }
        if ($changed) {
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        DISK_IDS: "{{ __data_disks__ | map(attribute='id') | select | join(';') }}"
      register: __disk_online__
      changed_when: "__disk_online__.stdout | trim == 'changed'"

    # Re-read the facts so the observed-state classification sees the post-online snapshot.
    - name: 'BEGIN | Re-load Disk Facts After Online/Writable Fixup'
      community.windows.win_disk_facts:
        filter:
          - 'physical_disk'
          - 'partitions'
          - 'volumes'

    #endregion --- [ Initialization: Input Guards ] ------------------------------------------ #

    #endregion --- [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Main: Data Volume Provisioning ] --------------------------------------- #

    # DATA-SAFETY GUARD (C14e), replacing the old drive-letter-based guard. Drive letters live in
    # HKLM\SYSTEM\MountedDevices ON THE OS DISK, so they do NOT survive an OS-disk replacement and are the wrong
    # recognizer; the NTFS label travels with the volume and is the same durability class as the disk selector.
    # The declared unique_id SELECTS the disk; the label CONFIRMS it (a right-label-on-the-wrong-disk observes
    # 'foreign' and refuses). Fail closed on anything we do not positively recognise.
    - name: 'MAIN | Assert Each Data Disk Is Safe To Provision Or Adopt'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }} ({{ __disk_observed__[item.purpose] }})"
      ansible.builtin.assert:
        that:
          - __disk_observed__[item.purpose] in ['pristine', 'unformatted', 'ours']
        fail_msg: >-
          Refusing to touch the '{{ item.purpose }}' disk (unique_id '{{ item.id }}'): it carries a filesystem
          this role does not recognise (observed '{{ __disk_observed__[item.purpose] }}'; expected an NTFS volume
          labelled '{{ item.label }}', or a pristine/unformatted disk). The role will not clobber existing data —
          clear the disk or correct the identifier.
        quiet: true

    # Ambiguity is unsafe: the same expected label on two matched disks, or two purposes resolving to one disk,
    # both make "which volume is ours" undecidable. Fail closed rather than guess.
    - name: 'MAIN | Assert Data Disk Identity Is Unambiguous'
      ansible.builtin.assert:
        that:
          - (__data_disks__ | map(attribute='matches') | map('first') | map(attribute='number') | list | unique | length) == (__data_disks__ | length)
        fail_msg: >-
          Two or more declared data disks resolve to the same physical disk
          ({{ __data_disks__ | map(attribute='matches') | map('first') | map(attribute='number') | list }}).
          Each purpose must resolve to a distinct disk.
        quiet: true

    # This first mutation is gated by the safety assert above. force:false is idempotent
    # (a no-op on an already-GPT disk); online:true defensively onlines an offline RAW disk
    # (the handed RAW-Online-writable disks need no change here), but is not a general
    # read-only fix for non-RAW disks. uniqueid targets the disk directly without disk_number.
    - name: 'MAIN | Initialize Data Disk (GPT, online, writable)'
      # Skipped when the volume already carries our filesystem ('ours') — this is what makes an idempotent re-run,
      # and an adopted data volume, safe; win_format's label-mismatch reformat cannot be made safe by parameters,
      # so the only safe control is not calling the module at all.
      when: __disk_observed__[item.purpose] in ['pristine', 'unformatted']
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      community.windows.win_initialize_disk:
        uniqueid: "{{ item.id }}"
        style: gpt
        online: true
        force: false

    # Creates a 100% partition (partition_size:-1 is the maximum free extent, the whole
    # initialized disk) and assigns its drive letter. drive_letter is mandatory for
    # win_partition idempotency; disk_number comes from the resolved disk
    # ((item.matches | first).number). The partition remains unformatted until C02e.
    - name: 'MAIN | Create 100% Data Partition With Drive Letter'
      # Skipped when the volume already carries our filesystem ('ours') — this is what makes an idempotent re-run,
      # and an adopted data volume, safe; win_format's label-mismatch reformat cannot be made safe by parameters,
      # so the only safe control is not calling the module at all.
      when: __disk_observed__[item.purpose] in ['pristine', 'unformatted']
      community.windows.win_partition:
        disk_number: "{{ (item.matches | first).number }}"
        partition_size: -1
        drive_letter: "{{ item.drive_letter }}"
        gpt_type: basic_data
        state: present
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"

    # NTFS-formats the RAW partition (C02d) with its label + MS-recommended allocation unit.
    # force:false is idempotent on the pristine RAW volume (first run size 0 -> format; re-run
    # size!=0 + label preserved + ALU match -> no-op). full:false = quick format (thin VMware
    # disks). allocation_unit_size is in BYTES (65536=64 KiB E: / 4096=4 KiB F:). Closes the C02
    # disk-provisioning arc; volumes are ready for WSUS install (C04+).
    - name: 'MAIN | Format Data Volume (NTFS, labelled, MS allocation unit)'
      # Skipped when the volume already carries our filesystem ('ours') — this is what makes an idempotent re-run,
      # and an adopted data volume, safe; win_format's label-mismatch reformat cannot be made safe by parameters,
      # so the only safe control is not calling the module at all.
      when: __disk_observed__[item.purpose] in ['pristine', 'unformatted']
      community.windows.win_format:
        drive_letter: "{{ item.drive_letter }}"
        file_system: ntfs
        new_label: "{{ item.label }}"
        allocation_unit_size: "{{ item.allocation_unit }}"
        full: false
        force: false
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"

    #endregion --- [ Main: Data Volume Provisioning ] --------------------------------------- #

    #region ------ [ Main: WSUS Installation ] ---------------------------------------------- #

    # Creates the WSUS content root on the formatted content volume (derived F:\WSUS).
    # win_file state:directory is idempotent (creates if absent, no-op if present).
    # wsusutil postinstall (C05) creates WSUSContent inside it.
    - name: 'MAIN | Ensure WSUS Content Directory Exists'
      ansible.windows.win_file:
        path: "{{ __content_dir__ }}"
        state: directory

    # Org convention (Director 2026-07-16): every interactive user on a server is an admin. An
    # unreadable folder makes Explorer offer 'Continue', which stamps the admin's PERSONAL ACE
    # onto the ACL — stale SIDs after they depart. The explicit Users grant kills the prompt.
    # R&X only (writes stay behind deliberate elevation); explicit rather than relying on the
    # format-default root-ACL inheritance, which a later hardening pass would silently remove.
    - name: 'MAIN | Grant Users Browse Access On The Content Root'
      ansible.windows.win_acl:
        path: "{{ __content_dir__ }}"
        user: 'BUILTIN\Users'
        rights: 'ReadAndExecute'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Installs the WSUS role on the WID backend (MS Step 1: Install-WindowsFeature -Name
    # UpdateServices -IncludeManagementTools). The WID role services are named EXPLICITLY —
    # MS never states the bare-parent auto-pull verbatim, and a missing WidDB would only
    # surface later as a postinstall failure. include_management_tools brings the WSUS console
    # + the UpdateServices PowerShell module (C07's Get-WsusServer). DO NOT set
    # include_sub_features: it maps to -IncludeAllSubFeature and would also pull
    # UpdateServices-DB (SQL Server Connectivity), which a WID build must NOT have.
    # Idempotent: changed only when the cmdlet returns a non-empty FeatureResult (a converged
    # re-run reports exitcode NoChangeNeeded). The module never reboots — it only reports
    # reboot_required; C04 deliberately does not act on it (measured at P4 first).
    - name: 'MAIN | Install WSUS Server Role (WID)'
      ansible.windows.win_feature:
        name:
          - 'UpdateServices'
          - 'UpdateServices-WidDB'
          - 'UpdateServices-Services'
        include_management_tools: true
        state: present

    # Target directory for the SUSDB relocation (C06 — community procedure, MS-unsupported,
    # Director-approved 2026-07-16) on the dedicated DB volume. Must exist before the WID
    # service-account ACL grant (C06b), the adopt attach (C14i), and the relocation attach (C06g).
    # Hoisted above postinstall (C14i) so the adopt attach has its directory + ACLs in place:
    # without the WID-service FullControl grant an attached SUSDB comes up READ-ONLY and WSUS
    # silently stops syncing. win_file creates parents (E:\WID then E:\WID\Data) and no-ops when present.
    - name: 'MAIN | Ensure WID Data Directory Exists'
      ansible.windows.win_file:
        path: "{{ __wid_data_dir__ }}"
        state: directory

    # Load-bearing ACL for the relocation: without it the C06g attach SUCCEEDS but SUSDB comes
    # up READ-ONLY and WSUS silently stops syncing. Detach flips file ownership, so this dir
    # grant (inherited by the copied .mdf/.ldf) is what guarantees the engine can open them.
    # FullControl mirrors the engine's ACL on its own C:\Windows\WID\Data; the virtual account
    # name is fixed by the WID instance (MICROSOFT##WID) — architectural, not config.
    - name: 'MAIN | Grant WID Service Account Rights On The Relocation Target'
      ansible.windows.win_acl:
        path: "{{ __wid_data_dir__ }}"
        user: 'NT SERVICE\MSSQL$MICROSOFT##WID'
        rights: 'FullControl'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Same org convention as the content-root Users grant (see the WSUS Installation region).
    # DB files readable by Users is accepted in this trust model — everyone is an admin anyway;
    # this is ACL hygiene (stale-SID prevention), not access control.
    - name: 'MAIN | Grant Users Browse Access On The WID Data Directory'
      ansible.windows.win_acl:
        path: "{{ __wid_data_dir__ }}"
        user: 'BUILTIN\Users'
        rights: 'ReadAndExecute'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Read-only completion-truth probe: the four Installed Role Services flags are written at
    # the END of each postinstall component (measured =2 live, the C05 change record). Get-WsusServer is
    # runtime-truth and failed when the C06 arc legitimately stopped the stack; a midway
    # postinstall death leaves flags !=2, so the documented repair operation re-runs.
    # Runtime verification belongs to C07.
    - name: 'MAIN | Probe WSUS Post-Installation State'
      ansible.windows.win_reg_stat:
        path: 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup\Installed Role Services'
      register: __wsus_postinstall_probe__

    # C14a DATA-LOSS INTERLOCK (roadmap item 5 precursor). A populated SUSDB.mdf on the DB volume together with
    # ABSENT postinstall completion flags means: this OS has never been post-installed, yet the data volume
    # already carries a database — i.e. the data disks were adopted from a previous machine (an OS-disk swap).
    # Under the greenfield playbook, continuing would DESTROY that database: postinstall would create an empty
    # SUSDB on C:, the C06 probe would read 'pending', and the C06 win_copy would overwrite E:\WID\Data\SUSDB.mdf
    # with the empty one (C06g's health gate cannot tell — an empty SUSDB is legitimately ONLINE + read-write),
    # after which C06i deletes the C: originals. Nothing would survive. Fail closed.
    # In adopt mode this state is EXPECTED (the attach below handles it), so the interlock is greenfield-only; it
    # still protects ansible/playbooks/wsus.yml unchanged.
    # UNREACHABLE in true greenfield (a fresh machine has no mdf on the DB volume) and in the converged state
    # (flags are =2 once postinstall has run), so this guard is invisible outside the wrong-playbook adopt scenario.
    - name: 'MAIN | Assert No Adopted SUSDB Before Post-Installation'
      ansible.windows.win_stat:
        path: '{{ __wid_data_dir__ }}\SUSDB.mdf'
        # get_checksum MUST be false: when SUSDB is attached, the WID engine holds an exclusive handle on the
        # .mdf and win_stat's default checksum pass fails with "being used by another process" (measured on the
        # converged VM, C14a P4). Only .stat.exists is needed here. (validation repair.)
        get_checksum: false
      register: __susdb_adopt_probe__

    - name: 'MAIN | Refuse To Post-Install Over An Adopted SUSDB'
      when: (config.mode | default('greenfield') | string | lower | trim) == 'greenfield'
      ansible.builtin.assert:
        that:
          - not (__susdb_adopt_probe__.stat.exists and __postinstall_flags__ != [2, 2, 2, 2])
        fail_msg: >-
          Refusing to run wsusutil postinstall: a SUSDB already exists at
          {{ __wid_data_dir__ }}\SUSDB.mdf but this OS has never completed WSUS post-installation
          (Installed Role Services flags = {{ __postinstall_flags__ }}, expected [2, 2, 2, 2]).
          This is the adopt-existing-data-volumes case (an OS-disk replacement); continuing under
          the greenfield playbook would overwrite and destroy the existing database. Run
          ansible/playbooks/wsus-adopt.yml (mode: adopt) instead of ansible/playbooks/wsus.yml.
        quiet: true

    # ADOPT (C14i): an OS-disk replacement leaves the DB volume holding the previous machine's SUSDB. Attach it
    # into the fresh WID instance BEFORE postinstall — MS documents "database in place first, THEN postinstall",
    # and postinstall then reuses + schema-upgrades it instead of creating a new empty database (hand-proven
    # end-to-end, the C14b-c change record). Consequence: the C06c probe below then reads 'relocated', so C06d/e/f/g skip
    # through their EXISTING gates and the C06f overwrite becomes structurally unreachable.
    # FAILURE PATH IS NON-DESTRUCTIVE: unlike C06g (where E: is only a copy and C: is the fallback), here E: IS
    # the original data — so on an unhealthy attach we sp_detach_db (leaves the files on disk) and throw. We NEVER
    # DROP DATABASE, which would delete the adopted .mdf/.ldf.
    - name: 'MAIN | Attach The Adopted SUSDB Before Post-Installation'
      when:
        - (config.mode | default('greenfield') | string | lower | trim) == 'adopt'
        - __susdb_adopt_probe__.stat.exists
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $dir = $env:WID_DATA_DIR
        $attached = 0
        $c = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
        try {
            $c.Open()
            $q = $c.CreateCommand()
            $q.CommandText = "SELECT COUNT(*) FROM sys.databases WHERE name = 'SUSDB'"
            $attached = [int]$q.ExecuteScalar()
        } finally {
            if ($c -and $c.State -eq 'Open') { $c.Close() }
        }
        if ($attached -gt 0) {
            Write-Output 'nochange'
            exit 0
        }
        $dirSql = $dir.Replace("'", "''")
        $c2 = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
        try {
            $c2.Open()
            $a = $c2.CreateCommand()
            $a.CommandText = "CREATE DATABASE SUSDB ON (FILENAME = N'$dirSql\SUSDB.mdf'), (FILENAME = N'$dirSql\SUSDB_log.ldf') FOR ATTACH;"
            [void]$a.ExecuteNonQuery()
            $h = $c2.CreateCommand()
            $h.CommandText = "SELECT d.state_desc AS s, d.is_read_only AS ro, m.physical_name AS pn FROM sys.databases d JOIN sys.master_files m ON m.database_id = d.database_id WHERE d.name = 'SUSDB';"
            $rd = $h.ExecuteReader()
            $state = $null
            $ro = $null
            $files = @()
            while ($rd.Read()) {
                $state = [string]$rd['s']
                $ro = [int]$rd['ro']
                $files += [string]$rd['pn']
            }
            $rd.Close()
            $prefix = $dir.TrimEnd([char]92) + [char]92
            $offTarget = @($files | Where-Object { -not $_.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase) })
            if ($state -ne 'ONLINE' -or $ro -ne 0 -or $files.Count -lt 2 -or $offTarget.Count -gt 0) {
                try {
                    $d = $c2.CreateCommand()
                    $d.CommandText = 'ALTER DATABASE SUSDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC master.dbo.sp_detach_db @dbname = N''SUSDB'';'
                    [void]$d.ExecuteNonQuery()
                } catch {
                    Write-Output 'detach-after-unhealthy-failed'
                }
                throw ("adopted SUSDB attached UNHEALTHY (state=$state ro=$ro files=$($files -join ';')) - detached, NOT dropped; the adopted database files are untouched on disk")
            }
            Write-Output 'changed'
        } finally {
            if ($c2 -and $c2.State -eq 'Open') { $c2.Close() }
        }
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
      register: __susdb_adopt_attach__
      changed_when: "__susdb_adopt_attach__.stdout | trim == 'changed'"

    # Runs the WSUS post-installation: creates SUSDB in WID (on C: — relocated at C06), creates
    # WSUSContent inside the content root, configures the IIS 'WSUS Administration' site (8530),
    # and enables+starts WsusService. WID is selected by the ABSENCE of SQL_INSTANCE_NAME. Gated
    # by the completion flags above (all four =2 means configured -> skip). argv auto-quotes per
    # Win32 rules (the exe path contains spaces). NO trailing backslash on CONTENT_DIR. wsusutil
    # logs to a random .tmp in %TEMP% (stdout names it); the first run takes minutes.
    - name: 'MAIN | Run WSUS Post-Installation (WID, content on F:)'
      when: __postinstall_flags__ != [2, 2, 2, 2]
      ansible.windows.win_command:
        argv:
          - 'C:\Program Files\Update Services\Tools\wsusutil.exe'
          - 'postinstall'
          - 'CONTENT_DIR={{ __content_dir__ }}'

    #endregion --- [ Main: WSUS Installation ] ---------------------------------------------- #

    #region ------ [ Main: SUSDB Relocation ] ----------------------------------------------- #

    # Server-truth relocation gate (sys.master_files — the filesystem lies: files can exist
    # detached or stale). Three states; BINDING contract for the C06 actors (ALWAYS compare
    # __susdb_probe__.stdout | trim — win_shell stdout carries a trailing newline):
    #   'pending'   attached on C:   -> full sequence (stop, detach, copy, attach, start)
    #   'orphaned'  detached, 0 rows -> RESUME: stop/copy/attach run, detach SKIPS — the expected
    #               state when a prior run died between detach and attach; while detached nothing
    #               writes to either copy, so C: stays the intact source (copy-don't-move payoff)
    #   'relocated' attached on E:   -> the whole destructive middle skips
    # SPLIT across volumes throws: attach is atomic, so this role can never produce it — it
    # uniquely signals foreign/manual drift (fail closed; manual recovery).
    - name: 'MAIN | Probe SUSDB Location (relocation gate)'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $prefix = $env:WID_DATA_DIR.TrimEnd([char]92) + [char]92
        $conn = $null
        try {
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT physical_name FROM sys.master_files WHERE database_id = DB_ID('SUSDB');"
            $reader = $cmd.ExecuteReader()
            $paths = @()
            while ($reader.Read()) {
                $paths += [string]$reader['physical_name']
            }
            $reader.Close()
        } finally {
            if ($conn -and $conn.State -eq 'Open') { $conn.Close() }
        }
        if ($paths.Count -eq 0) {
            Write-Output 'orphaned'
            exit 0
        }
        $onTarget = @($paths | Where-Object { $_ -like ($prefix + '*') })
        if ($onTarget.Count -eq $paths.Count) {
            Write-Output 'relocated'
        } elseif ($onTarget.Count -eq 0) {
            Write-Output 'pending'
        } else {
            throw ('SUSDB files SPLIT across volumes: ' + ($paths -join '; ') + ' — this role cannot produce this (attach is atomic); foreign/manual drift, manual recovery required.')
        }
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
      register: __susdb_probe__
      changed_when: false

    # MS's wid-to-sql sequence stops WSUS + IIS before detach: WsusService and W3SVC hold
    # SUSDB connections (the WSUS app pools live in W3SVC). The WID engine service
    # MSSQL$MICROSOFT##WID deliberately stays running to execute the C06e detach. Gated on
    # the C06c pending|orphaned contract; an orphaned resume may find them already stopped,
    # a native no-op. C06h restarts both after verified attach. TRANSITIONAL: until C06h, a
    # converged pending run ends with both stopped — acceptable in the revert-every-run lab.
    - name: 'MAIN | Stop WSUS Services For Relocation'
      ansible.windows.win_service:
        name: '{{ item }}'
        state: stopped
      loop: ['WsusService', 'W3SVC']
      loop_control:
        label: '{{ item }}'
      when: __susdb_probe__.stdout | trim in ['pending', 'orphaned']

    # MS wid-to-sql detach batch. SET SINGLE_USER WITH ROLLBACK IMMEDIATE drops any straggler
    # session so detach cannot block (WSUS/IIS already stopped by C06d); sp_detach_db leaves the
    # .mdf/.ldf on disk: copy-don't-move keeps C: intact until C06g attach-from-E: is verified.
    # The ==pending-only gate is the idempotency mechanism: orphaned is already detached and a
    # re-detach throws. SqlClient over the WID pipe is the C06c §8 idiom (no native module).
    - name: 'MAIN | Detach SUSDB For Relocation'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $conn = $null
        try {
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = 'ALTER DATABASE SUSDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC master.dbo.sp_detach_db @dbname = N''SUSDB'';'
            $cmd.ExecuteNonQuery() | Out-Null
        } finally {
            if ($conn -and $conn.State -eq 'Open') { $conn.Close() }
        }
        Write-Output 'detached'
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
      register: __susdb_detach__
      changed_when: true
      when: __susdb_probe__.stdout | trim == 'pending'

    # C14j belt-and-braces: C14i makes this copy structurally unreachable in adopt mode, but the copy below is a
    # force:true checksum-differs Copy-Item with no backup: and a TOTAL, unrecoverable blast radius. A future
    # ordering regression must hit an assert, not a Copy-Item.
    - name: 'MAIN | Assert Relocation Target Is Empty Before Copy'
      when: __susdb_probe__.stdout | trim in ['pending', 'orphaned']
      ansible.windows.win_stat:
        path: '{{ __wid_data_dir__ }}\SUSDB.mdf'
        get_checksum: false
      register: __susdb_dest_probe__

    - name: 'MAIN | Refuse To Overwrite An Existing SUSDB At The Relocation Target'
      when: __susdb_probe__.stdout | trim in ['pending', 'orphaned']
      ansible.builtin.assert:
        that:
          - not __susdb_dest_probe__.stat.exists
        fail_msg: >-
          Refusing to copy SUSDB onto {{ __wid_data_dir__ }}: a database file already exists there. The
          relocation copy would overwrite it irrecoverably. If this is an adopted data volume, run
          ansible/playbooks/wsus-adopt.yml (mode: adopt) instead of the greenfield playbook.
        quiet: true

    # MS wid-to-sql COPIES the detached DB files: copy-don't-move leaves the C: originals as the
    # fallback until C06g verifies attach-from-E:; C06i deletes them then. win_copy is native and
    # checksum-idempotent; remote_src keeps both endpoints on-guest. Copying into E:\WID\Data
    # inherits the C06b WID-service FullControl ACE, preventing a read-only C06g attach. The
    # explicit two-file list excludes WID system DBs (master/model/msdb/tempdb), which must not
    # move. Gated pending|orphaned per the C06c d/f/g contract.
    - name: 'MAIN | Copy SUSDB Files To Relocation Target'
      ansible.windows.win_copy:
        src: '{{ __wid_source_dir__ }}\{{ item }}'
        dest: '{{ __wid_data_dir__ }}\{{ item }}'
        remote_src: true
      loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
      loop_control:
        label: '{{ item }}'
      when: __susdb_probe__.stdout | trim in ['pending', 'orphaned']

    # MS wid-to-sql FOR ATTACH uses the E: copies while C: stays an untouched fallback. The
    # fail-closed health gate requires ONLINE + is_read_only=0 (read-only is C06b's silent-
    # no-sync failure) and every file under the exact E: StartsWith prefix. On failure, DROP
    # DATABASE is state-independent (unlike sp_detach_db, which needs EMERGENCY for SUSPECT),
    # restoring 'orphaned' before throwing so C06c cannot read broken state as 'relocated' and
    # C06i cannot delete the fallback. The path enters via environment, not PS source; the
    # reader closes before non-MARS DROP. A healthy attach flips the probe to 'relocated'.
    - name: 'MAIN | Attach SUSDB From Relocation Target'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $dir = $env:WID_DATA_DIR
        $dirSql = $dir.Replace("'", "''")
        $conn = $null
        try {
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "CREATE DATABASE SUSDB ON (FILENAME = N'$dirSql\SUSDB.mdf'), (FILENAME = N'$dirSql\SUSDB_log.ldf') FOR ATTACH;"
            $cmd.ExecuteNonQuery() | Out-Null
            $cmd.CommandText = "SELECT d.state_desc AS s, d.is_read_only AS ro, m.physical_name AS pn FROM sys.databases d JOIN sys.master_files m ON m.database_id = d.database_id WHERE d.name = 'SUSDB';"
            $reader = $cmd.ExecuteReader()
            $state = $null
            $ro = $null
            $files = @()
            while ($reader.Read()) {
                $state = [string]$reader['s']
                $ro = [int]$reader['ro']
                $files += [string]$reader['pn']
            }
            $reader.Close()
            $prefix = $dir.TrimEnd([char]92) + [char]92
            $offTarget = @($files | Where-Object { -not $_.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase) })
            if ($state -ne 'ONLINE' -or $ro -ne 0 -or $files.Count -lt 2 -or $offTarget.Count -gt 0) {
                $drop = $conn.CreateCommand()
                $drop.CommandText = "IF DB_ID('SUSDB') IS NOT NULL DROP DATABASE SUSDB;"
                $drop.ExecuteNonQuery() | Out-Null
                throw ("SUSDB attach unhealthy (state=$state ro=$ro files=$($files -join ';')) - dropped to preserve the C: fallback")
            }
        } finally {
            if ($conn -and $conn.State -eq 'Open') { $conn.Close() }
        }
        Write-Output 'attached'
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
      register: __susdb_attach__
      changed_when: true
      when: __susdb_probe__.stdout | trim in ['pending', 'orphaned']

    # C06d stopped IIS + WSUS for relocation; bring the stack back in reverse order (IIS first,
    # then WSUS). UNGATED terminal desired-state: every run ends with both services running,
    # reached only after C06g succeeds/skips (a bad attach fails). state: started is idempotent;
    # WID never stopped, so SUSDB remains reachable.
    - name: 'MAIN | Start WSUS Services After Relocation'
      ansible.windows.win_service:
        name: '{{ item }}'
        state: started
      loop: ['W3SVC', 'WsusService']
      loop_control:
        label: '{{ item }}'

    # INDEPENDENT health gate for the destructive C: delete (C06g forward commitment):
    # re-derives ONLINE + read-write + all-files-on-E. C06c 'relocated' is only files-on-E
    # and would pass a broken DB. This probe is read-only, so changed_when is false.
    - name: 'MAIN | Probe SUSDB Relocation Health (delete gate)'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $dir = $env:WID_DATA_DIR
        $conn = $null
        try {
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT d.state_desc AS s, d.is_read_only AS ro, m.physical_name AS pn FROM sys.databases d JOIN sys.master_files m ON m.database_id = d.database_id WHERE d.name = 'SUSDB';"
            $reader = $cmd.ExecuteReader()
            $state = $null
            $ro = $null
            $files = @()
            while ($reader.Read()) {
                $state = [string]$reader['s']
                $ro = [int]$reader['ro']
                $files += [string]$reader['pn']
            }
            $reader.Close()
        } finally {
            if ($conn -and $conn.State -eq 'Open') { $conn.Close() }
        }
        $prefix = $dir.TrimEnd([char]92) + [char]92
        $offTarget = @($files | Where-Object { -not $_.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase) })
        if ($state -eq 'ONLINE' -and $ro -eq 0 -and $files.Count -ge 2 -and $offTarget.Count -eq 0) {
            Write-Output 'healthy'
        } else {
            Write-Output 'unsafe'
        }
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
      register: __susdb_relocated_healthy__
      changed_when: false

    # Retire the copy-don't-move fallback: delete stale C: originals ONLY when the probe says
    # 'healthy'. win_file absent is idempotent; this is the arc's only fallback-destroying
    # step, hence the strictest gate. The explicit two-file loop never touches WID system DBs.
    - name: 'MAIN | Remove SUSDB Originals From System Volume'
      ansible.windows.win_file:
        path: '{{ __wid_source_dir__ }}\{{ item }}'
        state: absent
      loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
      loop_control:
        label: '{{ item }}'
      when: __susdb_relocated_healthy__.stdout | trim == 'healthy'

    #endregion --- [ Main: SUSDB Relocation ] ----------------------------------------------- #

    #region ------ [ Main: WSUS Tuning ] --------------------------------------------------- #

    # Fail-closed guard: win_iis_webapppool state:started would create a bogus generic pool
    # if WsusPool were absent, leaving WSUS silently broken. Refuse to tune unless install +
    # postinstall created it. Read-only (changed_when:false); §4b guard / §8 win_shell.
    - name: 'MAIN | Assert WsusPool Exists Before Tuning'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        if (-not (Test-Path 'IIS:\AppPools\WsusPool')) {
            throw 'WsusPool application pool not found - WSUS install + postinstall must complete before tuning; refusing to let win_iis_webapppool create a bogus pool.'
        }
        Write-Output 'present'
      changed_when: false

    # MS WSUS best practices, "Disable recycling and configure memory limits": prevents the
    # scan-storm / HTTP-503 / high-memory cascade when a recycle drops + rebuilds the metadata
    # cache. Values are role defaults (config.wsuspool.*), overridable for shared hosts. The
    # native module diffs current vs desired (idempotent). Source:
    # learn.microsoft.com/troubleshoot/mem/configmgr/update-management/windows-server-update-services-best-practices
    - name: 'MAIN | Tune WsusPool Application Pool'
      community.windows.win_iis_webapppool:
        name: WsusPool
        state: started
        attributes:
          queueLength: '{{ config.wsuspool.queue_length | int }}'
          recycling.periodicRestart.privateMemory: '{{ config.wsuspool.private_memory_kb | int }}'
          recycling.periodicRestart.memory: '{{ config.wsuspool.virtual_memory_kb | int }}'
          recycling.periodicRestart.time: '{{ config.wsuspool.periodic_restart }}'
          processModel.idleTimeout: '{{ config.wsuspool.idle_timeout }}'
          processModel.pingingEnabled: '{{ config.wsuspool.pinging_enabled | bool }}'

    #endregion --- [ Main: WSUS Tuning ] -------------------------------------------------- #

    #region ------ [ Main: WSUS Maintenance ] --------------------------------------------- #

    # Role-managed home for the SUSDB maintenance scripts and their timestamped run logs.
    # win_file state:directory is idempotent (creates if absent, no-op if present).
    - name: 'MAIN | Ensure WSUS Maintenance Directory'
      ansible.windows.win_file:
        path: '{{ config.maintenance.dir }}'
        state: directory

    # Deploy MS's verbatim reindex script + the SqlClient/WID-pipe runner and the UpdateServices
    # cleanup runner. Server 2025 has no sqlcmd, so the reindex runner GO-splits the script using
    # the C06 idiom. win_copy is checksum-idempotent; C09b/C10b schedule the runners.
    - name: 'MAIN | Deploy WSUS Maintenance Tooling'
      ansible.windows.win_copy:
        src: '{{ item }}'
        dest: '{{ config.maintenance.dir }}\{{ item }}'
      loop: ['SUSDBMaint.sql', 'Invoke-SusdbReindex.ps1', 'Invoke-WsusCleanup.ps1', 'Invoke-IisLogCleanup.ps1']
      loop_control:
        label: '{{ item }}'

    # The credential-free scheduled reindex runs as SYSTEM, which is not a WID sysadmin by
    # default. Grant it the same WID sysadmin the local admin already holds: sysadmin is required
    # because db_owner cannot run sp_updatestats. SID-verified IF-NOT-EXISTS checks keep the
    # SqlClient/WID-pipe C06/C09a idiom idempotent.
    - name: 'MAIN | Grant SYSTEM WID sysadmin For Scheduled Reindex'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $changed = $false
        $conn = $null
        try {
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            $conn.Open()
            $check = $conn.CreateCommand()
            $check.CommandText = "SELECT COUNT(*) FROM sys.server_principals WHERE name = 'NT AUTHORITY\SYSTEM' AND type = 'U' AND sid = SUSER_SID('NT AUTHORITY\SYSTEM')"
            if ([int]$check.ExecuteScalar() -eq 0) {
                $make = $conn.CreateCommand()
                $make.CommandText = "CREATE LOGIN [NT AUTHORITY\SYSTEM] FROM WINDOWS"
                [void]$make.ExecuteNonQuery()
                $changed = $true
            }
            $role = $conn.CreateCommand()
            $role.CommandText = "SELECT COUNT(*) FROM sys.server_role_members rm JOIN sys.server_principals r ON rm.role_principal_id = r.principal_id JOIN sys.server_principals p ON rm.member_principal_id = p.principal_id WHERE r.name = 'sysadmin' AND p.name = 'NT AUTHORITY\SYSTEM'"
            if ([int]$role.ExecuteScalar() -eq 0) {
                $add = $conn.CreateCommand()
                $add.CommandText = "ALTER SERVER ROLE sysadmin ADD MEMBER [NT AUTHORITY\SYSTEM]"
                [void]$add.ExecuteNonQuery()
                $changed = $true
            }
        } finally {
            if ($conn -and $conn.State -eq 'Open') { $conn.Close() }
        }
        if ($changed) { Write-Output 'changed' } else { Write-Output 'nochange' }
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
      register: __susdb_grant_system__
      changed_when: "__susdb_grant_system__.stdout | trim == 'changed'"

    # Schedule the C09a runner weekly off-hours as SYSTEM: service_account stores no password,
    # and SYSTEM has the required WID sysadmin grant above. IgnoreNew (2) prevents overlapping
    # offline-lock reindexes; the time limit bounds a hung run. The fixed past start-boundary
    # date anchors recurrence while day_of_week + target-local time drive the weekly schedule.
    - name: 'MAIN | Schedule The SUSDB Reindex'
      community.windows.win_scheduled_task:
        name: 'WSUS SUSDB Reindex'
        description: 'Weekly off-hours SUSDB reindex/defragment (MS SUSDBMaint.sql via SqlClient over the WID pipe). wsus role C09b.'
        actions:
          - path: 'powershell.exe'
            arguments: '-NoProfile -ExecutionPolicy Bypass -File "{{ config.maintenance.dir }}\Invoke-SusdbReindex.ps1" -ScriptPath "{{ config.maintenance.dir }}\SUSDBMaint.sql" -LogDir "{{ config.maintenance.dir }}"'
        triggers:
          - type: weekly
            days_of_week: '{{ config.maintenance.reindex_schedule.day }}'
            start_boundary: '2020-01-01T{{ config.maintenance.reindex_schedule.time }}:00'
        username: 'NT AUTHORITY\SYSTEM'
        logon_type: service_account
        run_level: highest
        multiple_instances: 2
        execution_time_limit: '{{ config.maintenance.reindex_schedule.time_limit }}'
        state: present
        enabled: true

    # Schedule the C10a cleanup runner monthly (first Sunday 00:00, before the 03:00 weekly
    # reindex) as SYSTEM: service_account stores no password, and SYSTEM has the C09b WID
    # sysadmin grant (pre-tested). Operations come from the cleanup_operations default joined
    # to the runner's comma-scalar, which its allowlist re-validates. IgnoreNew never overlaps;
    # the time limit bounds a hung run.
    - name: 'MAIN | Schedule The WSUS Server Cleanup'
      community.windows.win_scheduled_task:
        name: 'WSUS Server Cleanup'
        description: 'Monthly (first Sunday, off-hours) WSUS Server Cleanup (Invoke-WsusServerCleanup). wsus role C10b.'
        actions:
          - path: 'powershell.exe'
            arguments: '-NoProfile -ExecutionPolicy Bypass -File "{{ config.maintenance.dir }}\Invoke-WsusCleanup.ps1" -LogDir "{{ config.maintenance.dir }}" -Operations "{{ config.maintenance.cleanup_operations | join(",") }}"'
        triggers:
          - type: monthlydow
            weeks_of_month: '{{ config.maintenance.cleanup_schedule.week }}'
            days_of_week: '{{ config.maintenance.cleanup_schedule.day }}'
            start_boundary: '2020-01-01T{{ config.maintenance.cleanup_schedule.time }}:00'
        username: 'NT AUTHORITY\SYSTEM'
        logon_type: service_account
        run_level: highest
        multiple_instances: 2
        execution_time_limit: '{{ config.maintenance.cleanup_schedule.time_limit }}'
        state: present
        enabled: true

    # Schedule the C13f IIS log cleanup weekly off-hours as SYSTEM (credential-free; SYSTEM already has
    # FullControl on the IIS log dir via C13c — filesystem-only, NO WID grant). 02:00 sits between the 00:00
    # monthly cleanup and the 03:00 weekly reindex. IgnoreNew never overlaps; the time limit bounds a hung run.
    - name: 'MAIN | Schedule The IIS Log Cleanup'
      community.windows.win_scheduled_task:
        name: 'WSUS IIS Log Cleanup'
        description: 'Weekly off-hours IIS W3C log cleanup (delete *.log older than iis.log_retention_days). wsus role C13g.'
        actions:
          - path: 'powershell.exe'
            arguments: '-NoProfile -ExecutionPolicy Bypass -File "{{ config.maintenance.dir }}\Invoke-IisLogCleanup.ps1" -LogPath "{{ config.iis.log_dir }}" -MaxAgeDays {{ config.iis.log_retention_days }} -LogDir "{{ config.maintenance.dir }}"'
        triggers:
          - type: weekly
            days_of_week: '{{ config.iis.log_cleanup_schedule.day }}'
            start_boundary: '2020-01-01T{{ config.iis.log_cleanup_schedule.time }}:00'
        username: 'NT AUTHORITY\SYSTEM'
        logon_type: service_account
        run_level: highest
        multiple_instances: 2
        execution_time_limit: '{{ config.iis.log_cleanup_schedule.time_limit }}'
        state: present
        enabled: true

    #endregion --- [ Main: WSUS Maintenance ] --------------------------------------------- #

    #region ------ [ Main: WSUS Sync Configuration ] --------------------------------------- #

    # Restrict update languages (default en) so a sync doesn't pull every language (the
    # postinstall default is ALL). StringCollection of lowercase codes + AllUpdateLanguagesEnabled
    # false; normalized order-insensitive compare; re-acquire + verify after Save to avoid
    # perpetual-change/false-converge. Env-passed langs; WSUS-cmdlet win_shell (§8).
    - name: 'MAIN | Restrict WSUS Update Languages'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $want = @($env:WSUS_LANGS.Split(',') | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ } | Select-Object -Unique)
        if ($want.Count -eq 0) {
            throw 'no update languages specified'
        }
        $wantSorted = @($want | Sort-Object)
        $c = (Get-WsusServer).GetConfiguration()
        $current = @(@($c.GetEnabledUpdateLanguages()) | ForEach-Object { ([string]$_).ToLowerInvariant() } | Sort-Object)
        $needChange = $c.AllUpdateLanguagesEnabled -or @(Compare-Object $current $wantSorted).Count -gt 0
        if ($needChange) {
            $sc = New-Object System.Collections.Specialized.StringCollection
            foreach ($l in $want) { [void]$sc.Add($l) }
            $c.AllUpdateLanguagesEnabled = $false
            $c.SetEnabledUpdateLanguages($sc)
            $c.Save()
            $c2 = (Get-WsusServer).GetConfiguration()
            $after = @(@($c2.GetEnabledUpdateLanguages()) | ForEach-Object { ([string]$_).ToLowerInvariant() } | Sort-Object)
            if ($c2.AllUpdateLanguagesEnabled -or @(Compare-Object $after $wantSorted).Count -gt 0) {
                throw ('language restriction did not persist: got [' + ($after -join ',') + '] AllEnabled=' + $c2.AllUpdateLanguagesEnabled)
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        WSUS_LANGS: '{{ config.sync.update_languages | join(",") }}'
      register: __wsus_lang_cfg__
      changed_when: "__wsus_lang_cfg__.stdout | trim == 'changed'"

    # Gated one-time category-only bootstrap loads catalog metadata (no update files) early for the
    # C11c/d product/classification tree. PROVE-STARTED (Director): confirm acceptance, then write the
    # durable ServerId marker without waiting ~1-2hr; it survives history expiry/failed syncs and a
    # re-created SUSDB self-heals. 'inflight' resumes an already-running sync; §8 WSUS-cmdlet win_shell.
    - name: 'MAIN | Bootstrap WSUS Category Sync (trigger + mark)'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $w = Get-WsusServer
        $s = $w.GetSubscription()
        $serverId = [string]$w.GetConfiguration().ServerId
        $key = 'HKLM:\SOFTWARE\nwarila-platform\wsus'
        $marked = (Get-ItemProperty -Path $key -Name 'category_bootstrap_server_id' -ErrorAction SilentlyContinue).category_bootstrap_server_id
        if ($marked -and $marked -eq $serverId) {
            Write-Output 'nochange'
            return
        }
        $status = [string]$s.GetSynchronizationStatus()
        if ($status -eq 'NotProcessing') {
            $preHist = @($s.GetSynchronizationHistory()).Count
            $s.StartSynchronizationForCategoryOnly()
            $deadline = (Get-Date).AddSeconds([int]$env:ACCEPT_TIMEOUT)
            do {
                Start-Sleep -Seconds 3
                $accepted = ([string]$s.GetSynchronizationStatus() -ne 'NotProcessing') -or (@($s.GetSynchronizationHistory()).Count -gt $preHist)
            } while (-not $accepted -and (Get-Date) -lt $deadline)
            if (-not $accepted) {
                throw 'category sync not accepted within bootstrap_accept_timeout_sec of StartSynchronizationForCategoryOnly'
            }
            $result = 'started'
        } else {
            $result = 'inflight'
        }
        if (-not (Test-Path $key)) {
            New-Item -Path $key -Force | Out-Null
        }
        New-ItemProperty -Path $key -Name 'category_bootstrap_server_id' -Value $serverId -PropertyType String -Force | Out-Null
        Write-Output $result
      environment:
        ACCEPT_TIMEOUT: '{{ config.sync.bootstrap_accept_timeout_sec }}'
      register: __wsus_bootstrap__
      changed_when: "__wsus_bootstrap__.stdout | trim in ['started', 'inflight']"

    # Point this WSUS at the required upstream WSUS for the downstream topology; validate.yml
    # owns the primary input contract, and this shell guard is defense-in-depth. Save only on
    # a five-field diff, then re-acquire and verify because Save() does not validate reachability.
    # WSUS refuses config Save() while a synchronization is running, and the C11b prove-started
    # bootstrap leaves an MU category sync running on a fresh install — so stop it and wait for idle before Save.
    # Booleans arrive as lower env strings and are parsed with ToBoolean.
    - name: 'MAIN | Configure Upstream WSUS Source'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:UPSTREAM_SERVER)) {
            throw 'upstream_server is required for a downstream topology: declare it in the wsus: override dict (config.upstream_server)'
        }
        $wantPort = [int]$env:UPSTREAM_PORT
        $wantSsl = [System.Convert]::ToBoolean($env:UPSTREAM_SSL)
        $wantReplica = [System.Convert]::ToBoolean($env:REPLICA)
        $c = (Get-WsusServer).GetConfiguration()
        $needChange = $c.SyncFromMicrosoftUpdate -or ($c.UpstreamWsusServerName -ne $env:UPSTREAM_SERVER) -or ($c.UpstreamWsusServerPortNumber -ne $wantPort) -or ($c.UpstreamWsusServerUseSsl -ne $wantSsl) -or ($c.IsReplicaServer -ne $wantReplica)
        if ($needChange) {
            $sub = (Get-WsusServer).GetSubscription()
            if ([string]$sub.GetSynchronizationStatus() -ne 'NotProcessing') {
                $sub.StopSynchronization()
                $stopDeadline = (Get-Date).AddSeconds(60)
                do {
                    Start-Sleep -Seconds 2
                } while ((Get-Date) -lt $stopDeadline -and [string]$sub.GetSynchronizationStatus() -ne 'NotProcessing')
                if ([string]$sub.GetSynchronizationStatus() -ne 'NotProcessing') {
                    throw 'could not stop the in-progress synchronization before saving the upstream source config'
                }
            }
            $c.SyncFromMicrosoftUpdate = $false
            $c.UpstreamWsusServerName = $env:UPSTREAM_SERVER
            $c.UpstreamWsusServerPortNumber = $wantPort
            $c.UpstreamWsusServerUseSsl = $wantSsl
            $c.IsReplicaServer = $wantReplica
            $c.Save()
            $c2 = (Get-WsusServer).GetConfiguration()
            if ($c2.SyncFromMicrosoftUpdate -or ($c2.UpstreamWsusServerName -ne $env:UPSTREAM_SERVER) -or ($c2.UpstreamWsusServerPortNumber -ne $wantPort) -or ($c2.UpstreamWsusServerUseSsl -ne $wantSsl) -or ($c2.IsReplicaServer -ne $wantReplica)) {
                throw ('upstream source did not persist: SyncFromMU=' + $c2.SyncFromMicrosoftUpdate + ' upstream=[' + $c2.UpstreamWsusServerName + '] port=' + $c2.UpstreamWsusServerPortNumber + ' ssl=' + $c2.UpstreamWsusServerUseSsl + ' replica=' + $c2.IsReplicaServer)
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        UPSTREAM_SERVER: '{{ config.upstream_server | default("") | string | trim }}'
        UPSTREAM_PORT: '{{ config.sync.upstream_port }}'
        UPSTREAM_SSL: '{{ config.sync.upstream_use_ssl | bool | lower }}'
        REPLICA: '{{ config.sync.replica | bool | lower }}'
      register: __wsus_source__
      changed_when: "__wsus_source__.stdout | trim == 'changed'"

    #endregion --- [ Main: WSUS Sync Configuration ] -------------------------------------- #

    #region ------ [ Main: IIS Logging + Relocation ] ------------------------------------- #

    # WSUS's UpdateServices install (C04) pulls in the Web-Server role but NOT the HTTP Logging role
    # service, so the HttpLoggingModule that writes W3C logs is absent — the C12b logFile config (directory
    # on G:) is correct but produces NO file until this module exists (root-caused live 2026-07-18: 0 logs on
    # G: with correct config + traffic + flush; installing Web-Http-Logging => logs write to
    # G:\inetpub\logs\LogFiles\W3SVC*\u_ex*.log on the next request). Native + idempotent (changed only on
    # first install); no reboot (measured — the module hot-loads and IIS writes immediately). Enable logging
    # here, then the next task points it at G:.
    - name: 'MAIN | Install IIS HTTP Logging Role Service'
      ansible.windows.win_feature:
        name: Web-Http-Logging
        state: present

    # IIS site-level log paths can override siteDefaults, so the role repoints both to the
    # literal G: path for STIG-auditable active logging off the system volume. Validate the
    # path before any mutation and create the directory in-shell so a bad %VAR% override is
    # never expanded by another module before rejection.
    - name: 'MAIN | Relocate IIS Logs To G:'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        function Normalize-IisConfiguredPath([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p)) {
                return ''
            }
            return $p.Trim().Replace('/', [char]92).TrimEnd([char]92)
        }
        $want = Normalize-IisConfiguredPath $env:IIS_LOG_DIR
        if ($want -match '%[^%]+%' -or $want -notmatch '^[A-Za-z]:') {
            throw ('iis.log_dir must be a literal drive-qualified path (no %VAR%): ' + $env:IIS_LOG_DIR)
        }
        $changed = $false
        if (-not (Test-Path -LiteralPath $want)) {
            New-Item -ItemType Directory -Path $want -Force | Out-Null
            $changed = $true
        }
        function Test-IisConfiguredPath([string]$cur) {
            $c = Normalize-IisConfiguredPath $cur
            if ($c -match '%[^%]+%') {
                return $false
            }
            return [string]::Equals($c, $want, [System.StringComparison]::OrdinalIgnoreCase)
        }
        $globalCur = (Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name directory).Value
        $sites = @(Get-Website)
        $needChange = (-not (Test-IisConfiguredPath $globalCur)) -or (@($sites | Where-Object { -not (Test-IisConfiguredPath $_.logFile.directory) }).Count -gt 0)
        if ($needChange) {
            Set-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name directory -value $want
            foreach ($s in $sites) {
                Set-ItemProperty -LiteralPath ('IIS:\Sites' + [char]92 + $s.Name) -name logFile.directory -value $want
            }
            $globalAfter = (Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name directory).Value
            $bad = @()
            if (-not (Test-IisConfiguredPath $globalAfter)) {
                $bad += 'siteDefaults'
            }
            foreach ($s in @(Get-Website)) {
                if (-not (Test-IisConfiguredPath $s.logFile.directory)) {
                    $bad += $s.Name
                }
            }
            if ($bad.Count -gt 0) {
                throw ('IIS log dir did not persist to ' + $want + ' for: ' + ($bad -join ','))
            }
            $changed = $true
        }
        if ($changed) {
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        IIS_LOG_DIR: '{{ config.iis.log_dir }}'
      register: __iis_logdir__
      changed_when: "__iis_logdir__.stdout | trim == 'changed'"

    # Validate once before mutation so native path params never expand a bad %VAR% override.
    - name: 'MAIN | Validate + Normalize IIS wwwroot Target'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $p = $env:WWWROOT
        if ([string]::IsNullOrWhiteSpace($p)) {
            throw 'iis.wwwroot is required'
        }
        $norm = $p.Trim().Replace('/', [char]92).TrimEnd([char]92)
        if ($norm -match '%[^%]+%' -or $norm -notmatch '^[A-Za-z]:') {
            throw ('iis.wwwroot must be a literal drive-qualified path (no %VAR%): ' + $p)
        }
        Write-Output $norm
      environment:
        WWWROOT: '{{ config.iis.wwwroot }}'
      register: __iis_wwwroot_norm__
      changed_when: false

    # Copy content before repointing so the Default Web Site has a populated G: root.
    - name: 'MAIN | Copy IIS wwwroot Content To G:'
      ansible.windows.win_copy:
        src: 'C:\inetpub\wwwroot\'
        dest: '{{ __iis_wwwroot_norm__.stdout | trim }}\'
        remote_src: true

    # Repoint IIS default-root metadata in both registry views to the IIS disk.
    - name: 'MAIN | Repoint InetStp PathWWWRoot To G:'
      ansible.windows.win_regedit:
        path: '{{ item }}'
        name: PathWWWRoot
        data: '{{ __iis_wwwroot_norm__.stdout | trim }}'
        type: string
      loop:
        - 'HKLM:\SOFTWARE\Microsoft\InetStp'
        - 'HKLM:\SOFTWARE\Wow6432Node\Microsoft\InetStp'

    # Repoint only the Default Web Site; the WSUS Administration site stays untouched.
    - name: 'MAIN | Repoint Default Web Site Root To G:'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        function Normalize-IisConfiguredPath([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p)) {
                return ''
            }
            return $p.Trim().Replace('/', [char]92).TrimEnd([char]92)
        }
        $want = Normalize-IisConfiguredPath $env:WWWROOT
        if ($want -match '%[^%]+%' -or $want -notmatch '^[A-Za-z]:') {
            throw ('wwwroot must be a literal drive-qualified path (no %VAR%): ' + $env:WWWROOT)
        }
        $site = Get-Website -Name 'Default Web Site'
        if (-not $site) {
            throw 'Default Web Site not found'
        }
        function Test-IisConfiguredPath([string]$cur) {
            $c = Normalize-IisConfiguredPath $cur
            if ($c -match '%[^%]+%') {
                return $false
            }
            return [string]::Equals($c, $want, [System.StringComparison]::OrdinalIgnoreCase)
        }
        if (-not (Test-IisConfiguredPath $site.physicalPath)) {
            Set-ItemProperty -LiteralPath 'IIS:\Sites\Default Web Site' -name physicalPath -value $want
            $after = (Get-Website -Name 'Default Web Site').physicalPath
            if (-not (Test-IisConfiguredPath $after)) {
                throw ('Default Web Site physicalPath did not persist to ' + $want + ' (got ' + $after + ')')
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        WWWROOT: '{{ __iis_wwwroot_norm__.stdout | trim }}'
      register: __iis_wwwroot__
      changed_when: "__iis_wwwroot__.stdout | trim == 'changed'"

    # STIG V-218790 (IIST-SV-000115): the IIS log directory must grant SYSTEM + Administrators FullControl.
    # Director (2026-07-18): org convention + STIG FC — keep the explicit BUILTIN\Users ReadAndExecute grant
    # (ratified Users-ACL convention: everyone-is-admin, explicit not inherited) AND add SYSTEM/Administrators
    # FullControl. Additive (state present) — does not strip other ACEs. Native win_acl, idempotent.
    - name: 'MAIN | Set IIS Log Directory ACLs (SYSTEM/Admins FullControl, Users R&X)'
      ansible.windows.win_acl:
        path: '{{ config.iis.log_dir }}'
        user: '{{ item.user }}'
        rights: '{{ item.rights }}'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present
      loop:
        - { user: 'NT AUTHORITY\SYSTEM', rights: 'FullControl' }
        - { user: 'BUILTIN\Administrators', rights: 'FullControl' }
        - { user: 'BUILTIN\Users', rights: 'ReadAndExecute' }
      loop_control:
        label: '{{ item.user }}'

    # Harden the IIS W3C log config to STIG: logTargetW3C=File,ETW (V-218786) on siteDefaults + every site, and
    # the four required custom fields (V-218788/9) in the siteDefaults customFields collection (separate from the
    # standard fields). Config-object idiom (native-module template): normalized compare + full-tuple guard +
    # self-heal + re-acquire-verify + changed/nochange. §8 win_shell (no native module for IIS log config).
    - name: 'MAIN | Harden IIS W3C Log Config (STIG custom fields + File,ETW target)'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        $changed = $false
        function Normalize-Target([string]$t) {
            if ([string]::IsNullOrWhiteSpace($t)) {
                return ''
            }
            return (($t -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }) -join ',').ToLowerInvariant()
        }
        $wantTarget = $env:LOG_TARGET
        $wantNorm = Normalize-Target $wantTarget
        # logTargetW3C (a flags enum) is returned as a plain String by Get-WebConfigurationProperty /
        # Get-ItemProperty — NOT a wrapper with .Value (unlike 'directory'), so read it via [string](...)
        # (a .Value read yields empty and would loop-set + false-fail the verify). (validation repair.)
        $sdCur = [string](Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name logTargetW3C)
        if ((Normalize-Target $sdCur) -ne $wantNorm) {
            Set-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name logTargetW3C -value $wantTarget
            $changed = $true
        }
        foreach ($s in @(Get-Website)) {
            $cur = [string](Get-ItemProperty -LiteralPath ('IIS:\Sites' + [char]92 + $s.Name) -name logFile.logTargetW3C)
            if ((Normalize-Target $cur) -ne $wantNorm) {
                Set-ItemProperty -LiteralPath ('IIS:\Sites' + [char]92 + $s.Name) -name logFile.logTargetW3C -value $wantTarget
                $changed = $true
            }
        }
        $cfFilter = 'system.applicationHost/sites/siteDefaults/logFile/customFields'
        # PS 5.1: `@(pipeline | ConvertFrom-Json)` wraps a JSON array as ONE jagged element (member
        # enumeration then makes $f.field an array -> DISP_E_TYPEMISMATCH on Add). Assign the command
        # result first, THEN @() it, so each $f is a scalar-valued object. (validation repair.)
        $parsed = ConvertFrom-Json $env:CUSTOM_FIELDS
        $want = @($parsed)
        foreach ($f in $want) {
            $existing = @(Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -filter ($cfFilter + '/add') -name '.' | Where-Object { $_.logFieldName -eq $f.field })
            $exact = @($existing | Where-Object { $_.sourceName -eq $f.source -and $_.sourceType -eq $f.source_type })
            if ($exact.Count -eq 0) {
                if ($existing.Count -gt 0) {
                    Remove-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -filter $cfFilter -name '.' -AtElement @{ logFieldName = $f.field }
                }
                Add-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -filter $cfFilter -name '.' -value @{ logFieldName = $f.field; sourceName = $f.source; sourceType = $f.source_type }
                $changed = $true
            }
        }
        $sdAfter = Normalize-Target ([string](Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name logTargetW3C))
        if ($sdAfter -ne $wantNorm) {
            throw ('logTargetW3C did not persist on siteDefaults: got ' + $sdAfter)
        }
        $after = @(Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -filter ($cfFilter + '/add') -name '.')
        foreach ($f in $want) {
            $ok = @($after | Where-Object { $_.logFieldName -eq $f.field -and $_.sourceName -eq $f.source -and $_.sourceType -eq $f.source_type })
            if ($ok.Count -eq 0) {
                throw ('custom field did not persist: ' + $f.field)
            }
        }
        if ($changed) {
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        LOG_TARGET: '{{ config.iis.log_target_w3c }}'
        CUSTOM_FIELDS: '{{ config.iis.custom_log_fields | to_json }}'
      register: __iis_log_hardening__
      changed_when: "__iis_log_hardening__.stdout | trim == 'changed'"

    #endregion --- [ Main: IIS Logging + Relocation ] ------------------------------------- #

    #region ------ [ Main: Observability ] ------------------------------------------------- #

    # Deploy pre-built Event Viewer custom views for meaningful operational visibility into the services.
    # Event Viewer reads %ProgramData%\Microsoft\Event Viewer\Views\*.xml at startup (the folder exists on a
    # fresh server); the views appear under "Custom Views" on the next open. Static XML, win_copy is
    # checksum-idempotent. C13h.
    - name: 'MAIN | Ensure Event Viewer Views Directory'
      ansible.windows.win_file:
        path: 'C:\ProgramData\Microsoft\Event Viewer\Views'
        state: directory

    - name: 'MAIN | Deploy WSUS/IIS/WID Event Viewer Custom Views'
      ansible.windows.win_copy:
        src: 'eventviewer/{{ item }}'
        dest: 'C:\ProgramData\Microsoft\Event Viewer\Views\{{ item }}'
      loop: ['WSUS.xml', 'IIS-WsusPool.xml', 'WID-SUSDB.xml']
      loop_control:
        label: '{{ item }}'

    # Enable the IIS-Configuration Operational channel via the native EventLogConfiguration API (no wevtutil
    # string-parsing). Guard on BOTH IsEnabled AND MaximumSizeInBytes so an already-enabled-but-wrong-size
    # channel still converges; re-acquire + verify. Gated on iis.config_channel_enabled so a host can opt out.
    # §8 win_shell (channel state has no native module). C13i.
    - name: 'MAIN | Enable IIS Configuration Operational Event Channel'
      when: config.iis.config_channel_enabled | bool
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $ch = $env:CHANNEL
        $wantBytes = [long]$env:MAX_BYTES
        $cfg = New-Object System.Diagnostics.Eventing.Reader.EventLogConfiguration $ch
        if ((-not $cfg.IsEnabled) -or ($cfg.MaximumSizeInBytes -ne $wantBytes)) {
            $cfg.IsEnabled = $true
            $cfg.MaximumSizeInBytes = $wantBytes
            $cfg.SaveChanges()
            $c2 = New-Object System.Diagnostics.Eventing.Reader.EventLogConfiguration $ch
            if ((-not $c2.IsEnabled) -or ($c2.MaximumSizeInBytes -ne $wantBytes)) {
                throw ('channel ' + $ch + ' did not persist: enabled=' + $c2.IsEnabled + ' bytes=' + $c2.MaximumSizeInBytes)
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        CHANNEL: 'Microsoft-IIS-Configuration/Operational'
        MAX_BYTES: '{{ config.iis.config_channel_max_bytes }}'
      register: __iis_config_channel__
      changed_when: "__iis_config_channel__.stdout | trim == 'changed'"

    #endregion --- [ Main: Observability ] ------------------------------------------------- #

#endregion --- [ Script ] -------------------------------------------------------------------- #
