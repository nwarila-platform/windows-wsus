# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Complete install and configuration path for the wsus role on the Windows family (resolved by
# the v3 loader via first_found). Receives the merged running configuration as 'config'.
#
# Disk provisioning is delegated to aws_windows_disk_manager, which the playbook runs first. The wsus
# role builds WID and WSUS content paths from the database and content letters; its IIS letter
# anchors both literal IIS paths. The playbook feeds both roles one shared layout, and this role's
# independently reusable configuration invariants are enforced in tasks/validate.yml.
#
# =========================================================================================== #
---
#region ------ [ Script ] -------------------------------------------------------------------- #

- name: 'MAIN | Resolve The Windows System Drive'
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $systemDrive = [string]$env:SystemDrive

    if ($systemDrive -notmatch '^[A-Za-z]:$') {
        throw "The process SystemDrive value is missing or invalid: [$systemDrive]"
    }

    $systemDrive.ToUpperInvariant()
  register: __wsus_system_drive__
  changed_when: false

- name: 'INFO | Entering OS Tasks (present_windows - wsus)'
  vars:
    # Application paths derive from the same layout the playbook passes to the disk manager.
    __content_dir__: "{{ config.data_disks.content.drive_letter }}:\\{{ config.content_subdir }}"
    __wid_data_dir__: "{{ config.data_disks.db.drive_letter }}:\\{{ config.db_subdir }}"
    # WID instance's fixed default data directory under %SystemDrive% (MS-specified; SUSDB installs
    # here — measured on the target). Derived from the explicit read-only probe above, NOT literal
    # C: and NOT from db_subdir (which names the configurable E: TARGET; the source is fixed by WID).
    __wid_source_dir__: "{{ __wsus_system_drive__.stdout | trim }}\\Windows\\WID\\Data"
    # Fixed WID master named-pipe connection string (architectural constant: the WID instance pipe is
    # MICROSOFT##WID; named pipes are case-insensitive). Env-passed (WID_CONN) to the SqlClient blocks so the
    # literal is defined once and no raw \\.\pipe\ backslashes sit in PowerShell source (split_args-safety).
    __wid_conn_master__: 'server=\\.\pipe\MICROSOFT##WID\tsql\query;database=master;trusted_connection=true;'
    # The four 'Installed Role Services' completion flags written at the END of each postinstall component
    # (measured =2). Hoisted to block scope (C14a) so the C05 postinstall gate AND the C14a
    # data-loss interlock consume ONE derivation — a second, divergent copy would be a latent inconsistency.
    # Block vars are lazily evaluated, so referencing the mid-block register is fine.
    __postinstall_flags__: >-
      {{
        ['UpdateServices-API', 'UpdateServices-Services', 'UpdateServices-UI', 'UpdateServices-WidDatabase']
        | map('extract', __wsus_postinstall_probe__.properties | default({}), 'value')
        | map('default', 0)
        | list
      }}
    # wsusutil configuressl makes a bare Get-WsusServer follow the client-facing DNS name.
    # Every API actor therefore goes through one process-scoped loopback connection primitive:
    # pre-SSL it preserves the cmdlet's local default; post-SSL it uses Microsoft's explicit
    # 127.0.0.1:port form and accepts only the certificate currently bound to that exact local
    # listener. The caller's callback is restored even when the API operation fails. This keeps
    # the role independent of external DNS and machine trust-store mutation on every converge.
    __wsus_api_invoker__: |
      function Invoke-LocalWsusApi {
          param(
              [Parameter(Mandatory = $true)]
              [scriptblock]$Operation
          )
          $setupPath = 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup'
          $setup = Get-ItemProperty -Path $setupPath -ErrorAction Stop
          $usingSsl = [int]$setup.UsingSSL
          if ($usingSsl -eq 0) {
              $server = Get-WsusServer -ErrorAction Stop
              return (& $Operation $server)
          }
          if ($usingSsl -ne 1) {
              throw ('WSUS Setup UsingSSL must be 0 or 1, got [' + $setup.UsingSSL + ']')
          }
          $port = [int]$setup.PortNumber
          if ($port -lt 1 -or $port -gt 65535) {
              throw ('WSUS Setup PortNumber is invalid: [' + $setup.PortNumber + ']')
          }
          Import-Module WebAdministration
          $bindingPath = 'IIS:\SslBindings\0.0.0.0!' + $port
          $binding = Get-Item -LiteralPath $bindingPath -ErrorAction Stop
          $boundThumbprint = ([string]$binding.Thumbprint).Replace(' ', '').ToUpperInvariant()
          if ($boundThumbprint -notmatch '^[0-9A-F]{40}$') {
              throw ('WSUS local HTTPS binding has an invalid certificate thumbprint: [' +
                  $binding.Thumbprint + ']')
          }
          $previousCallback = [System.Net.ServicePointManager]::ServerCertificateValidationCallback
          try {
              $pinnedCallback = {
                  param($sender, $certificate, $chain, $errors)
                  if ($null -eq $certificate) { return $false }
                  return [string]::Equals(
                      $certificate.GetCertHashString().Replace(' ', ''),
                      $boundThumbprint,
                      [System.StringComparison]::OrdinalIgnoreCase)
              }.GetNewClosure()
              [System.Net.ServicePointManager]::ServerCertificateValidationCallback =
                  [System.Net.Security.RemoteCertificateValidationCallback]$pinnedCallback
              $server = Get-WsusServer -Name '127.0.0.1' -PortNumber $port -UseSsl -ErrorAction Stop
              return (& $Operation $server)
          } finally {
              [System.Net.ServicePointManager]::ServerCertificateValidationCallback = $previousCallback
          }
      }
    # The persisted WSUS SSL mode determines whether API actors need the HTTPS listener now.
    # Run this primitive before the first actor so a drifted post-SSL host can repair itself, and
    # again immediately after configuressl so a fresh transition to SSL activates before proof.
    # UsingSSL=0 repairs only the existing HTTP runtime so an interrupted TLS transition cannot
    # strand the next converge before its API actors; HTTPS binding/certificate work stays gated.
    __wsus_https_listener_reconciler__: |
      function Invoke-LocalWsusHttpsListenerReconcile {
          $setupPath = 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup'
          $setup = Get-ItemProperty -Path $setupPath -ErrorAction Stop
          $usingSslText = [string]$setup.UsingSSL
          if ($usingSslText -notmatch '^[01]$') {
              throw ('WSUS Setup UsingSSL must be 0 or 1, got [' + $setup.UsingSSL + ']')
          }
          $usingSsl = [int]$usingSslText

          $portText = [string]$setup.PortNumber
          if ($portText -notmatch '^[0-9]{1,5}$') {
              throw ('WSUS Setup PortNumber is invalid: [' + $setup.PortNumber + ']')
          }
          $port = [int]$portText
          if ($port -lt 1 -or $port -gt 65535) {
              throw ('WSUS Setup PortNumber is invalid: [' + $setup.PortNumber + ']')
          }
          Import-Module WebAdministration
          $siteName = 'WSUS Administration'
          $sitePath = Join-Path 'IIS:\Sites' $siteName
          $changed = $false

          if (-not (Test-Path -LiteralPath $sitePath)) {
              throw ('required IIS site is absent: ' + $siteName)
          }

          function Get-WsusSiteState {
              return [string](Get-WebItemState -PSPath $sitePath -ErrorAction Stop).Value
          }

          function Get-IisBindingsAtPort([int]$listenerPort) {
              $records = @()
              foreach ($configuredSite in @(Get-Website -ErrorAction Stop)) {
                  foreach ($configuredBinding in @(Get-WebBinding -Name $configuredSite.Name -ErrorAction Stop)) {
                      $bindingInformation = [string]$configuredBinding.bindingInformation
                      # HTTP(S) uses ip:port:host.  Match from the right so bracketed or bare IPv6
                      # addresses cannot move the port field; retain a fallback for other IIS
                      # protocols whose bindingInformation begins with the numeric port.
                      $portMatch = [regex]::Match(
                          $bindingInformation,
                          '^(?<address>.*):(?<port>[0-9]{1,5}):(?<host>.*)$'
                      )
                      if (-not $portMatch.Success) {
                          $portMatch = [regex]::Match($bindingInformation, '^(?<port>[0-9]{1,5})(?::|$)')
                      }
                      if ($portMatch.Success -and [int]$portMatch.Groups['port'].Value -eq $listenerPort) {
                          $records += [pscustomobject]@{
                              Site = [string]$configuredSite.Name
                              Protocol = [string]$configuredBinding.protocol
                              BindingInformation = $bindingInformation
                              Port = [int]$portMatch.Groups['port'].Value
                              SslFlags = [string]$configuredBinding.sslFlags
                          }
                      }
                  }
              }
              return @($records)
          }

          function Assert-WsusPortExclusive([int]$listenerPort) {
              $portBindings = @(Get-IisBindingsAtPort $listenerPort)
              $foreign = @($portBindings | Where-Object {
                  -not [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
              })
              if ($foreign.Count -gt 0) {
                  $owners = @($foreign | ForEach-Object {
                      $_.Site + '|' + $_.Protocol + '|' + $_.BindingInformation + '|sslFlags=' + $_.SslFlags
                  })
                  throw ('target WSUS port is owned by another IIS site; refusing mutation/start: port=' +
                      $listenerPort + ' foreignBindings=[' + ($owners -join ';') + ']')
              }
          }

          function Test-WsusOwnedPortBindingsNormalized([int]$listenerPort) {
              $portBindings = @(Get-IisBindingsAtPort $listenerPort)
              $owned = @($portBindings | Where-Object {
                  [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
              })
              $desiredBinding = '*:' + $listenerPort + ':'
              $desired = @($owned | Where-Object {
                  [string]::Equals($_.Protocol, 'https', [System.StringComparison]::OrdinalIgnoreCase) -and
                  [string]::Equals($_.BindingInformation, $desiredBinding, [System.StringComparison]::Ordinal)
              })
              return $owned.Count -eq 1 -and $desired.Count -eq 1 -and
                  [int]($desired[0].SslFlags) -eq 0
          }

          function Stop-WsusWebsiteBounded([string]$reason) {
              $stopIssued = $false
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                  $currentState = Get-WsusSiteState
                  if ($currentState -eq 'Stopped') {
                      return
                  }
                  if ($currentState -eq 'Started' -and -not $stopIssued) {
                      Stop-Website -Name $siteName -ErrorAction Stop | Out-Null
                      $stopIssued = $true
                  } elseif ($currentState -ne 'Started' -and
                      $currentState -ne 'Starting' -and $currentState -ne 'Stopping') {
                      throw ('WSUS IIS site has an unsafe state while stopping for ' +
                          $reason + ': ' + $currentState)
                  }
                  Start-Sleep -Milliseconds 500
              }
              throw ('WSUS IIS site did not stop within 10 seconds for ' + $reason +
                  '; state=' + (Get-WsusSiteState))
          }

          function Get-OrRepairCurrentSslMapping([int]$listenerPort) {
              $sslPath = 'IIS:\SslBindings\0.0.0.0!' + $listenerPort
              $bound = Get-Item $sslPath -ErrorAction SilentlyContinue
              if ($bound) {
                  $currentThumbprint = ([string]$bound.Thumbprint).Replace(' ', '').ToUpperInvariant()
                  if ($currentThumbprint -match '^[0-9A-F]{40}$') {
                      $certificatePath = Join-Path 'Cert:\LocalMachine\My' $currentThumbprint
                      $certificate = Get-Item $certificatePath -ErrorAction SilentlyContinue
                      if ($certificate -and $certificate.HasPrivateKey) {
                          # Preserve the currently serving certificate here.  It may intentionally
                          # be the old leaf during a reviewed rotation; the later artifact-backed
                          # transaction moves the endpoint to the new configured pin.
                          return [pscustomobject]@{
                              Path = $sslPath
                              Thumbprint = $currentThumbprint
                              Certificate = $certificate
                              Changed = $false
                          }
                      }
                  }
              }

              # A missing/broken map can be recovered without weakening trust when the exact
              # reviewed leaf is already present with its private key. This covers interruption
              # after an earlier provider-map removal. If the trusted leaf is also absent, fail
              # closed; artifact delivery remains the only authority that may restore it.
              $recoveryThumbprint = '{{ config.tls.thumbprint | trim | upper }}'
              if ($recoveryThumbprint -notmatch '^[0-9A-F]{40}$') {
                  throw ('configured TLS recovery thumbprint is invalid: [' + $recoveryThumbprint + ']')
              }
              $recoveryPath = Join-Path 'Cert:\LocalMachine\My' $recoveryThumbprint
              $recoveryCertificate = Get-Item $recoveryPath -ErrorAction SilentlyContinue
              if (-not $recoveryCertificate -or -not $recoveryCertificate.HasPrivateKey) {
                  throw ('current SSL mapping is unusable and the exact pinned recovery leaf with ' +
                      'a private key is absent: mapping=' + $sslPath + ' certificate=' + $recoveryPath)
              }

              Assert-WsusPortExclusive $listenerPort
              Stop-WsusWebsiteBounded 'pre-API SSL mapping recovery'
              Assert-WsusPortExclusive $listenerPort
              $bound = Get-Item $sslPath -ErrorAction SilentlyContinue
              if ($bound) {
                  Remove-Item $sslPath -ErrorAction Stop
              }
              Assert-WsusPortExclusive $listenerPort
              New-Item $sslPath -Value $recoveryCertificate | Out-Null
              Assert-WsusPortExclusive $listenerPort
              $verify = Get-Item $sslPath -ErrorAction Stop
              if (-not [string]::Equals(
                  [string]$verify.Thumbprint,
                  $recoveryThumbprint,
                  [System.StringComparison]::OrdinalIgnoreCase
              )) {
                  throw ('pre-API SSL mapping recovery did not persist thumbprint ' +
                      $recoveryThumbprint)
              }
              return [pscustomobject]@{
                  Path = $sslPath
                  Thumbprint = $recoveryThumbprint
                  Certificate = $recoveryCertificate
                  Changed = $true
              }
          }

          function Repair-WsusOwnedPortBindings([int]$listenerPort) {
              Assert-WsusPortExclusive $listenerPort
              if (Test-WsusOwnedPortBindingsNormalized $listenerPort) {
                  return $false
              }

              $mapping = Get-OrRepairCurrentSslMapping $listenerPort

              # This role owns only the target-port bindings on its own site.  Normalize that
              # drift while the site is stopped; a foreign site's ownership remains fail-closed.
              Stop-WsusWebsiteBounded 'owned target-port binding repair'
              Assert-WsusPortExclusive $listenerPort

              $owned = @(Get-IisBindingsAtPort $listenerPort | Where-Object {
                  [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
              })
              foreach ($ownedBinding in $owned) {
                  Remove-WebBinding -Name $siteName -Protocol $ownedBinding.Protocol `
                      -BindingInformation $ownedBinding.BindingInformation -ErrorAction Stop `
                      -Confirm:$false | Out-Null
              }
              New-WebBinding -Name $siteName -Protocol https -Port $listenerPort `
                  -IPAddress '*' -SslFlags 0 | Out-Null

              # Binding recreation may discard the provider mapping.  Restore the exact mapping
              # from the validated pre-mutation certificate and prove it before any site start.
              $boundAfter = Get-Item $mapping.Path -ErrorAction SilentlyContinue
              if (-not $boundAfter -or -not [string]::Equals(
                  [string]$boundAfter.Thumbprint,
                  $mapping.Thumbprint,
                  [System.StringComparison]::OrdinalIgnoreCase
              )) {
                  if ($boundAfter) {
                      Assert-WsusPortExclusive $listenerPort
                      Remove-Item $mapping.Path -ErrorAction Stop
                  }
                  Assert-WsusPortExclusive $listenerPort
                  New-Item $mapping.Path -Value $mapping.Certificate | Out-Null
              }
              Assert-WsusPortExclusive $listenerPort
              $verifyMapping = Get-Item $mapping.Path -ErrorAction Stop
              if (-not [string]::Equals(
                  [string]$verifyMapping.Thumbprint,
                  $mapping.Thumbprint,
                  [System.StringComparison]::OrdinalIgnoreCase
              )) {
                  throw ('WSUS-owned binding repair did not preserve SSL thumbprint ' + $mapping.Thumbprint)
              }

              Assert-WsusPortExclusive $listenerPort
              if (-not (Test-WsusOwnedPortBindingsNormalized $listenerPort)) {
                  $actual = @(Get-IisBindingsAtPort $listenerPort | Where-Object {
                      [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
                  } | ForEach-Object {
                      $_.Site + '|' + $_.Protocol + '|' + $_.BindingInformation + '|sslFlags=' + $_.SslFlags
                  })
                  throw ('WSUS-owned target-port binding repair did not persist: [' + ($actual -join ';') + ']')
              }
              return $true
          }

          function Limit-DiagnosticText($value, [int]$maxLength) {
              $text = ([string]$value -replace '[\r\n\t]+', ' ').Trim()
              if ($text.Length -le $maxLength) {
                  return $text
              }
              $omitted = $text.Length - $maxLength
              return ($text.Substring(0, $maxLength) + '...[truncated ' + $omitted + ' chars]')
          }

          function Format-ExceptionChain([System.Exception]$exception) {
              $parts = @()
              $current = $exception
              while ($null -ne $current) {
                  $signedHResult = [int64]$current.HResult
                  $unsignedHResult = $signedHResult -band 4294967295
                  $parts += ($current.GetType().FullName + '|hresult=' + $signedHResult +
                      '|hex=' + ('0x{0:X8}' -f $unsignedHResult) + '|message=' +
                      (Limit-DiagnosticText $current.Message 512))
                  $current = $current.InnerException
              }
              return ($parts -join ' -> ')
          }

          function Invoke-NetshCapture([string[]]$netshArguments) {
              $netsh = Join-Path $env:SystemRoot 'System32\netsh.exe'
              $savedPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'Continue'
                  $output = @(& $netsh $netshArguments 2>&1)
                  $exitCode = $LASTEXITCODE
              } finally {
                  $ErrorActionPreference = $savedPreference
              }
              return [pscustomobject]@{
                  ExitCode = $exitCode
                  Text = (($output | ForEach-Object { [string]$_ }) -join ' ').Trim()
              }
          }

          function Test-HttpSysPortRegistration([string]$serviceState, [int]$listenerPort) {
              $pattern = '(?i)https?://[^\s]*:' + [regex]::Escape([string]$listenerPort) + '(?:/|\s|$)'
              return [regex]::IsMatch($serviceState, $pattern)
          }

          function Test-AlreadyExistsHResult([System.Exception]$exception) {
              $current = $exception
              while ($null -ne $current) {
                  if ([int64]$current.HResult -eq -2147024713) {
                      return $true
                  }
                  $current = $current.InnerException
              }
              return $false
          }

          function Get-WsusListenerFailureDetails([int]$listenerPort) {
              $allBindings = @()
              foreach ($configuredSite in @(Get-Website -ErrorAction SilentlyContinue)) {
                  foreach ($configuredBinding in @(Get-WebBinding -Name $configuredSite.Name -ErrorAction SilentlyContinue)) {
                      $allBindings += ($configuredSite.Name + '|' + [string]$configuredBinding.protocol + '|' +
                          [string]$configuredBinding.bindingInformation + '|sslFlags=' +
                          [string]$configuredBinding.sslFlags)
                  }
              }
              $ssl = Invoke-NetshCapture @('http', 'show', 'sslcert', ('ipport=0.0.0.0:' + $listenerPort))
              $ipListen = Invoke-NetshCapture @('http', 'show', 'iplisten')
              $serviceState = Invoke-NetshCapture @('http', 'show', 'servicestate', 'view=requestq', 'verbose=yes')
              $events = @(
                  Get-WinEvent -FilterHashtable @{
                      LogName = 'System'
                      StartTime = (Get-Date).AddMinutes(-15)
                  } -ErrorAction SilentlyContinue |
                      Where-Object { [string]$_.ProviderName -match '(?i)(WAS|W3SVC|HttpEvent)' } |
                      Select-Object -First 12 |
                      ForEach-Object {
                          ([string]$_.TimeCreated + '|' + [string]$_.ProviderName + '|' +
                              [string]$_.Id + '|' + (Limit-DiagnosticText $_.Message 512))
                      }
              )
              $w3svcState = [string](Get-Service -Name W3SVC -ErrorAction SilentlyContinue).Status
              return ('siteState=' + (Get-WsusSiteState) + ' port=' + $listenerPort +
                  ' W3SVC=' + $w3svcState + ' allBindings=[' +
                  (Limit-DiagnosticText ($allBindings -join ';') 2048) +
                  '] httpSysSsl=[exitCode=' + $ssl.ExitCode + ' ' + (Limit-DiagnosticText $ssl.Text 2048) +
                  '] httpSysIpListen=[exitCode=' + $ipListen.ExitCode + ' ' +
                  (Limit-DiagnosticText $ipListen.Text 2048) +
                  '] httpSysServiceState=[exitCode=' + $serviceState.ExitCode + ' ' +
                  (Limit-DiagnosticText $serviceState.Text 4096) +
                  '] recentWasW3svcHttpEvents=[' + (Limit-DiagnosticText ($events -join ';') 4096) + ']')
          }

          function Get-WsusListenerFailureDetailsSafe([int]$listenerPort, [int]$maxLength) {
              try {
                  return Limit-DiagnosticText (Get-WsusListenerFailureDetails $listenerPort) $maxLength
              } catch {
                  return ('diagnosticFailure=[' +
                      (Limit-DiagnosticText (Format-ExceptionChain $_.Exception) 2048) + ']')
              }
          }

          function Start-WsusWebsiteBounded([int]$listenerPort, [bool]$requireHttpsContract) {
              $sawAlreadyExists = $false
              $lastAlreadyExists = ''
              $firstAlreadyExistsEvidence = ''
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                  Assert-WsusPortExclusive $listenerPort
                  if ($requireHttpsContract -and
                      -not (Test-WsusOwnedPortBindingsNormalized $listenerPort)) {
                      $actual = @(Get-IisBindingsAtPort $listenerPort | Where-Object {
                          [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
                      } | ForEach-Object {
                          $_.Site + '|' + $_.Protocol + '|' + $_.BindingInformation +
                              '|sslFlags=' + $_.SslFlags
                      })
                      throw ('WSUS site target-port bindings became unnormalized before start: [' +
                          ($actual -join ';') + ']')
                  }
                  $currentState = Get-WsusSiteState
                  if ($currentState -eq 'Started') {
                      return
                  }
                  if ($currentState -eq 'Starting' -or $currentState -eq 'Stopping') {
                      Start-Sleep -Milliseconds 500
                      continue
                  }
                  if ($currentState -ne 'Stopped') {
                      throw ('WSUS IIS site has an unsafe state before start: ' + $currentState)
                  }

                  # ERROR_ALREADY_EXISTS may mean an earlier asynchronous start still owns the
                  # HTTP.sys URL group.  Do not issue another start until that registration either
                  # becomes a concurrently successful Started site or drains completely.
                  if ($sawAlreadyExists) {
                      $requestQueues = Invoke-NetshCapture @(
                          'http', 'show', 'servicestate', 'view=requestq', 'verbose=yes'
                      )
                      if ($requestQueues.ExitCode -ne 0) {
                          throw ('cannot prove HTTP.sys request-queue ownership before retry: ' +
                              (Get-WsusListenerFailureDetailsSafe $listenerPort 8192))
                      }
                      if (Test-HttpSysPortRegistration $requestQueues.Text $listenerPort) {
                          Start-Sleep -Milliseconds 500
                          continue
                      }
                  }

                  try {
                      Start-Website -Name $siteName -ErrorAction Stop | Out-Null
                  } catch {
                      if (-not (Test-AlreadyExistsHResult $_.Exception)) {
                          throw ('Start-Website failed with a non-retryable exception: exceptions=[' +
                              (Format-ExceptionChain $_.Exception) + '] ' +
                              (Get-WsusListenerFailureDetailsSafe $listenerPort 8192))
                      }
                      if (-not $sawAlreadyExists) {
                          $firstAlreadyExistsEvidence = Get-WsusListenerFailureDetailsSafe $listenerPort 6144
                      }
                      $sawAlreadyExists = $true
                      $lastAlreadyExists = Format-ExceptionChain $_.Exception
                  }
                  Start-Sleep -Milliseconds 500
              }

              if ((Get-WsusSiteState) -eq 'Started') {
                  return
              }
              throw ('WSUS IIS site start did not settle within 10 seconds; lastAlreadyExists=[' +
                  $lastAlreadyExists + '] firstAlreadyExistsEvidence=[' + $firstAlreadyExistsEvidence +
                  '] finalEvidence=[' + (Get-WsusListenerFailureDetailsSafe $listenerPort 6144) + ']')
          }

          function Test-LoopbackListener([int]$listenerPort) {
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                  $connect = $client.ConnectAsync('127.0.0.1', $listenerPort)
                  $completed = $connect.Wait(1000)
                  return $completed -and $client.Connected
              } catch {
                  return $false
              } finally {
                  $client.Dispose()
              }
          }

          function New-WsusServerManager {
              $os64 = [System.Environment]::Is64BitOperatingSystem
              $process64 = [System.Environment]::Is64BitProcess
              $powerShellVersion = [string]$PSVersionTable.PSVersion
              $powerShellEdition = [string]$PSVersionTable.PSEdition
              $assemblyPath = '<loaded-assembly-not-resolved>'
              $runtimeContext = 'assembly=[' + $assemblyPath + '] os64=[' + $os64 +
                  '] process64=[' + $process64 + '] powershell=[' + $powerShellVersion +
                  '] edition=[' + $powerShellEdition + ']'
              if (-not $process64) {
                  throw ('64-bit PowerShell is required for IIS management: ' + $runtimeContext)
              }
              $typeName = 'Microsoft.Web.Administration.ServerManager'

              function Resolve-LoadedWsusServerManagerType([string]$requestedTypeName) {
                  foreach ($loadedAssembly in [System.AppDomain]::CurrentDomain.GetAssemblies()) {
                      if ($loadedAssembly.GetName().Name -ne 'Microsoft.Web.Administration') {
                          continue
                      }
                      $candidateType = $loadedAssembly.GetType(
                          $requestedTypeName, $false, $false)
                      if ($null -ne $candidateType) {
                          return $candidateType
                      }
                  }
                  return $null
              }

              try {
                  $serverManagerType = Resolve-LoadedWsusServerManagerType $typeName
              } catch {
                  throw ('Unable to inspect loaded IIS management assemblies: ' + $runtimeContext +
                      ' errorId=[' + [string]$_.FullyQualifiedErrorId + '] exception=[' +
                      $_.Exception.ToString() + ']')
              }
              if ($null -eq $serverManagerType) {
                  $windowsDirectory = [string]$env:WINDIR
                  if ([string]::IsNullOrWhiteSpace($windowsDirectory)) {
                      throw ('WINDIR is unavailable; cannot locate the IIS management assembly: ' +
                          $runtimeContext)
                  }
                  $assemblyPath = Join-Path $windowsDirectory `
                      'System32\inetsrv\Microsoft.Web.Administration.dll'
                  $runtimeContext = 'assembly=[' + $assemblyPath + '] os64=[' + $os64 +
                      '] process64=[' + $process64 + '] powershell=[' + $powerShellVersion +
                      '] edition=[' + $powerShellEdition + ']'
                  if (-not (Test-Path -LiteralPath $assemblyPath -PathType Leaf)) {
                      throw ('IIS management assembly is absent: ' + $runtimeContext)
                  }
                  try {
                      $null = Add-Type -LiteralPath $assemblyPath -ErrorAction Stop
                      $serverManagerType = Resolve-LoadedWsusServerManagerType $typeName
                  } catch {
                      throw ('Unable to load or resolve IIS management assembly: ' +
                          $runtimeContext + ' errorId=[' + [string]$_.FullyQualifiedErrorId +
                          '] exception=[' + $_.Exception.ToString() + ']')
                  }
              }
              if ($null -eq $serverManagerType) {
                  throw ('IIS management TypeNotFound: type=' + $typeName + ' ' + $runtimeContext)
              }
              $loadedAssemblyPath = [string]$serverManagerType.Assembly.Location
              if (-not [string]::IsNullOrWhiteSpace($loadedAssemblyPath)) {
                  $assemblyPath = $loadedAssemblyPath
              }
              $runtimeContext = 'assembly=[' + $assemblyPath + '] os64=[' + $os64 +
                  '] process64=[' + $process64 + '] powershell=[' + $powerShellVersion +
                  '] edition=[' + $powerShellEdition + ']'
              try {
                  $serverManager = [System.Activator]::CreateInstance($serverManagerType)
              } catch {
                  throw ('Unable to construct IIS ServerManager: ' + $runtimeContext +
                      ' errorId=[' + [string]$_.FullyQualifiedErrorId + '] exception=[' +
                      $_.Exception.ToString() + ']')
              }
              if ($null -eq $serverManager) {
                  throw ('IIS ServerManager construction returned null: ' + $runtimeContext)
              }
              return $serverManager
          }

          function Get-WsusAccessSslState([string]$location) {
              $serverManager = New-WsusServerManager
              try {
                  $configuration = $serverManager.GetApplicationHostConfiguration()
                  $section = $configuration.GetSection(
                      'system.webServer/security/access', $location)
                  if ($null -eq $section) {
                      throw ('IIS returned no access section for ' + $location)
                  }
                  $attribute = $section.GetAttribute('sslFlags')
                  if ($null -eq $attribute) {
                      throw ('IIS returned no access.sslFlags attribute for ' + $location)
                  }
                  $value = $attribute.Value
                  $valueText = '<null>'
                  $valueType = '<null>'
                  if ($null -ne $value) {
                      $valueText = ([string]$value).Trim()
                      $valueType = $value.GetType().FullName
                  }
                  return [pscustomobject]@{
                      Location = $location
                      Text = $valueText
                      Type = $valueType
                  }
              } finally {
                  [void]$serverManager.Dispose()
              }
          }

          function Set-WsusAccessSslValue([string]$location, [string]$desiredValue) {
              $serverManager = New-WsusServerManager
              try {
                  $configuration = $serverManager.GetApplicationHostConfiguration()
                  $section = $configuration.GetSection(
                      'system.webServer/security/access', $location)
                  if ($null -eq $section) {
                      throw ('IIS returned no access section for ' + $location)
                  }
                  if ($null -eq $section.GetAttribute('sslFlags')) {
                      throw ('IIS returned no access.sslFlags attribute for ' + $location)
                  }
                  [void]$section.SetAttributeValue('sslFlags', $desiredValue)
                  [void]$serverManager.CommitChanges()
              } finally {
                  [void]$serverManager.Dispose()
              }
          }

          function Repair-PreSslWsusApiAccess {
              # Microsoft requires these five WSUS web services to require SSL before
              # configuressl persists UsingSSL=1.  If a run is interrupted between those
              # operations, the next pre-API pass still selects HTTP.  Roll back only that
              # incomplete transition so the HTTP API remains reachable and can converge again.
              $sslRequiredVdirs = @(
                  'ApiRemoting30',
                  'ClientWebService',
                  'DSSAuthWebService',
                  'ServerSyncWebService',
                  'SimpleAuthWebService'
              )
              $repaired = $false
              foreach ($name in $sslRequiredVdirs) {
                  $location = $siteName + '/' + $name
                  $beforeWrite = Get-WsusAccessSslState $location
                  if ($beforeWrite.Text -ne 'None' -and $beforeWrite.Text -ne '0') {
                      Set-WsusAccessSslValue $location 'None'
                      $afterWrite = Get-WsusAccessSslState $location
                      if ($afterWrite.Text -ne 'None' -and $afterWrite.Text -ne '0') {
                          throw ('pre-SSL WSUS API access rollback write did not persist at ' +
                              $location + ': sslFlags=[' + $afterWrite.Text + '] type=[' +
                              $afterWrite.Type + '] expected=[None|0]')
                      }
                      $repaired = $true
                  }
              }
              foreach ($name in $sslRequiredVdirs) {
                  $location = $siteName + '/' + $name
                  $state = Get-WsusAccessSslState $location
                  if ($state.Text -ne 'None' -and $state.Text -ne '0') {
                      throw ('pre-SSL WSUS API access rollback did not persist at ' +
                          $location + ': sslFlags=[' + $state.Text + '] type=[' +
                          $state.Type + '] expected=[None|0]')
                  }
              }
              return $repaired
          }

          if ($usingSsl -eq 1) {
              Assert-WsusPortExclusive $port
              $currentSslMapping = Get-OrRepairCurrentSslMapping $port
              if ([System.Convert]::ToBoolean($currentSslMapping.Changed)) {
                  $changed = $true
              }
              if (Repair-WsusOwnedPortBindings $port) {
                  $changed = $true
              }
          }

          $site = Get-Item -LiteralPath $sitePath -ErrorAction Stop
          if (-not [System.Convert]::ToBoolean($site.serverAutoStart)) {
              Set-ItemProperty -LiteralPath $sitePath -Name serverAutoStart -Value $true | Out-Null
              $changed = $true
              # A live IIS configuration commit can be consumed asynchronously by WAS.  Give that
              # reconciliation a bounded chance to start the site before issuing an explicit start.
              for ($attempt = 0; $attempt -lt 10; $attempt++) {
                  $siteState = Get-WsusSiteState
                  if ($siteState -eq 'Started') {
                      break
                  }
                  if (@('Stopped', 'Starting', 'Stopping') -notcontains $siteState) {
                      throw ('WSUS IIS site has an unsafe state after serverAutoStart repair: ' + $siteState)
                  }
                  Start-Sleep -Milliseconds 500
              }
          }

          Assert-WsusPortExclusive $port
          if ($usingSsl -eq 0) {
              if (Repair-PreSslWsusApiAccess) {
                  $changed = $true
              }
              $httpBindings = @(Get-IisBindingsAtPort $port | Where-Object {
                  [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase) -and
                  [string]::Equals($_.Protocol, 'http', [System.StringComparison]::OrdinalIgnoreCase)
              })
              if ($httpBindings.Count -ne 1) {
                  $httpBindingDescriptions = @($httpBindings | ForEach-Object {
                      $_.Site + '|' + $_.Protocol + '|' + $_.BindingInformation
                  })
                  throw ('pre-SSL WSUS runtime does not have exactly one owned HTTP binding at port ' +
                      $port + '; actual=[' + ($httpBindingDescriptions -join ';') + ']')
              }
              $siteState = Get-WsusSiteState
              if ($siteState -ne 'Started') {
                  Start-WsusWebsiteBounded $port $false
                  $changed = $true
              }
              $httpReady = $false
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                  $siteState = Get-WsusSiteState
                  if ($siteState -eq 'Started' -and (Test-LoopbackListener $port)) {
                      $httpReady = $true
                      break
                  }
                  Start-Sleep -Milliseconds 500
              }
              if (-not $httpReady) {
                  throw ('pre-SSL WSUS HTTP runtime did not recover within the bounded window: ' +
                      (Get-WsusListenerFailureDetailsSafe $port 8192))
              }
              $site = Get-Item -LiteralPath $sitePath -ErrorAction Stop
              if (-not [System.Convert]::ToBoolean($site.serverAutoStart)) {
                  throw 'pre-SSL WSUS IIS site did not persist serverAutoStart=true'
              }
              if ($changed) { Write-Output 'changed' } else { Write-Output 'nochange' }
              return
          }

          $siteState = Get-WsusSiteState
          if ($siteState -ne 'Started') {
              Start-WsusWebsiteBounded $port $true
              $changed = $true
          } else {
              # Give a just-written IIS/HTTP.sys binding a short read-only activation window
              # before deciding that runtime repair is required.
              $listenerReady = $false
              for ($attempt = 0; $attempt -lt 10; $attempt++) {
                  if (Test-LoopbackListener $port) {
                      $listenerReady = $true
                      break
                  }
                  Start-Sleep -Milliseconds 500
              }
              if (-not $listenerReady) {
                  # Binding updates normally activate live. If they did not, recycle only the
                  # WSUS site; never bounce W3SVC or unrelated IIS sites.
                  Stop-WsusWebsiteBounded 'runtime listener recycle'
                  Start-WsusWebsiteBounded $port $true
                  $changed = $true
              }
          }

          $startedAndListening = $false
          $listenerReady = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $siteState = Get-WsusSiteState
              $listenerReady = Test-LoopbackListener $port
              if ($siteState -eq 'Started' -and $listenerReady) {
                  $startedAndListening = $true
                  break
              }
              Start-Sleep -Milliseconds 500
          }
          if (-not $startedAndListening) {
              throw ('WSUS HTTPS listener did not activate within the bounded readiness window: siteState=' +
                  $siteState + ' loopbackListening=' + $listenerReady + ' ' +
                  (Get-WsusListenerFailureDetailsSafe $port 8192))
          }
          $site = Get-Item -LiteralPath $sitePath -ErrorAction Stop
          if (-not [System.Convert]::ToBoolean($site.serverAutoStart)) {
              throw 'WSUS IIS site did not persist serverAutoStart=true'
          }
          if ($changed) { Write-Output 'changed' } else { Write-Output 'nochange' }
      }
  block:

    #region ------ [ Main: WSUS Installation ] ---------------------------------------------- #

    # Creates the WSUS content root on the formatted content volume (derived F:\WSUS).
    # win_file state:directory is idempotent (creates if absent, no-op if present).
    # wsusutil postinstall (C05) creates WSUSContent inside it.
    - name: 'MAIN | Ensure WSUS Content Directory Exists'
      ansible.windows.win_file:
        path: "{{ __content_dir__ }}"
        state: directory

    # Installs the WSUS role on the WID backend (MS Step 1: Install-WindowsFeature -Name
    # UpdateServices -IncludeManagementTools). The WID role services are named EXPLICITLY —
    # MS never states the bare-parent auto-pull verbatim, and a missing WidDB would only
    # surface later as a postinstall failure. include_management_tools brings the WSUS console
    # + the UpdateServices PowerShell module (C07's Get-WsusServer). DO NOT set
    # include_sub_features: it maps to -IncludeAllSubFeature and would also pull
    # UpdateServices-DB (SQL Server Connectivity), which a WID build must NOT have.
    # Install HTTP logging in the same feature transaction so a host that requires a reboot
    # takes it once, before postinstall or any database mutation.  A converged rerun reports
    # NoChangeNeeded and reboot_required=false.
    - name: 'MAIN | Install WSUS Server Role (WID) And IIS HTTP Logging'
      ansible.windows.win_feature:
        name:
          - 'UpdateServices'
          - 'UpdateServices-WidDB'
          - 'UpdateServices-Services'
          - 'Web-Http-Logging'
        include_management_tools: true
        state: present
      register: __wsus_features__

    - name: 'MAIN | Reboot After Windows Feature Installation When Required'
      when: __wsus_features__.reboot_required | default(false) | bool
      ansible.windows.win_reboot:
        msg: 'Ansible is rebooting after WSUS/IIS feature installation'
        pre_reboot_delay: 5
        post_reboot_delay: 15
        reboot_timeout: 1200

    # Every pre/postinstall and relocation probe connects to the WID named pipe. Reconcile both
    # persistent startup policy and current state before the first connection so a disabled or
    # stopped engine is repaired explicitly instead of surfacing later as a misleading SUSDB error.
    - name: 'MAIN | Ensure WID Service Is Automatic And Running Before SUSDB Probes'
      ansible.windows.win_service:
        name: 'MSSQL$MICROSOFT##WID'
        start_mode: auto
        state: started

    # Target directory for the SUSDB relocation (C06 — community procedure, MS-unsupported,
    # Director-approved 2026-07-16) on the dedicated DB volume. Must exist before the WID
    # service-account ACL grant (C06b), the adopt attach (C14i), and the relocation attach (C06g).
    # Hoisted above postinstall (C14i) so the adopt attach has its directory + ACLs in place:
    # without the WID-service FullControl grant an attached SUSDB comes up READ-ONLY and WSUS
    # silently stops syncing. win_file creates parents (E:\WID then E:\WID\Data) and no-ops when present.
    - name: 'MAIN | Ensure WID Data Directory Exists'
      ansible.windows.win_file:
        path: "{{ __wid_data_dir__ }}"
        state: directory

    # Load-bearing ACL for the relocation: without it the C06g attach SUCCEEDS but SUSDB comes
    # up READ-ONLY and WSUS silently stops syncing. Detach flips file ownership, so this dir
    # grant (inherited by the copied .mdf/.ldf) is what guarantees the engine can open them.
    # FullControl mirrors the engine's ACL on its own C:\Windows\WID\Data; the virtual account
    # name is fixed by the WID instance (MICROSOFT##WID) — architectural, not config.
    - name: 'MAIN | Grant WID Service Account Rights On The Relocation Target'
      ansible.windows.win_acl:
        path: "{{ __wid_data_dir__ }}"
        user: 'NT SERVICE\MSSQL$MICROSOFT##WID'
        rights: 'FullControl'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Same org convention as the content-root Users grant (see the WSUS Installation region).
    # DB files readable by Users is accepted in this trust model — everyone is an admin anyway;
    # this is ACL hygiene (stale-SID prevention), not access control.
    - name: 'MAIN | Grant Users Browse Access On The WID Data Directory'
      ansible.windows.win_acl:
        path: "{{ __wid_data_dir__ }}"
        user: 'BUILTIN\Users'
        rights: 'ReadAndExecute'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Read-only completion-truth probe: the four Installed Role Services flags are written at
    # the END of each postinstall component (measured =2 live). Get-WsusServer is
    # runtime-truth and failed when the C06 arc legitimately stopped the stack; a midway
    # postinstall death leaves flags !=2, so the documented repair operation re-runs.
    # Runtime verification belongs to C07.
    - name: 'MAIN | Probe WSUS Post-Installation State'
      ansible.windows.win_reg_stat:
        path: 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup\Installed Role Services'
      register: __wsus_postinstall_probe__

    # An OS-volume replacement loses postinstall's registry flags but can retain the dedicated
    # data volume. Observe that state before postinstall is allowed to create a new system-volume
    # SUSDB: one complete, unattached target pair is adopted; any competing/partial pair fails
    # closed. Microsoft documents restore/attach followed by wsusutil postinstall for WID
    # migrations, so the preserved database remains the authority while IIS/registry are rebuilt.
    - name: 'MAIN | Observe SUSDB Attachment Before Post-Installation Repair'
      when: __postinstall_flags__ != [2, 2, 2, 2]
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
        try {
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT physical_name FROM sys.master_files WHERE database_id = DB_ID('SUSDB');"
            $reader = $cmd.ExecuteReader()
            $files = @()
            while ($reader.Read()) { $files += [string]$reader['physical_name'] }
            $reader.Close()
        } finally {
            if ($conn.State -eq 'Open') { $conn.Close() }
        }
        if ($files.Count -eq 0) { Write-Output 'absent'; return }
        $targetPrefix = $env:WID_DATA_DIR.TrimEnd([char]92) + [char]92
        $sourcePrefix = $env:WID_SOURCE_DIR.TrimEnd([char]92) + [char]92
        if (@($files | Where-Object { -not $_.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase) }).Count -eq 0) {
            Write-Output 'target'
        } elseif (@($files | Where-Object { -not $_.StartsWith($sourcePrefix, [System.StringComparison]::OrdinalIgnoreCase) }).Count -eq 0) {
            Write-Output 'source'
        } else {
            Write-Output 'other'
        }
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
        WID_SOURCE_DIR: '{{ __wid_source_dir__ }}'
      register: __prepostinstall_location_probe__
      changed_when: false

    - name: 'MAIN | Observe SUSDB File Pairs Before Post-Installation Repair'
      when: __postinstall_flags__ != [2, 2, 2, 2]
      ansible.windows.win_stat:
        path: '{{ item.path }}'
        get_checksum: false
      loop:
        - { label: 'source-mdf', path: '{{ __wid_source_dir__ }}\SUSDB.mdf' }
        - { label: 'source-ldf', path: '{{ __wid_source_dir__ }}\SUSDB_log.ldf' }
        - { label: 'target-mdf', path: '{{ __wid_data_dir__ }}\SUSDB.mdf' }
        - { label: 'target-ldf', path: '{{ __wid_data_dir__ }}\SUSDB_log.ldf' }
      loop_control:
        label: '{{ item.label }}'
      register: __prepostinstall_file_probe__

    - name: 'MAIN | Resolve The Pre-Postinstall SUSDB Observation'
      when: __postinstall_flags__ != [2, 2, 2, 2]
      ansible.builtin.set_fact:
        __prepostinstall_location__: '{{ __prepostinstall_location_probe__.stdout | trim }}'
        __prepostinstall_source_count__: >-
          {{ (__prepostinstall_file_probe__.results[0:2] | selectattr('stat.exists') | list | length) }}
        __prepostinstall_target_count__: >-
          {{ (__prepostinstall_file_probe__.results[2:4] | selectattr('stat.exists') | list | length) }}

    - name: 'MAIN | Classify The Pre-Postinstall SUSDB Action'
      when: __postinstall_flags__ != [2, 2, 2, 2]
      ansible.builtin.set_fact:
        __prepostinstall_action__: >-
          {% if __prepostinstall_location__ == 'absent' and (__prepostinstall_source_count__ | int) == 0 and (__prepostinstall_target_count__ | int) == 0 %}
          fresh
          {% elif __prepostinstall_location__ == 'absent' and (__prepostinstall_source_count__ | int) == 0 and (__prepostinstall_target_count__ | int) == 2 %}
          adopt_target
          {% elif __prepostinstall_location__ == 'target'
                and (__prepostinstall_target_count__ | int) == 2
                and (__prepostinstall_source_count__ | int) in [0, 1, 2] %}
          target_attached
          {% elif __prepostinstall_location__ == 'source' and (__prepostinstall_source_count__ | int) == 2 and (__prepostinstall_target_count__ | int) == 0 %}
          source_attached
          {% else %}
          invalid
          {% endif %}

    - name: 'MAIN | Refuse Ambiguous SUSDB Authority Before Post-Installation Repair'
      when: __postinstall_flags__ != [2, 2, 2, 2]
      ansible.builtin.assert:
        that:
          - (__prepostinstall_action__ | trim) != 'invalid'
        fail_msg: >-
          Refusing wsusutil postinstall before it can replace a preserved SUSDB:
          attached={{ __prepostinstall_location__ }},
          source_files={{ __prepostinstall_source_count__ }},
          target_files={{ __prepostinstall_target_count__ }}. Only a truly empty fresh state, one
          complete attached pair, or one complete unattached target pair is safe automatically.
        quiet: true

    - name: 'MAIN | Adopt And Verify The Preserved SUSDB Before Post-Installation Repair'
      when:
        - __postinstall_flags__ != [2, 2, 2, 2]
        - (__prepostinstall_action__ | trim) in ['adopt_target', 'target_attached']
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
        $attachedHere = $false
        try {
            $conn.Open()
            if ($env:ACTION -eq 'adopt_target') {
                $dirSql = $env:WID_DATA_DIR.Replace("'", "''")
                $attach = $conn.CreateCommand()
                $attach.CommandText = "CREATE DATABASE SUSDB ON (FILENAME = N'$dirSql\SUSDB.mdf'), (FILENAME = N'$dirSql\SUSDB_log.ldf') FOR ATTACH;"
                $attach.ExecuteNonQuery() | Out-Null
                $attachedHere = $true
            }
            $health = $conn.CreateCommand()
            $health.CommandText = (
                "SELECT d.state_desc AS s, d.is_read_only AS ro, m.physical_name AS pn " +
                "FROM sys.databases d JOIN sys.master_files m ON m.database_id = d.database_id " +
                "WHERE d.name = 'SUSDB';")
            $reader = $health.ExecuteReader()
            $state = $null
            $readOnly = $null
            $files = @()
            while ($reader.Read()) {
                $state = [string]$reader['s']
                $readOnly = [int]$reader['ro']
                $files += [string]$reader['pn']
            }
            $reader.Close()
            $prefix = $env:WID_DATA_DIR.TrimEnd([char]92) + [char]92
            $offTarget = @($files | Where-Object { -not $_.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase) })
            if ($state -ne 'ONLINE' -or $readOnly -ne 0 -or $files.Count -lt 2 -or $offTarget.Count -gt 0) {
                throw ("preserved SUSDB is unsafe: state=$state readOnly=$readOnly files=$($files -join ';')")
            }
        } catch {
            if ($attachedHere) {
                try {
                    $detach = $conn.CreateCommand()
                    $detach.CommandText = 'ALTER DATABASE SUSDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC master.dbo.sp_detach_db @dbname = N''SUSDB'';'
                    $detach.ExecuteNonQuery() | Out-Null
                } catch {}
            }
            throw
        } finally {
            if ($conn.State -eq 'Open') { $conn.Close() }
        }
        if ($attachedHere) { Write-Output 'adopted-target' } else { Write-Output 'target-healthy' }
      environment:
        ACTION: '{{ __prepostinstall_action__ | trim }}'
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
      register: __prepostinstall_adoption__
      changed_when: "__prepostinstall_adoption__.stdout | trim == 'adopted-target'"

    # Runs the WSUS post-installation: creates a fresh SUSDB in WID or services the safely adopted
    # target SUSDB above, creates WSUSContent inside the content root, configures the IIS 'WSUS
    # Administration' site (8530), and enables+starts WsusService. WID is selected by the ABSENCE
    # of SQL_INSTANCE_NAME. Gated by the completion flags above (all four =2 means configured ->
    # skip). argv auto-quotes per
    # Win32 rules (the exe path contains spaces). NO trailing backslash on CONTENT_DIR. wsusutil
    # logs to a random .tmp in %TEMP% (stdout names it); the first run takes minutes.
    - name: 'MAIN | Run WSUS Post-Installation (WID, content on F:)'
      when: __postinstall_flags__ != [2, 2, 2, 2]
      ansible.windows.win_command:
        argv:
          - 'C:\Program Files\Update Services\Tools\wsusutil.exe'
          - 'postinstall'
          - 'CONTENT_DIR={{ __content_dir__ }}'
      register: __wsus_postinstall__

    #endregion --- [ Main: WSUS Installation ] ---------------------------------------------- #

    #region ------ [ Main: SUSDB Relocation ] ----------------------------------------------- #

    # Observe attachment and file state on every run.  The old gate depended on postinstall being
    # changed in this run, so interruption after detach left all future runs skipping relocation.
    - name: 'MAIN | Observe The Attached SUSDB Location'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
        try {
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT physical_name FROM sys.master_files WHERE database_id = DB_ID('SUSDB');"
            $reader = $cmd.ExecuteReader()
            $files = @()
            while ($reader.Read()) { $files += [string]$reader['physical_name'] }
            $reader.Close()
        } finally {
            if ($conn.State -eq 'Open') { $conn.Close() }
        }
        if ($files.Count -eq 0) { Write-Output 'absent'; return }
        $targetPrefix = $env:WID_DATA_DIR.TrimEnd([char]92) + [char]92
        $sourcePrefix = $env:WID_SOURCE_DIR.TrimEnd([char]92) + [char]92
        if (@($files | Where-Object { -not $_.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase) }).Count -eq 0) {
            Write-Output 'target'
        } elseif (@($files | Where-Object { -not $_.StartsWith($sourcePrefix, [System.StringComparison]::OrdinalIgnoreCase) }).Count -eq 0) {
            Write-Output 'source'
        } else {
            Write-Output 'other'
        }
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
        WID_SOURCE_DIR: '{{ __wid_source_dir__ }}'
      register: __susdb_location_probe__
      changed_when: false

    - name: 'MAIN | Observe SUSDB Source And Target File Pairs'
      ansible.windows.win_stat:
        path: '{{ item.path }}'
        get_checksum: false
      loop:
        - { label: 'source-mdf', path: '{{ __wid_source_dir__ }}\SUSDB.mdf' }
        - { label: 'source-ldf', path: '{{ __wid_source_dir__ }}\SUSDB_log.ldf' }
        - { label: 'target-mdf', path: '{{ __wid_data_dir__ }}\SUSDB.mdf' }
        - { label: 'target-ldf', path: '{{ __wid_data_dir__ }}\SUSDB_log.ldf' }
      loop_control:
        label: '{{ item.label }}'
      register: __susdb_file_probe__

    - name: 'MAIN | Resolve The Observed SUSDB State'
      ansible.builtin.set_fact:
        __susdb_location__: '{{ __susdb_location_probe__.stdout | trim }}'
        __susdb_source_count__: >-
          {{ (__susdb_file_probe__.results[0:2] | selectattr('stat.exists') | list | length) }}
        __susdb_target_count__: >-
          {{ (__susdb_file_probe__.results[2:4] | selectattr('stat.exists') | list | length) }}

    # Authority table before any detach:
    #   attached=source + complete source => source wins; discard ANY unattached target and
    #     rebuild it byte-for-byte, even when the target pair looks complete.
    #   attached=target + complete target => target wins; source is removed only after health.
    #   attached=absent + only one complete pair => that pair is the recovery source.
    #   attached=absent + both complete pairs => ambiguous and MUST fail without mutation.
    # A complete-but-stale target is therefore never adopted over an attached source database.
    - name: 'MAIN | Discard Any Unattached Target While Source SUSDB Is Authoritative'
      when:
        - __susdb_location__ == 'source'
        - __susdb_source_count__ | int == 2
        - __susdb_target_count__ | int > 0
      ansible.windows.win_file:
        path: '{{ __wid_data_dir__ }}\{{ item }}'
        state: absent
      loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
      loop_control:
        label: '{{ item }}'

    - name: 'MAIN | Normalize The Source-Authoritative SUSDB Target State'
      when:
        - __susdb_location__ == 'source'
        - __susdb_source_count__ | int == 2
        - __susdb_target_count__ | int > 0
      ansible.builtin.set_fact:
        __susdb_target_count__: 0

    # A killed copy can leave one target file while no database is attached. A complete source
    # pair makes that partial target safely disposable; two complete pairs remain ambiguous.
    - name: 'MAIN | Remove An Incomplete Recoverable Unattached SUSDB Target Pair'
      when:
        - __susdb_location__ == 'absent'
        - __susdb_source_count__ | int == 2
        - __susdb_target_count__ | int == 1
      ansible.windows.win_file:
        path: '{{ __wid_data_dir__ }}\{{ item }}'
        state: absent
      loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
      loop_control:
        label: '{{ item }}'

    - name: 'MAIN | Normalize The Recoverable Unattached SUSDB Target State'
      when:
        - __susdb_location__ == 'absent'
        - __susdb_source_count__ | int == 2
        - __susdb_target_count__ | int == 1
      ansible.builtin.set_fact:
        __susdb_target_count__: 0

    - name: 'MAIN | Classify The SUSDB Recovery Action'
      ansible.builtin.set_fact:
        __susdb_recovery_action__: >-
          {% if __susdb_location__ == 'target' and (__susdb_target_count__ | int) == 2 and (__susdb_source_count__ | int) in [0, 1, 2] %}
          converged
          {% elif __susdb_location__ == 'source' and (__susdb_source_count__ | int) == 2 and (__susdb_target_count__ | int) == 0 %}
          rebuild_from_source
          {% elif __susdb_location__ == 'absent' and (__susdb_source_count__ | int) == 2 and (__susdb_target_count__ | int) == 0 %}
          copy_from_source
          {% elif __susdb_location__ == 'absent' and (__susdb_source_count__ | int) == 0 and (__susdb_target_count__ | int) == 2 %}
          attach_target
          {% else %}
          invalid
          {% endif %}

    - name: 'MAIN | Assert SUSDB Has One Recoverable State'
      ansible.builtin.assert:
        that:
          - (__susdb_recovery_action__ | trim) != 'invalid'
        fail_msg: >-
          Refusing an ambiguous SUSDB recovery: attached={{ __susdb_location__ }},
          source_files={{ __susdb_source_count__ }}, target_files={{ __susdb_target_count__ }}.
          An unattached database with two complete pairs has no authoritative copy and is never
          guessed; partial/mixed/foreign attachment states also fail without detach or attach.
        quiet: true

    - name: 'MAIN | Converge SUSDB Attachment To The Data Volume'
      when: (__susdb_recovery_action__ | trim) != 'converged'
      block:
        - name: 'MAIN | Stop WSUS Consumers For SUSDB Relocation'
          ansible.windows.win_service:
            name: '{{ item }}'
            state: stopped
          loop: ['WsusService', 'W3SVC']
          loop_control:
            label: '{{ item }}'

        - name: 'MAIN | Detach The System-Volume SUSDB'
          when: __susdb_location__ == 'source'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            try {
                $conn.Open()
                $cmd = $conn.CreateCommand()
                $cmd.CommandText = 'ALTER DATABASE SUSDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC master.dbo.sp_detach_db @dbname = N''SUSDB'';'
                $cmd.ExecuteNonQuery() | Out-Null
            } finally {
                if ($conn.State -eq 'Open') { $conn.Close() }
            }
            Write-Output 'detached'
          environment:
            WID_CONN: '{{ __wid_conn_master__ }}'
          changed_when: true

        - name: 'MAIN | Copy A Complete SUSDB Pair To The Data Volume'
          when: __susdb_target_count__ | int == 0
          ansible.windows.win_copy:
            src: '{{ __wid_source_dir__ }}\{{ item }}'
            dest: '{{ __wid_data_dir__ }}\{{ item }}'
            remote_src: true
          loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
          loop_control:
            label: '{{ item }}'

        - name: 'MAIN | Attach SUSDB From The Data Volume'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $dirSql = $env:WID_DATA_DIR.Replace("'", "''")
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            try {
                $conn.Open()
                $cmd = $conn.CreateCommand()
                $cmd.CommandText = "CREATE DATABASE SUSDB ON (FILENAME = N'$dirSql\SUSDB.mdf'), (FILENAME = N'$dirSql\SUSDB_log.ldf') FOR ATTACH;"
                $cmd.ExecuteNonQuery() | Out-Null
                $cmd.CommandText = "SELECT d.state_desc AS s, d.is_read_only AS ro, m.physical_name AS pn FROM sys.databases d JOIN sys.master_files m ON m.database_id = d.database_id WHERE d.name = 'SUSDB';"
                $reader = $cmd.ExecuteReader()
                $state = $null
                $readOnly = $null
                $files = @()
                while ($reader.Read()) {
                    $state = [string]$reader['s']
                    $readOnly = [int]$reader['ro']
                    $files += [string]$reader['pn']
                }
                $reader.Close()
                $prefix = $env:WID_DATA_DIR.TrimEnd([char]92) + [char]92
                $offTarget = @($files | Where-Object { -not $_.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase) })
                if ($state -ne 'ONLINE' -or $readOnly -ne 0 -or $files.Count -lt 2 -or $offTarget.Count -gt 0) {
                    try {
                        $detach = $conn.CreateCommand()
                        $detach.CommandText = 'ALTER DATABASE SUSDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC master.dbo.sp_detach_db @dbname = N''SUSDB'';'
                        $detach.ExecuteNonQuery() | Out-Null
                    } catch {}
                    throw ("attached SUSDB failed target health verification: state=$state readOnly=$readOnly files=$($files -join ';')")
                }
            } finally {
                if ($conn.State -eq 'Open') { $conn.Close() }
            }
            Write-Output 'attached'
          environment:
            WID_CONN: '{{ __wid_conn_master__ }}'
            WID_DATA_DIR: '{{ __wid_data_dir__ }}'
          changed_when: true

      rescue:
        # Best effort restores serviceability from a complete pair, then the play still fails so
        # unattended proof cannot hide the interrupted/failed relocation.
        - name: 'RECOVER | Reattach The Best Complete SUSDB Pair'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            try {
                $conn.Open()
                $probe = $conn.CreateCommand()
                $probe.CommandText = "SELECT COUNT(*) FROM sys.databases WHERE name = 'SUSDB';"
                if ([int]$probe.ExecuteScalar() -gt 0) { Write-Output 'already-attached'; return }
                $candidates = @($env:WID_DATA_DIR, $env:WID_SOURCE_DIR) | Select-Object -Unique
                $errors = @()
                foreach ($dir in $candidates) {
                    $complete = (Test-Path -LiteralPath (Join-Path $dir 'SUSDB.mdf')) -and (Test-Path -LiteralPath (Join-Path $dir 'SUSDB_log.ldf'))
                    if (-not $complete) { continue }
                    try {
                        $dirSql = $dir.Replace("'", "''")
                        $attach = $conn.CreateCommand()
                        $attach.CommandText = "CREATE DATABASE SUSDB ON (FILENAME = N'$dirSql\SUSDB.mdf'), (FILENAME = N'$dirSql\SUSDB_log.ldf') FOR ATTACH;"
                        $attach.ExecuteNonQuery() | Out-Null
                        $health = $conn.CreateCommand()
                        $health.CommandText = "SELECT state_desc + ':' + CONVERT(varchar(1), is_read_only) FROM sys.databases WHERE name = 'SUSDB';"
                        if ([string]$health.ExecuteScalar() -ne 'ONLINE:0') { throw 'attached database is not ONLINE/read-write' }
                        Write-Output ('recovered:' + $dir)
                        return
                    } catch {
                        $errors += ($dir + '=' + $_.Exception.Message)
                        try {
                            $detach = $conn.CreateCommand()
                            $detach.CommandText = 'IF DB_ID(''SUSDB'') IS NOT NULL BEGIN ALTER DATABASE SUSDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC master.dbo.sp_detach_db @dbname = N''SUSDB''; END'
                            $detach.ExecuteNonQuery() | Out-Null
                        } catch {}
                    }
                }
                throw ('no complete healthy SUSDB pair could be recovered: ' + ($errors -join '; '))
            } finally {
                if ($conn.State -eq 'Open') { $conn.Close() }
            }
          environment:
            WID_CONN: '{{ __wid_conn_master__ }}'
            WID_DATA_DIR: '{{ __wid_data_dir__ }}'
            WID_SOURCE_DIR: '{{ __wid_source_dir__ }}'
          register: __susdb_recovery__
          failed_when: false
          changed_when: "(__susdb_recovery__.stdout | trim).startswith('recovered:')"

        - name: 'RECOVER | Fail After SUSDB Relocation Recovery'
          ansible.builtin.fail:
            msg: >-
              SUSDB relocation failed at '{{ ansible_failed_task.name | default('unknown task') }}'.
              Best-effort recovery result: {{ __susdb_recovery__.stdout | default('no output') | trim }}.
              The run remains failed so this interruption cannot be reported as proof.

      always:
        - name: 'RECOVER | Restore WSUS Consumer Services'
          ansible.windows.win_service:
            name: '{{ item }}'
            state: started
          loop: ['W3SVC', 'WsusService']
          loop_control:
            label: '{{ item }}'
          failed_when: false

    - name: 'MAIN | Ensure WSUS Services Are Running After SUSDB Convergence'
      ansible.windows.win_service:
        name: '{{ item }}'
        state: started
      loop: ['W3SVC', 'WsusService']
      loop_control:
        label: '{{ item }}'

    # A host that already persisted UsingSSL=1 must repair its local listener before any API
    # actor attempts the pinned HTTPS session. Fresh pre-SSL installs return nochange here and
    # activate through the same primitive immediately after configuressl below. win_powershell
    # runs this large shared primitive in the module runspace; win_shell would Base64-expand it
    # beyond the Windows child-process command-line limit before PowerShell could execute it.
    - name: 'MAIN | Reconcile Existing WSUS HTTPS Listener Before API Access'
      ansible.windows.win_powershell:
        error_action: stop
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          {{ __wsus_https_listener_reconciler__ }}
          $listenerResult = @(Invoke-LocalWsusHttpsListenerReconcile)
          if ($listenerResult.Count -ne 1 -or
              [string]$listenerResult[0] -notin @('changed', 'nochange')) {
              throw ('listener reconciler returned an invalid result contract: [' +
                  (($listenerResult | ForEach-Object { [string]$_ }) -join ';') + ']')
          }
          $Ansible.Changed = [string]$listenerResult[0] -eq 'changed'
          Write-Output ([string]$listenerResult[0])
      register: __pre_api_tls_listener_activation__

    - name: 'MAIN | Verify SUSDB Relocation Health'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        {{ __wsus_api_invoker__ }}
        Invoke-LocalWsusApi {
        param($wsus)
        $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
        try {
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT d.state_desc AS s, d.is_read_only AS ro, m.physical_name AS pn FROM sys.databases d JOIN sys.master_files m ON m.database_id = d.database_id WHERE d.name = 'SUSDB';"
            $reader = $cmd.ExecuteReader()
            $state = $null
            $ro = $null
            $files = @()
            while ($reader.Read()) {
                $state = [string]$reader['s']
                $ro = [int]$reader['ro']
                $files += [string]$reader['pn']
            }
            $reader.Close()
        } finally {
            if ($conn.State -eq 'Open') { $conn.Close() }
        }
        $prefix = $env:WID_DATA_DIR.TrimEnd([char]92) + [char]92
        $offTarget = @($files | Where-Object { -not $_.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase) })
        if ($state -ne 'ONLINE' -or $ro -ne 0 -or $files.Count -lt 2 -or $offTarget.Count -gt 0) {
            throw ("SUSDB is unsafe: state=$state readOnly=$ro files=$($files -join ';')")
        }
        $null = $wsus
        Write-Output 'healthy'
        }
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
      register: __susdb_relocated_healthy__
      changed_when: false

    - name: 'MAIN | Remove SUSDB Originals From System Volume'
      ansible.windows.win_file:
        path: '{{ __wid_source_dir__ }}\{{ item }}'
        state: absent
      loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
      loop_control:
        label: '{{ item }}'

    #endregion --- [ Main: SUSDB Relocation ] ----------------------------------------------- #

    #region ------ [ Main: WSUS Content Location ] ------------------------------------------ #

    # The completion flags only prove that postinstall finished once. They do not bind a later
    # drive/subdirectory override to WSUS's database-backed content location, so merely creating
    # the new directory would otherwise allow a false-green run while WSUS continued to use the
    # old volume. Run this after SUSDB recovery so an interrupted detach remains recoverable.
    # Use Microsoft's supported, copying movecontent operation when the API location differs. A
    # registry-only split brain is not repaired by hand: fail closed rather than turn an
    # unsupported registry edit into apparent convergence. The IIS Content vdir is declarative
    # metadata and is repaired independently after the authoritative API/registry pair agrees.
    - name: 'MAIN | Reconcile The WSUS Content Location'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        {{ __wsus_api_invoker__ }}
        Invoke-LocalWsusApi {
        param($wsus)

        function Normalize-ContentPath([string]$path) {
            if ([string]::IsNullOrWhiteSpace($path)) {
                return ''
            }
            return $path.Trim().Replace('/', [char]92).TrimEnd([char]92)
        }
        function Test-ContentPath([string]$actual, [string]$expected) {
            return [string]::Equals(
                (Normalize-ContentPath $actual),
                (Normalize-ContentPath $expected),
                [System.StringComparison]::OrdinalIgnoreCase)
        }

        $wantRoot = Normalize-ContentPath $env:CONTENT_DIR
        $wantCache = Join-Path $wantRoot 'WsusContent'
        $setupPath = 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup'
        $contentVdirPath = 'IIS:\Sites\WSUS Administration\Content'
        $setupBefore = Get-ItemProperty -Path $setupPath -ErrorAction Stop
        $cfgBefore = $wsus.GetConfiguration()
        $registryBefore = Normalize-ContentPath ([string]$setupBefore.ContentDir)
        $apiBefore = Normalize-ContentPath ([string]$cfgBefore.LocalContentCachePath)
        $changed = $false

        if (-not (Test-ContentPath $apiBefore $wantCache)) {
            $wsusutil = Join-Path $env:ProgramFiles 'Update Services\Tools\wsusutil.exe'
            $moveLog = Join-Path ([IO.Path]::GetTempPath()) ('wsus-movecontent-' + [guid]::NewGuid().ToString('N') + '.log')
            try {
                # Deliberately omit -skipcopy: an automatic reconcile must preserve the current
                # content before WSUS switches its database and IIS metadata to the new root.
                $out = & $wsusutil movecontent $wantRoot $moveLog 2>&1
                $rc = $LASTEXITCODE
                if ($rc -ne 0) {
                    $logText = if (Test-Path -LiteralPath $moveLog) {
                        (Get-Content -LiteralPath $moveLog -Tail 50 -ErrorAction SilentlyContinue) -join ' '
                    } else {
                        ''
                    }
                    throw ('wsusutil movecontent failed rc=' + $rc + ' output=' +
                        (($out -join ' ') + ' log=' + $logText))
                }
            } finally {
                Remove-Item -LiteralPath $moveLog -Force -ErrorAction SilentlyContinue
            }
            $changed = $true
        } elseif (-not (Test-ContentPath $registryBefore $wantRoot)) {
            throw ('WSUS content state is split-brain: API already names [' + $wantCache +
                '] but registry ContentDir is [' + $registryBefore +
                ']. Refusing an unsupported direct registry repair; run WSUS postinstall/repair.')
        }

        $setupAfter = Get-ItemProperty -Path $setupPath -ErrorAction Stop
        $cfgAfter = $wsus.GetConfiguration()
        $registryAfter = Normalize-ContentPath ([string]$setupAfter.ContentDir)
        $apiAfter = Normalize-ContentPath ([string]$cfgAfter.LocalContentCachePath)
        if (-not (Test-ContentPath $registryAfter $wantRoot) -or
            -not (Test-ContentPath $apiAfter $wantCache)) {
            throw ('WSUS content move did not persist: ContentDir=[' + $registryAfter +
                '] LocalContentCachePath=[' + $apiAfter + ']')
        }
        if (-not (Test-Path -LiteralPath $wantCache -PathType Container)) {
            throw ('WSUS content cache directory is absent after reconciliation: ' + $wantCache)
        }

        $contentVdir = Get-Item -LiteralPath $contentVdirPath -ErrorAction Stop
        if (-not (Test-ContentPath ([string]$contentVdir.physicalPath) $wantCache)) {
            Set-ItemProperty -LiteralPath $contentVdirPath -Name physicalPath -Value $wantCache
            $changed = $true
        }
        $contentVdirAfter = Get-Item -LiteralPath $contentVdirPath -ErrorAction Stop
        if (-not (Test-ContentPath ([string]$contentVdirAfter.physicalPath) $wantCache)) {
            throw ('WSUS IIS Content virtual directory did not persist at ' + $wantCache)
        }

        if ($changed) { Write-Output 'changed' } else { Write-Output 'nochange' }
        }
      environment:
        CONTENT_DIR: '{{ __content_dir__ }}'
      register: __wsus_content_location__
      changed_when: "__wsus_content_location__.stdout | trim == 'changed'"

    # Org convention (Director 2026-07-16): every interactive user on a server is an admin. An
    # unreadable folder makes Explorer offer 'Continue', which stamps the admin's PERSONAL ACE
    # onto the ACL — stale SIDs after they depart. Assert this after postinstall/movecontent so
    # those native tools cannot replace the final desired grant. R&X only; writes stay elevated.
    - name: 'MAIN | Grant Users Browse Access On The Content Root'
      ansible.windows.win_acl:
        path: "{{ __content_dir__ }}"
        user: 'BUILTIN\Users'
        rights: 'ReadAndExecute'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # WSUS downloads and serves binaries as NETWORK SERVICE. Postinstall normally creates this
    # ACE, but declaring it makes ACL drift repairable and lets the final verifier prove that a
    # correctly located cache is also writable by the service that owns it.
    - name: 'MAIN | Grant WSUS Service Rights On The Content Cache'
      ansible.windows.win_acl:
        path: '{{ __content_dir__ }}\WsusContent'
        user: 'NT AUTHORITY\NETWORK SERVICE'
        rights: 'FullControl'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    #endregion --- [ Main: WSUS Content Location ] ------------------------------------------ #

    #region ------ [ Main: WSUS Tuning ] --------------------------------------------------- #

    # Fail-closed guard: web_app_pool state:started would create a bogus generic pool
    # if WsusPool were absent, leaving WSUS silently broken. Refuse to tune unless install +
    # postinstall created it. Read-only (changed_when:false); §4b guard / §5 win_shell.
    - name: 'MAIN | Assert WsusPool Exists Before Tuning'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        if (-not (Test-Path 'IIS:\AppPools\WsusPool')) {
            throw 'WsusPool application pool not found - WSUS install + postinstall must complete before tuning; refusing to let web_app_pool create a bogus pool.'
        }
        Write-Output 'present'
      changed_when: false

    # MS WSUS best practices, "Disable recycling and configure memory limits": prevents the
    # scan-storm / HTTP-503 / high-memory cascade when a recycle drops + rebuilds the metadata
    # cache. Values are role defaults (config.wsuspool.*), overridable for shared hosts. The
    # native module diffs current vs desired (idempotent). Source:
    # learn.microsoft.com/troubleshoot/mem/configmgr/update-management/windows-server-update-services-best-practices
    - name: 'MAIN | Tune WsusPool Application Pool'
      microsoft.iis.web_app_pool:
        name: WsusPool
        state: started
        attributes:
          queueLength: '{{ config.wsuspool.queue_length | int }}'
          recycling.periodicRestart.privateMemory: '{{ config.wsuspool.private_memory_kb | int }}'
          recycling.periodicRestart.memory: '{{ config.wsuspool.virtual_memory_kb | int }}'
          recycling.periodicRestart.time: '{{ config.wsuspool.periodic_restart }}'
          processModel.idleTimeout: '{{ config.wsuspool.idle_timeout }}'
          processModel.pingingEnabled: '{{ config.wsuspool.pinging_enabled | bool }}'

    #endregion --- [ Main: WSUS Tuning ] -------------------------------------------------- #

    #region ------ [ Main: WSUS Sync Configuration ] --------------------------------------- #

    # Restrict update languages (default en) so a sync doesn't pull every language (the
    # postinstall default is ALL). StringCollection of lowercase codes + AllUpdateLanguagesEnabled
    # false; normalized order-insensitive compare; re-acquire + verify after Save to avoid
    # perpetual-change/false-converge. Env-passed langs; WSUS-cmdlet win_shell (§8).
    - name: 'MAIN | Restrict WSUS Update Languages'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        {{ __wsus_api_invoker__ }}
        Invoke-LocalWsusApi {
        param($wsus)
        $want = @($env:WSUS_LANGS.Split(',') | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ } | Select-Object -Unique)
        if ($want.Count -eq 0) {
            throw 'no update languages specified'
        }
        $wantSorted = @($want | Sort-Object)
        $c = $wsus.GetConfiguration()
        $current = @(@($c.GetEnabledUpdateLanguages()) | ForEach-Object { ([string]$_).ToLowerInvariant() } | Sort-Object)
        $needChange = $c.AllUpdateLanguagesEnabled -or @(Compare-Object $current $wantSorted).Count -gt 0
        if ($needChange) {
            $sc = New-Object System.Collections.Specialized.StringCollection
            foreach ($l in $want) { [void]$sc.Add($l) }
            $c.AllUpdateLanguagesEnabled = $false
            $c.SetEnabledUpdateLanguages($sc)
            $c.Save()
            $c2 = $wsus.GetConfiguration()
            $after = @(@($c2.GetEnabledUpdateLanguages()) | ForEach-Object { ([string]$_).ToLowerInvariant() } | Sort-Object)
            if ($c2.AllUpdateLanguagesEnabled -or @(Compare-Object $after $wantSorted).Count -gt 0) {
                throw ('language restriction did not persist: got [' + ($after -join ',') + '] AllEnabled=' + $c2.AllUpdateLanguagesEnabled)
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
        }
      environment:
        WSUS_LANGS: '{{ config.sync.update_languages | join(",") }}'
      register: __wsus_lang_cfg__
      changed_when: "__wsus_lang_cfg__.stdout | trim == 'changed'"

    # Configure the source BEFORE any synchronization.  The former ordering started a Microsoft
    # Update category sync, marked it on acceptance, then stopped it to save this downstream
    # source. Save only on a five-field diff and verify the persisted values.
    - name: 'MAIN | Configure Upstream WSUS Source'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        {{ __wsus_api_invoker__ }}
        Invoke-LocalWsusApi {
        param($wsus)
        if ([string]::IsNullOrWhiteSpace($env:UPSTREAM_SERVER)) {
            throw 'upstream_server is required for a downstream topology: declare it in the wsus: override dict (config.upstream_server)'
        }
        $wantPort = [int]$env:UPSTREAM_PORT
        $wantSsl = [System.Convert]::ToBoolean($env:UPSTREAM_SSL)
        $wantReplica = [System.Convert]::ToBoolean($env:REPLICA)
        $c = $wsus.GetConfiguration()
        $needChange = $c.SyncFromMicrosoftUpdate -or ($c.UpstreamWsusServerName -ne $env:UPSTREAM_SERVER) -or ($c.UpstreamWsusServerPortNumber -ne $wantPort) -or ($c.UpstreamWsusServerUseSsl -ne $wantSsl) -or ($c.IsReplicaServer -ne $wantReplica)
        if ($needChange) {
            $sub = $wsus.GetSubscription()
            if ([string]$sub.GetSynchronizationStatus() -ne 'NotProcessing') {
                $sub.StopSynchronization()
                $stopDeadline = (Get-Date).AddSeconds(60)
                do {
                    Start-Sleep -Seconds 2
                } while ((Get-Date) -lt $stopDeadline -and [string]$sub.GetSynchronizationStatus() -ne 'NotProcessing')
                if ([string]$sub.GetSynchronizationStatus() -ne 'NotProcessing') {
                    throw 'could not stop the in-progress synchronization before saving the upstream source config'
                }
            }
            $c.SyncFromMicrosoftUpdate = $false
            $c.UpstreamWsusServerName = $env:UPSTREAM_SERVER
            $c.UpstreamWsusServerPortNumber = $wantPort
            $c.UpstreamWsusServerUseSsl = $wantSsl
            $c.IsReplicaServer = $wantReplica
            $c.Save()
            $c2 = $wsus.GetConfiguration()
            if ($c2.SyncFromMicrosoftUpdate -or ($c2.UpstreamWsusServerName -ne $env:UPSTREAM_SERVER) -or ($c2.UpstreamWsusServerPortNumber -ne $wantPort) -or ($c2.UpstreamWsusServerUseSsl -ne $wantSsl) -or ($c2.IsReplicaServer -ne $wantReplica)) {
                throw ('upstream source did not persist: SyncFromMU=' + $c2.SyncFromMicrosoftUpdate + ' upstream=[' + $c2.UpstreamWsusServerName + '] port=' + $c2.UpstreamWsusServerPortNumber + ' ssl=' + $c2.UpstreamWsusServerUseSsl + ' replica=' + $c2.IsReplicaServer)
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
        }
      environment:
        UPSTREAM_SERVER: '{{ config.upstream_server | default("") | string | trim }}'
        UPSTREAM_PORT: '{{ config.sync.upstream_port }}'
        UPSTREAM_SSL: '{{ config.sync.upstream_use_ssl | bool | lower }}'
        REPLICA: '{{ config.sync.replica | bool | lower }}'
      register: __wsus_source__
      changed_when: "__wsus_source__.stdout | trim == 'changed'"

    # A TCP check is intentionally conditional: the repository's AWS play is presently an honest
    # configuration smoke because its placeholder corporate upstream is unreachable. Enabling the
    # bootstrap converts this to functional proof and therefore requires a reachable source.
    - name: 'MAIN | Wait For The Configured Upstream WSUS Endpoint'
      when: config.sync.bootstrap_enabled | bool
      ansible.windows.win_wait_for:
        host: "{{ config.upstream_server }}"
        port: "{{ config.sync.upstream_port | int }}"
        state: started
        connect_timeout: 5
        timeout: 120

    - name: 'INFO | Synchronization Proof Is Deliberately Disabled'
      when: not (config.sync.bootstrap_enabled | bool)
      ansible.builtin.debug:
        msg: >-
          WSUS topology was configured, but sync.bootstrap_enabled=false: this run is a
          configuration smoke and does not claim upstream reachability or synchronization.

    # A durable marker means this role started a category-only synchronization under the current
    # source/language fingerprint and observed that exact invocation finish with Succeeded. A stale
    # marker never adopts an older in-flight synchronization: stop it, wait for idle, snapshot the
    # history IDs, then bind success to one new manual history record. Failure leaves no new marker.
    - name: 'MAIN | Bootstrap WSUS Category Sync To Terminal Success'
      when: config.sync.bootstrap_enabled | bool
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        {{ __wsus_api_invoker__ }}
        Invoke-LocalWsusApi {
        param($w)
        $s = $w.GetSubscription()
        $cfg = $w.GetConfiguration()
        $serverId = [string]$cfg.ServerId
        $fingerprintInput = @(
            $env:UPSTREAM_SERVER.Trim().ToLowerInvariant(),
            $env:UPSTREAM_PORT,
            $env:UPSTREAM_SSL.ToLowerInvariant(),
            $env:REPLICA.ToLowerInvariant(),
            $env:WSUS_LANGS.ToLowerInvariant()
        ) -join '|'
        $sha = [System.Security.Cryptography.SHA256]::Create()
        try {
            $fingerprint = ([System.BitConverter]::ToString(
                $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($fingerprintInput))
            )).Replace('-', '')
        } finally {
            $sha.Dispose()
        }
        $key = 'HKLM:\SOFTWARE\nwarila-platform\wsus'
        $marker = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue
        $markedHistory = @()
        if ($marker.category_bootstrap_server_id -eq $serverId -and
            $marker.category_bootstrap_fingerprint -eq $fingerprint -and
            -not [string]::IsNullOrWhiteSpace([string]$marker.category_bootstrap_history_id)) {
            $markedHistory = @($s.GetSynchronizationHistory() | Where-Object {
                [string]$_.Id -eq [string]$marker.category_bootstrap_history_id
            })
        }
        if ($markedHistory.Count -eq 1 -and
            [bool]($markedHistory[0].StartedManually) -and
            [string]($markedHistory[0].Result) -eq 'Succeeded') {
            Write-Output 'nochange'
            return
        }

        $preexistingStatus = [string]$s.GetSynchronizationStatus()
        if ($preexistingStatus -ne 'NotProcessing') {
            if ($preexistingStatus -eq 'Running') {
                $s.StopSynchronization()
            }
            $stopDeadline = (Get-Date).AddSeconds([int]$env:ACCEPT_TIMEOUT)
            do {
                Start-Sleep -Seconds 3
            } while ([string]$s.GetSynchronizationStatus() -ne 'NotProcessing' -and
                     (Get-Date) -lt $stopDeadline)
            if ([string]$s.GetSynchronizationStatus() -ne 'NotProcessing') {
                throw 'could not stop the pre-existing synchronization before category bootstrap'
            }
        }

        $preHistoryIds = @{}
        foreach ($entry in @($s.GetSynchronizationHistory())) {
            $preHistoryIds[[string]$entry.Id] = $true
        }
        $requestStartUtc = [DateTime]::UtcNow
        # WSUS persists StartTime at coarser precision on some releases. The unique-history-ID and
        # StartedManually checks remain authoritative; this small floor only avoids clock truncation.
        $requestFloorUtc = $requestStartUtc.AddSeconds(-5)
        $s.StartSynchronizationForCategoryOnly()

        $acceptDeadline = (Get-Date).AddSeconds([int]$env:ACCEPT_TIMEOUT)
        do {
            Start-Sleep -Seconds 3
            $newHistory = @($s.GetSynchronizationHistory() | Where-Object {
                -not $preHistoryIds.ContainsKey([string]$_.Id) -and
                [bool]$_.StartedManually -and
                $_.StartTime.ToUniversalTime() -ge $requestFloorUtc
            })
            $accepted = ([string]$s.GetSynchronizationStatus() -ne 'NotProcessing') -or
                ($newHistory.Count -gt 0)
        } while (-not $accepted -and (Get-Date) -lt $acceptDeadline)
        if (-not $accepted) {
            throw 'this category-only synchronization was not accepted within bootstrap_accept_timeout_sec'
        }

        $deadline = (Get-Date).AddSeconds([int]$env:COMPLETION_TIMEOUT)
        while ([string]$s.GetSynchronizationStatus() -ne 'NotProcessing' -and
               (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds ([int]$env:POLL_SECONDS)
        }
        if ([string]$s.GetSynchronizationStatus() -ne 'NotProcessing') {
            throw 'category sync did not reach a terminal state within bootstrap_completion_timeout_sec'
        }
        $invocationHistory = @($s.GetSynchronizationHistory() | Where-Object {
            -not $preHistoryIds.ContainsKey([string]$_.Id) -and
            [bool]$_.StartedManually -and
            $_.StartTime.ToUniversalTime() -ge $requestFloorUtc
        })
        if ($invocationHistory.Count -ne 1) {
            throw ('category sync reached idle with ' + $invocationHistory.Count +
                ' new manual history records attributable to this invocation; expected exactly one')
        }
        $completed = $invocationHistory[0]
        if ([string]$completed.Result -ne 'Succeeded') {
            throw ('category sync invocation ' + [string]$completed.Id + ' terminal result was ' +
                [string]$completed.Result + ', not Succeeded')
        }
        if (-not (Test-Path $key)) {
            New-Item -Path $key -Force | Out-Null
        }
        New-ItemProperty -Path $key -Name 'category_bootstrap_history_id' -Value ([string]$completed.Id) -PropertyType String -Force | Out-Null
        New-ItemProperty -Path $key -Name 'category_bootstrap_server_id' -Value $serverId -PropertyType String -Force | Out-Null
        # Commit the fingerprint last. A kill between registry writes cannot make an invocation
        # under an older source/language contract look current.
        New-ItemProperty -Path $key -Name 'category_bootstrap_fingerprint' -Value $fingerprint -PropertyType String -Force | Out-Null
        Write-Output 'changed'
        }
      environment:
        ACCEPT_TIMEOUT: '{{ config.sync.bootstrap_accept_timeout_sec }}'
        COMPLETION_TIMEOUT: '{{ config.sync.bootstrap_completion_timeout_sec }}'
        POLL_SECONDS: '{{ config.sync.bootstrap_poll_sec }}'
        UPSTREAM_SERVER: '{{ config.upstream_server | string | trim }}'
        UPSTREAM_PORT: '{{ config.sync.upstream_port }}'
        UPSTREAM_SSL: '{{ config.sync.upstream_use_ssl | bool | lower }}'
        REPLICA: '{{ config.sync.replica | bool | lower }}'
        WSUS_LANGS: '{{ config.sync.update_languages | map("lower") | sort | join(",") }}'
      register: __wsus_bootstrap__
      changed_when: "__wsus_bootstrap__.stdout | trim == 'changed'"

    #endregion --- [ Main: WSUS Sync Configuration ] -------------------------------------- #

    #region ------ [ Main: IIS Logging + Relocation ] ------------------------------------- #

    # Web-Http-Logging was installed with the WSUS feature set above, before the reboot and
    # postinstall boundary.  The tasks below can therefore treat active W3C logging as an
    # invariant rather than mutating Windows features midway through configuration.

    # IIS site-level log paths can override siteDefaults, so the role repoints both to the
    # literal G: path for STIG-auditable active logging off the system volume. Validate the
    # path before any mutation and create the directory in-shell so a bad %VAR% override is
    # never expanded by another module before rejection.
    - name: 'MAIN | Relocate IIS Logs To G:'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        function Normalize-IisConfiguredPath([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p)) {
                return ''
            }
            return $p.Trim().Replace('/', [char]92).TrimEnd([char]92)
        }
        $want = Normalize-IisConfiguredPath $env:IIS_LOG_DIR
        if ($want -match '%[^%]+%' -or $want -notmatch '^[A-Za-z]:') {
            throw ('iis.log_dir must be a literal drive-qualified path (no %VAR%): ' + $env:IIS_LOG_DIR)
        }
        $changed = $false
        if (-not (Test-Path -LiteralPath $want)) {
            New-Item -ItemType Directory -Path $want -Force | Out-Null
            $changed = $true
        }
        function Test-IisConfiguredPath([string]$cur) {
            $c = Normalize-IisConfiguredPath $cur
            if ($c -match '%[^%]+%') {
                return $false
            }
            return [string]::Equals($c, $want, [System.StringComparison]::OrdinalIgnoreCase)
        }
        $globalCur = (Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name directory).Value
        $globalEnabled = (Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name enabled).Value
        $sites = @(Get-Website)
        if (-not (Test-IisConfiguredPath $globalCur)) {
            Set-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name directory -value $want
            $changed = $true
        }
        if (-not [System.Convert]::ToBoolean($globalEnabled)) {
            Set-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name enabled -value $true
            $changed = $true
        }
        foreach ($s in $sites) {
            $sitePath = 'IIS:\Sites' + [char]92 + $s.Name
            if (-not (Test-IisConfiguredPath $s.logFile.directory)) {
                Set-ItemProperty -LiteralPath $sitePath -name logFile.directory -value $want
                $changed = $true
            }
            if (-not [System.Convert]::ToBoolean($s.logFile.enabled)) {
                Set-ItemProperty -LiteralPath $sitePath -name logFile.enabled -value $true
                $changed = $true
            }
        }
        $globalAfter = (Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name directory).Value
        $globalEnabledAfter = (Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name enabled).Value
        $bad = @()
        if (-not (Test-IisConfiguredPath $globalAfter) -or
            (-not [System.Convert]::ToBoolean($globalEnabledAfter))) {
            $bad += 'siteDefaults'
        }
        foreach ($s in @(Get-Website)) {
            if (-not (Test-IisConfiguredPath $s.logFile.directory) -or
                (-not [System.Convert]::ToBoolean($s.logFile.enabled))) {
                $bad += $s.Name
            }
        }
        if ($bad.Count -gt 0) {
            throw ('IIS logging did not persist as enabled at ' + $want + ' for: ' + ($bad -join ','))
        }
        if ($changed) {
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        IIS_LOG_DIR: '{{ config.iis.log_dir }}'
      register: __iis_logdir__
      changed_when: "__iis_logdir__.stdout | trim == 'changed'"

    # Validate once before mutation so native path params never expand a bad %VAR% override.
    - name: 'MAIN | Validate + Normalize IIS wwwroot Target'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $p = $env:WWWROOT
        if ([string]::IsNullOrWhiteSpace($p)) {
            throw 'iis.wwwroot is required'
        }
        $norm = $p.Trim().Replace('/', [char]92).TrimEnd([char]92)
        if ($norm -match '%[^%]+%' -or $norm -notmatch '^[A-Za-z]:') {
            throw ('iis.wwwroot must be a literal drive-qualified path (no %VAR%): ' + $p)
        }
        Write-Output $norm
      environment:
        WWWROOT: '{{ config.iis.wwwroot }}'
      register: __iis_wwwroot_norm__
      changed_when: false

    # Copy content before repointing so the Default Web Site has a populated G: root.
    - name: 'MAIN | Copy IIS wwwroot Content To G:'
      ansible.windows.win_copy:
        src: 'C:\inetpub\wwwroot\'
        dest: '{{ __iis_wwwroot_norm__.stdout | trim }}\'
        remote_src: true

    # Repoint IIS default-root metadata in both registry views to the IIS disk.
    - name: 'MAIN | Repoint InetStp PathWWWRoot To G:'
      ansible.windows.win_regedit:
        path: '{{ item }}'
        name: PathWWWRoot
        data: '{{ __iis_wwwroot_norm__.stdout | trim }}'
        type: string
      loop:
        - 'HKLM:\SOFTWARE\Microsoft\InetStp'
        - 'HKLM:\SOFTWARE\Wow6432Node\Microsoft\InetStp'

    # Repoint only the Default Web Site; the WSUS Administration site stays untouched.
    - name: 'MAIN | Repoint Default Web Site Root To G:'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        function Normalize-IisConfiguredPath([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p)) {
                return ''
            }
            return $p.Trim().Replace('/', [char]92).TrimEnd([char]92)
        }
        $want = Normalize-IisConfiguredPath $env:WWWROOT
        if ($want -match '%[^%]+%' -or $want -notmatch '^[A-Za-z]:') {
            throw ('wwwroot must be a literal drive-qualified path (no %VAR%): ' + $env:WWWROOT)
        }
        $site = Get-Website -Name 'Default Web Site'
        if (-not $site) {
            throw 'Default Web Site not found'
        }
        function Test-IisConfiguredPath([string]$cur) {
            $c = Normalize-IisConfiguredPath $cur
            if ($c -match '%[^%]+%') {
                return $false
            }
            return [string]::Equals($c, $want, [System.StringComparison]::OrdinalIgnoreCase)
        }
        if (-not (Test-IisConfiguredPath $site.physicalPath)) {
            Set-ItemProperty -LiteralPath 'IIS:\Sites\Default Web Site' -name physicalPath -value $want
            $after = (Get-Website -Name 'Default Web Site').physicalPath
            if (-not (Test-IisConfiguredPath $after)) {
                throw ('Default Web Site physicalPath did not persist to ' + $want + ' (got ' + $after + ')')
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        WWWROOT: '{{ __iis_wwwroot_norm__.stdout | trim }}'
      register: __iis_wwwroot__
      changed_when: "__iis_wwwroot__.stdout | trim == 'changed'"

    # STIG V-218790 (IIST-SV-000115): the IIS log directory must grant SYSTEM + Administrators FullControl.
    # Director (2026-07-18): org convention + STIG FC — keep the explicit BUILTIN\Users ReadAndExecute grant
    # (ratified Users-ACL convention: everyone-is-admin, explicit not inherited) AND add SYSTEM/Administrators
    # FullControl. Additive (state present) — does not strip other ACEs. Native win_acl, idempotent.
    - name: 'MAIN | Set IIS Log Directory ACLs (SYSTEM/Admins FullControl, Users R&X)'
      ansible.windows.win_acl:
        path: '{{ config.iis.log_dir }}'
        user: '{{ item.user }}'
        rights: '{{ item.rights }}'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present
      loop:
        - { user: 'NT AUTHORITY\SYSTEM', rights: 'FullControl' }
        - { user: 'BUILTIN\Administrators', rights: 'FullControl' }
        - { user: 'BUILTIN\Users', rights: 'ReadAndExecute' }
      loop_control:
        label: '{{ item.user }}'

    #endregion --- [ Main: IIS Logging + Relocation ] ------------------------------------- #

    #region ------ [ Main: WSUS SSL (delivered certificate) ] ------------------------------ #

    # The CA-issued PFX and its password live at the artifact prefix the IAM pins
    # (bucket = wsus.bucket, keys tls.pfx_key and tls.pfx_key + '.password'). The CONTROLLER
    # downloads both through the read-only artifact-reader role (s3_artifact_delivery get) —
    # the target never holds an S3 credential — then copies the PFX up, imports it with the
    # password as a no_log argument, validates it without persisting its key, imports the exact
    # pinned leaf, binds it to tls.port in IIS, and wsusutil configuressl flips client-facing
    # endpoints to HTTPS. Trust distribution stays out of scope.

    # The block conditional is re-evaluated for every task it covers, including tasks inside the
    # delivery role below — where the lazy `config` binding resolves against that role's own name
    # and fails. Pin the flag as a host fact so the inherited conditional stays resolvable.
    - name: 'MAIN | Resolve The TLS Enablement Flag'
      ansible.builtin.set_fact:
        __tls_enabled__: '{{ config.tls.enabled | bool }}'

    - name: 'MAIN | Deliver, Validate, Import, And Bind The TLS Certificate'
      when: __tls_enabled__
      block:
        - name: 'MAIN | Resolve The Pinned TLS Identity'
          ansible.builtin.set_fact:
            __tls_thumbprint__: '{{ config.tls.thumbprint | trim | upper }}'

        # Skip controller delivery on a converged second pass. Binding and live validation below
        # still run every time, so drift is repaired without counting two ephemeral S3 downloads.
        - name: 'MAIN | Probe The Pinned Certificate In The Machine Store'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            function Test-ServerAuthenticationEku(
                [System.Security.Cryptography.X509Certificates.X509Certificate2]$certificate
            ) {
                foreach ($extension in $certificate.Extensions) {
                    if ($extension.Oid.Value -ne '2.5.29.37') { continue }
                    $eku = [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new()
                    $eku.CopyFrom($extension)
                    foreach ($usage in $eku.EnhancedKeyUsages) {
                        if ($usage.Value -eq '1.3.6.1.5.5.7.3.1') { return $true }
                    }
                }
                # This managed endpoint requires an explicit Server Authentication purpose;
                # absence of the EKU extension is not interpreted as unrestricted use.
                return $false
            }
            $cert = Get-Item (Join-Path 'Cert:\LocalMachine\My' $env:TLS_THUMBPRINT) -ErrorAction SilentlyContinue
            if (-not $cert -or -not $cert.HasPrivateKey -or $cert.NotBefore -gt (Get-Date) -or
                $cert.NotAfter -lt (Get-Date).AddDays([int]$env:MINIMUM_VALIDITY_DAYS) -or
                -not (Test-ServerAuthenticationEku $cert)) {
                Write-Output 'absent'
                return
            }
            # GetNameInfo returns one arbitrary DNS name; a multi-SAN certificate matches when ANY
            # of its DNS names does. DnsNameList enumerates every SAN entry with a CN fallback.
            $wantedDns = $env:TLS_DNS_NAME.Trim().ToLowerInvariant()
            $certificateNames = @($cert.DnsNameList | ForEach-Object { "$($_.Unicode)".Trim().ToLowerInvariant() })
            $dnsMatches = $false
            foreach ($certificateDns in $certificateNames) {
                if ($certificateDns -eq $wantedDns) { $dnsMatches = $true; break }
                if ($certificateDns.StartsWith('*.')) {
                    $suffix = $certificateDns.Substring(1)
                    if ($wantedDns.EndsWith($suffix) -and
                        ($wantedDns.Split('.').Count -eq $certificateDns.Split('.').Count)) { $dnsMatches = $true; break }
                }
            }
            if ($dnsMatches) { Write-Output 'present' } else { Write-Output 'absent' }
          environment:
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
            TLS_DNS_NAME: '{{ config.tls.dns_name }}'
            MINIMUM_VALIDITY_DAYS: '{{ config.tls.minimum_validity_days }}'
          register: __tls_store_probe__
          changed_when: false

        - name: 'MAIN | Create A Unique TLS Staging Directory On The Controller'
          when: __tls_store_probe__.stdout | trim != 'present'
          delegate_to: localhost
          become: false
          ansible.builtin.tempfile:
            state: directory
            prefix: 'windows-wsus-tls-'
          register: __tls_controller_temp__
          changed_when: false

        - name: 'MAIN | Restrict The Controller TLS Staging Directory'
          when: __tls_store_probe__.stdout | trim != 'present'
          delegate_to: localhost
          become: false
          ansible.builtin.file:
            path: '{{ __tls_controller_temp__.path }}'
            state: directory
            mode: '0700'
          changed_when: false

        # Host facts cross the included role's scope boundary; unique paths prevent a failed or
        # concurrent run from reusing stale PFX/password bytes.
        - name: 'MAIN | Resolve The Unique TLS Delivery Coordinates'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.builtin.set_fact:
            __tls_staging__: '{{ __tls_controller_temp__.path }}'
            __tls_bucket__: '{{ config.bucket }}'
            __tls_pfx_key__: '{{ config.tls.pfx_key }}'

        - name: 'MAIN | Download The TLS Certificate And Password To The Controller'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.builtin.include_role:
            name: 's3_artifact_delivery'
            tasks_from: 'get'
          vars:
            s3_artifact_delivery_reader_role_arn: "arn:aws:iam::{{ aws_account_id }}:role/windows-wsus-artifact-reader"
            s3_artifact_delivery_session_name: 'wsus-tls-delivery'
            s3_artifact_delivery_bucket: '{{ __tls_bucket__ }}'
            s3_artifact_delivery_region: '{{ aws_region }}'
            s3_artifact_delivery_controller_objects:
              - object_key: '{{ __tls_pfx_key__ }}'
                destination: '{{ __tls_staging__ }}/certificate.pfx'
              - object_key: '{{ __tls_pfx_key__ }}.password'
                destination: '{{ __tls_staging__ }}/certificate.pfx.password'

        - name: 'MAIN | Read The PFX Password Into Protected Memory'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.builtin.set_fact:
            __tls_pfx_password__: "{{ lookup('ansible.builtin.file', __tls_staging__ ~ '/certificate.pfx.password') | trim }}"
          no_log: true

        - name: 'MAIN | Create A Unique TLS Staging Directory On The Target'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_tempfile:
            state: directory
            prefix: 'windows-wsus-tls-'
          register: __tls_target_temp__
          changed_when: false

        - name: 'MAIN | Copy The Certificate To The Unique Target Path'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_copy:
            src: '{{ __tls_staging__ }}/certificate.pfx'
            dest: '{{ __tls_target_temp__.path }}\certificate.pfx'
          changed_when: false

        # Load with EphemeralKeySet so validation cannot persist the private key.  Import happens
        # only after private-key, pin, DNS identity, activation, and expiry checks all pass.
        - name: 'MAIN | Validate The PFX Before Import'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            function Test-ServerAuthenticationEku(
                [System.Security.Cryptography.X509Certificates.X509Certificate2]$certificate
            ) {
                foreach ($extension in $certificate.Extensions) {
                    if ($extension.Oid.Value -ne '2.5.29.37') { continue }
                    $eku = [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new()
                    $eku.CopyFrom($extension)
                    foreach ($usage in $eku.EnhancedKeyUsages) {
                        if ($usage.Value -eq '1.3.6.1.5.5.7.3.1') { return $true }
                    }
                }
                return $false
            }
            $storageFlags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]
            try {
                try {
                    $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                        $env:PFX_PATH, $env:PFX_PASSWORD, $storageFlags::EphemeralKeySet)
                } catch [System.Security.Cryptography.CryptographicException] {
                    # .NET Framework rejects EphemeralKeySet for legacy CAPI-keyed PFXs; fall back
                    # to a non-persisted machine-context load. Dispose below scrubs its key file.
                    $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                        $env:PFX_PATH, $env:PFX_PASSWORD, $storageFlags::MachineKeySet)
                }
                try {
                    $wantThumb = $env:TLS_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
                    $gotThumb = $cert.Thumbprint.Replace(' ', '').ToUpperInvariant()
                    if (-not $cert.HasPrivateKey) { throw 'PFX leaf certificate has no private key' }
                    if ($gotThumb -ne $wantThumb) { throw "PFX thumbprint $gotThumb does not match pinned $wantThumb" }
                    if (-not (Test-ServerAuthenticationEku $cert)) {
                        throw ('PFX leaf certificate must explicitly permit Server Authentication ' +
                            'EKU (OID 1.3.6.1.5.5.7.3.1); an absent EKU extension is not accepted')
                    }
                    $now = Get-Date
                    if ($cert.NotBefore -gt $now) { throw ('certificate is not active until ' + $cert.NotBefore.ToString('o')) }
                    $minimumExpiry = $now.AddDays([int]$env:MINIMUM_VALIDITY_DAYS)
                    if ($cert.NotAfter -lt $minimumExpiry) { throw ('certificate expires too soon: ' + $cert.NotAfter.ToString('o')) }
                    # GetNameInfo returns one arbitrary DNS name; a multi-SAN certificate matches
                    # when ANY of its DNS names does. DnsNameList enumerates every SAN entry.
                    $wantedDns = $env:TLS_DNS_NAME.Trim().ToLowerInvariant()
                    $certificateNames = @($cert.DnsNameList | ForEach-Object { "$($_.Unicode)".Trim().ToLowerInvariant() })
                    $dnsMatches = $false
                    foreach ($certificateDns in $certificateNames) {
                        if ($certificateDns -eq $wantedDns) { $dnsMatches = $true; break }
                        if ($certificateDns.StartsWith('*.')) {
                            $suffix = $certificateDns.Substring(1)
                            if ($wantedDns.EndsWith($suffix) -and
                                ($wantedDns.Split('.').Count -eq $certificateDns.Split('.').Count)) { $dnsMatches = $true; break }
                        }
                    }
                    if (-not $dnsMatches) {
                        throw ('certificate DNS names (' + ($certificateNames -join ', ') + ") do not match ${wantedDns}")
                    }
                    Write-Output ('validated:' + $gotThumb)
                } finally {
                    $cert.Dispose()
                }
            } catch {
                # Sanitized marker for the uncensored assert below; never includes the password.
                Write-Output ('validation-error: ' + $_.Exception.GetType().FullName + ': ' + $_.Exception.Message)
                exit 1
            }
          environment:
            PFX_PATH: '{{ __tls_target_temp__.path }}\certificate.pfx'
            PFX_PASSWORD: '{{ __tls_pfx_password__ }}'
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
            TLS_DNS_NAME: '{{ config.tls.dns_name }}'
            MINIMUM_VALIDITY_DAYS: '{{ config.tls.minimum_validity_days }}'
          no_log: true
          changed_when: false
          failed_when: false
          register: __tls_validate__

        # no_log censors the validator's own failure output. Its stdout carries only the
        # sanitized markers above, so this separate task can surface the verdict readably.
        - name: 'MAIN | Enforce The PFX Validation Verdict'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.builtin.assert:
            that:
              - __tls_validate__.rc == 0
              - __tls_validate__.stdout is search('^validated:')
            fail_msg: 'PFX validation failed: {{ __tls_validate__.stdout | trim }}'
            success_msg: '{{ __tls_validate__.stdout | trim }}'

        - name: 'MAIN | Import The Validated Certificate Into The Machine Store'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_certificate_store:
            path: '{{ __tls_target_temp__.path }}\certificate.pfx'
            password: '{{ __tls_pfx_password__ }}'
            store_location: 'LocalMachine'
            store_name: 'My'
            key_storage: 'machine'
            key_exportable: false
            state: present
          no_log: true
          register: __tls_import__

        # Do not rely on win_certificate_store.thumbprints: some collection versions return
        # that list only when an import changed the store. Query the converged store directly.
        - name: 'MAIN | Assert The Pinned Leaf Exists In The Machine Store'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $cert = Get-Item (Join-Path 'Cert:\LocalMachine\My' $env:TLS_THUMBPRINT) -ErrorAction Stop
            if ($cert.Thumbprint.ToUpperInvariant() -ne $env:TLS_THUMBPRINT) {
                throw ('machine-store thumbprint differs from pin: ' + $cert.Thumbprint)
            }
            if (-not $cert.HasPrivateKey) { throw 'pinned machine-store certificate has no private key' }
            Write-Output 'present'
          environment:
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
          changed_when: false

        - name: 'MAIN | Bind The Pinned Certificate To The WSUS HTTPS Endpoint'
          ansible.windows.win_powershell:
            error_action: stop
            script: |
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $false
              Import-Module WebAdministration
              $thumb = $env:TLS_THUMBPRINT
              $port = [int]$env:TLS_PORT
              $siteName = 'WSUS Administration'
              $sitePath = Join-Path 'IIS:\Sites' $siteName
              $desiredBinding = '*:' + $port + ':'
              $changed = $false

              if (-not (Test-Path -LiteralPath $sitePath)) {
                  throw ('required IIS site is absent: ' + $siteName)
              }

              function Get-IisBindingsAtPort([int]$listenerPort) {
                  $records = @()
                  foreach ($configuredSite in @(Get-Website -ErrorAction Stop)) {
                      foreach ($configuredBinding in @(Get-WebBinding -Name $configuredSite.Name -ErrorAction Stop)) {
                          $bindingInformation = [string]$configuredBinding.bindingInformation
                          # Parse the HTTP(S) ip:port:host form from the right so IPv6 addresses are
                          # safe, then recognize the leading-port form used by other IIS protocols.
                          $portMatch = [regex]::Match(
                              $bindingInformation,
                              '^(?<address>.*):(?<port>[0-9]{1,5}):(?<host>.*)$'
                          )
                          if (-not $portMatch.Success) {
                              $portMatch = [regex]::Match($bindingInformation, '^(?<port>[0-9]{1,5})(?::|$)')
                          }
                          if ($portMatch.Success -and [int]$portMatch.Groups['port'].Value -eq $listenerPort) {
                              $records += [pscustomobject]@{
                                  Site = [string]$configuredSite.Name
                                  Protocol = [string]$configuredBinding.protocol
                                  BindingInformation = $bindingInformation
                                  Port = [int]$portMatch.Groups['port'].Value
                                  SslFlags = [string]$configuredBinding.sslFlags
                              }
                          }
                      }
                  }
                  return @($records)
              }

              function Get-WsusHttpsBindingRecords {
                  $records = @()
                  foreach ($configuredBinding in @(Get-WebBinding -Name $siteName -Protocol https -ErrorAction Stop)) {
                      $bindingInformation = [string]$configuredBinding.bindingInformation
                      $portMatch = [regex]::Match(
                          $bindingInformation,
                          '^(?<address>.*):(?<port>[0-9]{1,5}):(?<host>.*)$'
                      )
                      if (-not $portMatch.Success) {
                          throw ('cannot safely parse WSUS HTTPS binding port: [' + $bindingInformation + ']')
                      }
                      $records += [pscustomobject]@{
                          Site = $siteName
                          Protocol = [string]$configuredBinding.protocol
                          BindingInformation = $bindingInformation
                          Port = [int]$portMatch.Groups['port'].Value
                          SslFlags = [string]$configuredBinding.sslFlags
                      }
                  }
                  return @($records)
              }

              function Format-IisBindingOwners($records) {
                  return @( $records | ForEach-Object {
                      $_.Site + '|' + $_.Protocol + '|' + $_.BindingInformation + '|sslFlags=' + $_.SslFlags
                  })
              }

              function Assert-WsusPortExclusive([int]$listenerPort, [string]$operation) {
                  $foreign = @(Get-IisBindingsAtPort $listenerPort | Where-Object {
                      -not [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
                  })
                  if ($foreign.Count -gt 0) {
                      throw ($operation + ' would affect a port owned by another IIS site: port=' +
                          $listenerPort + ' foreignBindings=[' +
                          ((Format-IisBindingOwners $foreign) -join ';') + ']')
                  }
              }

              function Assert-WsusBindingRemovalPortsExclusive($candidates) {
                  $checkedPorts = @{}
                  foreach ($candidate in @($candidates)) {
                      $candidatePort = [int]$candidate.Port
                      if ($candidatePort -lt 1 -or $candidatePort -gt 65535) {
                          throw ('refusing stale WSUS binding removal with an invalid parsed port: binding=[' +
                              $candidate.Protocol + '|' + $candidate.BindingInformation +
                              '] parsedPort=' + $candidatePort)
                      }
                      if ($checkedPorts.ContainsKey($candidatePort)) { continue }
                      $checkedPorts[$candidatePort] = $true
                      Assert-WsusPortExclusive $candidatePort 'stale WSUS binding removal'
                  }
              }

              $portBindings = @(Get-IisBindingsAtPort $port)
              $foreignBindings = @($portBindings | Where-Object {
                  -not [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
              })
              if ($foreignBindings.Count -gt 0) {
                  throw ('target WSUS port is owned by another IIS site; refusing mutation: port=' +
                      $port + ' foreignBindings=[' + ((Format-IisBindingOwners $foreignBindings) -join ';') + ']')
              }

              $ownedTargetPortBindings = @($portBindings | Where-Object {
                  [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
              })
              $ownedHttpsBindings = @(Get-WsusHttpsBindingRecords)
              $desiredBindings = @($ownedHttpsBindings | Where-Object {
                  [string]::Equals($_.Protocol, 'https', [System.StringComparison]::OrdinalIgnoreCase) -and
                  [string]::Equals($_.BindingInformation, $desiredBinding, [System.StringComparison]::Ordinal)
              })
              $nonDesiredTargetPortBindings = @($ownedTargetPortBindings | Where-Object {
                  (-not [string]::Equals($_.Protocol, 'https', [System.StringComparison]::OrdinalIgnoreCase)) -or
                  (-not [string]::Equals($_.BindingInformation, $desiredBinding, [System.StringComparison]::Ordinal))
              })
              $bindingDrift = $ownedHttpsBindings.Count -ne 1 -or $desiredBindings.Count -ne 1 -or
                  $nonDesiredTargetPortBindings.Count -gt 0 -or
                  [int]($desiredBindings[0].SslFlags) -ne 0

              $bindingsToRemove = @()
              if ($bindingDrift) {
                  $seenBindings = @{}
                  foreach ($candidate in @($ownedHttpsBindings) + @($ownedTargetPortBindings)) {
                      $key = $candidate.Protocol.ToLowerInvariant() + '|' + $candidate.BindingInformation
                      if (-not $seenBindings.ContainsKey($key)) {
                          $seenBindings[$key] = $true
                          $bindingsToRemove += $candidate
                      }
                  }

                  # An HTTPS certificate mapping is global to its endpoint.  Before stopping the
                  # site, prove that no foreign IIS site shares any binding-removal candidate port.
                  Assert-WsusBindingRemovalPortsExclusive $bindingsToRemove
              }

              $sslPath = 'IIS:\SslBindings\0.0.0.0!' + $port
              $boundBefore = Get-Item $sslPath -ErrorAction SilentlyContinue
              $certificateDriftBefore = -not $boundBefore -or
                  (-not [string]::Equals([string]$boundBefore.Thumbprint, $thumb, [System.StringComparison]::OrdinalIgnoreCase))

              if ($bindingDrift -or $certificateDriftBefore) {
                  # Binding/provider changes are committed only while this site is fully stopped.
                  # This prevents WAS from observing a half-updated live listener.  No service or
                  # unrelated site is touched; the shared listener helper starts this site later.
                  $stopIssued = $false
                  $stopped = $false
                  for ($attempt = 0; $attempt -lt 20; $attempt++) {
                      $siteState = [string](Get-WebItemState -PSPath $sitePath -ErrorAction Stop).Value
                      if ($siteState -eq 'Stopped') {
                          $stopped = $true
                          break
                      }
                      if ($siteState -eq 'Started' -and -not $stopIssued) {
                          Stop-Website -Name $siteName -ErrorAction Stop | Out-Null
                          $stopIssued = $true
                      } elseif ($siteState -ne 'Started' -and $siteState -ne 'Starting' -and $siteState -ne 'Stopping') {
                          throw ('WSUS IIS site has an unsafe state before TLS binding mutation: ' + $siteState)
                      }
                      Start-Sleep -Milliseconds 500
                  }
                  if (-not $stopped) {
                      throw ('WSUS IIS site did not stop within 10 seconds before TLS binding mutation; state=' +
                          [string](Get-WebItemState -PSPath $sitePath -ErrorAction Stop).Value)
                  }

                  # Re-read every ownership boundary after the bounded stop.  The initial snapshot
                  # may be ten seconds old, so it cannot authorize the global endpoint mutations.
                  Assert-WsusPortExclusive $port 'WSUS TLS reconciliation'
                  if ($bindingDrift) {
                      Assert-WsusBindingRemovalPortsExclusive $bindingsToRemove
                      # Remove every WSUS-owned HTTPS endpoint (including a stale old TLS port) and
                      # every non-HTTPS binding incorrectly placed on the desired TLS port.  The
                      # WSUS HTTP payload binding on 8530 and every foreign site remain untouched.
                      foreach ($ownedBinding in $bindingsToRemove) {
                          Remove-WebBinding -Name $siteName -Protocol $ownedBinding.Protocol `
                              -BindingInformation $ownedBinding.BindingInformation -ErrorAction Stop `
                              -Confirm:$false | Out-Null
                      }
                      # Omitting HostHeader creates the exact wildcard, empty-host listener.
                      New-WebBinding -Name $siteName -Protocol https -Port $port -IPAddress '*' -SslFlags 0 | Out-Null
                      Assert-WsusBindingRemovalPortsExclusive $bindingsToRemove
                  }

                  # Re-read after binding normalization: removing/recreating an IIS binding can
                  # change its provider mapping, so the pre-mutation snapshot is not authoritative.
                  $bound = Get-Item $sslPath -ErrorAction SilentlyContinue
                  $certificateDrift = -not $bound -or
                      (-not [string]::Equals([string]$bound.Thumbprint, $thumb, [System.StringComparison]::OrdinalIgnoreCase))
                  if ($certificateDrift) {
                      if ($bound) {
                          Assert-WsusPortExclusive $port 'global SSL mapping removal'
                          Remove-Item $sslPath -ErrorAction Stop
                      }
                      $cert = Get-Item (Join-Path 'Cert:\LocalMachine\My' $thumb) -ErrorAction Stop
                      if (-not $cert.HasPrivateKey) { throw 'pinned certificate in LocalMachine/My has no private key' }
                      Assert-WsusPortExclusive $port 'global SSL mapping creation'
                      New-Item $sslPath -Value $cert | Out-Null
                  }
                  Assert-WsusPortExclusive $port 'post-mutation TLS verification'
                  $changed = $true
              }

              $verifyPortBindings = @(Get-IisBindingsAtPort $port)
              $verifyForeignBindings = @($verifyPortBindings | Where-Object {
                  -not [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
              })
              if ($verifyForeignBindings.Count -gt 0) {
                  throw ('foreign IIS ownership appeared during WSUS TLS reconciliation: [' +
                      ((Format-IisBindingOwners $verifyForeignBindings) -join ';') + ']')
              }
              $verifyOwnedBindings = @($verifyPortBindings | Where-Object {
                  [string]::Equals($_.Site, $siteName, [System.StringComparison]::OrdinalIgnoreCase)
              })
              $verifyOwnedHttpsBindings = @(Get-WsusHttpsBindingRecords)
              if ($verifyOwnedBindings.Count -ne 1 -or $verifyOwnedHttpsBindings.Count -ne 1 -or
                  (-not [string]::Equals($verifyOwnedBindings[0].Protocol, 'https', [System.StringComparison]::OrdinalIgnoreCase)) -or
                  (-not [string]::Equals($verifyOwnedBindings[0].BindingInformation, $desiredBinding, [System.StringComparison]::Ordinal)) -or
                  [int]($verifyOwnedBindings[0].SslFlags) -ne 0) {
                  throw ('WSUS site does not expose exactly one HTTPS binding total at target=' +
                      $desiredBinding + ' sslFlags=0; targetPortActual=[' +
                      ((Format-IisBindingOwners $verifyOwnedBindings) -join ';') +
                      '] allHttpsActual=[' + ((Format-IisBindingOwners $verifyOwnedHttpsBindings) -join ';') + ']')
              }

              $verify = Get-Item $sslPath -ErrorAction Stop
              if (-not [string]::Equals([string]$verify.Thumbprint, $thumb, [System.StringComparison]::OrdinalIgnoreCase)) {
                  throw 'SSL binding did not persist the pinned thumbprint'
              }
              $Ansible.Changed = $changed
              if ($changed) { Write-Output 'changed' } else { Write-Output 'nochange' }
          environment:
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
            TLS_PORT: '{{ config.tls.port }}'
          register: __tls_binding__

        # configuressl persists the client endpoint contract in the WSUS Server Setup registry
        # key.  Read all three authoritative values before deciding whether the utility must run.
        - name: 'MAIN | Require SSL On The Client-Facing WSUS Endpoints'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            Import-Module WebAdministration
            $dns = $env:TLS_DNS_NAME
            $port = [int]$env:TLS_PORT
            $setupPath = 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup'
            $before = Get-ItemProperty -Path $setupPath -ErrorAction Stop
            $wsusSslDrift = ([int]$before.UsingSSL -ne 1) -or
                ([int]$before.PortNumber -ne $port) -or
                (-not [string]::Equals([string]$before.ServerCertificateName, $dns, [System.StringComparison]::OrdinalIgnoreCase))
            $vdirs = @(
                'ApiRemoting30',
                'ClientWebService',
                'DSSAuthWebService',
                'ServerSyncWebService',
                'SimpleAuthWebService'
            )
            $changed = $false

            function New-WsusServerManager {
                $os64 = [System.Environment]::Is64BitOperatingSystem
                $process64 = [System.Environment]::Is64BitProcess
                $powerShellVersion = [string]$PSVersionTable.PSVersion
                $powerShellEdition = [string]$PSVersionTable.PSEdition
                $assemblyPath = '<loaded-assembly-not-resolved>'
                $runtimeContext = 'assembly=[' + $assemblyPath + '] os64=[' + $os64 +
                    '] process64=[' + $process64 + '] powershell=[' + $powerShellVersion +
                    '] edition=[' + $powerShellEdition + ']'
                if (-not $process64) {
                    throw ('64-bit PowerShell is required for IIS management: ' + $runtimeContext)
                }
                $typeName = 'Microsoft.Web.Administration.ServerManager'

                function Resolve-LoadedWsusServerManagerType([string]$requestedTypeName) {
                    foreach ($loadedAssembly in [System.AppDomain]::CurrentDomain.GetAssemblies()) {
                        if ($loadedAssembly.GetName().Name -ne 'Microsoft.Web.Administration') {
                            continue
                        }
                        $candidateType = $loadedAssembly.GetType(
                            $requestedTypeName, $false, $false)
                        if ($null -ne $candidateType) {
                            return $candidateType
                        }
                    }
                    return $null
                }

                try {
                    $serverManagerType = Resolve-LoadedWsusServerManagerType $typeName
                } catch {
                    throw ('Unable to inspect loaded IIS management assemblies: ' + $runtimeContext +
                        ' errorId=[' + [string]$_.FullyQualifiedErrorId + '] exception=[' +
                        $_.Exception.ToString() + ']')
                }
                if ($null -eq $serverManagerType) {
                    $windowsDirectory = [string]$env:WINDIR
                    if ([string]::IsNullOrWhiteSpace($windowsDirectory)) {
                        throw ('WINDIR is unavailable; cannot locate the IIS management assembly: ' +
                            $runtimeContext)
                    }
                    $assemblyPath = Join-Path $windowsDirectory `
                        'System32\inetsrv\Microsoft.Web.Administration.dll'
                    $runtimeContext = 'assembly=[' + $assemblyPath + '] os64=[' + $os64 +
                        '] process64=[' + $process64 + '] powershell=[' + $powerShellVersion +
                        '] edition=[' + $powerShellEdition + ']'
                    if (-not (Test-Path -LiteralPath $assemblyPath -PathType Leaf)) {
                        throw ('IIS management assembly is absent: ' + $runtimeContext)
                    }
                    try {
                        $null = Add-Type -LiteralPath $assemblyPath -ErrorAction Stop
                        $serverManagerType = Resolve-LoadedWsusServerManagerType $typeName
                    } catch {
                        throw ('Unable to load or resolve IIS management assembly: ' +
                            $runtimeContext + ' errorId=[' + [string]$_.FullyQualifiedErrorId +
                            '] exception=[' + $_.Exception.ToString() + ']')
                    }
                }
                if ($null -eq $serverManagerType) {
                    throw ('IIS management TypeNotFound: type=' + $typeName + ' ' + $runtimeContext)
                }
                $loadedAssemblyPath = [string]$serverManagerType.Assembly.Location
                if (-not [string]::IsNullOrWhiteSpace($loadedAssemblyPath)) {
                    $assemblyPath = $loadedAssemblyPath
                }
                $runtimeContext = 'assembly=[' + $assemblyPath + '] os64=[' + $os64 +
                    '] process64=[' + $process64 + '] powershell=[' + $powerShellVersion +
                    '] edition=[' + $powerShellEdition + ']'
                try {
                    $serverManager = [System.Activator]::CreateInstance($serverManagerType)
                } catch {
                    throw ('Unable to construct IIS ServerManager: ' + $runtimeContext +
                        ' errorId=[' + [string]$_.FullyQualifiedErrorId + '] exception=[' +
                        $_.Exception.ToString() + ']')
                }
                if ($null -eq $serverManager) {
                    throw ('IIS ServerManager construction returned null: ' + $runtimeContext)
                }
                return $serverManager
            }

            function Get-WsusAccessSslState([string]$location) {
                $serverManager = New-WsusServerManager
                try {
                    $configuration = $serverManager.GetApplicationHostConfiguration()
                    $section = $configuration.GetSection(
                        'system.webServer/security/access', $location)
                    if ($null -eq $section) {
                        throw ('IIS returned no access section for ' + $location)
                    }
                    $attribute = $section.GetAttribute('sslFlags')
                    if ($null -eq $attribute) {
                        throw ('IIS returned no access.sslFlags attribute for ' + $location)
                    }
                    $value = $attribute.Value
                    $valueText = '<null>'
                    $valueType = '<null>'
                    if ($null -ne $value) {
                        $valueText = ([string]$value).Trim()
                        $valueType = $value.GetType().FullName
                    }
                    return [pscustomobject]@{
                        Location = $location
                        Text = $valueText
                        Type = $valueType
                    }
                } finally {
                    [void]$serverManager.Dispose()
                }
            }

            function Set-WsusAccessSslValue([string]$location, [string]$desiredValue) {
                $serverManager = New-WsusServerManager
                try {
                    $configuration = $serverManager.GetApplicationHostConfiguration()
                    $section = $configuration.GetSection(
                        'system.webServer/security/access', $location)
                    if ($null -eq $section) {
                        throw ('IIS returned no access section for ' + $location)
                    }
                    if ($null -eq $section.GetAttribute('sslFlags')) {
                        throw ('IIS returned no access.sslFlags attribute for ' + $location)
                    }
                    [void]$section.SetAttributeValue('sslFlags', $desiredValue)
                    [void]$serverManager.CommitChanges()
                } finally {
                    [void]$serverManager.Dispose()
                }
            }

            function Test-ExactRequiredSsl($state) {
                return $state.Text -eq 'Ssl' -or $state.Text -eq '8'
            }

            function Format-WsusAccessSslState($state) {
                return ('location=' + $state.Location + ' sslFlags=[' + $state.Text +
                    '] type=[' + $state.Type + ']')
            }

            function Assert-WsusVdirsRequireSsl {
                foreach ($name in $vdirs) {
                    $state = Get-WsusAccessSslState ('WSUS Administration/' + $name)
                    if (-not (Test-ExactRequiredSsl $state)) {
                        throw ('WSUS client web service does not require exact SSL: ' +
                            (Format-WsusAccessSslState $state) + ' expected=[Ssl|8]')
                    }
                }
            }

            function Repair-WsusVdirsRequireSsl {
                $repaired = $false
                foreach ($name in $vdirs) {
                    $location = 'WSUS Administration/' + $name
                    $beforeWrite = Get-WsusAccessSslState $location
                    if (Test-ExactRequiredSsl $beforeWrite) { continue }
                    # This is the access-section schema token, distinct from a binding's sslFlags.
                    # Set, commit, dispose, then use a fresh ServerManager for authoritative proof.
                    Set-WsusAccessSslValue $location 'Ssl'
                    $afterWrite = Get-WsusAccessSslState $location
                    if (-not (Test-ExactRequiredSsl $afterWrite)) {
                        throw ('IIS access.sslFlags write did not persist: ' +
                            (Format-WsusAccessSslState $afterWrite) + ' expected=[Ssl|8]')
                    }
                    $repaired = $true
                }
                Assert-WsusVdirsRequireSsl
                return $repaired
            }

            # Preserve Microsoft's IIS-before-configuressl ordering, and prove the exact access
            # flags immediately. A later pass repeats this after configuressl to close both the
            # commit/readback gap and the interrupted-transition recovery boundary.
            if (Repair-WsusVdirsRequireSsl) {
                $changed = $true
            }
            if ($wsusSslDrift) {
                $wsusutil = Join-Path $env:ProgramFiles 'Update Services\Tools\wsusutil.exe'
                $out = & $wsusutil configuressl $dns 2>&1
                $rc = $LASTEXITCODE
                $text = ($out -join ' ')
                if ($rc -ne 0) { throw ('wsusutil configuressl failed rc=' + $rc + ' output=' + $text) }
                $expectedUrl = 'https://' + $dns + ':' + $port
                if ($text.IndexOf($expectedUrl, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
                    throw ('configuressl did not report the expected URL [' + $expectedUrl + ']: ' + $text)
                }
                $changed = $true
            }
            if (Repair-WsusVdirsRequireSsl) {
                $changed = $true
            }
            $after = Get-ItemProperty -Path $setupPath -ErrorAction Stop
            if ([int]$after.UsingSSL -ne 1 -or
                [int]$after.PortNumber -ne $port -or
                (-not [string]::Equals([string]$after.ServerCertificateName, $dns, [System.StringComparison]::OrdinalIgnoreCase))) {
                throw ('WSUS SSL state did not persist: UsingSSL=' + $after.UsingSSL +
                    ' PortNumber=' + $after.PortNumber + ' ServerCertificateName=[' + $after.ServerCertificateName + ']')
            }
            if ($changed) { Write-Output 'changed' } else { Write-Output 'nochange' }
          environment:
            TLS_DNS_NAME: '{{ config.tls.dns_name }}'
            TLS_PORT: '{{ config.tls.port }}'
          register: __tls_configuressl__
          changed_when: "__tls_configuressl__.stdout | trim == 'changed'"

        # IIS binding and certificate-provider objects are configuration truth, but neither proves
        # that HTTP.sys has activated the listener. Reconcile the site's persistent/runtime state,
        # and recycle only this site when a nominally Started site still has no loopback listener.
        # Listener absence is runtime drift even when persisted TLS configuration is unchanged;
        # a healthy converged pass performs no restart and reports no change. Keep this invocation
        # in the module runspace for the same command-line-size reason as the pre-API invocation.
        - name: 'MAIN | Activate And Verify The WSUS HTTPS Listener'
          ansible.windows.win_powershell:
            error_action: stop
            script: |
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $false
              {{ __wsus_https_listener_reconciler__ }}
              $listenerResult = @(Invoke-LocalWsusHttpsListenerReconcile)
              if ($listenerResult.Count -ne 1 -or
                  [string]$listenerResult[0] -notin @('changed', 'nochange')) {
                  throw ('listener reconciler returned an invalid result contract: [' +
                      (($listenerResult | ForEach-Object { [string]$_ }) -join ';') + ']')
              }
              $Ansible.Changed = [string]$listenerResult[0] -eq 'changed'
              Write-Output ([string]$listenerResult[0])
          register: __tls_listener_activation__

        # Validate what IIS actually serves, independently of the certificate-store and binding
        # APIs. Trust distribution is out of scope, so the callback permits the private CA while
        # the task explicitly verifies the pinned peer identity and validity window. The HTTP GET
        # proves the wildcard listener accepts the intended SNI and Host contract, not merely TLS.
        - name: 'VERIFY | Complete A Live HTTPS Request To The WSUS Client Endpoint'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $tcp = New-Object System.Net.Sockets.TcpClient
            $ssl = $null
            $reader = $null
            try {
                $tcp.ReceiveTimeout = 15000
                $tcp.SendTimeout = 15000
                $tcp.Connect('127.0.0.1', [int]$env:TLS_PORT)
                $callback = { param($sender, $certificate, $chain, $errors) return $true }
                $ssl = New-Object System.Net.Security.SslStream($tcp.GetStream(), $false, $callback)
                $ssl.AuthenticateAsClient($env:TLS_DNS_NAME)
                $peer = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($ssl.RemoteCertificate)
                if ($peer.Thumbprint.ToUpperInvariant() -ne $env:TLS_THUMBPRINT) {
                    throw ('live endpoint served unexpected thumbprint ' + $peer.Thumbprint)
                }
                if ($peer.NotAfter -lt (Get-Date).AddDays([int]$env:MINIMUM_VALIDITY_DAYS)) {
                    throw ('live endpoint certificate expires too soon: ' + $peer.NotAfter.ToString('o'))
                }
                $request = "GET /ClientWebService/client.asmx HTTP/1.1`r`nHost: $($env:TLS_DNS_NAME):$($env:TLS_PORT)`r`nConnection: close`r`n`r`n"
                $requestBytes = [System.Text.Encoding]::ASCII.GetBytes($request)
                $ssl.Write($requestBytes, 0, $requestBytes.Length)
                $ssl.Flush()
                $reader = [System.IO.StreamReader]::new(
                    $ssl, [System.Text.Encoding]::ASCII, $false, 1024, $true)
                $statusLine = $reader.ReadLine()
                if ($statusLine -notmatch '^HTTP/[0-9]+\.[0-9]+ 200(?: |$)') {
                    throw ('WSUS client HTTPS endpoint did not return HTTP 200: [' + $statusLine + ']')
                }
                Write-Output 'healthy'
            } finally {
                if ($reader) { $reader.Dispose() }
                if ($ssl) { $ssl.Dispose() }
                $tcp.Dispose()
            }
          environment:
            TLS_PORT: '{{ config.tls.port }}'
            TLS_DNS_NAME: '{{ config.tls.dns_name }}'
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
            MINIMUM_VALIDITY_DAYS: '{{ config.tls.minimum_validity_days }}'
          register: __tls_live_probe__
          retries: 12
          delay: 5
          until: __tls_live_probe__.rc == 0
          changed_when: false

      always:
        - name: 'CLEANUP | Remove The Unique TLS Staging Directory From The Target'
          when:
            - __tls_target_temp__ is defined
            - __tls_target_temp__.path is defined
          ansible.windows.win_file:
            path: '{{ __tls_target_temp__.path }}'
            state: absent
          changed_when: false

        - name: 'CLEANUP | Remove The Unique TLS Staging Directory From The Controller'
          when:
            - __tls_controller_temp__ is defined
            - __tls_controller_temp__.path is defined
          delegate_to: localhost
          become: false
          ansible.builtin.file:
            path: '{{ __tls_controller_temp__.path }}'
            state: absent
          changed_when: false

        - name: 'CLEANUP | Clear The In-Memory PFX Password Fact'
          when: __tls_pfx_password__ is defined
          ansible.builtin.set_fact:
            __tls_pfx_password__: null
          no_log: true

    # Independent read-only acceptance gate.  This re-derives the externally meaningful state
    # rather than trusting task return values; it is also safe to run after a second converge.
    # Run the expanded API helper in the module runspace: win_shell would encode this verifier
    # into a child-process command line that exceeds Windows' CreateProcess limit.
    - name: 'VERIFY | Assert The Complete WSUS Runtime Contract'
      ansible.windows.win_powershell:
        error_action: stop
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module WebAdministration
          function New-WsusServerManager {
              $os64 = [System.Environment]::Is64BitOperatingSystem
              $process64 = [System.Environment]::Is64BitProcess
              $powerShellVersion = [string]$PSVersionTable.PSVersion
              $powerShellEdition = [string]$PSVersionTable.PSEdition
              $assemblyPath = '<loaded-assembly-not-resolved>'
              $runtimeContext = 'assembly=[' + $assemblyPath + '] os64=[' + $os64 +
                  '] process64=[' + $process64 + '] powershell=[' + $powerShellVersion +
                  '] edition=[' + $powerShellEdition + ']'
              if (-not $process64) {
                  throw ('64-bit PowerShell is required for IIS management: ' + $runtimeContext)
              }
              $typeName = 'Microsoft.Web.Administration.ServerManager'

              function Resolve-LoadedWsusServerManagerType([string]$requestedTypeName) {
                  foreach ($loadedAssembly in [System.AppDomain]::CurrentDomain.GetAssemblies()) {
                      if ($loadedAssembly.GetName().Name -ne 'Microsoft.Web.Administration') {
                          continue
                      }
                      $candidateType = $loadedAssembly.GetType(
                          $requestedTypeName, $false, $false)
                      if ($null -ne $candidateType) {
                          return $candidateType
                      }
                  }
                  return $null
              }

              try {
                  $serverManagerType = Resolve-LoadedWsusServerManagerType $typeName
              } catch {
                  throw ('Unable to inspect loaded IIS management assemblies: ' + $runtimeContext +
                      ' errorId=[' + [string]$_.FullyQualifiedErrorId + '] exception=[' +
                      $_.Exception.ToString() + ']')
              }
              if ($null -eq $serverManagerType) {
                  $windowsDirectory = [string]$env:WINDIR
                  if ([string]::IsNullOrWhiteSpace($windowsDirectory)) {
                      throw ('WINDIR is unavailable; cannot locate the IIS management assembly: ' +
                          $runtimeContext)
                  }
                  $assemblyPath = Join-Path $windowsDirectory `
                      'System32\inetsrv\Microsoft.Web.Administration.dll'
                  $runtimeContext = 'assembly=[' + $assemblyPath + '] os64=[' + $os64 +
                      '] process64=[' + $process64 + '] powershell=[' + $powerShellVersion +
                      '] edition=[' + $powerShellEdition + ']'
                  if (-not (Test-Path -LiteralPath $assemblyPath -PathType Leaf)) {
                      throw ('IIS management assembly is absent: ' + $runtimeContext)
                  }
                  try {
                      $null = Add-Type -LiteralPath $assemblyPath -ErrorAction Stop
                      $serverManagerType = Resolve-LoadedWsusServerManagerType $typeName
                  } catch {
                      throw ('Unable to load or resolve IIS management assembly: ' +
                          $runtimeContext + ' errorId=[' + [string]$_.FullyQualifiedErrorId +
                          '] exception=[' + $_.Exception.ToString() + ']')
                  }
              }
              if ($null -eq $serverManagerType) {
                  throw ('IIS management TypeNotFound: type=' + $typeName + ' ' + $runtimeContext)
              }
              $loadedAssemblyPath = [string]$serverManagerType.Assembly.Location
              if (-not [string]::IsNullOrWhiteSpace($loadedAssemblyPath)) {
                  $assemblyPath = $loadedAssemblyPath
              }
              $runtimeContext = 'assembly=[' + $assemblyPath + '] os64=[' + $os64 +
                  '] process64=[' + $process64 + '] powershell=[' + $powerShellVersion +
                  '] edition=[' + $powerShellEdition + ']'
              try {
                  $serverManager = [System.Activator]::CreateInstance($serverManagerType)
              } catch {
                  throw ('Unable to construct IIS ServerManager: ' + $runtimeContext +
                      ' errorId=[' + [string]$_.FullyQualifiedErrorId + '] exception=[' +
                      $_.Exception.ToString() + ']')
              }
              if ($null -eq $serverManager) {
                  throw ('IIS ServerManager construction returned null: ' + $runtimeContext)
              }
              return $serverManager
          }
          if ([System.Convert]::ToBoolean($env:TLS_ENABLED)) {
              $wsusSitePath = 'IIS:\Sites\WSUS Administration'
              if (-not (Test-Path -LiteralPath $wsusSitePath)) {
                  throw 'required IIS site is absent: WSUS Administration'
              }
              $wsusSite = Get-Item -LiteralPath $wsusSitePath -ErrorAction Stop
              $wsusSiteState = [string](Get-WebItemState -PSPath $wsusSitePath -ErrorAction Stop).Value
              if ($wsusSiteState -ne 'Started') {
                  throw ('WSUS Administration IIS site is ' + $wsusSiteState + ', not Started')
              }
              if (-not [System.Convert]::ToBoolean($wsusSite.serverAutoStart)) {
                  throw 'WSUS Administration IIS site serverAutoStart is not true'
              }
          }
          {{ __wsus_api_invoker__ }}
          Invoke-LocalWsusApi {
          param($wsus)
          $widService = Get-CimInstance -ClassName Win32_Service -Filter 'Name = "MSSQL$MICROSOFT##WID"' -ErrorAction Stop
          if ($widService.StartMode -ne 'Auto' -or $widService.State -ne 'Running') {
              throw ('MSSQL$MICROSOFT##WID must be Automatic and Running; startup=' +
                  $widService.StartMode + ' state=' + $widService.State)
          }
          foreach ($serviceName in @('W3SVC', 'WsusService')) {
              $service = Get-Service -Name $serviceName -ErrorAction Stop
              if ($service.Status -ne 'Running') { throw "$serviceName is $($service.Status), not Running" }
          }
          foreach ($path in @($env:CONTENT_DIR, $env:WID_DATA_DIR, $env:IIS_LOG_DIR, $env:IIS_WWWROOT)) {
              if (-not (Test-Path -LiteralPath $path -PathType Container)) { throw "required directory is absent: $path" }
          }
          $cfg = $wsus.GetConfiguration()
          function Normalize-ContractPath([string]$path) {
              if ([string]::IsNullOrWhiteSpace($path)) { return '' }
              return $path.Trim().Replace('/', [char]92).TrimEnd([char]92)
          }
          function Test-ContractPath([string]$actual, [string]$expected) {
              return [string]::Equals(
                  (Normalize-ContractPath $actual),
                  (Normalize-ContractPath $expected),
                  [System.StringComparison]::OrdinalIgnoreCase)
          }
          function Test-RequiredAllowAce(
              [string]$path,
              [string]$sidValue,
              [System.Security.AccessControl.FileSystemRights]$rights
          ) {
              $inheritance = [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
                  [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
              $allowed = $false
              foreach ($rule in (Get-Acl -LiteralPath $path -ErrorAction Stop).Access) {
                  try {
                      $ruleSid = $rule.IdentityReference.Translate(
                          [System.Security.Principal.SecurityIdentifier]).Value
                  } catch {
                      continue
                  }
                  if ($ruleSid -ne $sidValue) { continue }
                  if ($rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Deny -and
                      ($rule.FileSystemRights -band $rights) -ne 0) {
                      return $false
                  }
                  if ($rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
                      ($rule.FileSystemRights -band $rights) -eq $rights -and
                      ($rule.InheritanceFlags -band $inheritance) -eq $inheritance) {
                      $allowed = $true
                  }
              }
              return $allowed
          }
          function Test-ServerAuthenticationEku(
              [System.Security.Cryptography.X509Certificates.X509Certificate2]$certificate
          ) {
              foreach ($extension in $certificate.Extensions) {
                  if ($extension.Oid.Value -ne '2.5.29.37') { continue }
                  $eku = [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new()
                  $eku.CopyFrom($extension)
                  foreach ($usage in $eku.EnhancedKeyUsages) {
                      if ($usage.Value -eq '1.3.6.1.5.5.7.3.1') { return $true }
                  }
              }
              return $false
          }
          $contentRoot = Normalize-ContractPath $env:CONTENT_DIR
          $contentCache = Join-Path $contentRoot 'WsusContent'
          if (-not (Test-Path -LiteralPath $contentCache -PathType Container)) {
              throw ('WSUS content cache directory is absent: ' + $contentCache)
          }
          $setup = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup' -ErrorAction Stop
          $contentVdir = Get-Item -LiteralPath 'IIS:\Sites\WSUS Administration\Content' -ErrorAction Stop
          if (-not (Test-ContractPath ([string]$setup.ContentDir) $contentRoot) -or
              -not (Test-ContractPath ([string]$cfg.LocalContentCachePath) $contentCache) -or
              -not (Test-ContractPath ([string]$contentVdir.physicalPath) $contentCache)) {
              throw 'registry, API, or IIS WSUS content path differs from the desired content volume'
          }
          if (-not (Test-RequiredAllowAce $contentRoot 'S-1-5-32-545' ([System.Security.AccessControl.FileSystemRights]::ReadAndExecute))) {
              throw 'WSUS content root lacks the inheritable BUILTIN\Users ReadAndExecute grant'
          }
          if (-not (Test-RequiredAllowAce $contentCache 'S-1-5-20' ([System.Security.AccessControl.FileSystemRights]::FullControl))) {
              throw 'WSUS content cache lacks the inheritable NETWORK SERVICE FullControl grant'
          }
          $wantPort = [int]$env:UPSTREAM_PORT
          $wantSsl = [System.Convert]::ToBoolean($env:UPSTREAM_SSL)
          $wantReplica = [System.Convert]::ToBoolean($env:REPLICA)
          if ($cfg.SyncFromMicrosoftUpdate -or
              $cfg.UpstreamWsusServerName -ne $env:UPSTREAM_SERVER -or
              $cfg.UpstreamWsusServerPortNumber -ne $wantPort -or
              $cfg.UpstreamWsusServerUseSsl -ne $wantSsl -or
              $cfg.IsReplicaServer -ne $wantReplica) {
              throw 'persisted WSUS upstream source differs from the desired contract'
          }
          $pool = Get-Item 'IIS:\AppPools\WsusPool' -ErrorAction Stop
          if ([string]$pool.state -ne 'Started') { throw ('WsusPool is ' + [string]$pool.state) }
          $wantQueueLength = [long]$env:WSUSPOOL_QUEUE_LENGTH
          $wantPrivateMemory = [long]$env:WSUSPOOL_PRIVATE_MEMORY_KB
          $wantVirtualMemory = [long]$env:WSUSPOOL_VIRTUAL_MEMORY_KB
          $wantPeriodicRestart = [System.TimeSpan]::Parse($env:WSUSPOOL_PERIODIC_RESTART)
          $wantIdleTimeout = [System.TimeSpan]::Parse($env:WSUSPOOL_IDLE_TIMEOUT)
          $wantPinging = [System.Convert]::ToBoolean($env:WSUSPOOL_PINGING_ENABLED)
          $actualPeriodicRestart = [System.TimeSpan]::Parse([string]$pool.recycling.periodicRestart.time)
          $actualIdleTimeout = [System.TimeSpan]::Parse([string]$pool.processModel.idleTimeout)
          if ([long]$pool.queueLength -ne $wantQueueLength -or
              [long]$pool.recycling.periodicRestart.privateMemory -ne $wantPrivateMemory -or
              [long]$pool.recycling.periodicRestart.memory -ne $wantVirtualMemory -or
              $actualPeriodicRestart -ne $wantPeriodicRestart -or
              $actualIdleTimeout -ne $wantIdleTimeout -or
              [System.Convert]::ToBoolean($pool.processModel.pingingEnabled) -ne $wantPinging) {
              throw 'WsusPool tuning differs from the desired queue, memory, recycle, idle, or pinging contract'
          }
          $defaultSite = Get-Website -Name 'Default Web Site' -ErrorAction Stop
          if (-not [string]::Equals($defaultSite.physicalPath.TrimEnd([char]92), $env:IIS_WWWROOT.TrimEnd([char]92), [System.StringComparison]::OrdinalIgnoreCase)) {
              throw ('Default Web Site root differs from ' + $env:IIS_WWWROOT)
          }
          $globalLog = (Get-WebConfigurationProperty -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name directory).Value
          $globalLogEnabled = (Get-WebConfigurationProperty -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name enabled).Value
          if (-not [System.Convert]::ToBoolean($globalLogEnabled)) {
              throw 'IIS siteDefaults logging is disabled'
          }
          if (-not [string]::Equals(([string]$globalLog).TrimEnd([char]92), $env:IIS_LOG_DIR.TrimEnd([char]92), [System.StringComparison]::OrdinalIgnoreCase)) {
              throw ('IIS siteDefaults log path differs from ' + $env:IIS_LOG_DIR)
          }
          foreach ($site in @(Get-Website)) {
              if (-not [System.Convert]::ToBoolean($site.logFile.enabled)) {
                  throw ($site.Name + ' logging is disabled')
              }
              if (-not [string]::Equals(([string]$site.logFile.directory).TrimEnd([char]92), $env:IIS_LOG_DIR.TrimEnd([char]92), [System.StringComparison]::OrdinalIgnoreCase)) {
                  throw ($site.Name + ' log path differs from ' + $env:IIS_LOG_DIR)
              }
          }
          if ([System.Convert]::ToBoolean($env:TLS_ENABLED)) {
              $desiredBinding = '*:' + [int]$env:TLS_PORT + ':'
              $siteBindings = @(Get-WebBinding -Name 'WSUS Administration' -Protocol https -ErrorAction Stop)
              $desiredSiteBindings = @($siteBindings | Where-Object {
                  [string]::Equals([string]$_.bindingInformation, $desiredBinding, [System.StringComparison]::Ordinal)
              })
              if ($siteBindings.Count -ne 1 -or $desiredSiteBindings.Count -ne 1 -or
                  [int]($desiredSiteBindings[0].sslFlags) -ne 0) {
                  throw ('WSUS site lacks exactly one HTTPS binding total, at ' +
                      $desiredBinding + ' with sslFlags=0')
              }
              $binding = Get-Item ('IIS:\SslBindings\0.0.0.0!' + [int]$env:TLS_PORT) -ErrorAction Stop
              if ($binding.Thumbprint -ne $env:TLS_THUMBPRINT) { throw 'IIS SSL binding differs from the pinned certificate' }
              $certificatePath = Join-Path 'Cert:\LocalMachine\My' $env:TLS_THUMBPRINT
              $certificate = Get-Item $certificatePath -ErrorAction Stop
              if (-not (Test-ServerAuthenticationEku $certificate)) {
                  throw 'pinned IIS certificate does not explicitly permit Server Authentication EKU (OID 1.3.6.1.5.5.7.3.1)'
              }
              $setup = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup' -ErrorAction Stop
              if ([int]$setup.UsingSSL -ne 1 -or
                  [int]$setup.PortNumber -ne [int]$env:TLS_PORT -or
                  (-not [string]::Equals([string]$setup.ServerCertificateName, $env:TLS_DNS_NAME, [System.StringComparison]::OrdinalIgnoreCase))) {
                  throw 'persisted WSUS SSL hostname or port differs from the desired TLS contract'
              }
              $serverManager = New-WsusServerManager
              try {
                  $configuration = $serverManager.GetApplicationHostConfiguration()
                  foreach ($name in @('ApiRemoting30', 'ClientWebService', 'DSSAuthWebService', 'ServerSyncWebService', 'SimpleAuthWebService')) {
                      $location = 'WSUS Administration/' + $name
                      $section = $configuration.GetSection(
                          'system.webServer/security/access', $location)
                      if ($null -eq $section) {
                          throw ('IIS returned no access section for ' + $location)
                      }
                      $attribute = $section.GetAttribute('sslFlags')
                      if ($null -eq $attribute) {
                          throw ('IIS returned no access.sslFlags attribute for ' + $location)
                      }
                      $value = $attribute.Value
                      $flags = '<null>'
                      $valueType = '<null>'
                      if ($null -ne $value) {
                          $flags = ([string]$value).Trim()
                          $valueType = $value.GetType().FullName
                      }
                      if ($flags -ne 'Ssl' -and $flags -ne '8') {
                          throw ($location + ' does not require exact SSL: sslFlags=[' + $flags +
                              '] type=[' + $valueType + '] expected=[Ssl|8]')
                      }
                  }
              } finally {
                  [void]$serverManager.Dispose()
              }
          }
          if ([System.Convert]::ToBoolean($env:BOOTSTRAP_ENABLED)) {
              $serverId = [string]$cfg.ServerId
              $fingerprintInput = @(
                  $env:UPSTREAM_SERVER.Trim().ToLowerInvariant(),
                  $env:UPSTREAM_PORT,
                  $env:UPSTREAM_SSL.ToLowerInvariant(),
                  $env:REPLICA.ToLowerInvariant(),
                  $env:WSUS_LANGS.ToLowerInvariant()
              ) -join '|'
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try {
                  $expectedFingerprint = ([System.BitConverter]::ToString(
                      $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($fingerprintInput))
                  )).Replace('-', '')
              } finally {
                  $sha.Dispose()
              }
              $marker = Get-ItemProperty 'HKLM:\SOFTWARE\nwarila-platform\wsus' -ErrorAction Stop
              if ($marker.category_bootstrap_server_id -ne $serverId -or
                  $marker.category_bootstrap_fingerprint -ne $expectedFingerprint -or
                  [string]::IsNullOrWhiteSpace([string]$marker.category_bootstrap_history_id)) {
                  throw 'terminal-success category bootstrap marker is absent or stale'
              }
              $markedHistory = @($wsus.GetSubscription().GetSynchronizationHistory() | Where-Object {
                  [string]$_.Id -eq [string]$marker.category_bootstrap_history_id
              })
              if ($markedHistory.Count -ne 1 -or
                  -not [bool]($markedHistory[0].StartedManually) -or
                  [string]($markedHistory[0].Result) -ne 'Succeeded') {
                  throw ('bootstrap marker history ' + [string]$marker.category_bootstrap_history_id +
                      ' is absent, ambiguous, non-manual, or no longer Succeeded')
              }
          }
          Write-Output 'healthy'
          }
      environment:
        CONTENT_DIR: '{{ __content_dir__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
        IIS_LOG_DIR: '{{ config.iis.log_dir }}'
        IIS_WWWROOT: '{{ config.iis.wwwroot }}'
        UPSTREAM_SERVER: '{{ config.upstream_server | string | trim }}'
        UPSTREAM_PORT: '{{ config.sync.upstream_port }}'
        UPSTREAM_SSL: '{{ config.sync.upstream_use_ssl | bool | lower }}'
        REPLICA: '{{ config.sync.replica | bool | lower }}'
        WSUS_LANGS: '{{ config.sync.update_languages | map("lower") | sort | join(",") }}'
        WSUSPOOL_QUEUE_LENGTH: '{{ config.wsuspool.queue_length | int }}'
        WSUSPOOL_PRIVATE_MEMORY_KB: '{{ config.wsuspool.private_memory_kb | int }}'
        WSUSPOOL_VIRTUAL_MEMORY_KB: '{{ config.wsuspool.virtual_memory_kb | int }}'
        WSUSPOOL_PERIODIC_RESTART: '{{ config.wsuspool.periodic_restart }}'
        WSUSPOOL_IDLE_TIMEOUT: '{{ config.wsuspool.idle_timeout }}'
        WSUSPOOL_PINGING_ENABLED: '{{ config.wsuspool.pinging_enabled | bool | lower }}'
        TLS_ENABLED: '{{ config.tls.enabled | bool | lower }}'
        TLS_PORT: '{{ config.tls.port }}'
        TLS_DNS_NAME: '{{ config.tls.dns_name }}'
        TLS_THUMBPRINT: '{{ config.tls.thumbprint | trim | upper }}'
        BOOTSTRAP_ENABLED: '{{ config.sync.bootstrap_enabled | bool | lower }}'

    #endregion --- [ Main: WSUS SSL (delivered certificate) ] ------------------------------- #

#endregion --- [ Script ] -------------------------------------------------------------------- #
