# ============================================================================================= #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Windows / state=present provider.
#
# Built one action at a time against docs/explanation/wsus-role-migration-contract.md. Three
# stages: BEGIN reads the machine and decides, PROCESS acts on that decision, END proves the
# result. END is ungated on purpose, so a converged host proves the same state as a fresh one.
#
# Guest PowerShell is a first-class file under files/, never inline, and END re-runs the SAME
# script BEGIN ran, so the read and the proof cannot disagree about what counts as placed. Unlike
# the reference this repository tracks the .ps1 itself rather than a .stub, because the local rule
# forbids the materialization step that would otherwise produce it.
#
# --check against a host that has never converged does not complete: win_file predicts the
# directories rather than creating them, and the access-control actor reads a descriptor from a
# path that does not exist yet. That is the ordinary limit of check mode on tasks that depend on
# an earlier task's side effect, not something this role can repair without carrying conditionals
# for a path the lifecycle never runs. --check against a converged host reads normally.
#
# ============================================================================================= #
---
#region ------ [ Begin: Configure WSUS on Windows ] ------------------------------------------- #

- name: 'BEGIN | Read The Machine And Decide One Action'
  vars:
    __desired_data__: "{{ wsus_running.db.drive_letter }}:\\{{ wsus_running.db.data_subdir }}"
    __desired_log__: "{{ wsus_running.db.drive_letter }}:\\{{ wsus_running.db.log_subdir }}"
    # What the machine holds of SUSDB, from two independent answers: the engine's (is it
    # attached, and from where) and the filesystem's (did its pair survive). Stage vars rather
    # than set_fact, per the style guide -- these are role-internal derived values, and a fact
    # would persist into every later role in the play. Lazily evaluated, so the registers they
    # read exist by the time anything consumes them.
    #
    # ONE backslash in these folded scalars and TWO in the double-quoted paths below, because
    # YAML processes escapes in a double-quoted scalar and leaves a folded one alone. Both reach
    # Jinja as the same single separator; writing either in the other's place does not.
    __susdb_present__: >-
      {{ __wsus_susdb_files__.results | selectattr('stat.exists') | list }}
    __susdb_attached__: "{{ __wsus_placement__.result.susdb_file_count > 0 }}"
    __susdb_declared__: >-
      {{ (__wsus_placement__.result.susdb_data_path | lower)
         == ((__desired_data__ ~ '\SUSDB.mdf') | lower)
         and (__wsus_placement__.result.susdb_log_path | lower)
         == ((__desired_log__ ~ '\SUSDB_log.ldf') | lower) }}
    __wsus_susdb_action__: >-
      {{ 'attached' if (__susdb_attached__ and __susdb_declared__)
         else 'refuse' if (__susdb_attached__ or __susdb_present__ | length == 1)
         else 'adopt' if __susdb_present__ | length == 2
         else 'create' }}

  # Begin The 'Begin' Block
  block:

    #region ------ [ Begin: Read The Engine's Effective Placement ] --------------------------- #
    # One read answers every question this stage has: whether the engine is up to be asked, which
    # directory the instance publishes itself under, where it would ACTUALLY put a database right
    # now, and what access the two directories give it.
    #
    # A stopped instance is read, not raised. PROCESS starts it; failing here would deny the very
    # repair the next stage exists to perform. The script declares SupportsShouldProcess, so this
    # read still runs under --check and PROCESS can predict against a real answer.
    #
    # The service reconcile therefore sits in PROCESS, AFTER this read, which means the first
    # connection is opened against a service this role has not yet reconciled. That is deliberate:
    # BEGIN does not mutate the target, and every mutation belongs to PROCESS. It costs nothing --
    # a down instance is reported rather than queried, and the restart below fires on what this
    # read established rather than on what it could not.

    # The same startup race END retries for, on the same terms: an instance that has just come
    # back -- from a reboot, or from a converge killed mid-restart -- reports Running before it
    # accepts connections, and opening the connection throws. Without this a rerun dies on timing
    # at the very read that would have diagnosed the host, before PROCESS can repair anything.

    - name: 'BEGIN | Read Where This Instance Creates Databases'
      register: '__wsus_placement__'
      retries: 12
      delay: 5
      until: '__wsus_placement__ is succeeded'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          ServiceName: 'MSSQLSERVER'
          InstanceName: 'MSSQLSERVER'
          InstanceNamesKey: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\Instance Names\SQL'
          InstanceRoot: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server'
          DesiredData: "{{ __desired_data__ }}"
          DesiredLog: "{{ __desired_log__ }}"
        script: "{{ lookup('ansible.builtin.file', 'Get-SqlDatabasePlacement.ps1') }}"

    #endregion --- [ Begin: Read The Engine's Effective Placement ] --------------------------- #

    #region ------ [ Begin: Read The Post-Installation Completion Flags ] --------------------- #
    # Post-installation is the one expensive action here -- it builds the database schema and the
    # content store -- so it is gated on evidence rather than run every converge. Not because
    # repeating it is unsafe: re-running it is the vendor's own repair for a wrong CONTENT_DIR.
    # The evidence is its own completion flags: each reaches 2 only when its component finishes,
    # so a partial run leaves a value this can see and repairs itself on the next pass.

    - name: 'BEGIN | Read The Post-Installation Completion Flags'
      register: '__wsus_postinstall_state__'

      ansible.windows.win_reg_stat:
        path: 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup\Installed Role Services'

    #endregion --- [ Begin: Read The Post-Installation Completion Flags ] --------------------- #

    #region ------ [ Begin: Read This Machine Name ] ------------------------------------------ #
    # SQL_INSTANCE_NAME must carry the machine name, because a default instance answers to it and
    # to nothing else. Read rather than assumed from the inventory name: the two agree today, and
    # a host renamed after its join would make that agreement quietly false.

    - name: 'BEGIN | Read This Machine Name'
      register: '__wsus_computer_name__'

      ansible.windows.win_reg_stat:
        name: 'ComputerName'
        path: 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName'

    #endregion --- [ Begin: Read This Machine Name ] ------------------------------------------ #

    #region ------ [ Begin: Read Whether The Preserved Database Files Are There ] ------------- #
    # A replaced operating system leaves the database on its volume and the completion flags on
    # the root disk that went with it. WSUS reads only the flags, so it calls such a host a fresh
    # install and its post-installation tries to CREATE over files that are already there --
    # measured 2026-08-27 on i-024c87e53a03f2881: 'Install type is: Fresh', then 'Cannot create
    # file E:\MSSQL\Data\SUSDB.mdf because it already exists'. Deciding this BEFORE
    # post-installation is what turns that collision into an adoption.

    - name: 'BEGIN | Read Whether The Preserved Database Files Are There'
      loop:
        - "{{ __desired_data__ }}\\SUSDB.mdf"
        - "{{ __desired_log__ }}\\SUSDB_log.ldf"
      loop_control:
        label: "{{ item }}"
      register: '__wsus_susdb_files__'

      ansible.windows.win_stat:
        # A database file. The question is whether it exists, so neither its contents nor its
        # length is wanted -- and hashing gigabytes to answer it would cost the whole converge.
        checksum_algorithm: 'sha1'
        follow: false
        get_checksum: false
        get_size: false
        path: "{{ item }}"

    #endregion --- [ Begin: Read Whether The Preserved Database Files Are There ] ------------- #

    #region ------ [ Begin: Require A SUSDB This Role Can Resolve ] --------------------------- #
    # Three states this role can act on, and everything else refused. The engine answers whether
    # SUSDB is attached; the filesystem answers whether its pair survived. The pairing of those
    # two is the whole classification, and the contract's matrix collapses to exactly this under
    # SQL Server, because the system-volume source pair the WID build could also see cannot exist
    # here.
    # Fail closed, BEFORE post-installation, which is the only place refusing is worth anything.
    # Two shapes reach here, and each names the path that produces it. A lone database file: a
    # first post-installation that died after creating one of the pair -- this command's failure
    # mode was measured on 2026-08-27, and re-running it collides rather than repairing. A SUSDB
    # the engine holds from somewhere undeclared: a converge whose placement pin did not take
    # before post-installation ran, so the database was born at the engine's old default. Neither
    # is a state this role may resolve by guessing.

    - name: 'BEGIN | Require A SUSDB This Role Can Resolve'

      ansible.builtin.assert:
        fail_msg: >-
          Expected SUSDB either attached from '{{ __desired_data__ }}\SUSDB.mdf' and
          '{{ __desired_log__ }}\SUSDB_log.ldf', or absent from the engine with both of those
          files present, or absent with neither. The engine reports
          {{ __wsus_placement__.result.susdb_file_count }} file(s) at
          '{{ __wsus_placement__.result.susdb_data_path | default('nothing', true) }}' and
          '{{ __wsus_placement__.result.susdb_log_path | default('nothing', true) }}'. Nothing is
          changed until an operator says what this database is.
        quiet: true
        that:
          - __wsus_susdb_action__ != 'refuse'

    #endregion --- [ Begin: Require A SUSDB This Role Can Resolve ] --------------------------- #

#endregion --- [ Begin: Configure WSUS on Windows ] ------------------------------------------- #


#region ------ [ Process: Configure WSUS on Windows ] ----------------------------------------- #

- name: 'PROCESS | Install And Configure WSUS On The SQL Instance'
  vars:
    __desired_data__: "{{ wsus_running.db.drive_letter }}:\\{{ wsus_running.db.data_subdir }}"
    __desired_log__: "{{ wsus_running.db.drive_letter }}:\\{{ wsus_running.db.log_subdir }}"
    __content_dir__: "{{ wsus_running.content.drive_letter }}:\\{{ wsus_running.content.subdir }}"
    # The two client-facing rules, written in the shape Windows writes its own: the name carries
    # the product and the direction, the description ends in the protocol and port, and both say
    # WSUS rather than IIS so the reason the port is open is on the rule itself.
    __firewall_rules__:
      - name: 'Windows Server Update Services (HTTP Traffic-In)'
        port: "{{ wsus_running.firewall.http_port }}"
        description: >-
          An inbound rule to allow client computers to download approved update payloads from
          Windows Server Update Services (WSUS). WSUS serves payloads over plain HTTP by design;
          they are Microsoft-signed and the client verifies them.
          [TCP {{ wsus_running.firewall.http_port }}]

      - name: 'Windows Server Update Services (HTTPS Traffic-In)'
        port: "{{ wsus_running.tls.port }}"
        description: >-
          An inbound rule to allow client computers to retrieve update metadata from, authenticate
          to, and report installation status to Windows Server Update Services (WSUS) over TLS.
          [TCP {{ wsus_running.tls.port }}]
    __wsus_machine_name__: "{{ __wsus_computer_name__.value }}"
    # The four completion flags post-installation writes, each reaching 2 only when its component
    # finishes. Measured on this image: after the features install and before post-installation,
    # API and UI already read 2 while Database and Services read 1.
    __postinstall_flags__:
      - 'UpdateServices-API'
      - 'UpdateServices-Database'
      - 'UpdateServices-Services'
      - 'UpdateServices-UI'
    # Any flag short of 2 means a component did not finish, including a run interrupted midway.
    __wsus_postinstall_incomplete__: >-
      {{ __postinstall_flags__
         | map('extract', __wsus_postinstall_state__.properties | default({}), 'value')
         | map('default', 0) | select('ne', 2) | list | length > 0 }}
    # The same derivation as BEGIN's, re-declared because block vars do not cross stages
    # and this repository does not use set_fact. Explained once, above.
    __susdb_present__: >-
      {{ __wsus_susdb_files__.results | selectattr('stat.exists') | list }}
    __susdb_attached__: "{{ __wsus_placement__.result.susdb_file_count > 0 }}"
    __susdb_declared__: >-
      {{ (__wsus_placement__.result.susdb_data_path | lower)
         == ((__desired_data__ ~ '\SUSDB.mdf') | lower)
         and (__wsus_placement__.result.susdb_log_path | lower)
         == ((__desired_log__ ~ '\SUSDB_log.ldf') | lower) }}
    __wsus_susdb_action__: >-
      {{ 'attached' if (__susdb_attached__ and __susdb_declared__)
         else 'refuse' if (__susdb_attached__ or __susdb_present__ | length == 1)
         else 'adopt' if __susdb_present__ | length == 2
         else 'create' }}

  # Begin The 'Process' Block
  block:

    #region ------ [ Process: Ensure The Instance Is Automatic And Running ] ------------------ #
    # First, because everything after it needs an engine to talk to and every later stage inherits
    # the same obligation: a host that reboots must come back serving updates without an operator.
    # Unconditional rather than gated on what BEGIN read, so a correct-but-Manual instance is
    # corrected too -- start_mode is state this role owns, not a detail of the restart below.

    - name: 'PROCESS | Ensure The Instance Is Automatic And Running'

      ansible.windows.win_service:
        dependency_action: 'set'
        desktop_interact: false
        force_dependent_services: false
        name: 'MSSQLSERVER'
        start_mode: 'auto'
        state: 'started'

    #endregion --- [ Process: Ensure The Instance Is Automatic And Running ] ------------------ #

    #region ------ [ Process: Create The Database Directories On The Data Volume ] ------------ #
    # First of the four regions that place the database, and they run in the only order that
    # works: the directories must exist before an ACL can name them, the ACL must grant the engine
    # before it is told to write there, the registry must say where, and the service must restart
    # before any of it is true.

    - name: 'PROCESS | Create The Database Directories On The Data Volume'
      loop:
        - "{{ __desired_data__ }}"
        - "{{ __desired_log__ }}"
      loop_control:
        label: "{{ item }}"

      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ item }}"
        state: 'directory'

    #endregion --- [ Process: Create The Database Directories On The Data Volume ] ------------ #

    #region ------ [ Process: Grant The Instance FullControl On The Database Directories ] ---- #
    # The per-service account, whose SID Windows derives from the service NAME rather than from the
    # machine -- so the entry this writes is the one a REPLACEMENT operating system reading the same
    # volume would also resolve, which is what lets the data volume outlive the host. Passed as the
    # SID the placement read already resolved, because a name comparison would be satisfied by a
    # renamed or localised principal that grants nothing.
    #
    # Set rather than added, for the same reason the content paths are: an additive grant leaves a
    # DENY on the same identity standing, and Windows evaluates deny first -- so the allow would be
    # written, the task would report ok on every later run, and SUSDB still could not grow. That is
    # the one thing two clean runs cannot prove here, so the actor removes it instead.

    - name: 'PROCESS | Grant The Instance FullControl On The Database Directories'
      loop:
        - "{{ __desired_data__ }}"
        - "{{ __desired_log__ }}"
      loop_control:
        label: "{{ item }}"

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          InheritanceFlags: 'ContainerInherit, ObjectInherit'
          Path: "{{ item }}"
          Rights: 'FullControl'
          Sid: "{{ __wsus_placement__.result.service_sid }}"
        script: "{{ lookup('ansible.builtin.file', 'Set-AclGrant.ps1') }}"

    #endregion --- [ Process: Grant The Instance FullControl On The Database Directories ] ---- #

    #region ------ [ Process: Pin The Instance Default Data And Log Directories ] ------------- #

    - name: 'PROCESS | Pin The Instance Default Data And Log Directories'
      loop:
        - name: 'DefaultData'
          value: "{{ __desired_data__ }}"
        - name: 'DefaultLog'
          value: "{{ __desired_log__ }}"
      loop_control:
        label: "{{ item.name }}"
      register: '__wsus_placement_pinned__'

      ansible.windows.win_regedit:
        data: "{{ item.value }}"
        name: "{{ item.name }}"
        path: "{{ __wsus_placement__.result.settings_key }}"
        state: 'present'
        type: 'string'

    #endregion --- [ Process: Pin The Instance Default Data And Log Directories ] ------------- #

    #region ------ [ Process: Restart The Instance So It Adopts The Pinned Directories ] ------ #
    # A restart is a service outage, so it fires on evidence, never on ignorance. Two cases earn
    # one, and no others:
    #
    #   the registry just changed -- the engine is still serving what it read at startup, and
    #   measured on a live instance, writing the registry moved neither SERVERPROPERTY nor where a
    #   database landed until the service came back;
    #
    #   BEGIN reached the engine and it named the wrong directory.
    #
    # An instance that was DOWN when BEGIN looked earns nothing by itself: it has since been
    # started, and it read the registry on the way up. If that registry was already right it is
    # already serving the right directories, and bouncing it would be an outage bought with a
    # question nobody asked. If it was wrong, the pin above changed and the first case fires. END
    # proves the outcome either way, so a wrong guess here fails the run rather than passing it.
    #
    # force_dependent_services because the instance carries dependents -- on this image
    # MSSQLLaunchpad runs and SQLSERVERAGENT is installed -- and Windows refuses to stop a service
    # that has them. Measured on the guest: after this restart the running Launchpad came back
    # with the engine, and a stopped SQLSERVERAGENT stayed stopped.

    - name: 'PROCESS | Restart The Instance So It Adopts The Pinned Directories'
      when: >-
        (__wsus_placement_pinned__ is changed)
        or (__wsus_placement__.result.placement_read
            and not __wsus_placement__.result.placement_valid)

      ansible.windows.win_service:
        dependency_action: 'set'
        desktop_interact: false
        force_dependent_services: true
        name: 'MSSQLSERVER'
        state: 'restarted'

    #endregion --- [ Process: Restart The Instance So It Adopts The Pinned Directories ] ------ #

    #region ------ [ Process: Install The WSUS Features And HTTP Logging ] -------------------- #
    # After placement, because the features are what bring postinstall within reach and postinstall
    # creates the database wherever the engine now points. Before anything reads WSUS, because the
    # console and the UpdateServices module arrive with them.

    # Named one by one, and neither the bare parent nor include_sub_features. Both select the
    # Windows Internal Database backend, and Windows refuses that alongside the SQL one -- so the
    # obvious install line is the one that cannot work here.

    - name: 'PROCESS | Install The WSUS Features And HTTP Logging'
      register: '__wsus_feature_install__'

      ansible.windows.win_feature:
        include_management_tools: true
        include_sub_features: false
        name: ['UpdateServices-Services', 'UpdateServices-DB', 'Web-Http-Logging']
        state: 'present'

    #endregion --- [ Process: Install The WSUS Features And HTTP Logging ] -------------------- #

    #region ------ [ Process: Reboot When The Feature Installation Requires It ] -------------- #
    # Taken here, between the feature install and post-installation, so the reboot the feature
    # transaction asks for lands before any database mutation exists to be interrupted by it.

    - name: 'PROCESS | Reboot When The Feature Installation Requires It'
      when: __wsus_feature_install__.reboot_required | default(false) | bool

      ansible.windows.win_reboot:
        boot_time_command: >-
          (Get-CimInstance -ClassName Win32_OperatingSystem -Property
          LastBootUpTime).LastBootUpTime.ToFileTime()
        connect_timeout: 5
        msg: 'Rebooting to complete WSUS feature installation'
        post_reboot_delay: 0
        pre_reboot_delay: 2
        reboot_timeout: 600

    #endregion --- [ Process: Reboot When The Feature Installation Requires It ] -------------- #

    #region ------ [ Process: Adopt A Preserved SUSDB ] --------------------------------------- #
    # Before post-installation, always, because post-installation is what would otherwise create
    # over the preserved files. The attach is health-gated inside the script and rolls itself back
    # if any gate fails, so a database that attaches but cannot serve never reaches the next task.

    # No retries here, deliberately, though the two reads above carry them: this task mutates,
    # and retrying it would attach and roll back once per attempt. The same startup race is real
    # -- the feature install one region up can ask for a reboot, and the restart returns at the
    # logon prompt before the auto-start services finish -- so the script retries opening its
    # connection instead, which is the only part the race touches.

    - name: 'PROCESS | Adopt The Preserved SUSDB Before Post-Installation'
      when: __wsus_susdb_action__ == 'adopt'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          DataFile: "{{ __desired_data__ }}\\SUSDB.mdf"
          LogFile: "{{ __desired_log__ }}\\SUSDB_log.ldf"
        script: "{{ lookup('ansible.builtin.file', 'Invoke-SusdbAdoption.ps1') }}"

    #endregion --- [ Process: Adopt A Preserved SUSDB ] --------------------------------------- #

    #region ------ [ Process: Create The Content Directory On The Content Volume ] ------------ #

    - name: 'PROCESS | Create The Content Directory On The Content Volume'

      ansible.windows.win_file:
        access_time: 'preserve'
        access_time_format: 'yyyy-MM-dd HH:mm:ss'
        modification_time: 'preserve'
        modification_time_format: 'yyyy-MM-dd HH:mm:ss'
        path: "{{ __content_dir__ }}"
        state: 'directory'

    #endregion --- [ Process: Create The Content Directory On The Content Volume ] ------------ #

    #region ------ [ Process: Complete The Post-Installation Against The SQL Instance ] ------- #
    # The region SUSDB comes out of, by one of two routes. On a first converge it CREATES the
    # database, and everything before it exists so that this is a creation rather than a repair:
    # the engine already points at the data volume, so the database is born there and never has
    # to be moved. On a converge that adopted a preserved SUSDB, the adoption region attached it
    # already and this configures the database it found. The command is the same either way --
    # what differs is whether the engine holds SUSDB when it runs.
    #
    # Both arguments are mandatory, and neither is tidiness. Measured on the target: the feature
    # install leaves SqlServerName pointing at the Windows Internal Database instance -- a
    # backend this host does not have -- and ContentDir on the system volume. Left to its own
    # defaults, post-installation would aim at the wrong database and put the store on C:.
    #
    # argv form so the module hands the arguments over as given, rather than parsing a command
    # line back into them.

    - name: 'PROCESS | Complete The Post-Installation Against The SQL Instance'
      when: __wsus_postinstall_incomplete__

      ansible.windows.win_command:
        argv:
          - 'C:\Program Files\Update Services\Tools\wsusutil.exe'
          - 'postinstall'
          - "SQL_INSTANCE_NAME={{ __wsus_machine_name__ }}"
          - "CONTENT_DIR={{ __content_dir__ }}"

    #endregion --- [ Process: Complete The Post-Installation Against The SQL Instance ] ------- #

    #region ------ [ Process: Ensure The WSUS Services Are Running ] -------------------------- #
    # Post-installation configures the server; it does not guarantee the services that answer for
    # it came back. In this order, because IIS hosts the WSUS endpoints and a WsusService started
    # against a stopped W3SVC has nothing to serve.

    - name: 'PROCESS | Ensure The WSUS Services Are Running'
      loop: ['W3SVC', 'WsusService']
      loop_control:
        label: "{{ item }}"

      ansible.windows.win_service:
        dependency_action: 'set'
        desktop_interact: false
        force_dependent_services: false
        name: "{{ item }}"
        start_mode: 'auto'
        state: 'started'

    #endregion --- [ Process: Ensure The WSUS Services Are Running ] -------------------------- #

    #region ------ [ Process: Serve WSUS To Its Clients Over HTTPS ] -------------------------- #
    # FIRST of the regions that talk to the WSUS API, and the position is load-bearing. Once
    # wsusutil records UsingSSL=1, every later bare Get-WsusServer dials this machine over HTTPS and
    # validates the certificate it is presented -- so the trust anchor this region installs has to
    # already be there when they run. Putting this last instead would work on run one, when they
    # still speak HTTP, and leave a host that had lost its anchor unable to converge again: every
    # run's first API read would fail before reaching the region that repairs it.
    #
    # It also removes an asymmetry that would otherwise make the two runs different things. Here,
    # run one and run two both drive the API over the same transport; last, run one would use HTTP
    # and run two HTTPS, and only run two would exercise the path the estate actually uses.
    #
    # Everything it needs -- the WSUS site, the Setup key, the services -- exists by this point.
    #
    # The delivery is controller-side and the target never holds an S3 credential. That is not a
    # preference: measured in terraform/aws.tfvars, this guest's only egress rule is the VPN
    # tunnel, so it has no route to S3 at all. All three objects -- the certificate, its password
    # and the public half this machine has to trust -- are fetched here, verified here, and handed
    # over the existing connection.
    #
    # Wrapped in its own block so the staging directories are removed on the way out whether this
    # converged, refused or threw. A PFX left on either side is a private key left on disk.
    #
    # The password stays in the register that fetched it, which carries no_log, rather than being
    # cleared afterwards. Clearing it would need set_fact, which this repository does not use, and
    # the controller is an ephemeral runner whose process ends with the play.

    - name: 'PROCESS | Deliver And Install The WSUS TLS Certificate'
      vars:
        __tls__: "{{ wsus_running.tls }}"
        __tls_cert__: "{{ wsus_running.tls.certificate }}"
      when: wsus_running.tls.enabled | bool

      # Begin The 'TLS' Block
      block:

        # become is off explicitly on every controller task. The framework chassis turns become on
        # for every task, and these run on the CONTROLLER, where elevation buys nothing and a
        # runner that cannot sudo without a password would fail the play on a task never needing
        # root.

        - name: 'PROCESS | Create A Staging Directory For The TLS Delivery On The Controller'
          become: false
          changed_when: false
          check_mode: false
          delegate_to: 'localhost'
          register: '__wsus_tls_controller__'

          ansible.builtin.tempfile:
            prefix: 'windows-wsus-tls-'
            state: 'directory'

        - name: 'PROCESS | Restrict The Controller Staging Directory'
          become: false
          changed_when: false
          check_mode: false
          delegate_to: 'localhost'

          ansible.builtin.file:
            mode: '0700'
            path: "{{ __wsus_tls_controller__.path }}"
            state: 'directory'

        # ------------------------------------------------------------------------------------- #
        # check_mode is off for the reason the framework's own S3 fetch records: s3_object supports
        # check mode by RETURNING EARLY, so under --check the register exists and the field the
        # next task reads does not, and the digest check dies on a template error instead of its
        # own message. Running the fetch for real under --check costs a read this task already
        # declares changeless, and buys the most useful thing --check can say here -- that the
        # objects exist and still match the digests the deployment pinned.

        - name: 'PROCESS | Fetch The TLS Certificate To The Controller'
          become: false
          changed_when: false
          check_mode: false
          delegate_to: 'localhost'

        # The module probes the BUCKET before the object, and that probe is authorized by a
        # bucket-level grant this deployment deliberately does not hold: reading two pinned keys
        # must not imply the right to see the bucket. Skipping the probe is the module's documented
        # answer for exactly that policy shape. A missing object still fails loudly -- the key check
        # uses head_object, which the object-level grant does authorize.
          amazon.aws.s3_object:
            bucket: "{{ __tls_cert__.bucket }}"
            ceph: false
            debug_botocore_endpoint_logs: false
            dest: "{{ __wsus_tls_controller__.path }}/certificate.pfx"
            dualstack: false
            encrypt: true
            encryption_mode: 'AES256'
            expiry: 600
            ignore_nonexistent_bucket: true
            mode: 'get'
            object: "{{ __tls_cert__.object }}"
            overwrite: 'different'
            permission: [ 'private' ]
            prefix: ''
            purge_tags: true
            retries: 0
            sig_v4: true
            validate_bucket_name: true
            validate_certs: true

        - name: 'PROCESS | Fetch The TLS Certificate Password To The Controller'
          become: false
          changed_when: false
          check_mode: false
          delegate_to: 'localhost'
          no_log: true
          register: '__wsus_tls_password__'

        # The module probes the BUCKET before the object, and that probe is authorized by a
        # bucket-level grant this deployment deliberately does not hold: reading two pinned keys
        # must not imply the right to see the bucket. Skipping the probe is the module's documented
        # answer for exactly that policy shape. A missing object still fails loudly -- the key check
        # uses head_object, which the object-level grant does authorize.
          amazon.aws.s3_object:
            bucket: "{{ __tls_cert__.bucket }}"
            ceph: false
            debug_botocore_endpoint_logs: false
            dualstack: false
            encrypt: true
            encryption_mode: 'AES256'
            expiry: 600
            ignore_nonexistent_bucket: true
            mode: 'getstr'
            object: "{{ __tls_cert__.password_object }}"
            overwrite: 'different'
            permission: [ 'private' ]
            prefix: ''
            purge_tags: true
            retries: 0
            sig_v4: true
            validate_bucket_name: true
            validate_certs: true

        - name: 'PROCESS | Fetch The Server Trust Anchor To The Controller'
          become: false
          changed_when: false
          check_mode: false
          delegate_to: 'localhost'

          amazon.aws.s3_object:
            bucket: "{{ __tls_cert__.bucket }}"
            ceph: false
            debug_botocore_endpoint_logs: false
            dest: "{{ __wsus_tls_controller__.path }}/trust-anchor.cer"
            dualstack: false
            encrypt: true
            encryption_mode: 'AES256'
            expiry: 600
            ignore_nonexistent_bucket: true
            mode: 'get'
            object: "{{ __tls_cert__.public_object }}"
            overwrite: 'different'
            permission: [ 'private' ]
            prefix: ''
            purge_tags: true
            retries: 0
            sig_v4: true
            validate_bucket_name: true
            validate_certs: true

        # ------------------------------------------------------------------------------------- #

        - name: 'PROCESS | Read The Delivered Trust Anchor Digest'
          become: false
          changed_when: false
          check_mode: false
          delegate_to: 'localhost'
          register: '__wsus_tls_anchor__'

          ansible.builtin.stat:
            checksum_algorithm: 'sha256'
            path: "{{ __wsus_tls_controller__.path }}/trust-anchor.cer"

        - name: 'PROCESS | Read The Delivered Certificate Digest'
          become: false
          changed_when: false
          check_mode: false
          delegate_to: 'localhost'
          register: '__wsus_tls_delivered__'

          ansible.builtin.stat:
            checksum_algorithm: 'sha256'
            path: "{{ __wsus_tls_controller__.path }}/certificate.pfx"

        # Deliberately NOT no_log: assert reports the expression text and our message, never the
        # value, so a mismatch stays diagnosable without exposing the password. Both objects are
        # held to their pinned digest because an unverified private key is not one this server
        # should present, and an unverified password only fails later and less clearly.

        - name: 'PROCESS | Verify The TLS Delivery Against Its Pinned Digests'

          ansible.builtin.assert:
            fail_msg: >-
              The TLS delivery does not match the digests the deployment pinned. Refusing to
              import a certificate, or unlock one with a password, that is not the artifact this
              role was told to install.
            quiet: true
            that:
              - __wsus_tls_delivered__.stat.exists
              - __wsus_tls_delivered__.stat.checksum == __tls_cert__.sha256
              - __wsus_tls_password__.contents | hash('sha256') == __tls_cert__.password_sha256
              - __wsus_tls_anchor__.stat.exists
              - __wsus_tls_anchor__.stat.checksum == __tls_cert__.public_sha256

        # ------------------------------------------------------------------------------------- #
        # Unique per run, so a failed or concurrent run cannot leave PFX bytes for the next one to
        # find and reuse.

        - name: 'PROCESS | Create A Staging Directory For The TLS Delivery On The Target'
          changed_when: false
          check_mode: false
          register: '__wsus_tls_target__'

          ansible.windows.win_tempfile:
            prefix: 'windows-wsus-tls-'
            state: 'directory'

        # changed_when false because delivering the artifact is not convergence. Only the import
        # and the listener below may report a change.

        - name: 'PROCESS | Copy The Certificate To The Target'
          changed_when: false
          check_mode: false

          ansible.windows.win_copy:
            dest: "{{ __wsus_tls_target__.path }}\\certificate.pfx"
            src: "{{ __wsus_tls_controller__.path }}/certificate.pfx"

        # key_exportable false so the private key cannot be taken back off the machine that serves
        # it. key_storage machine because HTTP.SYS presents this certificate as the machine, not as
        # whichever account happened to import it.

        - name: 'PROCESS | Import The Certificate Into The Machine Store'
          no_log: true

          ansible.windows.win_certificate_store:
            key_exportable: false
            key_storage: 'machine'
            password: "{{ __wsus_tls_password__.contents }}"
            path: "{{ __wsus_tls_target__.path }}\\certificate.pfx"
            state: 'present'
            store_location: 'LocalMachine'
            store_name: 'My'

        - name: 'PROCESS | Copy The Trust Anchor To The Target'
          changed_when: false
          check_mode: false

          ansible.windows.win_copy:
            dest: "{{ __wsus_tls_target__.path }}\\trust-anchor.cer"
            src: "{{ __wsus_tls_controller__.path }}/trust-anchor.cer"

        # Root as well as My, and load-bearing rather than tidy. Once wsusutil records UsingSSL=1,
        # WSUS's own API calls go over HTTPS to this machine and .NET validates what it is
        # presented; a self-signed certificate is its own trust anchor, so without this every
        # converge AFTER the first fails on its first read of the WSUS API -- which is the second
        # run, the one that is supposed to be the proof.
        #
        # The public half, not the PFX, so the private key never enters the Root store. No password
        # and no key_storage, because there is no key in this file.

        - name: 'PROCESS | Install The Certificate As A Trust Anchor For This Server'
          register: '__wsus_tls_anchor_import__'

          ansible.windows.win_certificate_store:
            path: "{{ __wsus_tls_target__.path }}\\trust-anchor.cer"
            state: 'present'
            store_location: 'LocalMachine'
            store_name: 'Root'

        # ------------------------------------------------------------------------------------- #
        # The digest proves the anchor is the object that was declared. It does NOT prove that
        # object is the public half of the certificate the listener presents -- a consistent
        # public_object and public_sha256 naming some OTHER valid certificate passes every check
        # above, puts an unrelated anchor in Root, and leaves the next API call unable to build the
        # chain it is shown. The store reports what it imported, so the two are tied together here.
        #
        # Skipped under --check because the import it reads is the thing check mode suppressed.

        - name: 'PROCESS | Prove The Anchor Is The Certificate The Listener Will Present'
          when: not ansible_check_mode

          ansible.builtin.assert:
            fail_msg: >-
              The trust anchor installed into LocalMachine\Root is not the certificate this server
              is pinned to present. Refusing to continue: the listener would come up with a chain
              this machine cannot build, and every WSUS API call after it would fail on a
              certificate error rather than on anything that names WSUS.
            quiet: true
            that:
              - (__tls_cert__.thumbprint | upper)
                in (__wsus_tls_anchor_import__.thumbprints | default([], true) | map('upper') | list)

        # One script for all three, because a server holding any two of them serves nobody and
        # reads as configured. Explained in the script's own header.

        - name: 'PROCESS | Serve WSUS Over HTTPS With The Pinned Certificate'

          ansible.windows.win_powershell:
            depth: 3
            error_action: 'stop'
            parameters:
              DnsName: "{{ __tls_cert__.dns_name }}"
              Port: "{{ __tls__.port }}"
              SecuredPath: "{{ __tls__.secured_paths }}"
              SiteName: "{{ __tls__.site_name }}"
              Thumbprint: "{{ __tls_cert__.thumbprint }}"
              WsusUtilPath: 'C:\Program Files\Update Services\Tools\wsusutil.exe'
            script: "{{ lookup('ansible.builtin.file', 'Set-WsusHttpsListener.ps1') }}"

      # Runs whether the block converged, refused or threw. Each is guarded on its own register
      # having been set, because a failure early enough leaves the later ones undefined.
      always:

        # The CONTROLLER copy goes first, and the order is the whole point. Both copies hold the
        # private key, but only one of these two tasks can be stopped by an unreachable guest --
        # so the one that cannot is done first. Removing the target first and losing the
        # connection would leave the runner's copy behind with nothing left to remove it, while a
        # target that cannot be reached fails this task loudly instead of silently.

        - name: 'PROCESS | Remove The TLS Delivery From The Controller'
          become: false
          changed_when: false
          check_mode: false
          delegate_to: 'localhost'
          when: (__wsus_tls_controller__ | default({})).path | default('') | length > 0

          ansible.builtin.file:
            path: "{{ __wsus_tls_controller__.path }}"
            state: 'absent'

        - name: 'PROCESS | Remove The TLS Delivery From The Target'
          changed_when: false
          check_mode: false
          when: (__wsus_tls_target__ | default({})).path | default('') | length > 0

          ansible.windows.win_file:
            path: "{{ __wsus_tls_target__.path }}"
            state: 'absent'

    #endregion --- [ Process: Serve WSUS To Its Clients Over HTTPS ] -------------------------- #

    #region ------ [ Process: Admit Only The Estate To The Update Service ] ------------------- #
    # WSUS opens two firewall rules of its own at post-installation. Measured on a live server:
    # both named 'WSUS', inbound, TCP 8530 and TCP 8531, with program Any, service Any and remote
    # address ANY. That is the entire internet admitted to the update service.
    #
    # This is NOT the security group repeated. A group cannot see traffic that arrives over the VPN
    # tunnel: it sees a UDP envelope on 1194, and the payload is decapsulated inside the guest past
    # every group rule. For everything reaching this server from the lab, the host firewall is not
    # defence in depth -- it is the only defence there is.
    #
    # SCOPED THREE WAYS. To the ports WSUS serves; to System, because the listener is HTTP.SYS in
    # kernel mode and the sockets belong to PID 4 rather than to w3wp.exe -- measured, and the same
    # program Windows names in its own built-in IIS rules; and to the networks the estate actually
    # occupies, which is the control the group cannot provide.
    #
    # NOT scoped to a service, and that is a limit rather than an omission. A service filter
    # matches traffic owned by a named service, and HTTP.SYS answers these ports from the kernel --
    # measured, PID 4 -- so no service owns them. Naming one would match nothing and close the port
    # to the very clients the rule exists to admit. Windows' own IIS rules leave it unset for the
    # same reason, and so do the two WSUS installs of its own.
    #
    # The network list is given in CIDR and Windows stores it in dotted-mask form -- 10.0.0.0/16
    # becomes 10.0.0.0/255.255.0.0. Measured that this does NOT churn: the COM object normalises on
    # ASSIGNMENT, so the module compares a normalised stored value against a normalised new one and
    # finds them equal. Declaring the mask form here would be the same rule and a worse comment.
    #
    # Written in the shape Windows writes its own rules -- '<Product> (<PROTOCOL> Traffic-In)', a
    # group, and a description ending '[TCP <port>]' -- but saying WSUS things rather than IIS
    # things, so an administrator reading the rule list learns why the port is open and not merely
    # that something web-shaped wanted it.
    #
    # ADDED BEFORE THE VENDOR'S ARE REMOVED. Windows evaluates every matching allow, so during the
    # overlap the wider rule simply wins and the service never stops answering. Removing first
    # would leave a window where a client is refused for no reason anyone would later find.

    - name: 'PROCESS | Admit Only The Estate To The Update Service'
      loop: "{{ __firewall_rules__ }}"
      loop_control:
        label: "{{ item.name }}"

      community.windows.win_firewall_rule:
        action: 'allow'
        description: "{{ item.description }}"
        direction: 'in'
        enabled: true
        group: 'Windows Server Update Services (WSUS)'
        localport: "{{ item.port }}"
        name: "{{ item.name }}"
        profiles: [ 'domain', 'private', 'public' ]
        program: 'System'
        protocol: 'tcp'
        remoteip: "{{ wsus_running.firewall.admitted_networks }}"
        state: 'present'

    # Both of the vendor's rules share one display name, which is not something a declarative
    # module can address one at a time -- so the name is removed, and the two scoped rules above
    # are what remains admitting the ports.

    - name: 'PROCESS | Remove The Unscoped Rules WSUS Opened For Itself'

      community.windows.win_firewall_rule:
        direction: 'in'
        name: 'WSUS'
        state: 'absent'

    #endregion --- [ Process: Admit Only The Estate To The Update Service ] ------------------- #

    #region ------ [ Process: Reconcile Where WSUS Keeps Its Content ] ------------------------ #
    # WSUS records where its content lives in three places -- the registry root, the API cache one
    # level below it, and the IIS Content virtual directory that actually serves files -- and only
    # wsusutil movecontent updates them together. The realistic path to disagreement is a
    # re-declaration: an operator changes the content drive letter and converges, leaving the store
    # where it was while this role now asks for somewhere else.
    #
    # After the services, because the script asks the WSUS API where the content is and the API
    # answers only once the server is up. Reading a stopped server as an empty answer would compare
    # as "wrong place" and start copying a populated store, so the script refuses that read rather
    # than guessing -- but the ordering is what keeps the refusal from firing on every reboot.
    #
    # One task, not a read and a decision and a command. The script owns the whole concern: it
    # refuses the split brain movecontent cannot repair, moves when the API names the wrong cache,
    # and checks all three records against the declaration afterwards.

    - name: 'PROCESS | Reconcile Where WSUS Keeps Its Content'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          ContentRoot: "{{ __content_dir__ }}"
          MoveLogPath: 'C:\Windows\Temp\wsus-movecontent.log'
          WsusUtilPath: 'C:\Program Files\Update Services\Tools\wsusutil.exe'
        script: "{{ lookup('ansible.builtin.file', 'Set-WsusContentLocation.ps1') }}"

    #endregion --- [ Process: Reconcile Where WSUS Keeps Its Content ] ------------------------ #

    #region ------ [ Process: Grant The WSUS Service Rights On The Content Cache ] ------------ #
    # WSUS serves update files as NETWORK SERVICE, so the cache is only usable if that account can
    # write beneath it. Set rather than added: win_acl adds an allow and leaves a DENY on the same
    # identity in place, and Windows evaluates deny first -- measured on a live host, the allow
    # entry is still printed exactly as before while the account cannot write. The script purges
    # this identity's explicit entries and writes the declared one, so the result does not depend
    # on what was there before. Post-installation happens to grant this today -- measured on
    # the target -- but the role declares it rather than inheriting it, so the rights survive a
    # WSUS version that stops granting them and are stated where an operator can read them.
    # Inheritable, because the cache is a tree the product creates folders and files inside
    # long after this runs.

    - name: 'PROCESS | Grant The WSUS Service Rights On The Content Cache'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          InheritanceFlags: 'ContainerInherit, ObjectInherit'
          Path: "{{ __content_dir__ ~ '\\WsusContent' }}"
          Rights: 'FullControl'
          Sid: 'S-1-5-20'
        script: "{{ lookup('ansible.builtin.file', 'Set-AclGrant.ps1') }}"

    #endregion --- [ Process: Grant The WSUS Service Rights On The Content Cache ] ------------ #

    #region ------ [ Process: Grant Interactive Users Browse Access On The Content Root ] ----- #
    # Ratified convention: every interactive user on these servers is an administrator, and a
    # folder Explorer cannot read makes it offer "Continue", which stamps that administrator's
    # personal ACE onto the tree and leaves a stale SID behind when they depart. One shared
    # read-and-execute entry costs nothing and prevents that.
    #
    # Written EXPLICITLY though the volume root already grants the same rights by inheritance.
    # An inherited entry is the parent's to withdraw -- break inheritance here, or re-permission
    # the volume, and the access vanishes with no change to this role. The role owns what it
    # depends on.

    - name: 'PROCESS | Grant Interactive Users Browse Access On The Content Root'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          InheritanceFlags: 'ContainerInherit, ObjectInherit'
          Path: "{{ __content_dir__ }}"
          Rights: 'ReadAndExecute'
          Sid: 'S-1-5-32-545'
        script: "{{ lookup('ansible.builtin.file', 'Set-AclGrant.ps1') }}"

    #endregion --- [ Process: Grant Interactive Users Browse Access On The Content Root ] ----- #

    #region ------ [ Process: Restrict The Update Languages WSUS Will Accept ] ---------------- #
    # A WSUS server installs with every language Microsoft publishes enabled, so a synchronisation
    # would pull metadata and binaries for all of them. On a server that patches one estate that is
    # a permanent cost in disk and sync time for content nobody will ever approve.
    #
    # After the services, because the configuration is read and written through the WSUS API rather
    # than the registry, and the API answers only once the server is up.
    #
    # The script does both halves and verifies from a freshly acquired configuration object:
    # clearing the
    # all-languages flag without writing a list leaves the old list, writing a list without
    # clearing the flag leaves the flag overriding it, and the configuration object is a
    # client-side cache that would report either assignment back whether or not it persisted.

    - name: 'PROCESS | Restrict The Update Languages WSUS Will Accept'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          Language: "{{ wsus_running.updates.languages }}"
        script: "{{ lookup('ansible.builtin.file', 'Set-WsusUpdateLanguage.ps1') }}"

    #endregion --- [ Process: Restrict The Update Languages WSUS Will Accept ] ---------------- #

    #region ------ [ Process: Point This Server At Its Upstream WSUS Source ] ----------------- #
    # A WSUS server installs pointed at Microsoft Update. Leaving it there on a downstream means
    # every server in the estate approves the same update independently and pulls the same bytes
    # from the internet, which is the cost a downstream topology exists to remove.
    #
    # After the languages, because both are written through the same configuration object and the
    # API only answers once the server is up. Order between them does not matter to the product;
    # keeping the two API writes adjacent is what makes that obvious.
    #
    # All five values are one act. Recording the upstream without clearing SyncFromMicrosoftUpdate
    # leaves the address in the console and Microsoft Update as the actual source -- a server that
    # reads as configured and is not -- so the script writes and verifies the five together, and
    # stops any synchronisation in flight first, because a sync mid-run is still talking to the old
    # source and saving underneath it lands the server in a state neither configuration describes.
    #
    # The booleans arrive as booleans: Ansible templates a bare '{{ bool }}' back to a real bool
    # and win_powershell serialises it as JSON true/false, so PowerShell binds it directly. That is
    # load-bearing -- had it arrived as the string 'False', [System.Boolean] would have made it
    # true, because every non-empty string casts true.

    - name: 'PROCESS | Point This Server At Its Upstream WSUS Source'
      register: '__wsus_upstream__'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          Replica: "{{ wsus_running.sync.replica }}"
          UpstreamPort: "{{ wsus_running.sync.upstream_port }}"
          UpstreamServer: "{{ wsus_running.sync.upstream_server }}"
          UseSsl: "{{ wsus_running.sync.upstream_use_ssl }}"
        script: "{{ lookup('ansible.builtin.file', 'Set-WsusUpstream.ps1') }}"

    #endregion --- [ Process: Point This Server At Its Upstream WSUS Source ] ----------------- #

    #region ------ [ Process: Bring The Catalogue And Its Content Down From The Upstream ] ---- #
    # Pointing a server at an upstream fetches nothing. Until a synchronisation completes this
    # server offers its clients an empty catalogue -- and a client that asks an empty server
    # reports "no updates required" and looks exactly like success. That silence is the failure
    # this region exists to remove, and it is the only one in the role a client can see.
    #
    # Force is the upstream actor's OWN change report rather than a fingerprint recomputed here.
    # The question is "does the catalogue on disk come from the source we are now pointed at", and
    # the task that re-pointed the server has already answered it. The contract reached the same
    # answer by hashing five values into a registry marker; this reaches it by asking the task
    # that knows.
    #
    # default({}) because under --check the module reports what it would do without a result, and
    # a run that cannot read the flag should decline to force rather than fail reading it.

    - name: 'PROCESS | Bring The Catalogue And Its Content Down From The Upstream'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          ContentTimeoutSeconds: "{{ wsus_running.sync.content_timeout_seconds }}"
          Force: "{{ (__wsus_upstream__.result | default({})).changed | default(false) }}"
          TimeoutSeconds: "{{ wsus_running.sync.timeout_seconds }}"
        script: "{{ lookup('ansible.builtin.file', 'Invoke-WsusSynchronisation.ps1') }}"

    #endregion --- [ Process: Bring The Catalogue And Its Content Down From The Upstream ] ---- #

#endregion --- [ Process: Configure WSUS on Windows ] ----------------------------------------- #


#region ------ [ End: Configure WSUS on Windows ] --------------------------------------------- #

- name: 'END | Prove The Result'
  vars:
    __desired_data__: "{{ wsus_running.db.drive_letter }}:\\{{ wsus_running.db.data_subdir }}"
    __desired_log__: "{{ wsus_running.db.drive_letter }}:\\{{ wsus_running.db.log_subdir }}"

  # Begin The 'End' Block
  block:

    #region ------ [ End: Re-Read The Engine ] ------------------------------------------------ #
    # Ungated, so a converged host proves the same state as one this run just changed. This is the
    # same read BEGIN performed, against the same script, so the two cannot disagree about what
    # counts as placed -- and it asks the ENGINE, because the registry is only a request.

    # A restarted instance reports Running before it accepts connections, so opening the
    # connection can throw for a few seconds after PROCESS. Retrying covers that, and with it
    # every other throw this read can raise -- a host missing the service or the settings key
    # spends the full minute before failing.
    #
    # Reading successfully is not the same as the engine being up. win_reboot returns at the
    # logon prompt, before the auto-start services have finished, and the script reports a
    # Start Pending instance as a clean read with placement_read false. The until condition
    # therefore requires placement_read as well as success, so the retry covers a half-started
    # engine rather than accepting its answer. `and` short-circuits, so a genuinely failed read
    # never dereferences .result.

    - name: 'END | Re-Read Where This Instance Creates Databases'
      register: '__wsus_placement_proof__'
      retries: 12
      delay: 5
      until: >-
        __wsus_placement_proof__ is succeeded
        and __wsus_placement_proof__.result.placement_read

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          ServiceName: 'MSSQLSERVER'
          InstanceName: 'MSSQLSERVER'
          InstanceNamesKey: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\Instance Names\SQL'
          InstanceRoot: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server'
          DesiredData: "{{ __desired_data__ }}"
          DesiredLog: "{{ __desired_log__ }}"
        script: "{{ lookup('ansible.builtin.file', 'Get-SqlDatabasePlacement.ps1') }}"

    #endregion --- [ End: Re-Read The Engine ] ------------------------------------------------ #

    #region ------ [ End: Prove SUSDB Can Actually Serve ] ------------------------------------ #
    # Decision 23 cut the adoption actor's gates to ONLINE alone and named this the boundary that
    # owns the rest, so this is where the rest lives. Where the files are is proven above; this is
    # whether the database behind them can be used. Ungated, so a host that adopted and a host that
    # created prove the same thing.

    - name: 'END | Prove SUSDB Can Actually Serve'
      ansible.builtin.assert:
        fail_msg: >-
          Expected SUSDB to be ONLINE and writable. The engine reports state
          '{{ __wsus_placement_proof__.result.susdb_state | default('none', true) }}' and
          is_read_only={{ __wsus_placement_proof__.result.susdb_read_only }}. A database that is
          attached where it belongs but cannot serve is one post-installation would build on.
        quiet: true
        that:
          - __wsus_placement_proof__.result.susdb_state == 'ONLINE'
          - __wsus_placement_proof__.result.susdb_read_only == 0

    #endregion --- [ End: Prove SUSDB Can Actually Serve ] ------------------------------------ #

    #region ------ [ End: Prove No SUSDB File Sits On The System Volume ] --------------------- #
    # The engine only lists files it has ATTACHED, so a stray pair left on C: by an earlier run is
    # invisible to every proof above. The path that produces one is nameable: a converge whose
    # placement pin did not take before post-installation ran creates the database at the engine's
    # old default, which is on the system volume. Searched where SQL Server and WSUS actually put
    # files, not across the whole disk, which would cost minutes to answer a bounded question.

    - name: 'END | Read The System Volume For Stray Database Files'
      register: '__wsus_system_volume_susdb__'

      ansible.windows.win_find:
        age_stamp: 'mtime'
        case_sensitive: false
        checksum_algorithm: 'sha1'
        file_type: 'file'
        follow: false
        get_checksum: false
        hidden: false
        paths: ['C:\Program Files\Microsoft SQL Server', 'C:\Program Files\Update Services']
        patterns: ['SUSDB*.mdf', 'SUSDB*.ldf']
        recurse: true
        use_regex: false

    # ----------------------------------------------------------------------------------------- #

    # The migration contract inverts its removal task here: under SQL nothing may place a SUSDB
    # file on the system volume, so the rebuild proves the absence instead of performing a
    # deletion. A file found here is not deleted -- an operator decides what it is.

    - name: 'END | Prove No SUSDB File Sits On The System Volume'
      ansible.builtin.assert:
        fail_msg: >-
          Expected no SUSDB file anywhere on the system volume. Found
          {{ __wsus_system_volume_susdb__.files | map(attribute='path') | join(', ') }}. The
          database this role places belongs on {{ wsus_running.db.drive_letter }}:, so a copy
          on C: is one an earlier run created before the engine was pinned. Nothing is deleted
          here.
        quiet: true
        that:
          - __wsus_system_volume_susdb__.files | length == 0

    #endregion --- [ End: Prove No SUSDB File Sits On The System Volume ] --------------------- #

#endregion --- [ End: Configure WSUS on Windows ] --------------------------------------------- #
