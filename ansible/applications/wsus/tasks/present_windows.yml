# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Complete install path for the wsus role on the Windows family (resolved by the v3
# loader via first_found; a future 'present_windows_<dist>_<ver>.yml' would shadow this
# automatically). Receives the merged running configuration as 'config'.
#
# BUILD IN PROGRESS — BEGIN Input Guards gather disk facts and resolve each declared
# data disk (config.wid_disk_id -> E:, config.wsus_disk_id -> F:) to exactly one
# attached disk. The Main region's state-aware safety guard authorizes provisioning.
# Config-contract invariants (id distinctness) live in tasks/validate.yml (run by the
# loader). Later pieces (C02c+) append the volume mutations after the Main region, one
# command per cycle piece.
#
# =========================================================================================== #
---
#region ------ [ Script ] -------------------------------------------------------------------- #

- name: 'INFO | Entering OS Tasks (present_windows - wsus)'
  vars:
    __data_disks__:
      - purpose: 'db'
        id: "{{ config.wid_disk_id | default('') }}"
        drive_letter: "{{ config.data_disks.db.drive_letter }}"
        matches: "{{ ansible_facts.disks | selectattr('unique_id', 'equalto', config.wid_disk_id | default('')) | list }}"
      - purpose: 'content'
        id: "{{ config.wsus_disk_id | default('') }}"
        drive_letter: "{{ config.data_disks.content.drive_letter }}"
        matches: "{{ ansible_facts.disks | selectattr('unique_id', 'equalto', config.wsus_disk_id | default('')) | list }}"
  block:

    #region ------ [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Initialization: Input Guards ] ------------------------------------------ #

    # This is the single canonical read-only gather at the superset the safety path needs
    # (partition_style + partitions[].drive_letter). No role task mutates disks before these
    # facts are consumed, so the snapshot stays valid; C02c owns its post-mutation refresh.
    - name: 'BEGIN | Loading Disk, Partition and Volume Facts'
      community.windows.win_disk_facts:
        filter:
          - 'physical_disk'
          - 'partitions'
          - 'volumes'

    - name: 'BEGIN | Assert Declared Data Disks Are Attached'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      ansible.builtin.assert:
        that:
          - item.matches | length == 1
        fail_msg: >-
          Expected exactly one attached disk whose unique_id matches the
          '{{ item.purpose }}' identifier ('{{ item.id }}'), but found
          {{ item.matches | length }}.
          Attached disks:
          {% for disk in ansible_facts.disks %}
          number={{ disk.number | default('unknown') }}, unique_id={{ disk.unique_id | default('unknown') }},
          size={{ disk.size | default('unknown') }}{%- if not loop.last %}; {% endif %}
          {% endfor %}
        quiet: true

    #endregion --- [ Initialization: Input Guards ] ------------------------------------------ #

    #endregion --- [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Main: Data Volume Provisioning ] --------------------------------------- #

    - name: 'MAIN | Assert Target Disk Is Safe To Provision'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      vars:
        __target_disk__: "{{ item.matches | first }}"
        __foreign_lettered__: >-
          {{
            __target_disk__.partitions | default([])
            | selectattr('drive_letter', 'defined')
            | selectattr('drive_letter')
            | rejectattr('drive_letter', 'equalto', item.drive_letter)
            | list
          }}
      ansible.builtin.assert:
        that:
          - __target_disk__.partition_style == 'RAW' or (__foreign_lettered__ | length == 0)
        fail_msg: >-
          Refusing to provision the '{{ item.purpose }}' disk (unique_id '{{ item.id }}'): it is
          already initialized (partition_style {{ __target_disk__.partition_style }}) and carries
          partition(s) with a foreign drive letter
          ({{ __foreign_lettered__ | map(attribute='drive_letter') | join(', ') }}). The role will
          not clobber existing data — clear the disk or correct the identifier.
        quiet: true

    # This first mutation is gated by the safety assert above. force:false is idempotent
    # (a no-op on an already-GPT disk); online:true defensively onlines an offline RAW disk
    # (the handed RAW-Online-writable disks need no change here), but is not a general
    # read-only fix for non-RAW disks. uniqueid targets the disk directly without disk_number.
    - name: 'MAIN | Initialize Data Disk (GPT, online, writable)'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      community.windows.win_initialize_disk:
        uniqueid: "{{ item.id }}"
        style: gpt
        online: true
        force: false

    #endregion --- [ Main: Data Volume Provisioning ] --------------------------------------- #

#endregion --- [ Script ] -------------------------------------------------------------------- #
