# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Complete install and configuration path for the wsus role on the Windows family (resolved by
# the v3 loader via first_found). Receives the merged running configuration as 'config'.
#
# Disk provisioning is delegated to windows_disk_manager, which the playbook runs first. The wsus
# role builds WID and WSUS content paths from the database and content letters; its IIS letter
# anchors both literal IIS paths. The playbook feeds both roles one shared layout, and this role's
# independently reusable configuration invariants are enforced in tasks/validate.yml.
#
# =========================================================================================== #
---
#region ------ [ Script ] -------------------------------------------------------------------- #

- name: 'MAIN | Resolve The Windows System Drive'
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $systemDrive = [string]$env:SystemDrive

    if ($systemDrive -notmatch '^[A-Za-z]:$') {
        throw "The process SystemDrive value is missing or invalid: [$systemDrive]"
    }

    $systemDrive.ToUpperInvariant()
  register: __wsus_system_drive__
  changed_when: false

- name: 'INFO | Entering OS Tasks (present_windows - wsus)'
  vars:
    # Application paths derive from the same layout the playbook passes to the disk manager.
    __content_dir__: "{{ config.data_disks.content.drive_letter }}:\\{{ config.content_subdir }}"
    __wid_data_dir__: "{{ config.data_disks.db.drive_letter }}:\\{{ config.db_subdir }}"
    # WID instance's fixed default data directory under %SystemDrive% (MS-specified; SUSDB installs
    # here — measured on the target). Derived from the explicit read-only probe above, NOT literal
    # C: and NOT from db_subdir (which names the configurable E: TARGET; the source is fixed by WID).
    __wid_source_dir__: "{{ __wsus_system_drive__.stdout | trim }}\\Windows\\WID\\Data"
    # Fixed WID master named-pipe connection string (architectural constant: the WID instance pipe is
    # MICROSOFT##WID; named pipes are case-insensitive). Env-passed (WID_CONN) to the SqlClient blocks so the
    # literal is defined once and no raw \\.\pipe\ backslashes sit in PowerShell source (split_args-safety).
    __wid_conn_master__: 'server=\\.\pipe\MICROSOFT##WID\tsql\query;database=master;trusted_connection=true;'
    # The four 'Installed Role Services' completion flags written at the END of each postinstall component
    # (measured =2). Hoisted to block scope (C14a) so the C05 postinstall gate AND the C14a
    # data-loss interlock consume ONE derivation — a second, divergent copy would be a latent inconsistency.
    # Block vars are lazily evaluated, so referencing the mid-block register is fine.
    __postinstall_flags__: >-
      {{
        ['UpdateServices-API', 'UpdateServices-Services', 'UpdateServices-UI', 'UpdateServices-WidDatabase']
        | map('extract', __wsus_postinstall_probe__.properties | default({}), 'value')
        | map('default', 0)
        | list
      }}
  block:

    #region ------ [ Main: WSUS Installation ] ---------------------------------------------- #

    # Creates the WSUS content root on the formatted content volume (derived F:\WSUS).
    # win_file state:directory is idempotent (creates if absent, no-op if present).
    # wsusutil postinstall (C05) creates WSUSContent inside it.
    - name: 'MAIN | Ensure WSUS Content Directory Exists'
      ansible.windows.win_file:
        path: "{{ __content_dir__ }}"
        state: directory

    # Org convention (Director 2026-07-16): every interactive user on a server is an admin. An
    # unreadable folder makes Explorer offer 'Continue', which stamps the admin's PERSONAL ACE
    # onto the ACL — stale SIDs after they depart. The explicit Users grant kills the prompt.
    # R&X only (writes stay behind deliberate elevation); explicit rather than relying on the
    # format-default root-ACL inheritance, which a later hardening pass would silently remove.
    - name: 'MAIN | Grant Users Browse Access On The Content Root'
      ansible.windows.win_acl:
        path: "{{ __content_dir__ }}"
        user: 'BUILTIN\Users'
        rights: 'ReadAndExecute'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Installs the WSUS role on the WID backend (MS Step 1: Install-WindowsFeature -Name
    # UpdateServices -IncludeManagementTools). The WID role services are named EXPLICITLY —
    # MS never states the bare-parent auto-pull verbatim, and a missing WidDB would only
    # surface later as a postinstall failure. include_management_tools brings the WSUS console
    # + the UpdateServices PowerShell module (C07's Get-WsusServer). DO NOT set
    # include_sub_features: it maps to -IncludeAllSubFeature and would also pull
    # UpdateServices-DB (SQL Server Connectivity), which a WID build must NOT have.
    # Install HTTP logging in the same feature transaction so a host that requires a reboot
    # takes it once, before postinstall or any database mutation.  A converged rerun reports
    # NoChangeNeeded and reboot_required=false.
    - name: 'MAIN | Install WSUS Server Role (WID) And IIS HTTP Logging'
      ansible.windows.win_feature:
        name:
          - 'UpdateServices'
          - 'UpdateServices-WidDB'
          - 'UpdateServices-Services'
          - 'Web-Http-Logging'
        include_management_tools: true
        state: present
      register: __wsus_features__

    - name: 'MAIN | Reboot After Windows Feature Installation When Required'
      when: __wsus_features__.reboot_required | default(false) | bool
      ansible.windows.win_reboot:
        msg: 'Ansible is rebooting after WSUS/IIS feature installation'
        pre_reboot_delay: 5
        post_reboot_delay: 15
        reboot_timeout: 1200

    # Target directory for the SUSDB relocation (C06 — community procedure, MS-unsupported,
    # Director-approved 2026-07-16) on the dedicated DB volume. Must exist before the WID
    # service-account ACL grant (C06b), the adopt attach (C14i), and the relocation attach (C06g).
    # Hoisted above postinstall (C14i) so the adopt attach has its directory + ACLs in place:
    # without the WID-service FullControl grant an attached SUSDB comes up READ-ONLY and WSUS
    # silently stops syncing. win_file creates parents (E:\WID then E:\WID\Data) and no-ops when present.
    - name: 'MAIN | Ensure WID Data Directory Exists'
      ansible.windows.win_file:
        path: "{{ __wid_data_dir__ }}"
        state: directory

    # Load-bearing ACL for the relocation: without it the C06g attach SUCCEEDS but SUSDB comes
    # up READ-ONLY and WSUS silently stops syncing. Detach flips file ownership, so this dir
    # grant (inherited by the copied .mdf/.ldf) is what guarantees the engine can open them.
    # FullControl mirrors the engine's ACL on its own C:\Windows\WID\Data; the virtual account
    # name is fixed by the WID instance (MICROSOFT##WID) — architectural, not config.
    - name: 'MAIN | Grant WID Service Account Rights On The Relocation Target'
      ansible.windows.win_acl:
        path: "{{ __wid_data_dir__ }}"
        user: 'NT SERVICE\MSSQL$MICROSOFT##WID'
        rights: 'FullControl'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Same org convention as the content-root Users grant (see the WSUS Installation region).
    # DB files readable by Users is accepted in this trust model — everyone is an admin anyway;
    # this is ACL hygiene (stale-SID prevention), not access control.
    - name: 'MAIN | Grant Users Browse Access On The WID Data Directory'
      ansible.windows.win_acl:
        path: "{{ __wid_data_dir__ }}"
        user: 'BUILTIN\Users'
        rights: 'ReadAndExecute'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present

    # Read-only completion-truth probe: the four Installed Role Services flags are written at
    # the END of each postinstall component (measured =2 live). Get-WsusServer is
    # runtime-truth and failed when the C06 arc legitimately stopped the stack; a midway
    # postinstall death leaves flags !=2, so the documented repair operation re-runs.
    # Runtime verification belongs to C07.
    - name: 'MAIN | Probe WSUS Post-Installation State'
      ansible.windows.win_reg_stat:
        path: 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup\Installed Role Services'
      register: __wsus_postinstall_probe__

    # Runs the WSUS post-installation: creates SUSDB in WID (on C: — relocated at C06), creates
    # WSUSContent inside the content root, configures the IIS 'WSUS Administration' site (8530),
    # and enables+starts WsusService. WID is selected by the ABSENCE of SQL_INSTANCE_NAME. Gated
    # by the completion flags above (all four =2 means configured -> skip). argv auto-quotes per
    # Win32 rules (the exe path contains spaces). NO trailing backslash on CONTENT_DIR. wsusutil
    # logs to a random .tmp in %TEMP% (stdout names it); the first run takes minutes.
    - name: 'MAIN | Run WSUS Post-Installation (WID, content on F:)'
      when: __postinstall_flags__ != [2, 2, 2, 2]
      ansible.windows.win_command:
        argv:
          - 'C:\Program Files\Update Services\Tools\wsusutil.exe'
          - 'postinstall'
          - 'CONTENT_DIR={{ __content_dir__ }}'
      register: __wsus_postinstall__

    #endregion --- [ Main: WSUS Installation ] ---------------------------------------------- #

    #region ------ [ Main: SUSDB Relocation ] ----------------------------------------------- #

    # Observe attachment and file state on every run.  The old gate depended on postinstall being
    # changed in this run, so interruption after detach left all future runs skipping relocation.
    - name: 'MAIN | Observe The Attached SUSDB Location'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
        try {
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT physical_name FROM sys.master_files WHERE database_id = DB_ID('SUSDB');"
            $reader = $cmd.ExecuteReader()
            $files = @()
            while ($reader.Read()) { $files += [string]$reader['physical_name'] }
            $reader.Close()
        } finally {
            if ($conn.State -eq 'Open') { $conn.Close() }
        }
        if ($files.Count -eq 0) { Write-Output 'absent'; return }
        $targetPrefix = $env:WID_DATA_DIR.TrimEnd([char]92) + [char]92
        $sourcePrefix = $env:WID_SOURCE_DIR.TrimEnd([char]92) + [char]92
        if (@($files | Where-Object { -not $_.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase) }).Count -eq 0) {
            Write-Output 'target'
        } elseif (@($files | Where-Object { -not $_.StartsWith($sourcePrefix, [System.StringComparison]::OrdinalIgnoreCase) }).Count -eq 0) {
            Write-Output 'source'
        } else {
            Write-Output 'other'
        }
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
        WID_SOURCE_DIR: '{{ __wid_source_dir__ }}'
      register: __susdb_location_probe__
      changed_when: false

    - name: 'MAIN | Observe SUSDB Source And Target File Pairs'
      ansible.windows.win_stat:
        path: '{{ item.path }}'
        get_checksum: false
      loop:
        - { label: 'source-mdf', path: '{{ __wid_source_dir__ }}\SUSDB.mdf' }
        - { label: 'source-ldf', path: '{{ __wid_source_dir__ }}\SUSDB_log.ldf' }
        - { label: 'target-mdf', path: '{{ __wid_data_dir__ }}\SUSDB.mdf' }
        - { label: 'target-ldf', path: '{{ __wid_data_dir__ }}\SUSDB_log.ldf' }
      loop_control:
        label: '{{ item.label }}'
      register: __susdb_file_probe__

    - name: 'MAIN | Resolve The Observed SUSDB State'
      ansible.builtin.set_fact:
        __susdb_location__: '{{ __susdb_location_probe__.stdout | trim }}'
        __susdb_source_count__: >-
          {{ (__susdb_file_probe__.results[0:2] | selectattr('stat.exists') | list | length) }}
        __susdb_target_count__: >-
          {{ (__susdb_file_probe__.results[2:4] | selectattr('stat.exists') | list | length) }}

    # Authority table before any detach:
    #   attached=source + complete source => source wins; discard ANY unattached target and
    #     rebuild it byte-for-byte, even when the target pair looks complete.
    #   attached=target + complete target => target wins; source is removed only after health.
    #   attached=absent + only one complete pair => that pair is the recovery source.
    #   attached=absent + both complete pairs => ambiguous and MUST fail without mutation.
    # A complete-but-stale target is therefore never adopted over an attached source database.
    - name: 'MAIN | Discard Any Unattached Target While Source SUSDB Is Authoritative'
      when:
        - __susdb_location__ == 'source'
        - __susdb_source_count__ | int == 2
        - __susdb_target_count__ | int > 0
      ansible.windows.win_file:
        path: '{{ __wid_data_dir__ }}\{{ item }}'
        state: absent
      loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
      loop_control:
        label: '{{ item }}'

    - name: 'MAIN | Normalize The Source-Authoritative SUSDB Target State'
      when:
        - __susdb_location__ == 'source'
        - __susdb_source_count__ | int == 2
        - __susdb_target_count__ | int > 0
      ansible.builtin.set_fact:
        __susdb_target_count__: 0

    # A killed copy can leave one target file while no database is attached. A complete source
    # pair makes that partial target safely disposable; two complete pairs remain ambiguous.
    - name: 'MAIN | Remove An Incomplete Recoverable Unattached SUSDB Target Pair'
      when:
        - __susdb_location__ == 'absent'
        - __susdb_source_count__ | int == 2
        - __susdb_target_count__ | int == 1
      ansible.windows.win_file:
        path: '{{ __wid_data_dir__ }}\{{ item }}'
        state: absent
      loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
      loop_control:
        label: '{{ item }}'

    - name: 'MAIN | Normalize The Recoverable Unattached SUSDB Target State'
      when:
        - __susdb_location__ == 'absent'
        - __susdb_source_count__ | int == 2
        - __susdb_target_count__ | int == 1
      ansible.builtin.set_fact:
        __susdb_target_count__: 0

    - name: 'MAIN | Classify The SUSDB Recovery Action'
      ansible.builtin.set_fact:
        __susdb_recovery_action__: >-
          {% if __susdb_location__ == 'target' and (__susdb_target_count__ | int) == 2 and (__susdb_source_count__ | int) in [0, 2] %}
          converged
          {% elif __susdb_location__ == 'source' and (__susdb_source_count__ | int) == 2 and (__susdb_target_count__ | int) == 0 %}
          rebuild_from_source
          {% elif __susdb_location__ == 'absent' and (__susdb_source_count__ | int) == 2 and (__susdb_target_count__ | int) == 0 %}
          copy_from_source
          {% elif __susdb_location__ == 'absent' and (__susdb_source_count__ | int) == 0 and (__susdb_target_count__ | int) == 2 %}
          attach_target
          {% else %}
          invalid
          {% endif %}

    - name: 'MAIN | Assert SUSDB Has One Recoverable State'
      ansible.builtin.assert:
        that:
          - (__susdb_recovery_action__ | trim) != 'invalid'
        fail_msg: >-
          Refusing an ambiguous SUSDB recovery: attached={{ __susdb_location__ }},
          source_files={{ __susdb_source_count__ }}, target_files={{ __susdb_target_count__ }}.
          An unattached database with two complete pairs has no authoritative copy and is never
          guessed; partial/mixed/foreign attachment states also fail without detach or attach.
        quiet: true

    - name: 'MAIN | Converge SUSDB Attachment To The Data Volume'
      when: (__susdb_recovery_action__ | trim) != 'converged'
      block:
        - name: 'MAIN | Stop WSUS Consumers For SUSDB Relocation'
          ansible.windows.win_service:
            name: '{{ item }}'
            state: stopped
          loop: ['WsusService', 'W3SVC']
          loop_control:
            label: '{{ item }}'

        - name: 'MAIN | Detach The System-Volume SUSDB'
          when: __susdb_location__ == 'source'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            try {
                $conn.Open()
                $cmd = $conn.CreateCommand()
                $cmd.CommandText = 'ALTER DATABASE SUSDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC master.dbo.sp_detach_db @dbname = N''SUSDB'';'
                $cmd.ExecuteNonQuery() | Out-Null
            } finally {
                if ($conn.State -eq 'Open') { $conn.Close() }
            }
            Write-Output 'detached'
          environment:
            WID_CONN: '{{ __wid_conn_master__ }}'
          changed_when: true

        - name: 'MAIN | Copy A Complete SUSDB Pair To The Data Volume'
          when: __susdb_target_count__ | int == 0
          ansible.windows.win_copy:
            src: '{{ __wid_source_dir__ }}\{{ item }}'
            dest: '{{ __wid_data_dir__ }}\{{ item }}'
            remote_src: true
          loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
          loop_control:
            label: '{{ item }}'

        - name: 'MAIN | Attach SUSDB From The Data Volume'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $dirSql = $env:WID_DATA_DIR.Replace("'", "''")
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            try {
                $conn.Open()
                $cmd = $conn.CreateCommand()
                $cmd.CommandText = "CREATE DATABASE SUSDB ON (FILENAME = N'$dirSql\SUSDB.mdf'), (FILENAME = N'$dirSql\SUSDB_log.ldf') FOR ATTACH;"
                $cmd.ExecuteNonQuery() | Out-Null
                $cmd.CommandText = "SELECT d.state_desc AS s, d.is_read_only AS ro, m.physical_name AS pn FROM sys.databases d JOIN sys.master_files m ON m.database_id = d.database_id WHERE d.name = 'SUSDB';"
                $reader = $cmd.ExecuteReader()
                $state = $null
                $readOnly = $null
                $files = @()
                while ($reader.Read()) {
                    $state = [string]$reader['s']
                    $readOnly = [int]$reader['ro']
                    $files += [string]$reader['pn']
                }
                $reader.Close()
                $prefix = $env:WID_DATA_DIR.TrimEnd([char]92) + [char]92
                $offTarget = @($files | Where-Object { -not $_.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase) })
                if ($state -ne 'ONLINE' -or $readOnly -ne 0 -or $files.Count -lt 2 -or $offTarget.Count -gt 0) {
                    try {
                        $detach = $conn.CreateCommand()
                        $detach.CommandText = 'ALTER DATABASE SUSDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC master.dbo.sp_detach_db @dbname = N''SUSDB'';'
                        $detach.ExecuteNonQuery() | Out-Null
                    } catch {}
                    throw ("attached SUSDB failed target health verification: state=$state readOnly=$readOnly files=$($files -join ';')")
                }
            } finally {
                if ($conn.State -eq 'Open') { $conn.Close() }
            }
            Write-Output 'attached'
          environment:
            WID_CONN: '{{ __wid_conn_master__ }}'
            WID_DATA_DIR: '{{ __wid_data_dir__ }}'
          changed_when: true

      rescue:
        # Best effort restores serviceability from a complete pair, then the play still fails so
        # unattended proof cannot hide the interrupted/failed relocation.
        - name: 'RECOVER | Reattach The Best Complete SUSDB Pair'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
            try {
                $conn.Open()
                $probe = $conn.CreateCommand()
                $probe.CommandText = "SELECT COUNT(*) FROM sys.databases WHERE name = 'SUSDB';"
                if ([int]$probe.ExecuteScalar() -gt 0) { Write-Output 'already-attached'; return }
                $candidates = @($env:WID_DATA_DIR, $env:WID_SOURCE_DIR) | Select-Object -Unique
                $errors = @()
                foreach ($dir in $candidates) {
                    $complete = (Test-Path -LiteralPath (Join-Path $dir 'SUSDB.mdf')) -and (Test-Path -LiteralPath (Join-Path $dir 'SUSDB_log.ldf'))
                    if (-not $complete) { continue }
                    try {
                        $dirSql = $dir.Replace("'", "''")
                        $attach = $conn.CreateCommand()
                        $attach.CommandText = "CREATE DATABASE SUSDB ON (FILENAME = N'$dirSql\SUSDB.mdf'), (FILENAME = N'$dirSql\SUSDB_log.ldf') FOR ATTACH;"
                        $attach.ExecuteNonQuery() | Out-Null
                        $health = $conn.CreateCommand()
                        $health.CommandText = "SELECT state_desc + ':' + CONVERT(varchar(1), is_read_only) FROM sys.databases WHERE name = 'SUSDB';"
                        if ([string]$health.ExecuteScalar() -ne 'ONLINE:0') { throw 'attached database is not ONLINE/read-write' }
                        Write-Output ('recovered:' + $dir)
                        return
                    } catch {
                        $errors += ($dir + '=' + $_.Exception.Message)
                        try {
                            $detach = $conn.CreateCommand()
                            $detach.CommandText = 'IF DB_ID(''SUSDB'') IS NOT NULL BEGIN ALTER DATABASE SUSDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC master.dbo.sp_detach_db @dbname = N''SUSDB''; END'
                            $detach.ExecuteNonQuery() | Out-Null
                        } catch {}
                    }
                }
                throw ('no complete healthy SUSDB pair could be recovered: ' + ($errors -join '; '))
            } finally {
                if ($conn.State -eq 'Open') { $conn.Close() }
            }
          environment:
            WID_CONN: '{{ __wid_conn_master__ }}'
            WID_DATA_DIR: '{{ __wid_data_dir__ }}'
            WID_SOURCE_DIR: '{{ __wid_source_dir__ }}'
          register: __susdb_recovery__
          failed_when: false
          changed_when: "(__susdb_recovery__.stdout | trim).startswith('recovered:')"

        - name: 'RECOVER | Fail After SUSDB Relocation Recovery'
          ansible.builtin.fail:
            msg: >-
              SUSDB relocation failed at '{{ ansible_failed_task.name | default('unknown task') }}'.
              Best-effort recovery result: {{ __susdb_recovery__.stdout | default('no output') | trim }}.
              The run remains failed so this interruption cannot be reported as proof.

      always:
        - name: 'RECOVER | Restore WSUS Consumer Services'
          ansible.windows.win_service:
            name: '{{ item }}'
            state: started
          loop: ['W3SVC', 'WsusService']
          loop_control:
            label: '{{ item }}'
          failed_when: false

    - name: 'MAIN | Ensure WSUS Services Are Running After SUSDB Convergence'
      ansible.windows.win_service:
        name: '{{ item }}'
        state: started
      loop: ['W3SVC', 'WsusService']
      loop_control:
        label: '{{ item }}'

    - name: 'MAIN | Verify SUSDB Relocation Health'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $conn = New-Object System.Data.SqlClient.SqlConnection($env:WID_CONN)
        try {
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT d.state_desc AS s, d.is_read_only AS ro, m.physical_name AS pn FROM sys.databases d JOIN sys.master_files m ON m.database_id = d.database_id WHERE d.name = 'SUSDB';"
            $reader = $cmd.ExecuteReader()
            $state = $null
            $ro = $null
            $files = @()
            while ($reader.Read()) {
                $state = [string]$reader['s']
                $ro = [int]$reader['ro']
                $files += [string]$reader['pn']
            }
            $reader.Close()
        } finally {
            if ($conn.State -eq 'Open') { $conn.Close() }
        }
        $prefix = $env:WID_DATA_DIR.TrimEnd([char]92) + [char]92
        $offTarget = @($files | Where-Object { -not $_.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase) })
        if ($state -ne 'ONLINE' -or $ro -ne 0 -or $files.Count -lt 2 -or $offTarget.Count -gt 0) {
            throw ("SUSDB is unsafe: state=$state readOnly=$ro files=$($files -join ';')")
        }
        $null = Get-WsusServer
        Write-Output 'healthy'
      environment:
        WID_CONN: '{{ __wid_conn_master__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
      register: __susdb_relocated_healthy__
      changed_when: false

    - name: 'MAIN | Remove SUSDB Originals From System Volume'
      ansible.windows.win_file:
        path: '{{ __wid_source_dir__ }}\{{ item }}'
        state: absent
      loop: ['SUSDB.mdf', 'SUSDB_log.ldf']
      loop_control:
        label: '{{ item }}'

    #endregion --- [ Main: SUSDB Relocation ] ----------------------------------------------- #

    #region ------ [ Main: WSUS Tuning ] --------------------------------------------------- #

    # Fail-closed guard: win_iis_webapppool state:started would create a bogus generic pool
    # if WsusPool were absent, leaving WSUS silently broken. Refuse to tune unless install +
    # postinstall created it. Read-only (changed_when:false); §4b guard / §8 win_shell.
    - name: 'MAIN | Assert WsusPool Exists Before Tuning'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        if (-not (Test-Path 'IIS:\AppPools\WsusPool')) {
            throw 'WsusPool application pool not found - WSUS install + postinstall must complete before tuning; refusing to let win_iis_webapppool create a bogus pool.'
        }
        Write-Output 'present'
      changed_when: false

    # MS WSUS best practices, "Disable recycling and configure memory limits": prevents the
    # scan-storm / HTTP-503 / high-memory cascade when a recycle drops + rebuilds the metadata
    # cache. Values are role defaults (config.wsuspool.*), overridable for shared hosts. The
    # native module diffs current vs desired (idempotent). Source:
    # learn.microsoft.com/troubleshoot/mem/configmgr/update-management/windows-server-update-services-best-practices
    - name: 'MAIN | Tune WsusPool Application Pool'
      community.windows.win_iis_webapppool:
        name: WsusPool
        state: started
        attributes:
          queueLength: '{{ config.wsuspool.queue_length | int }}'
          recycling.periodicRestart.privateMemory: '{{ config.wsuspool.private_memory_kb | int }}'
          recycling.periodicRestart.memory: '{{ config.wsuspool.virtual_memory_kb | int }}'
          recycling.periodicRestart.time: '{{ config.wsuspool.periodic_restart }}'
          processModel.idleTimeout: '{{ config.wsuspool.idle_timeout }}'
          processModel.pingingEnabled: '{{ config.wsuspool.pinging_enabled | bool }}'

    #endregion --- [ Main: WSUS Tuning ] -------------------------------------------------- #

    #region ------ [ Main: WSUS Sync Configuration ] --------------------------------------- #

    # Restrict update languages (default en) so a sync doesn't pull every language (the
    # postinstall default is ALL). StringCollection of lowercase codes + AllUpdateLanguagesEnabled
    # false; normalized order-insensitive compare; re-acquire + verify after Save to avoid
    # perpetual-change/false-converge. Env-passed langs; WSUS-cmdlet win_shell (§8).
    - name: 'MAIN | Restrict WSUS Update Languages'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $want = @($env:WSUS_LANGS.Split(',') | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ } | Select-Object -Unique)
        if ($want.Count -eq 0) {
            throw 'no update languages specified'
        }
        $wantSorted = @($want | Sort-Object)
        $c = (Get-WsusServer).GetConfiguration()
        $current = @(@($c.GetEnabledUpdateLanguages()) | ForEach-Object { ([string]$_).ToLowerInvariant() } | Sort-Object)
        $needChange = $c.AllUpdateLanguagesEnabled -or @(Compare-Object $current $wantSorted).Count -gt 0
        if ($needChange) {
            $sc = New-Object System.Collections.Specialized.StringCollection
            foreach ($l in $want) { [void]$sc.Add($l) }
            $c.AllUpdateLanguagesEnabled = $false
            $c.SetEnabledUpdateLanguages($sc)
            $c.Save()
            $c2 = (Get-WsusServer).GetConfiguration()
            $after = @(@($c2.GetEnabledUpdateLanguages()) | ForEach-Object { ([string]$_).ToLowerInvariant() } | Sort-Object)
            if ($c2.AllUpdateLanguagesEnabled -or @(Compare-Object $after $wantSorted).Count -gt 0) {
                throw ('language restriction did not persist: got [' + ($after -join ',') + '] AllEnabled=' + $c2.AllUpdateLanguagesEnabled)
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        WSUS_LANGS: '{{ config.sync.update_languages | join(",") }}'
      register: __wsus_lang_cfg__
      changed_when: "__wsus_lang_cfg__.stdout | trim == 'changed'"

    # Configure the source BEFORE any synchronization.  The former ordering started a Microsoft
    # Update category sync, marked it on acceptance, then stopped it to save this downstream
    # source. Save only on a five-field diff and verify the persisted values.
    - name: 'MAIN | Configure Upstream WSUS Source'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:UPSTREAM_SERVER)) {
            throw 'upstream_server is required for a downstream topology: declare it in the wsus: override dict (config.upstream_server)'
        }
        $wantPort = [int]$env:UPSTREAM_PORT
        $wantSsl = [System.Convert]::ToBoolean($env:UPSTREAM_SSL)
        $wantReplica = [System.Convert]::ToBoolean($env:REPLICA)
        $c = (Get-WsusServer).GetConfiguration()
        $needChange = $c.SyncFromMicrosoftUpdate -or ($c.UpstreamWsusServerName -ne $env:UPSTREAM_SERVER) -or ($c.UpstreamWsusServerPortNumber -ne $wantPort) -or ($c.UpstreamWsusServerUseSsl -ne $wantSsl) -or ($c.IsReplicaServer -ne $wantReplica)
        if ($needChange) {
            $sub = (Get-WsusServer).GetSubscription()
            if ([string]$sub.GetSynchronizationStatus() -ne 'NotProcessing') {
                $sub.StopSynchronization()
                $stopDeadline = (Get-Date).AddSeconds(60)
                do {
                    Start-Sleep -Seconds 2
                } while ((Get-Date) -lt $stopDeadline -and [string]$sub.GetSynchronizationStatus() -ne 'NotProcessing')
                if ([string]$sub.GetSynchronizationStatus() -ne 'NotProcessing') {
                    throw 'could not stop the in-progress synchronization before saving the upstream source config'
                }
            }
            $c.SyncFromMicrosoftUpdate = $false
            $c.UpstreamWsusServerName = $env:UPSTREAM_SERVER
            $c.UpstreamWsusServerPortNumber = $wantPort
            $c.UpstreamWsusServerUseSsl = $wantSsl
            $c.IsReplicaServer = $wantReplica
            $c.Save()
            $c2 = (Get-WsusServer).GetConfiguration()
            if ($c2.SyncFromMicrosoftUpdate -or ($c2.UpstreamWsusServerName -ne $env:UPSTREAM_SERVER) -or ($c2.UpstreamWsusServerPortNumber -ne $wantPort) -or ($c2.UpstreamWsusServerUseSsl -ne $wantSsl) -or ($c2.IsReplicaServer -ne $wantReplica)) {
                throw ('upstream source did not persist: SyncFromMU=' + $c2.SyncFromMicrosoftUpdate + ' upstream=[' + $c2.UpstreamWsusServerName + '] port=' + $c2.UpstreamWsusServerPortNumber + ' ssl=' + $c2.UpstreamWsusServerUseSsl + ' replica=' + $c2.IsReplicaServer)
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        UPSTREAM_SERVER: '{{ config.upstream_server | default("") | string | trim }}'
        UPSTREAM_PORT: '{{ config.sync.upstream_port }}'
        UPSTREAM_SSL: '{{ config.sync.upstream_use_ssl | bool | lower }}'
        REPLICA: '{{ config.sync.replica | bool | lower }}'
      register: __wsus_source__
      changed_when: "__wsus_source__.stdout | trim == 'changed'"

    # A TCP check is intentionally conditional: the repository's AWS play is presently an honest
    # configuration smoke because its placeholder corporate upstream is unreachable. Enabling the
    # bootstrap converts this to functional proof and therefore requires a reachable source.
    - name: 'MAIN | Wait For The Configured Upstream WSUS Endpoint'
      when: config.sync.bootstrap_enabled | bool
      ansible.windows.win_wait_for:
        host: "{{ config.upstream_server }}"
        port: "{{ config.sync.upstream_port | int }}"
        state: started
        connect_timeout: 5
        timeout: 120

    - name: 'INFO | Synchronization Proof Is Deliberately Disabled'
      when: not (config.sync.bootstrap_enabled | bool)
      ansible.builtin.debug:
        msg: >-
          WSUS topology was configured, but sync.bootstrap_enabled=false: this run is a
          configuration smoke and does not claim upstream reachability or synchronization.

    # A durable marker now means a terminal Succeeded history record. Acceptance and an in-flight
    # status are never recorded as success. The fingerprint invalidates the marker whenever source
    # or language policy changes; a failed/timed-out sync leaves no marker and retries next run.
    - name: 'MAIN | Bootstrap WSUS Category Sync To Terminal Success'
      when: config.sync.bootstrap_enabled | bool
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $w = Get-WsusServer
        $s = $w.GetSubscription()
        $cfg = $w.GetConfiguration()
        $serverId = [string]$cfg.ServerId
        $fingerprintInput = @(
            $env:UPSTREAM_SERVER.Trim().ToLowerInvariant(),
            $env:UPSTREAM_PORT,
            $env:UPSTREAM_SSL.ToLowerInvariant(),
            $env:REPLICA.ToLowerInvariant(),
            $env:WSUS_LANGS.ToLowerInvariant()
        ) -join '|'
        $sha = [System.Security.Cryptography.SHA256]::Create()
        try {
            $fingerprint = ([System.BitConverter]::ToString(
                $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($fingerprintInput))
            )).Replace('-', '')
        } finally {
            $sha.Dispose()
        }
        $key = 'HKLM:\SOFTWARE\nwarila-platform\wsus'
        $marker = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue
        if ($marker.category_bootstrap_server_id -eq $serverId -and
            $marker.category_bootstrap_fingerprint -eq $fingerprint) {
            Write-Output 'nochange'
            return
        }

        $startedHere = $false
        if ([string]$s.GetSynchronizationStatus() -eq 'NotProcessing') {
            $preHist = @($s.GetSynchronizationHistory()).Count
            $s.StartSynchronizationForCategoryOnly()
            $startedHere = $true
            $acceptDeadline = (Get-Date).AddSeconds([int]$env:ACCEPT_TIMEOUT)
            do {
                Start-Sleep -Seconds 3
                $accepted = ([string]$s.GetSynchronizationStatus() -ne 'NotProcessing') -or
                    (@($s.GetSynchronizationHistory()).Count -gt $preHist)
            } while (-not $accepted -and (Get-Date) -lt $acceptDeadline)
            if (-not $accepted) {
                throw 'category sync was not accepted within bootstrap_accept_timeout_sec'
            }
        }

        $deadline = (Get-Date).AddSeconds([int]$env:COMPLETION_TIMEOUT)
        while ([string]$s.GetSynchronizationStatus() -ne 'NotProcessing' -and
               (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds ([int]$env:POLL_SECONDS)
        }
        if ([string]$s.GetSynchronizationStatus() -ne 'NotProcessing') {
            throw 'category sync did not reach a terminal state within bootstrap_completion_timeout_sec'
        }
        $history = @($s.GetSynchronizationHistory() | Sort-Object EndTime -Descending)
        if ($history.Count -eq 0) {
            throw 'category sync reached idle without a synchronization history record'
        }
        $latest = $history[0]
        if ([string]$latest.Result -ne 'Succeeded') {
            throw ('category sync terminal result was ' + [string]$latest.Result + ', not Succeeded')
        }
        if (-not (Test-Path $key)) {
            New-Item -Path $key -Force | Out-Null
        }
        New-ItemProperty -Path $key -Name 'category_bootstrap_server_id' -Value $serverId -PropertyType String -Force | Out-Null
        New-ItemProperty -Path $key -Name 'category_bootstrap_fingerprint' -Value $fingerprint -PropertyType String -Force | Out-Null
        if ($startedHere) { Write-Output 'changed' } else { Write-Output 'completed' }
      environment:
        ACCEPT_TIMEOUT: '{{ config.sync.bootstrap_accept_timeout_sec }}'
        COMPLETION_TIMEOUT: '{{ config.sync.bootstrap_completion_timeout_sec }}'
        POLL_SECONDS: '{{ config.sync.bootstrap_poll_sec }}'
        UPSTREAM_SERVER: '{{ config.upstream_server | string | trim }}'
        UPSTREAM_PORT: '{{ config.sync.upstream_port }}'
        UPSTREAM_SSL: '{{ config.sync.upstream_use_ssl | bool | lower }}'
        REPLICA: '{{ config.sync.replica | bool | lower }}'
        WSUS_LANGS: '{{ config.sync.update_languages | map("lower") | sort | join(",") }}'
      register: __wsus_bootstrap__
      changed_when: "__wsus_bootstrap__.stdout | trim in ['changed', 'completed']"

    #endregion --- [ Main: WSUS Sync Configuration ] -------------------------------------- #

    #region ------ [ Main: IIS Logging + Relocation ] ------------------------------------- #

    # Web-Http-Logging was installed with the WSUS feature set above, before the reboot and
    # postinstall boundary.  The tasks below can therefore treat active W3C logging as an
    # invariant rather than mutating Windows features midway through configuration.

    # IIS site-level log paths can override siteDefaults, so the role repoints both to the
    # literal G: path for STIG-auditable active logging off the system volume. Validate the
    # path before any mutation and create the directory in-shell so a bad %VAR% override is
    # never expanded by another module before rejection.
    - name: 'MAIN | Relocate IIS Logs To G:'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        function Normalize-IisConfiguredPath([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p)) {
                return ''
            }
            return $p.Trim().Replace('/', [char]92).TrimEnd([char]92)
        }
        $want = Normalize-IisConfiguredPath $env:IIS_LOG_DIR
        if ($want -match '%[^%]+%' -or $want -notmatch '^[A-Za-z]:') {
            throw ('iis.log_dir must be a literal drive-qualified path (no %VAR%): ' + $env:IIS_LOG_DIR)
        }
        $changed = $false
        if (-not (Test-Path -LiteralPath $want)) {
            New-Item -ItemType Directory -Path $want -Force | Out-Null
            $changed = $true
        }
        function Test-IisConfiguredPath([string]$cur) {
            $c = Normalize-IisConfiguredPath $cur
            if ($c -match '%[^%]+%') {
                return $false
            }
            return [string]::Equals($c, $want, [System.StringComparison]::OrdinalIgnoreCase)
        }
        $globalCur = (Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name directory).Value
        $sites = @(Get-Website)
        $needChange = (-not (Test-IisConfiguredPath $globalCur)) -or (@($sites | Where-Object { -not (Test-IisConfiguredPath $_.logFile.directory) }).Count -gt 0)
        if ($needChange) {
            Set-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name directory -value $want
            foreach ($s in $sites) {
                Set-ItemProperty -LiteralPath ('IIS:\Sites' + [char]92 + $s.Name) -name logFile.directory -value $want
            }
            $globalAfter = (Get-WebConfigurationProperty -filter 'system.applicationHost/sites/siteDefaults/logFile' -name directory).Value
            $bad = @()
            if (-not (Test-IisConfiguredPath $globalAfter)) {
                $bad += 'siteDefaults'
            }
            foreach ($s in @(Get-Website)) {
                if (-not (Test-IisConfiguredPath $s.logFile.directory)) {
                    $bad += $s.Name
                }
            }
            if ($bad.Count -gt 0) {
                throw ('IIS log dir did not persist to ' + $want + ' for: ' + ($bad -join ','))
            }
            $changed = $true
        }
        if ($changed) {
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        IIS_LOG_DIR: '{{ config.iis.log_dir }}'
      register: __iis_logdir__
      changed_when: "__iis_logdir__.stdout | trim == 'changed'"

    # Validate once before mutation so native path params never expand a bad %VAR% override.
    - name: 'MAIN | Validate + Normalize IIS wwwroot Target'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $p = $env:WWWROOT
        if ([string]::IsNullOrWhiteSpace($p)) {
            throw 'iis.wwwroot is required'
        }
        $norm = $p.Trim().Replace('/', [char]92).TrimEnd([char]92)
        if ($norm -match '%[^%]+%' -or $norm -notmatch '^[A-Za-z]:') {
            throw ('iis.wwwroot must be a literal drive-qualified path (no %VAR%): ' + $p)
        }
        Write-Output $norm
      environment:
        WWWROOT: '{{ config.iis.wwwroot }}'
      register: __iis_wwwroot_norm__
      changed_when: false

    # Copy content before repointing so the Default Web Site has a populated G: root.
    - name: 'MAIN | Copy IIS wwwroot Content To G:'
      ansible.windows.win_copy:
        src: 'C:\inetpub\wwwroot\'
        dest: '{{ __iis_wwwroot_norm__.stdout | trim }}\'
        remote_src: true

    # Repoint IIS default-root metadata in both registry views to the IIS disk.
    - name: 'MAIN | Repoint InetStp PathWWWRoot To G:'
      ansible.windows.win_regedit:
        path: '{{ item }}'
        name: PathWWWRoot
        data: '{{ __iis_wwwroot_norm__.stdout | trim }}'
        type: string
      loop:
        - 'HKLM:\SOFTWARE\Microsoft\InetStp'
        - 'HKLM:\SOFTWARE\Wow6432Node\Microsoft\InetStp'

    # Repoint only the Default Web Site; the WSUS Administration site stays untouched.
    - name: 'MAIN | Repoint Default Web Site Root To G:'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        function Normalize-IisConfiguredPath([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p)) {
                return ''
            }
            return $p.Trim().Replace('/', [char]92).TrimEnd([char]92)
        }
        $want = Normalize-IisConfiguredPath $env:WWWROOT
        if ($want -match '%[^%]+%' -or $want -notmatch '^[A-Za-z]:') {
            throw ('wwwroot must be a literal drive-qualified path (no %VAR%): ' + $env:WWWROOT)
        }
        $site = Get-Website -Name 'Default Web Site'
        if (-not $site) {
            throw 'Default Web Site not found'
        }
        function Test-IisConfiguredPath([string]$cur) {
            $c = Normalize-IisConfiguredPath $cur
            if ($c -match '%[^%]+%') {
                return $false
            }
            return [string]::Equals($c, $want, [System.StringComparison]::OrdinalIgnoreCase)
        }
        if (-not (Test-IisConfiguredPath $site.physicalPath)) {
            Set-ItemProperty -LiteralPath 'IIS:\Sites\Default Web Site' -name physicalPath -value $want
            $after = (Get-Website -Name 'Default Web Site').physicalPath
            if (-not (Test-IisConfiguredPath $after)) {
                throw ('Default Web Site physicalPath did not persist to ' + $want + ' (got ' + $after + ')')
            }
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        WWWROOT: '{{ __iis_wwwroot_norm__.stdout | trim }}'
      register: __iis_wwwroot__
      changed_when: "__iis_wwwroot__.stdout | trim == 'changed'"

    # STIG V-218790 (IIST-SV-000115): the IIS log directory must grant SYSTEM + Administrators FullControl.
    # Director (2026-07-18): org convention + STIG FC — keep the explicit BUILTIN\Users ReadAndExecute grant
    # (ratified Users-ACL convention: everyone-is-admin, explicit not inherited) AND add SYSTEM/Administrators
    # FullControl. Additive (state present) — does not strip other ACEs. Native win_acl, idempotent.
    - name: 'MAIN | Set IIS Log Directory ACLs (SYSTEM/Admins FullControl, Users R&X)'
      ansible.windows.win_acl:
        path: '{{ config.iis.log_dir }}'
        user: '{{ item.user }}'
        rights: '{{ item.rights }}'
        type: allow
        inherit: 'ContainerInherit, ObjectInherit'
        state: present
      loop:
        - { user: 'NT AUTHORITY\SYSTEM', rights: 'FullControl' }
        - { user: 'BUILTIN\Administrators', rights: 'FullControl' }
        - { user: 'BUILTIN\Users', rights: 'ReadAndExecute' }
      loop_control:
        label: '{{ item.user }}'

    #endregion --- [ Main: IIS Logging + Relocation ] ------------------------------------- #

    #region ------ [ Main: WSUS SSL (delivered certificate) ] ------------------------------ #

    # The CA-issued PFX and its password live at the artifact prefix the IAM pins
    # (bucket = wsus.bucket, keys tls.pfx_key and tls.pfx_key + '.password'). The CONTROLLER
    # downloads both through the read-only artifact-reader role (s3_artifact_delivery get) —
    # the target never holds an S3 credential — then copies the PFX up, imports it with the
    # password as a no_log argument, validates it without persisting its key, imports the exact
    # pinned leaf, binds it to tls.port in IIS, and wsusutil configuressl flips client-facing
    # endpoints to HTTPS. Trust distribution stays out of scope.

    # The block conditional is re-evaluated for every task it covers, including tasks inside the
    # delivery role below — where the lazy `config` binding resolves against that role's own name
    # and fails. Pin the flag as a host fact so the inherited conditional stays resolvable.
    - name: 'MAIN | Resolve The TLS Enablement Flag'
      ansible.builtin.set_fact:
        __tls_enabled__: '{{ config.tls.enabled | bool }}'

    - name: 'MAIN | Deliver, Validate, Import, And Bind The TLS Certificate'
      when: __tls_enabled__
      block:
        - name: 'MAIN | Resolve The Pinned TLS Identity'
          ansible.builtin.set_fact:
            __tls_thumbprint__: '{{ config.tls.thumbprint | trim | upper }}'

        # Skip controller delivery on a converged second pass. Binding and live validation below
        # still run every time, so drift is repaired without counting two ephemeral S3 downloads.
        - name: 'MAIN | Probe The Pinned Certificate In The Machine Store'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $cert = Get-Item (Join-Path 'Cert:\LocalMachine\My' $env:TLS_THUMBPRINT) -ErrorAction SilentlyContinue
            if (-not $cert -or -not $cert.HasPrivateKey -or $cert.NotBefore -gt (Get-Date) -or
                $cert.NotAfter -lt (Get-Date).AddDays([int]$env:MINIMUM_VALIDITY_DAYS)) {
                Write-Output 'absent'
                return
            }
            # GetNameInfo returns one arbitrary DNS name; a multi-SAN certificate matches when ANY
            # of its DNS names does. DnsNameList enumerates every SAN entry with a CN fallback.
            $wantedDns = $env:TLS_DNS_NAME.Trim().ToLowerInvariant()
            $certificateNames = @($cert.DnsNameList | ForEach-Object { "$($_.Unicode)".Trim().ToLowerInvariant() })
            $dnsMatches = $false
            foreach ($certificateDns in $certificateNames) {
                if ($certificateDns -eq $wantedDns) { $dnsMatches = $true; break }
                if ($certificateDns.StartsWith('*.')) {
                    $suffix = $certificateDns.Substring(1)
                    if ($wantedDns.EndsWith($suffix) -and
                        ($wantedDns.Split('.').Count -eq $certificateDns.Split('.').Count)) { $dnsMatches = $true; break }
                }
            }
            if ($dnsMatches) { Write-Output 'present' } else { Write-Output 'absent' }
          environment:
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
            TLS_DNS_NAME: '{{ config.tls.dns_name }}'
            MINIMUM_VALIDITY_DAYS: '{{ config.tls.minimum_validity_days }}'
          register: __tls_store_probe__
          changed_when: false

        - name: 'MAIN | Create A Unique TLS Staging Directory On The Controller'
          when: __tls_store_probe__.stdout | trim != 'present'
          delegate_to: localhost
          become: false
          ansible.builtin.tempfile:
            state: directory
            prefix: 'windows-wsus-tls-'
          register: __tls_controller_temp__
          changed_when: false

        - name: 'MAIN | Restrict The Controller TLS Staging Directory'
          when: __tls_store_probe__.stdout | trim != 'present'
          delegate_to: localhost
          become: false
          ansible.builtin.file:
            path: '{{ __tls_controller_temp__.path }}'
            state: directory
            mode: '0700'
          changed_when: false

        # Host facts cross the included role's scope boundary; unique paths prevent a failed or
        # concurrent run from reusing stale PFX/password bytes.
        - name: 'MAIN | Resolve The Unique TLS Delivery Coordinates'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.builtin.set_fact:
            __tls_staging__: '{{ __tls_controller_temp__.path }}'
            __tls_bucket__: '{{ config.bucket }}'
            __tls_pfx_key__: '{{ config.tls.pfx_key }}'

        - name: 'MAIN | Download The TLS Certificate And Password To The Controller'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.builtin.include_role:
            name: 's3_artifact_delivery'
            tasks_from: 'get'
          vars:
            s3_artifact_delivery_reader_role_arn: "arn:aws:iam::{{ aws_account_id }}:role/windows-wsus-artifact-reader"
            s3_artifact_delivery_session_name: 'wsus-tls-delivery'
            s3_artifact_delivery_bucket: '{{ __tls_bucket__ }}'
            s3_artifact_delivery_region: '{{ aws_region }}'
            s3_artifact_delivery_controller_objects:
              - object_key: '{{ __tls_pfx_key__ }}'
                destination: '{{ __tls_staging__ }}/certificate.pfx'
              - object_key: '{{ __tls_pfx_key__ }}.password'
                destination: '{{ __tls_staging__ }}/certificate.pfx.password'

        - name: 'MAIN | Read The PFX Password Into Protected Memory'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.builtin.set_fact:
            __tls_pfx_password__: "{{ lookup('ansible.builtin.file', __tls_staging__ ~ '/certificate.pfx.password') | trim }}"
          no_log: true

        - name: 'MAIN | Create A Unique TLS Staging Directory On The Target'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_tempfile:
            state: directory
            prefix: 'windows-wsus-tls-'
          register: __tls_target_temp__
          changed_when: false

        - name: 'MAIN | Copy The Certificate To The Unique Target Path'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_copy:
            src: '{{ __tls_staging__ }}/certificate.pfx'
            dest: '{{ __tls_target_temp__.path }}\certificate.pfx'
          changed_when: false

        # Load with EphemeralKeySet so validation cannot persist the private key.  Import happens
        # only after private-key, pin, DNS identity, activation, and expiry checks all pass.
        - name: 'MAIN | Validate The PFX Before Import'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $storageFlags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]
            try {
                try {
                    $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                        $env:PFX_PATH, $env:PFX_PASSWORD, $storageFlags::EphemeralKeySet)
                } catch [System.Security.Cryptography.CryptographicException] {
                    # .NET Framework rejects EphemeralKeySet for legacy CAPI-keyed PFXs; fall back
                    # to a non-persisted machine-context load. Dispose below scrubs its key file.
                    $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                        $env:PFX_PATH, $env:PFX_PASSWORD, $storageFlags::MachineKeySet)
                }
                try {
                    $wantThumb = $env:TLS_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
                    $gotThumb = $cert.Thumbprint.Replace(' ', '').ToUpperInvariant()
                    if (-not $cert.HasPrivateKey) { throw 'PFX leaf certificate has no private key' }
                    if ($gotThumb -ne $wantThumb) { throw "PFX thumbprint $gotThumb does not match pinned $wantThumb" }
                    $now = Get-Date
                    if ($cert.NotBefore -gt $now) { throw ('certificate is not active until ' + $cert.NotBefore.ToString('o')) }
                    $minimumExpiry = $now.AddDays([int]$env:MINIMUM_VALIDITY_DAYS)
                    if ($cert.NotAfter -lt $minimumExpiry) { throw ('certificate expires too soon: ' + $cert.NotAfter.ToString('o')) }
                    # GetNameInfo returns one arbitrary DNS name; a multi-SAN certificate matches
                    # when ANY of its DNS names does. DnsNameList enumerates every SAN entry.
                    $wantedDns = $env:TLS_DNS_NAME.Trim().ToLowerInvariant()
                    $certificateNames = @($cert.DnsNameList | ForEach-Object { "$($_.Unicode)".Trim().ToLowerInvariant() })
                    $dnsMatches = $false
                    foreach ($certificateDns in $certificateNames) {
                        if ($certificateDns -eq $wantedDns) { $dnsMatches = $true; break }
                        if ($certificateDns.StartsWith('*.')) {
                            $suffix = $certificateDns.Substring(1)
                            if ($wantedDns.EndsWith($suffix) -and
                                ($wantedDns.Split('.').Count -eq $certificateDns.Split('.').Count)) { $dnsMatches = $true; break }
                        }
                    }
                    if (-not $dnsMatches) {
                        throw ('certificate DNS names (' + ($certificateNames -join ', ') + ") do not match ${wantedDns}")
                    }
                    Write-Output ('validated:' + $gotThumb)
                } finally {
                    $cert.Dispose()
                }
            } catch {
                # Sanitized marker for the uncensored assert below; never includes the password.
                Write-Output ('validation-error: ' + $_.Exception.GetType().FullName + ': ' + $_.Exception.Message)
                exit 1
            }
          environment:
            PFX_PATH: '{{ __tls_target_temp__.path }}\certificate.pfx'
            PFX_PASSWORD: '{{ __tls_pfx_password__ }}'
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
            TLS_DNS_NAME: '{{ config.tls.dns_name }}'
            MINIMUM_VALIDITY_DAYS: '{{ config.tls.minimum_validity_days }}'
          no_log: true
          changed_when: false
          failed_when: false
          register: __tls_validate__

        # no_log censors the validator's own failure output. Its stdout carries only the
        # sanitized markers above, so this separate task can surface the verdict readably.
        - name: 'MAIN | Enforce The PFX Validation Verdict'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.builtin.assert:
            that:
              - __tls_validate__.rc == 0
              - __tls_validate__.stdout is search('^validated:')
            fail_msg: 'PFX validation failed: {{ __tls_validate__.stdout | trim }}'
            success_msg: '{{ __tls_validate__.stdout | trim }}'

        - name: 'MAIN | Import The Validated Certificate Into The Machine Store'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_certificate_store:
            path: '{{ __tls_target_temp__.path }}\certificate.pfx'
            password: '{{ __tls_pfx_password__ }}'
            store_location: 'LocalMachine'
            store_name: 'My'
            key_storage: 'machine'
            key_exportable: false
            state: present
          no_log: true
          register: __tls_import__

        # Do not rely on win_certificate_store.thumbprints: some collection versions return
        # that list only when an import changed the store. Query the converged store directly.
        - name: 'MAIN | Assert The Pinned Leaf Exists In The Machine Store'
          when: __tls_store_probe__.stdout | trim != 'present'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $cert = Get-Item (Join-Path 'Cert:\LocalMachine\My' $env:TLS_THUMBPRINT) -ErrorAction Stop
            if ($cert.Thumbprint.ToUpperInvariant() -ne $env:TLS_THUMBPRINT) {
                throw ('machine-store thumbprint differs from pin: ' + $cert.Thumbprint)
            }
            if (-not $cert.HasPrivateKey) { throw 'pinned machine-store certificate has no private key' }
            Write-Output 'present'
          environment:
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
          changed_when: false

        - name: 'MAIN | Bind The Pinned Certificate To The WSUS HTTPS Endpoint'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            Import-Module WebAdministration
            $thumb = $env:TLS_THUMBPRINT
            $port = [int]$env:TLS_PORT
            $site = 'WSUS Administration'
            $changed = $false
            $binding = Get-WebBinding -Name $site -Protocol https -Port $port -ErrorAction SilentlyContinue
            if (-not $binding) {
                New-WebBinding -Name $site -Protocol https -Port $port -IPAddress '*'
                $changed = $true
            }
            $sslPath = 'IIS:\SslBindings\0.0.0.0!' + $port
            $bound = Get-Item $sslPath -ErrorAction SilentlyContinue
            if (-not $bound -or $bound.Thumbprint -ne $thumb) {
                if ($bound) { Remove-Item $sslPath }
                $cert = Get-Item (Join-Path 'Cert:\LocalMachine\My' $thumb)
                if (-not $cert.HasPrivateKey) { throw 'pinned certificate in LocalMachine/My has no private key' }
                New-Item $sslPath -Value $cert | Out-Null
                $changed = $true
            }
            $verify = Get-Item $sslPath
            if ($verify.Thumbprint -ne $thumb) { throw 'SSL binding did not persist the pinned thumbprint' }
            if ($changed) { Write-Output 'changed' } else { Write-Output 'nochange' }
          environment:
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
            TLS_PORT: '{{ config.tls.port }}'
          register: __tls_binding__
          changed_when: "__tls_binding__.stdout | trim == 'changed'"

        - name: 'MAIN | Require SSL On The Client-Facing WSUS Endpoints'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            Import-Module WebAdministration
            $dns = $env:TLS_DNS_NAME
            $vdirs = @('ApiRemoting30', 'ClientWebService', 'DSSAuthWebService', 'ServerSyncWebService', 'SimpleAuthWebService')
            $changed = $false
            foreach ($name in $vdirs) {
                $location = 'WSUS Administration/' + $name
                $value = (Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Location $location -Filter 'system.webServer/security/access' -Name 'sslFlags').Value
                $text = [string]$value
                if ($text -ne 'Ssl' -and $text -ne '8') {
                    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Location $location -Filter 'system.webServer/security/access' -Name 'sslFlags' -Value 'Ssl'
                    $changed = $true
                }
            }
            $wsusutil = Join-Path $env:ProgramFiles 'Update Services\Tools\wsusutil.exe'
            $out = & $wsusutil configuressl $dns 2>&1
            $text = ($out -join ' ')
            if ($LASTEXITCODE -ne 0) { throw ('wsusutil configuressl failed rc=' + $LASTEXITCODE + ' output=' + $text) }
            if ($text -notmatch 'https://') { throw ('configuressl still reports a non-SSL URL: ' + $text) }
            if ($changed) { Write-Output 'changed' } else { Write-Output 'nochange' }
          environment:
            TLS_DNS_NAME: '{{ config.tls.dns_name }}'
          register: __tls_configuressl__
          changed_when: "__tls_configuressl__.stdout | trim == 'changed'"

        # Validate what IIS actually serves, independently of the certificate-store and binding
        # APIs. Trust distribution is out of scope, so the callback permits the private CA while
        # the task explicitly verifies the pinned peer identity and validity window.
        - name: 'VERIFY | Complete A Live TLS Handshake With The Pinned Certificate'
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $tcp = New-Object System.Net.Sockets.TcpClient
            $ssl = $null
            try {
                $tcp.Connect('127.0.0.1', [int]$env:TLS_PORT)
                $callback = { param($sender, $certificate, $chain, $errors) return $true }
                $ssl = New-Object System.Net.Security.SslStream($tcp.GetStream(), $false, $callback)
                $ssl.AuthenticateAsClient($env:TLS_DNS_NAME)
                $peer = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($ssl.RemoteCertificate)
                if ($peer.Thumbprint.ToUpperInvariant() -ne $env:TLS_THUMBPRINT) {
                    throw ('live endpoint served unexpected thumbprint ' + $peer.Thumbprint)
                }
                if ($peer.NotAfter -lt (Get-Date).AddDays([int]$env:MINIMUM_VALIDITY_DAYS)) {
                    throw ('live endpoint certificate expires too soon: ' + $peer.NotAfter.ToString('o'))
                }
                Write-Output 'healthy'
            } finally {
                if ($ssl) { $ssl.Dispose() }
                $tcp.Dispose()
            }
          environment:
            TLS_PORT: '{{ config.tls.port }}'
            TLS_DNS_NAME: '{{ config.tls.dns_name }}'
            TLS_THUMBPRINT: '{{ __tls_thumbprint__ }}'
            MINIMUM_VALIDITY_DAYS: '{{ config.tls.minimum_validity_days }}'
          register: __tls_live_probe__
          retries: 12
          delay: 5
          until: __tls_live_probe__.rc == 0
          changed_when: false

      always:
        - name: 'CLEANUP | Remove The Unique TLS Staging Directory From The Target'
          when:
            - __tls_target_temp__ is defined
            - __tls_target_temp__.path is defined
          ansible.windows.win_file:
            path: '{{ __tls_target_temp__.path }}'
            state: absent
          changed_when: false

        - name: 'CLEANUP | Remove The Unique TLS Staging Directory From The Controller'
          when:
            - __tls_controller_temp__ is defined
            - __tls_controller_temp__.path is defined
          delegate_to: localhost
          become: false
          ansible.builtin.file:
            path: '{{ __tls_controller_temp__.path }}'
            state: absent
          changed_when: false

        - name: 'CLEANUP | Clear The In-Memory PFX Password Fact'
          when: __tls_pfx_password__ is defined
          ansible.builtin.set_fact:
            __tls_pfx_password__: null
          no_log: true

    # Independent read-only acceptance gate.  This re-derives the externally meaningful state
    # rather than trusting task return values; it is also safe to run after a second converge.
    - name: 'VERIFY | Assert The Complete WSUS Runtime Contract'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module WebAdministration
        foreach ($serviceName in @('MSSQL$MICROSOFT##WID', 'W3SVC', 'WsusService')) {
            $service = Get-Service -Name $serviceName -ErrorAction Stop
            if ($service.Status -ne 'Running') { throw "$serviceName is $($service.Status), not Running" }
        }
        foreach ($path in @($env:CONTENT_DIR, $env:WID_DATA_DIR, $env:IIS_LOG_DIR, $env:IIS_WWWROOT)) {
            if (-not (Test-Path -LiteralPath $path -PathType Container)) { throw "required directory is absent: $path" }
        }
        $wsus = Get-WsusServer
        $cfg = $wsus.GetConfiguration()
        $wantPort = [int]$env:UPSTREAM_PORT
        $wantSsl = [System.Convert]::ToBoolean($env:UPSTREAM_SSL)
        $wantReplica = [System.Convert]::ToBoolean($env:REPLICA)
        if ($cfg.SyncFromMicrosoftUpdate -or
            $cfg.UpstreamWsusServerName -ne $env:UPSTREAM_SERVER -or
            $cfg.UpstreamWsusServerPortNumber -ne $wantPort -or
            $cfg.UpstreamWsusServerUseSsl -ne $wantSsl -or
            $cfg.IsReplicaServer -ne $wantReplica) {
            throw 'persisted WSUS upstream source differs from the desired contract'
        }
        $pool = Get-Item 'IIS:\AppPools\WsusPool' -ErrorAction Stop
        if ([string]$pool.state -ne 'Started') { throw ('WsusPool is ' + [string]$pool.state) }
        $defaultSite = Get-Website -Name 'Default Web Site' -ErrorAction Stop
        if (-not [string]::Equals($defaultSite.physicalPath.TrimEnd([char]92), $env:IIS_WWWROOT.TrimEnd([char]92), [System.StringComparison]::OrdinalIgnoreCase)) {
            throw ('Default Web Site root differs from ' + $env:IIS_WWWROOT)
        }
        $globalLog = (Get-WebConfigurationProperty -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name directory).Value
        if (-not [string]::Equals(([string]$globalLog).TrimEnd([char]92), $env:IIS_LOG_DIR.TrimEnd([char]92), [System.StringComparison]::OrdinalIgnoreCase)) {
            throw ('IIS siteDefaults log path differs from ' + $env:IIS_LOG_DIR)
        }
        foreach ($site in @(Get-Website)) {
            if (-not [string]::Equals(([string]$site.logFile.directory).TrimEnd([char]92), $env:IIS_LOG_DIR.TrimEnd([char]92), [System.StringComparison]::OrdinalIgnoreCase)) {
                throw ($site.Name + ' log path differs from ' + $env:IIS_LOG_DIR)
            }
        }
        if ([System.Convert]::ToBoolean($env:TLS_ENABLED)) {
            $binding = Get-Item ('IIS:\SslBindings\0.0.0.0!' + [int]$env:TLS_PORT) -ErrorAction Stop
            if ($binding.Thumbprint -ne $env:TLS_THUMBPRINT) { throw 'IIS SSL binding differs from the pinned certificate' }
            foreach ($name in @('ApiRemoting30', 'ClientWebService', 'DSSAuthWebService', 'ServerSyncWebService', 'SimpleAuthWebService')) {
                $location = 'WSUS Administration/' + $name
                $flags = [string](Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Location $location -Filter 'system.webServer/security/access' -Name 'sslFlags').Value
                if ($flags -ne 'Ssl' -and $flags -ne '8') { throw ($location + ' does not require SSL') }
            }
        }
        if ([System.Convert]::ToBoolean($env:BOOTSTRAP_ENABLED)) {
            $serverId = [string]$cfg.ServerId
            $marker = Get-ItemProperty 'HKLM:\SOFTWARE\nwarila-platform\wsus' -ErrorAction Stop
            if ($marker.category_bootstrap_server_id -ne $serverId -or
                [string]::IsNullOrWhiteSpace($marker.category_bootstrap_fingerprint)) {
                throw 'terminal-success category bootstrap marker is absent or stale'
            }
        }
        Write-Output 'healthy'
      environment:
        CONTENT_DIR: '{{ __content_dir__ }}'
        WID_DATA_DIR: '{{ __wid_data_dir__ }}'
        IIS_LOG_DIR: '{{ config.iis.log_dir }}'
        IIS_WWWROOT: '{{ config.iis.wwwroot }}'
        UPSTREAM_SERVER: '{{ config.upstream_server | string | trim }}'
        UPSTREAM_PORT: '{{ config.sync.upstream_port }}'
        UPSTREAM_SSL: '{{ config.sync.upstream_use_ssl | bool | lower }}'
        REPLICA: '{{ config.sync.replica | bool | lower }}'
        TLS_ENABLED: '{{ config.tls.enabled | bool | lower }}'
        TLS_PORT: '{{ config.tls.port }}'
        TLS_THUMBPRINT: '{{ config.tls.thumbprint | trim | upper }}'
        BOOTSTRAP_ENABLED: '{{ config.sync.bootstrap_enabled | bool | lower }}'
      changed_when: false

    #endregion --- [ Main: WSUS SSL (delivered certificate) ] ------------------------------- #

#endregion --- [ Script ] -------------------------------------------------------------------- #
