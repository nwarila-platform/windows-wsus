# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Complete install path for the wsus role on the Windows family (resolved by the v3
# loader via first_found; a future 'present_windows_<dist>_<ver>.yml' would shadow this
# automatically). Receives the merged running configuration as 'config'.
#
# BUILD IN PROGRESS — C01r BEGIN guards require stable identifiers for the WID and
# WSUS content disks and assert their presence. Later pieces (C02+) append their
# implementation after the Initialization: Input Guards region, one command per
# cycle piece.
#
# =========================================================================================== #
---
#region ------ [ Script ] -------------------------------------------------------------------- #

- name: 'INFO | Entering OS Tasks (present_windows - wsus)'
  vars:
    __data_disks__:
      - purpose: 'db'
        id: "{{ config.wid_disk_id | default('') }}"
        drive_letter: "{{ config.data_disks.db.drive_letter }}"
      - purpose: 'content'
        id: "{{ config.wsus_disk_id | default('') }}"
        drive_letter: "{{ config.data_disks.content.drive_letter }}"
  block:

    #region ------ [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Initialization: Input Guards ] ------------------------------------------ #

    - name: 'BEGIN | Assert Target Is Windows Family'
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family | default('') == 'Windows'
        fail_msg: >-
          The wsus state=present path requires a Windows-family target, but Ansible
          reported os_family='{{ ansible_facts.os_family | default('undefined') }}'.
          Confirm the inventory target and loader routing before running this role.
        quiet: true

    # Required per-target inputs are declared in the wsus: override dict and merged
    # into config (framework idiom). These checks are ordered so a missing or mistyped
    # id fails cleanly, never during templating.
    - name: 'BEGIN | Assert Data Disk Identifiers Are Provided'
      ansible.builtin.assert:
        that:
          - config.wid_disk_id is defined
          - config.wsus_disk_id is defined
          - config.wid_disk_id is string
          - config.wsus_disk_id is string
          - (config.wid_disk_id | trim | length) > 0
          - (config.wsus_disk_id | trim | length) > 0
        fail_msg: >-
          wid_disk_id and wsus_disk_id are REQUIRED and are declared in the wsus:
          override dict (consumed as config.wid_disk_id / config.wsus_disk_id). Got
          wid_disk_id={{ config.wid_disk_id | default('<undefined>') | string }},
          wsus_disk_id={{ config.wsus_disk_id | default('<undefined>') | string }}.
          Declare them per the wsus role README (the unique_id of each target disk).
        quiet: true

    # Trust pre-existing disk facts intentionally. In the composed play, gather_facts
    # does not populate ansible_facts.disks, no earlier role sets it, fact caching is
    # memory-only, and every target run begins from a reverted VM snapshot.
    - name: 'BEGIN | Loading Physical Disk Facts'
      when: ansible_facts.disks is not defined
      community.windows.win_disk_facts:
        filter:
          - 'physical_disk'

    - name: 'BEGIN | Assert Declared Data Disks Are Attached'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      vars:
        __matching_disks__: >-
          {{ ansible_facts.disks | selectattr('unique_id', 'equalto', item.id) | list }}
      ansible.builtin.assert:
        that:
          - __matching_disks__ | length == 1
        fail_msg: >-
          Expected exactly one attached disk whose unique_id matches the
          '{{ item.purpose }}' identifier ('{{ item.id }}'), but found
          {{ __matching_disks__ | length }}.
          Attached disks:
          {% for disk in ansible_facts.disks %}
          number={{ disk.number | default('unknown') }}, unique_id={{ disk.unique_id | default('unknown') }},
          size={{ disk.size | default('unknown') }}{%- if not loop.last %}; {% endif %}
          {% endfor %}
        quiet: true

    #endregion --- [ Initialization: Input Guards ] ------------------------------------------ #

    #endregion --- [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Main: Data Volume Provisioning ] --------------------------------------- #

    # C02b re-gathers the fuller superset (partitions + volumes) the safety assert needs; the
    # Input Guard gathered physical_disk only, so a disks-not-defined guard would skip it. Later
    # C02c-e reuse these read-only facts.
    - name: 'MAIN | Loading Disk, Partition and Volume Facts'
      community.windows.win_disk_facts:
        filter:
          - 'physical_disk'
          - 'partitions'
          - 'volumes'

    - name: 'MAIN | Assert Target Disk Is Safe To Provision'
      loop: "{{ __data_disks__ }}"
      loop_control:
        label: "{{ item.purpose }}"
      vars:
        __target_disk__: >-
          {{ ansible_facts.disks | selectattr('unique_id', 'equalto', item.id) | first }}
        __foreign_lettered__: >-
          {{
            __target_disk__.partitions | default([])
            | selectattr('drive_letter', 'defined')
            | selectattr('drive_letter')
            | rejectattr('drive_letter', 'equalto', item.drive_letter)
            | list
          }}
      ansible.builtin.assert:
        that:
          - __target_disk__.partition_style == 'RAW' or (__foreign_lettered__ | length == 0)
        fail_msg: >-
          Refusing to provision the '{{ item.purpose }}' disk (unique_id '{{ item.id }}'): it is
          already initialized (partition_style {{ __target_disk__.partition_style }}) and carries
          partition(s) with a foreign drive letter
          ({{ __foreign_lettered__ | map(attribute='drive_letter') | join(', ') }}). The role will
          not clobber existing data — clear the disk or correct the identifier.
        quiet: true

    #endregion --- [ Main: Data Volume Provisioning ] --------------------------------------- #

#endregion --- [ Script ] -------------------------------------------------------------------- #
