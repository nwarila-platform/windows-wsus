# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Config-contract validation executed by the v3.1.0 loader's
# 'INIT | Validating Merged Configuration' hook, with the merged configuration passed
# as 'config'. Holds ONLY load-bearing, module-inexpressible invariants (never a
# precondition a module already fails on — style guide §4b). Runs for every state;
# branch present-specific asserts on 'state'.
#
# =========================================================================================== #
---
#region ------ [ Script ] -------------------------------------------------------------------- #

# Load-bearing config invariant: the two data-disk identifiers must be DISTINCT. No module and no
# arg-spec expresses wid != wsus; if equal, both resolve to the SAME physical disk and provisioning
# silently targets one disk twice (half-provisioned) — a silent-wrong no Ansible action catches.
- name: 'BEGIN | Assert Data Disk Identifiers Are Distinct'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - (config.wid_disk_id | default('') | string | trim) != (config.wsus_disk_id | default('') | string | trim)
    fail_msg: >-
      wsus.wid_disk_id and wsus.wsus_disk_id must identify two DIFFERENT disks but both resolve to
      '{{ config.wid_disk_id | default('') | string | trim }}'. Each disk's unique_id is globally
      unique; declare the correct id for each volume.
    quiet: true

- name: 'BEGIN | Assert Upstream WSUS Server Provided'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - (config.upstream_server | default('') | string | trim) | length > 0
    fail_msg: >-
      wsus.upstream_server is REQUIRED for the downstream topology but is empty/undefined. Each WSUS
      downstream points at its upstream by name; declare upstream_server in the wsus: override dict.
    quiet: true

#endregion --- [ Script ] -------------------------------------------------------------------- #
