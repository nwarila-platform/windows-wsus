# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Config-contract validation executed by the v3.1.0 loader's
# 'INIT | Validating Merged Configuration' hook, with the merged configuration passed
# as 'config'. Holds ONLY load-bearing, module-inexpressible invariants (never a
# precondition a module already fails on — style guide §4b). Runs for every state;
# branch present-specific asserts on 'state'.
#
# =========================================================================================== #
---
#region ------ [ Script ] -------------------------------------------------------------------- #

# Load-bearing config invariant: application drive letters must be DISTINCT. The disk-manager
# role validates its own declaration, but it cannot see this role's independently overrideable
# path targets. A duplicate here silently sends two logical data purposes to one volume.
- name: 'BEGIN | Assert Data Disk Drive Letters Are Distinct'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __disk_letters__:
      - "{{ config.data_disks.db.drive_letter | default('') | string | trim | upper }}"
      - "{{ config.data_disks.content.drive_letter | default('') | string | trim | upper }}"
      - "{{ config.data_disks.iis.drive_letter | default('') | string | trim | upper }}"
  ansible.builtin.assert:
    that:
      - (__disk_letters__ | select | list | unique | length) == (__disk_letters__ | select | list | length)
    fail_msg: >-
      wsus.data_disks.db/content/iis.drive_letter must each be a DIFFERENT letter. A collision
      sends two logical data purposes to the same volume (silent-wrong).
      letters={{ __disk_letters__ }}.
    quiet: true

- name: 'BEGIN | Assert Upstream WSUS Server Provided'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - (config.upstream_server | default('') | string | trim) | length > 0
    fail_msg: >-
      wsus.upstream_server is REQUIRED for the downstream topology but is empty/undefined. Each WSUS
      downstream points at its upstream by name; declare upstream_server in the wsus: override dict.
    quiet: true

#endregion --- [ Script ] -------------------------------------------------------------------- #
