# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the wsus role. The v3 loader merges the OS overlay in vars/
# over this map and publishes the result as 'wsus_running'; tasks read only the merged map.
# WHAT BELONGS HERE is what a deployer can meaningfully choose -- the layout inside the volumes
# this role is given, and settings an estate decides for itself rather than the product deciding
# for it. WHAT DOES NOT is constants wearing a default's clothes: the features WSUS is made of,
# the flags post-installation writes, the services that answer for it and the default SQL instance
# are fixed by the product and written where they are used. Anything declared empty here is the
# PLAYBOOK's to publish, and validate.yml refuses a run that omits it.
#
# =========================================================================================== #
---
wsus_defaults:

  #region ------ [ Database placement ] ------------------------------------------------------ #

  # WHERE SUSDB IS CREATED, and why this is the role's first action: wsusutil postinstall creates
  # the database wherever the instance's default directories point, and moving it afterwards is the
  # unsupported detach/copy/attach path (TD-005). Placement must be right before anything can
  # create it, so these are pinned before the feature is installed. The letter is the play's to
  # publish and is absent here; the subdirectories are relative to it, so one letter moves both.
  db:
    data_subdir: 'MSSQL\Data'
    log_subdir: 'MSSQL\Log'

  #endregion --- [ Database placement ] ------------------------------------------------------ #

  #region ------ [ Content placement ] ------------------------------------------------------- #

  # WHERE UPDATE FILES LAND. Post-installation takes this as CONTENT_DIR and will not create a
  # missing tree, so the directory exists first. Measured: the feature install writes ContentDir =
  # C:\Program Files\Update Services, so passing this is what keeps the store off the system
  # volume. Same split as the database -- the volume is the play's, the layout within it is ours.
  content:
    subdir: 'WSUS'

  #endregion --- [ Content placement ] ------------------------------------------------------- #

  #region ------ [ Update languages ] -------------------------------------------------------- #

  # WHICH LANGUAGES THIS SERVER WILL ACCEPT. A WSUS installs accepting every language Microsoft
  # publishes, a permanent cost in disk and sync time for content nobody will approve. Which ones
  # an estate speaks is the estate's, so this is declared empty and published by the play.
  updates:
    languages: ''

  #endregion --- [ Update languages ] -------------------------------------------------------- #

  #region ------ [ Upstream source ] --------------------------------------------------------- #

  # WHERE THIS SERVER GETS ITS UPDATES. A WSUS installs pointed at Microsoft Update; a downstream
  # mirrors a parent instead, so approvals are made once upstream. Every value here is declared
  # empty and published by the play -- which parent, which port, which transport, whether to
  # inherit approvals and how long to wait are all the DEPLOYMENT's, and a default for any of them
  # is a production server quietly taking a development answer. upstream_server takes a DNS name or
  # an IPv4 literal. The three endpoint values are separate because that is how a deployer thinks,
  # and the role composes them into one URL for the actor: a URL cannot carry a transport flag that
  # arrives as the string 'False' and binds as true. MODE is one of three: 'wait' fetches the
  # catalogue and reports what arrived, the only mode that can say what the server holds; 'start'
  # begins a synchronisation and returns, because a first one against a full Microsoft mirror takes
  # WEEKS and a converge that blocks on it never returns; 'disabled' fetches nothing, for an estate
  # that synchronises out of band. Anything but 'wait' leaves the one gap a CLIENT can see and
  # answers "no updates required", which reads exactly like success -- so the role reports which
  # mode it took. A flag like this existed once and was removed in decision 50, when no disabled
  # case existed to be honest about. THE TIMEOUTS run sequentially in one CI step so their sum is
  # what matters, and the worst case is THREE waits: an in-flight synchronisation is polled to a
  # stop under timeout_seconds before a new one starts. Whoever publishes them owns that
  # arithmetic against the budget of the calling step.
  sync:
    content_timeout_seconds: ''
    mode: ''
    replica: ''
    timeout_seconds: ''
    upstream_port: ''
    upstream_server: ''
    upstream_use_ssl: ''

  #endregion --- [ Upstream source ] --------------------------------------------------------- #

  #region ------ [ Who may reach this server ] ----------------------------------------------- #

  # WSUS serves metadata over TLS and update payloads over plain HTTP, on adjacent ports. The HTTPS
  # port is wsus.tls.port and is NOT repeated here: one server has one HTTPS port, and two
  # declarations of it would be two places to disagree. WHICH networks may reach either port is not
  # stated in this role at all -- that belongs to the security group, and a second copy on the host
  # would be a second place to edit.
  firewall:
    http_port: 8530


  #region ------ [ Client-facing TLS ] ------------------------------------------------------- #

  # WHETHER CLIENTS TALK TO THIS SERVER OVER HTTPS, and with which certificate. Every value under
  # 'certificate' is declared empty: the keys are written out so a reader sees the whole shape, but
  # which certificate a server presents belongs to the DEPLOYMENT, and an identity baked into a
  # role that travels would have to be edited in the travelling file. validate.yml refuses a
  # present run with tls.enabled true that omits any of them; a run with it false skips the
  # assertion and the delivery alike. ONE object arrives, the PKCS#12, and presenting it is the
  # whole of what this role does: the container goes into the machine store and the listener is
  # pinned to it. TRUSTING it belongs to the directory, which delivers its root to every domain
  # member as a production CA would -- measured on a live Server 2025 host, a PKCS#12 imported into
  # LocalMachine\My alone lands in no other store and chains to UntrustedRoot, so holding a
  # certificate is not trusting it. In THIS estate that delivery is a temporary policy pending a
  # real CA, measured not reaching a client, and a server it has not reached cannot read its own
  # WSUS API once TLS is on. The password is not an object either: it arrives resolved through the
  # framework's secret lookup. The digest is checked on the CONTROLLER, because the target holds no
  # S3 credential and no route to S3 at all.
  tls:
    enabled: true
    port: 8531
    site_name: 'WSUS Administration'

    certificate:
      bucket: ''
      dns_name: ''
      object: ''
      password: ''
      sha256: ''
      thumbprint: ''

    # WHICH DIRECTORIES REFUSE PLAIN HTTP. Vendor-fixed, not a preference: these five are the
    # endpoints a client authenticates and reports through, and Microsoft's instructions name these
    # five and stop. The site serves more and every other is deliberately absent -- requiring SSL
    # on Content breaks content delivery, on SelfUpdate breaks legacy self-update, and Reporting
    # and Inventory are not endpoints the vendor asks to be secured. Measured: Content, Inventory
    # and ReportingWebService exist on both images here, SelfUpdate on the RTM one but NOT the
    # patched AMI, so its presence tracks the WSUS patch level rather than the OS version. Naming
    # five rather than deriving them is what makes this indifferent to which others an image ships.
    secured_paths:
      - 'ApiRemoting30'
      - 'ClientWebService'
      - 'DssAuthWebService'
      - 'ServerSyncWebService'
      - 'SimpleAuthWebService'

  #endregion --- [ Client-facing TLS ] ------------------------------------------------------- #
