# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the wsus role, merged by the v3 loader into
# 'wsus_running' (defaults -> vars/<os>[_<env>].yml overlays -> playbook 'wsus:' dict).
#
# Populated one piece at a time via the cycle build queue (the build queue);
# every key added here must be documented in the role README the same cycle.
#
# =========================================================================================== #
---
wsus_defaults:
  # WSUS content folder NAME only; the role joins it with data_disks.content.drive_letter to
  # form the content root (e.g. F:\WSUS). wsusutil postinstall (C05) creates WSUSContent inside
  # it. Name-only keeps the content drive in ONE place so it cannot drift.
  content_subdir: 'WSUS'
  # SUSDB target dir name only; joined with data_disks.db.drive_letter to form the relocation
  # target (e.g. E:\WID\Data — mirrors the C:\Windows\WID\Data source layout). Name-only so the
  # DB drive lives in ONE place (data_disks.db.drive_letter) — no drift. Consumed by C06.
  db_subdir: 'WID\Data'
  data_disks:
    # Drive letters consumed by the C02b state-aware safety guard (recognize an already-managed
    # disk by its target letter). These labels + allocation units are consumed by C02e win_format:
    # E: WSUSDB 64 KiB (SUSDB/SQL), F: WSUSDATA 4 KiB (WSUS content), and G: WSUSIIS 4 KiB
    # (IIS working-dir disk; inetpub relocated here in C12b/c).
    db:
      drive_letter: 'E'
      label: 'WSUSDB'
      allocation_unit: 65536
    content:
      drive_letter: 'F'
      label: 'WSUSDATA'
      allocation_unit: 4096
    iis:
      drive_letter: 'G'
      label: 'WSUSIIS'
      allocation_unit: 4096
  # MS WSUS best practices, "Disable recycling and configure memory limits". These are MS's
  # dedicated-host defaults; shared/co-located hosts should override private_memory_kb with a
  # finite limit and adjust the remaining WsusPool settings as required.
  wsuspool:
    queue_length: 2000
    private_memory_kb: 0
    virtual_memory_kb: 0
    periodic_restart: '00:00:00'
    idle_timeout: '00:00:00'
    pinging_enabled: false
  # Role-managed directory for the SUSDB maintenance scripts + timestamped run logs;
  # overridable for hosts with a different maintenance layout.
  maintenance:
    dir: 'C:\ProgramData\wsus-maintenance'
    # Weekly off-hours reindex window (time is target-local HH:MM); the ISO 8601 time limit
    # bounds a hung or lock-blocked run.
    reindex_schedule:
      day: 'sunday'
      time: '03:00'
      time_limit: 'PT2H'
    # WSUS Server Cleanup operations run by the scheduled cleanup; MS's full set — override to a
    # subset if needed.
    cleanup_operations:
      - 'DeclineSupersededUpdates'
      - 'DeclineExpiredUpdates'
      - 'CleanupObsoleteComputers'
      - 'CleanupObsoleteUpdates'
      - 'CleanupUnneededContentFiles'
      - 'CompressUpdates'
    # Monthly first-week off-hours cleanup: 00:00 + PT2H finishes by 02:00, leaving a one-hour
    # buffer before the 03:00 weekly reindex because IgnoreNew does not prevent cleanup/reindex
    # concurrency. week maps to weeks_of_month (1 = first).
    cleanup_schedule:
      week: 1
      day: 'sunday'
      time: '00:00'
      time_limit: 'PT2H'
  # Which languages' updates WSUS syncs/downloads (lowercase codes). The postinstall default is
  # ALL languages (a large, wasteful scope), so the role restricts it. Override to add languages.
  sync:
    update_languages:
      - 'en'
    # Max SECONDS to confirm the category bootstrap sync was ACCEPTED (status left NotProcessing, or a new
    # sync-history entry appeared) after StartSynchronizationForCategoryOnly(). Prove-started (Director
    # 2026-07-17): C11b does NOT wait for the ~1-2hr full category sync to complete; it confirms acceptance
    # and marks, and the sync (with the early-loaded product/classification catalog) continues async.
    bootstrap_accept_timeout_sec: 120
    # C11d downstream source policy. The upstream WSUS server itself is REQUIRED input
    # (config.upstream_server in the 'wsus:' override dict) with NO default.
    # upstream_port: 8530 HTTP / 8531 HTTPS; upstream_use_ssl: sync over SSL.
    # replica true = REPLICA downstream mirroring the upstream's product/classification selections
    # AND approvals [inherit-everything]; false = autonomous downstream managing its own approvals.
    upstream_port: 8530
    upstream_use_ssl: false
    replica: true
  # Where IIS writes its site logs. STIG "IIS on its own drive": on the IIS disk
  # (G:), NOT the system drive. Must be a LITERAL drive-qualified path (no
  # %SystemDrive% token - the role treats a %VAR% value as drift). C12b repoints
  # the global siteDefaults + every site's logFile.directory here.
  iis:
    log_dir: 'G:\inetpub\logs\LogFiles'
    # The IIS default web content root, relocated to the IIS disk (G:) for STIG "IIS on its own drive".
    # Literal drive-qualified path (a %SystemDrive% token is treated as drift). C12c.
    wwwroot: 'G:\inetpub\wwwroot'
    # IIS W3C log event destination (STIG V-218786). Valid: File | ETW | 'File,ETW'. File keeps the G: file
    # logs; ETW adds a real-time event emit. Director (2026-07-18): ship File,ETW. C13e.
    log_target_w3c: 'File,ETW'
    # STIG-required W3C CUSTOM log fields (V-218788/V-218789) — a SEPARATE collection from the standard fields
    # (logExtFileFlags), so the already-complete standard set does not cover them. C13d.
    custom_log_fields:
      - { field: 'Connection', source: 'Connection', source_type: 'RequestHeader' }
      - { field: 'Warning', source: 'Warning', source_type: 'RequestHeader' }
      - { field: 'Authorization', source: 'Authorization', source_type: 'RequestHeader' }
      - { field: 'Content-Type', source: 'Content-Type', source_type: 'ResponseHeader' }
    # IIS W3C log retention (days). IIS has no built-in retention; the C13g scheduled task deletes *.log
    # older than this under iis.log_dir. Director (2026-07-18): 90. Overridable. C13f.
    log_retention_days: 90
    # Weekly off-hours schedule for the IIS log cleanup (02:00 sits between the 00:00 monthly WSUS cleanup
    # and the 03:00 weekly SUSDB reindex). C13g.
    log_cleanup_schedule:
      day: 'sunday'
      time: '02:00'
      time_limit: 'PT1H'
    # Enable the Microsoft-IIS-Configuration/Operational event channel (logs IIS config changes — a
    # web-shell/config-tamper signal; operational-class = retention-safe, low volume). Set false to opt out. C13i.
    config_channel_enabled: true
    # Max size (bytes) for that channel; 20 MB mirrors the App/System sizing. C13i.
    config_channel_max_bytes: 20971520
# Disk identity (wid_disk_id / wsus_disk_id) is declared in the 'wsus:' override dict and read as
# config.wid_disk_id / config.wsus_disk_id (see README); this file holds role-default conventions.
