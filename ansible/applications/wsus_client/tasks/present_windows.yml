# ============================================================================================= #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Triggers a Windows Update synchronisation against the WSUS server this deployment built, and
# proves it worked. That is the whole role.
#
# It WRITES NO WSUS CONFIGURATION. Group Policy owns what a machine is told about WSUS -- the
# server it reports to and the certificate it must trust -- and Group Policy rewrites
# HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate at its own convenience. A role that
# also wrote those values would be a second owner losing intermittently, which is worse to
# diagnose than losing outright. It does refresh policy and it does install what it is offered;
# every registry operation here is a read.
#
# There is no BEGIN stage: nothing here decides between actions. There is no END stage either --
# what this role does is itself the proof, and the one thing worth asserting is that nothing WSUS
# offered failed to install.
#
# ============================================================================================= #
---
#region ------ [ Process: Ask WSUS For Updates, And Prove It Answered ] ----------------------- #

- name: 'PROCESS | Ask WSUS For Updates, And Prove It Answered'
  vars:
    __client__: "{{ wsus_client_running }}"
    __policy_root__: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    __policy_au__: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    # THREE hives, because Windows fills a different one depending on how the anchor arrived and
    # honours all three: Policies\SystemCertificates for a Group Policy deployment,
    # Microsoft\SystemCertificates for a local install, Microsoft\EnterpriseCertificates for a root
    # published to the directory. The third was missing and cost a converge -- measured on this
    # deployment's own client, 2026-09-11, the machine trusted the certificate perfectly and this
    # role refused anyway, because an enterprise root never lands in the other two. It is also the
    # hive a real certificate authority uses: publish the root to AD, every member pulls it.
    __anchor_policy__: 'HKLM:\SOFTWARE\Policies\Microsoft\SystemCertificates\Root\Certificates'
    __anchor_machine__: 'HKLM:\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates'
    __anchor_enterprise__: 'HKLM:\SOFTWARE\Microsoft\EnterpriseCertificates\Root\Certificates'

  # Begin The 'Process' Block
  block:

    #region ------ [ Process: Make Group Policy Current Before Reading It ] ------------------- #
    # A machine that joined minutes ago has had one policy application, at boot, and anything edited
    # since has not reached it. A refresh removes that race so the next task reads what the domain
    # currently says. Deliberately NOT /force: the default applies only settings that CHANGED, which
    # on a converged machine is none, where /force reapplies everything every converge -- a repeated
    # write dressed up as a read. changed_when false is then honest rather than a suppression, since
    # anything Group Policy applies is Group Policy's change to report, not this role's to claim.

    - name: 'PROCESS | Make Group Policy Current Before Reading It'
      changed_when: false

      ansible.windows.win_command:
        argv:
          - 'gpupdate.exe'
          - '/target:computer'

    #endregion --- [ Process: Make Group Policy Current Before Reading It ] ------------------- #

    #region ------ [ Process: Read What Group Policy Left Behind ] ---------------------------- #
    # Four reads and no writes. Two say which server this machine was told to use, two say whether
    # it can chain that server's certificate. Read separately from the assertion below so a
    # failure names the value rather than the expression.

    - name: 'PROCESS | Read The Server Group Policy Named'
      changed_when: false
      register: '__wsus_client_server__'

      ansible.windows.win_reg_stat:
        name: 'WUServer'
        path: "{{ __policy_root__ }}"

    - name: 'PROCESS | Read Whether Group Policy Turned The Estate Server On'
      changed_when: false
      register: '__wsus_client_use__'

      ansible.windows.win_reg_stat:
        name: 'UseWUServer'
        path: "{{ __policy_au__ }}"

    - name: 'PROCESS | Read Whether Group Policy Delivered The Trust Anchor'
      changed_when: false
      register: '__wsus_client_anchor_policy__'

      ansible.windows.win_reg_stat:
        path: "{{ __anchor_policy__ }}\\{{ __client__.certificate.thumbprint | upper }}"

    - name: 'PROCESS | Read Whether The Trust Anchor Is In The Machine Store'
      changed_when: false
      register: '__wsus_client_anchor_machine__'

      ansible.windows.win_reg_stat:
        path: "{{ __anchor_machine__ }}\\{{ __client__.certificate.thumbprint | upper }}"

    - name: 'PROCESS | Read Whether The Directory Published The Trust Anchor'
      changed_when: false
      register: '__wsus_client_anchor_enterprise__'

      ansible.windows.win_reg_stat:
        path: "{{ __anchor_enterprise__ }}\\{{ __client__.certificate.thumbprint | upper }}"

    #endregion --- [ Process: Read What Group Policy Left Behind ] ---------------------------- #

    #region ------ [ Process: Refuse A Machine Nothing Told About WSUS ] ---------------------- #
    # The one refusal in this role, and it is about something the role does not control. A machine
    # Group Policy never reached scans Microsoft, or scans nothing, and reports "no updates
    # required" -- which is indistinguishable from a successful proof. Every other way this can
    # fail is loud; this way is silent, so it is the one worth catching.

    - name: 'PROCESS | Refuse A Machine Nothing Told About WSUS'

      ansible.builtin.assert:
        fail_msg: >-
          Refusing to test: this machine has not been told to use the WSUS server under test.
          Group Policy should have set WUServer to {{ __client__.server.url }} and UseWUServer to 1,
          and should have delivered the trust anchor
          {{ __client__.certificate.thumbprint | upper }} to a root store. It reports
          WUServer={{ __wsus_client_server__.value | default('<absent>') }},
          UseWUServer={{ __wsus_client_use__.value | default('<absent>') }},
          anchor={{ (__wsus_client_anchor_policy__.exists or __wsus_client_anchor_machine__.exists
                     or __wsus_client_anchor_enterprise__.exists) }}.
          A scan from here would report no updates required and prove nothing.
        quiet: true
        that:
          - __wsus_client_server__.exists
          - __wsus_client_server__.value == __client__.server.url
          - __wsus_client_use__.exists
          - (__wsus_client_use__.value | int) == 1
          - __wsus_client_anchor_policy__.exists or __wsus_client_anchor_machine__.exists
            or __wsus_client_anchor_enterprise__.exists

    #endregion --- [ Process: Refuse A Machine Nothing Told About WSUS ] ---------------------- #

    #region ------ [ Process: Take What WSUS Offers ] ----------------------------------------- #
    # win_updates rather than the agent's own COM interface, and not for convenience: that interface
    # refuses to INSTALL from a remote session, so a script driven over this connection could search
    # and download and then fail at the one step that matters. The module runs the work through a
    # scheduled task on the machine itself, which is the supported way around that. managed_server
    # explicitly: no server name is passed and none could be -- it tells the agent to use the
    # service Group Policy configured it with, where the default would let the agent decide. Naming
    # the right server is the refusal above. Naturally idempotent without anything here making it
    # so: a second run finds nothing left to install because the first run installed it.

    # failed_when rather than a following assertion, because an actor owns its own outcome: an
    # update WSUS offered and this machine could not install is a failure of the work this task
    # performed, not a fact about it for something else to judge. The module's own failure signal
    # is preserved alongside, since failed_when REPLACES it rather than adding to it.

    - name: 'PROCESS | Take What WSUS Offers'
      register: '__wsus_client_updates__'
      failed_when: >-
        __wsus_client_updates__ is failed
        or (__wsus_client_updates__.failed_update_count | default(0) | int) > 0

      ansible.windows.win_updates:
        category_names: "{{ __client__.updates.categories }}"
        reboot: "{{ __client__.updates.reboot }}"
        server_selection: 'managed_server'
        state: 'installed'

    # The counts ARE the proof, and a registered result nobody prints is a proof nobody can read.
    # Printed rather than asserted: a converged machine is offered nothing, so there is no number
    # here worth failing on that failed_when above has not already caught.

    - name: 'PROCESS | Report What WSUS Delivered'
      changed_when: false

      ansible.builtin.debug:
        msg: >-
          WSUS offered {{ __wsus_client_updates__.found_update_count | default(0) }},
          installed {{ __wsus_client_updates__.installed_update_count | default(0) }},
          failed {{ __wsus_client_updates__.failed_update_count | default(0) }},
          reboot required {{ __wsus_client_updates__.reboot_required | default(false) }}.

    #endregion --- [ Process: Take What WSUS Offers ] ----------------------------------------- #

#endregion --- [ Process: Ask WSUS For Updates, And Prove It Answered ] ----------------------- #
