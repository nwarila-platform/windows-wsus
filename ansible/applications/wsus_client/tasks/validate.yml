# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Validates the merged running config on the CONTROLLER, before anything touches the guest.
#
# 'state' is normalised EXACTLY as the loader normalises it for dispatch -- lower and trimmed --
# because a guard that reads the value differently from the dispatcher is a guard the dispatcher
# can route around: ' present ' would skip every check here and still run present_windows.yml.
#
# Every value this role holds is an EXPECTATION it checks on the guest, not a setting it writes.
# These guards therefore hold the expectation itself to a usable shape: an expectation that cannot
# be true is a run that fails on the guest for a reason declared here.
#
# =========================================================================================== #
---

# The URL is held to a shape rather than merely to being non-empty, because it is compared against
# what Group Policy wrote, byte for byte. A trailing slash or a missing port here does not fail
# loosely -- it fails as "Group Policy named a different server", which sends whoever reads it to
# the wrong place entirely.
- name: 'VALIDATE | Require A Usable WSUS Server URL'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __host__: '[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*'
    __url__: "{{ wsus_client_running.server.url | default('', true) }}"
    # Five digits is a shape, not a port. 99999 and 00000 both match the shape and neither can be
    # dialled.
    __port__: "{{ __url__ | regex_search(':([0-9]{1,5})/?$', '\\1') | first | default('0', true) }}"
  ansible.builtin.assert:
    fail_msg: >-
      Refusing to test: wsus_client.server.url must be the URL Group Policy is expected to have
      named, written with its scheme, host and port -- 'https://wsus.example.com:8531'. It is
      deliberately never defaulted, because this role compares it against what the machine was
      actually told and a defaulted one would compare against the last deployer's lab. The port is
      required because WSUS does not serve on 80 or 443, and it must be one that can be dialled.
    quiet: true
    that:
      - __url__ is match('^https?://' ~ __host__ ~ ':[0-9]{1,5}/?$')
      - __url__ | length <= 255
      - (__port__ | int) >= 1
      - (__port__ | int) <= 65535

- name: 'VALIDATE | Require A Usable Trust Anchor Expectation'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    fail_msg: >-
      Refusing to test: wsus_client.certificate.thumbprint must be forty hexadecimal characters,
      naming the certificate Group Policy is expected to have delivered. It is read as a registry
      key name under both root stores, so a malformed one does not fail as "wrong thumbprint" --
      it fails as "no anchor anywhere", which is a different and much more alarming answer.
    quiet: true
    that:
      - wsus_client_running.certificate.thumbprint | default('', true) is match('^[0-9A-Fa-f]{40}$')

# The module's own default names three categories and excludes Definition Updates, which is
# exactly what this deployment approves. An empty or defaulted list here finds nothing and reports
# success, so the list is required to say something.
- name: 'VALIDATE | Require Something To Ask For'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    fail_msg: >-
      Refusing to test: wsus_client.updates.categories must name at least one update category, or
      '*' for every category. A machine that asks for categories the server never approves finds
      nothing and reports success, which is the one outcome this run must not produce by accident.
      wsus_client.updates.reboot must be a real boolean, because a quoted string coerces silently
      and a machine that reboots mid-task reports nothing at all.
    quiet: true
    that:
      - wsus_client_running.updates.categories | default([], true) | length > 0
      - wsus_client_running.updates.reboot is boolean
