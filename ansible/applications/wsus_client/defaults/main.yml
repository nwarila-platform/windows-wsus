# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the wsus_client role. The v3 loader merges the OS overlay in
# vars/ over this map and publishes the result as 'wsus_client_running'; tasks read only the
# merged map.
#
# THIS ROLE WRITES NO WSUS CONFIGURATION. It refreshes Group Policy, triggers a Windows Update
# synchronisation against the WSUS server this deployment built, and verifies that it worked.
# Group Policy owns what a machine is told about WSUS -- the server it reports to, and the
# certificate it must trust -- so every value here is an EXPECTATION the role checks, never a
# setting it writes. A role that wrote them would be a second owner of keys Group Policy rewrites
# at its own convenience, and would lose intermittently.
#
# =========================================================================================== #
---
wsus_client_defaults:

  #region ------ [ Which server policy should have named ] ----------------------------------- #

  # WHAT THE MACHINE SHOULD ALREADY HAVE BEEN TOLD, as the URL clients dial -- scheme, host and
  # port. Published by the play and declared empty here; validate.yml refuses a present run that
  # omits it. CHECKED, NOT WRITTEN: if Group Policy has not reached this machine, or reached it
  # with a different server, that is what this value exists to surface -- the alternative is a scan
  # that succeeds against nothing and reports "no updates required", indistinguishable from success.
  server:
    url: ''

  #endregion --- [ Which server policy should have named ] ----------------------------------- #

  #region ------ [ Which anchor policy should have delivered ] ------------------------------- #

  # The WSUS server presents a self-signed certificate, so a client that cannot chain it fails
  # every scan with a transport error naming TLS and never mentioning WSUS. This is the thumbprint
  # the directory should have delivered. Declared empty exactly as the server role declares its
  # certificate keys: which certificate an estate trusts belongs to the deployment, and one written
  # here would be baked into a role that travels. Checked in THREE hives because Windows fills a
  # different one per delivery mechanism and honours all of them -- Policies\SystemCertificates for
  # a Group Policy deployment, Microsoft\SystemCertificates for a local install, and
  # Microsoft\EnterpriseCertificates for a root published to the directory, which is what a real
  # certificate authority uses.
  certificate:
    thumbprint: ''

  #endregion --- [ Which anchor policy should have delivered ] ------------------------------- #

  #region ------ [ What to take ] ------------------------------------------------------------ #

  # EVERY category, because the point is to take what the SERVER approved rather than to have an
  # opinion here. The module's own default names three categories and excludes Definition Updates,
  # so a client asking for the default set finds nothing whenever the server's approvals fall
  # outside it -- and reports success. Approvals are made upstream and inherited, and this
  # repository declares none of them, so the only safe ask is everything. No reboot: the run has to
  # report what happened, and a machine that reboots mid-task reports nothing -- reboot_required
  # comes back in the result instead, for a human to act on.
  updates:
    categories: ['*']
    reboot: false

  #endregion --- [ What to take ] ------------------------------------------------------------ #
