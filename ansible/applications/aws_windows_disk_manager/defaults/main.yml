# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the aws_windows_disk_manager role, merged by the shared
# loader into 'aws_windows_disk_manager_running' (defaults -> OS overlays -> playbook
# 'aws_windows_disk_manager:' override dict). Task files receive the merged result as 'config'.
#
# WHAT THIS ROLE IS
#   A single-platform narrowing of the framework's windows_disk_manager (forked at pin
#   24a8ec74a7965b3a6f9cc827455962d541ff6d73): Windows on Amazon EC2, nothing else. The
#   platform knob and the literal unique_id identity mode are gone — every declared disk is
#   identified by its EBS Function tag and resolved through the Nitro serial==volume-id
#   guarantee. The classification and mutation-safety contract is unchanged: an idempotent
#   online/writable fixup, provisioning only from a recognized blank or unformatted state,
#   skip on a matching NTFS label, and fail-closed refusal of any foreign layout.
#
# =========================================================================================== #
---
aws_windows_disk_manager_defaults:


  #region ------ [ Managed disks ] -------------------------------------------------------------- #
  # Declared disks to manage. Empty by default. Each entry declares:
  #
  #   - function:        REQUIRED. The EBS volume's `Function` tag value (e.g. 'WSUSDB').
  #                      Resolved by tasks/resolve_aws.yml: ONE controller-side describe per
  #                      host maps the tag to its attached volume-id, and the physical disk is
  #                      matched via the Nitro guarantee that the NVMe serial equals the
  #                      volume-id without its hyphen. There is no literal-identity escape
  #                      hatch; a volume-id is Terraform's to assign, never configuration.
  #     drive_letter:    One ASCII letter with optional colon and optional backslash after the
  #                      colon: D, D:, or D:\ (case-insensitive).
  #     label:           NTFS volume label.
  #     allocation_unit: Allocation-unit size in bytes (default 4096).
  #
  # A resolved disk is provisioned only when positively classified as RAW/blank or
  # GPT/unformatted, skipped when an NTFS volume has the declared label case-insensitively, and
  # refused when its observed contents do not match one of those recognized states.
  disks: []
  #endregion --- [ Managed disks ] -------------------------------------------------------------- #
