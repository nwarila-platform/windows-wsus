# =========================================================================================== #
# File: '{{ role_path }}/tasks/resolve_aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Function-tag disk resolver — carried unchanged in contract from the framework's
# windows_disk_manager (fork pin 24a8ec74). Included by present_windows.yml BEFORE disk facts
# are loaded, whenever any disk is declared. Resolves each entry's `function` (an EBS volume's
# `Function` tag value, e.g. WSUSDB) to that ATTACHED volume's volume-id, so the caller can
# materialize the disk identity from the disk whose NVMe serial equals the volume-id (Nitro
# guarantees serial == volume-id without its hyphen).
#
# CONTROLLER-SIDE, ONE call per HOST (never per disk): amazon.aws.ec2_vol_info, filtered to
# THIS host's own instance-id + attachment.status=attached and controller-delegated per this
# codebase's amazon.aws conventions. Deliberately NOT run_once: this call's result is
# host-specific (each host's own attached volumes), not a single value shared across the play.
#
# The TARGET instance needs NO EBS/IAM permissions of its own — the describe runs under the
# deploy identity's existing ec2:Describe* grant (see docs/reference/aws-iam/README.md). The
# instance-id comes from the target's own IMDSv2 (link-local, hop-limit-1 safe, no
# credential), never from inventory metadata that could drift from the machine actually being
# configured.
# =========================================================================================== #

#region ------ [ Script ] -------------------------------------------------------------------- #

# The identity anchor: ask the MACHINE which instance it is, so the volume describe below can
# never be scoped to a stale or mistyped inventory value. IMDSv2 only — the token PUT fails
# closed on anything that is not this instance's own link-local metadata service.
- name: 'BEGIN | Acquire IMDSv2 Session Token'
  ansible.windows.win_uri:
    url: 'http://169.254.169.254/latest/api/token'
    method: 'PUT'
    headers:
      X-aws-ec2-metadata-token-ttl-seconds: '300'
    return_content: true
  register: '__imds_token__'

- name: 'BEGIN | Resolve This Instance Id From IMDSv2'
  ansible.windows.win_uri:
    url: 'http://169.254.169.254/latest/meta-data/instance-id'
    method: 'GET'
    headers:
      X-aws-ec2-metadata-token: "{{ __imds_token__.content }}"
    return_content: true
  register: '__imds_instance_id__'

- name: 'BEGIN | Publish Resolved Instance Id'
  ansible.builtin.set_fact:
    __instance_id__: "{{ __imds_instance_id__.content | trim }}"

# ONE describe call for the whole host — every declared `function` on this host resolves from
# this single response, never a per-disk API call. Retries cover post-apply describe
# eventual-consistency: a volume attached moments ago by Terraform may not yet be visible to
# DescribeVolumes on the first attempt.
- name: 'BEGIN | Describe Attached EBS Volumes For This Instance'
  delegate_to: 'localhost'
  become: false
  no_log: true
  register: '__aws_vol_info__'
  retries: 5
  delay: 10
  until: >-
    (__declared_functions__
    | difference(__aws_vol_info__.volumes | default([], true) | selectattr('tags')
    | selectattr('tags.Function', 'defined') | map(attribute='tags.Function') | list)
    | length) == 0
  vars:
    # Run boto3 under the SAME interpreter that runs ansible-playbook (the controller venv,
    # which already has boto3/botocore) — mirroring every other delegate_to: localhost site in
    # this codebase.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    __declared_functions__: "{{ config.disks | map(attribute='function') | list }}"
  amazon.aws.ec2_vol_info:
    region: "{{ AWS_DEFAULT_REGION | default(omit, true) }}"
    access_key: "{{ AWS_ACCESS_KEY_ID | default(omit, true) }}"
    secret_key: "{{ AWS_SECRET_ACCESS_KEY | default(omit, true) }}"
    session_token: "{{ AWS_SESSION_TOKEN | default(omit, true) }}"
    filters:
      attachment.instance-id: "{{ __instance_id__ }}"
      attachment.status: 'attached'

# NEGATIVE PROOF, per declared entry: exactly one ATTACHED volume may carry this Function tag.
# The zero-match case normally terminates at the describe task's retry gate; this assert
# prevents a multiple match from silently resolving to the WRONG disk and remains defense in
# depth for zero matches. A volume-id/Function-tag pairing is ordinary infrastructure
# metadata, so this assert can enumerate it outside the no_log describe task.
- name: 'BEGIN | Assert Exactly One Attached Volume Per Declared Function'
  loop: "{{ config.disks }}"
  loop_control:
    loop_var: 'disk'
    label: "{{ disk.function }}"
  vars:
    __matches__: >-
      {{ __aws_vol_info__.volumes | selectattr('tags')
      | selectattr('tags.Function', 'defined')
      | selectattr('tags.Function', 'equalto', disk.function) | list }}
  ansible.builtin.assert:
    that:
      - __matches__ | length == 1
    fail_msg: >-
      Expected exactly one ATTACHED EBS volume tagged Function={{ disk.function }} on instance
      {{ __instance_id__ }}; found {{ __matches__ | length }}. Attached volumes on this
      instance: {% for v in __aws_vol_info__.volumes %}{{ v.id }} (Function={{
      v.tags.Function | default('<untagged>', true) }}){% if not loop.last %}, {% endif %}{% endfor
      %}. Fix the intended volume's `tags.Function` value so exactly one attached
      volume carries `Function={{ disk.function }}`.
    quiet: true

#endregion --- [ Script ] -------------------------------------------------------------------- #
